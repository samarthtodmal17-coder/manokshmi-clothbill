// A bill needs a customer with a real name + mobile number (Settings can relax this).
// If it's missing, open the right form straight away instead of just refusing.
async function ensureBillCustomerOk(){
  if(SETTINGS.requireCustomerOnBill===false) return true;
  if(!CART.customerId){
    toast(t('toast_customerRequiredForBill'),'error');
    quickAddCustomerFromBilling();
    return false;
  }
  const c = await dbGet('customers', CART.customerId);
  if(!c){ CART.customerId = null; toast(t('toast_customerRequiredForBill'),'error'); quickAddCustomerFromBilling(); return false; }
  if(!(c.name||'').trim() || !isValidMobile(c.phone)){
    toast(t('toast_customerNeedsMobile').replace('{0}', c.name||''),'error');
    openCustomerModal(c.id);
    return false;
  }
  return true;
}
async function openCheckoutModal(){
  if(CART.items.length===0){ toast(t('toast_cartEmpty'),'error'); return; }
  if(!(await ensureBillCustomerOk())) return;
  const tot = computeTotals();
  let customer = null;
  if(CART.customerId) customer = await dbGet('customers', CART.customerId);
  const loyaltyOn = !!SETTINGS.loyaltyEnabled;
  const availablePoints = (loyaltyOn && customer) ? (customer.loyaltyPoints||0) : 0;
  const maxRedeemValue = Math.min(availablePoints * (SETTINGS.loyaltyRedeemValue||1), tot.grandTotal);
  const maxRedeemPoints = (SETTINGS.loyaltyRedeemValue>0) ? Math.floor(maxRedeemValue / SETTINGS.loyaltyRedeemValue) : 0;

  const loyaltyHTML = (loyaltyOn && customer) ? `
    <div class="field" style="margin-top:4px;background:var(--paper-soft);border-radius:9px;padding:8px 10px;">
      <label>Redeem Loyalty Points <span class="muted" style="font-weight:400;">(${availablePoints} pts available, worth ${fmtMoney(availablePoints*(SETTINGS.loyaltyRedeemValue||1))})</span></label>
      <div class="row" style="gap:6px;">
        <input id="redeemPoints" type="number" min="0" max="${maxRedeemPoints}" step="1" value="0" style="flex:1">
        <button type="button" class="btn btn-outline btn-sm" id="redeemMaxBtn">${t('vendor_useMaxBtn')}</button>
      </div>
    </div>
  ` : (loyaltyOn ? `<p class="muted" style="font-size:11.5px;">Select a customer to earn or redeem loyalty points on this bill.</p>` : '');

  const availableStoreCredit = customer ? (customer.storeCredit||0) : 0;
  const maxStoreCreditUse = Math.round(Math.min(availableStoreCredit, tot.grandTotal)*100)/100;
  const storeCreditHTML = (customer && availableStoreCredit>0) ? `
    <div class="field" style="margin-top:4px;background:var(--paper-soft);border-radius:9px;padding:8px 10px;">
      <label>Use Store Credit <span class="muted" style="font-weight:400;">(${fmtMoney(availableStoreCredit)} available, from past returns/exchanges)</span></label>
      <div class="row" style="gap:6px;">
        <input id="useStoreCredit" type="number" min="0" max="${maxStoreCreditUse}" step="0.01" value="0" style="flex:1">
        <button type="button" class="btn btn-outline btn-sm" id="useStoreCreditMaxBtn">${t('vendor_useMaxBtn')}</button>
      </div>
    </div>
  ` : '';

  const enabledModes = (SETTINGS.enabledPaymentModes && SETTINGS.enabledPaymentModes.length) ? SETTINGS.enabledPaymentModes : ['Cash','UPI','Card'];
  const hasCash = enabledModes.includes('Cash');

  const bodyHTML = `
    <div class="stat-tiles" style="grid-template-columns:1fr;margin-bottom:10px;">
      <div class="stat-tile"><div class="label">Bill Total</div><div class="value">${fmtMoney(tot.grandTotal)}</div></div>
    </div>
    ${loyaltyHTML}
    ${storeCreditHTML}
    <div id="amountDueWrap" style="margin:10px 0 6px;font-size:13px;font-weight:700;"></div>

    <div style="display:flex;flex-wrap:wrap;gap:8px;">
      ${enabledModes.map(m=>`<button type="button" class="btn btn-outline btn-sm quickPayBtn" data-mode="${escapeHTML(m)}">${t('bill_fullPrefix')}${escapeHTML(dv(m))}</button>`).join('')}
      <button type="button" class="btn btn-outline btn-sm" id="splitPayToggleBtn">Split / Multiple Modes</button>
      <button type="button" class="btn btn-outline btn-sm" id="payFullCreditBtn" ${!CART.customerId?'disabled title="Select a customer first"':''}>Full Credit</button>
    </div>
    <div id="payRemainingWrap" style="margin-top:10px;font-size:13px;"></div>

    <div id="splitPayWrap" style="display:none;margin-top:6px;border-top:1px solid var(--line);padding-top:10px;">
      <div class="row" style="flex-wrap:wrap;">
        ${enabledModes.map(m=>`<div class="col field" style="min-width:110px;"><label>${escapeHTML(dv(m))}</label><input id="pay_${modeSlug(m)}" class="payModeInput" type="number" min="0" step="0.01" value="0"></div>`).join('')}
        <div class="col field" style="min-width:110px;"><label>${t('sales_tagCredit')}</label><input id="pay_credit_display" type="text" readonly style="background:var(--paper-soft);font-weight:700;" value="₹0.00"></div>
      </div>
      <p class="muted" style="font-size:11.5px;margin-top:2px;">Type amounts across modes and the remaining balance auto-fills into Credit — e.g. ₹500 cash on an ₹800 bill leaves ₹300 on credit. A customer must be selected for any credit balance.</p>
    </div>

    <div id="cashTenderedCard" style="display:none;margin-top:10px;background:var(--paper-soft);border-radius:9px;padding:8px 10px;">
      <label>${t('print_cashTendered')} <span class="muted" style="font-weight:400;">(for change calculation)</span></label>
      <div class="row" style="gap:6px;align-items:center;flex-wrap:wrap;">
        <input id="cashTenderedInput" type="number" min="0" step="1" value="" style="flex:1;min-width:100px;">
        <button type="button" class="btn btn-outline btn-sm tenderQuickBtn" data-amt="exact">Exact</button>
        <button type="button" class="btn btn-outline btn-sm tenderQuickBtn" data-amt="500">₹500</button>
        <button type="button" class="btn btn-outline btn-sm tenderQuickBtn" data-amt="1000">₹1000</button>
        <button type="button" class="btn btn-outline btn-sm tenderQuickBtn" data-amt="2000">₹2000</button>
      </div>
      <div id="changeDueWrap" style="margin-top:6px;font-size:13px;"></div>
    </div>
  `;
  const footerHTML = `
    <button class="btn btn-outline" onclick="closeModal()">${t('vendor_backBtn')}</button>
    <button class="btn btn-gold" id="confirmCheckoutBtn">Confirm &amp; Generate Bill</button>
  `;
  openModal({
    title:t('modal_payment'),
    bodyHTML, footerHTML,
    onMount:()=>{
      const getAmountDue = ()=>{
        const redeemPts = loyaltyOn && customer ? Math.min(maxRedeemPoints, Math.max(0, parseInt(document.getElementById('redeemPoints').value)||0)) : 0;
        const redeemValue = redeemPts * (SETTINGS.loyaltyRedeemValue||1);
        const storeCreditUse = (customer && availableStoreCredit>0) ? Math.min(maxStoreCreditUse, Math.max(0, parseFloat(document.getElementById('useStoreCredit').value)||0)) : 0;
        return Math.max(0, Math.round((tot.grandTotal - redeemValue - storeCreditUse)*100)/100);
      };
      const modeVal = (m)=> parseFloat(document.getElementById('pay_'+modeSlug(m)).value)||0;
      const recalc = ()=>{
        const amountDue = getAmountDue();
        document.getElementById('amountDueWrap').innerHTML = `Amount Due: ${fmtMoney(amountDue)}`;
        let paidTotal = 0;
        const perMode = {};
        enabledModes.forEach(m=>{ const v = modeVal(m); perMode[m]=v; paidTotal += v; });
        const remaining = Math.round((amountDue - paidTotal)*100)/100;
        const rw = document.getElementById('payRemainingWrap');
        const creditDisplay = document.getElementById('pay_credit_display');
        if(Math.abs(remaining) < 0.01){
          const paidModes = Object.entries(perMode).filter(([,v])=>v>0.001).map(([m])=>m);
          rw.innerHTML = paidModes.length===1 ? `<span class="tag tag-green">Fully paid via ${escapeHTML(paidModes[0])}</span>` : `<span class="tag tag-green">Fully paid</span>`;
          creditDisplay.value = fmtMoney(0);
        } else if(remaining > 0){
          rw.innerHTML = `<span class="tag tag-amber">Balance on credit: ${fmtMoney(remaining)}</span>`;
          creditDisplay.value = fmtMoney(remaining);
        } else {
          rw.innerHTML = `<span class="tag tag-red">Entered amount exceeds total by ${fmtMoney(-remaining)}</span>`;
          creditDisplay.value = fmtMoney(0);
        }
        if(hasCash){
          const cashCard = document.getElementById('cashTenderedCard');
          if(perMode['Cash'] > 0){ cashCard.style.display=''; }
          else { cashCard.style.display='none'; document.getElementById('cashTenderedInput').value=''; document.getElementById('changeDueWrap').innerHTML=''; }
        }
        recalcChange();
      };
      const recalcChange = ()=>{
        if(!hasCash) return;
        const tenderedRaw = document.getElementById('cashTenderedInput').value;
        const changeWrap = document.getElementById('changeDueWrap');
        if(tenderedRaw===''){ changeWrap.innerHTML=''; return; }
        const tendered = parseFloat(tenderedRaw)||0;
        const cash = modeVal('Cash');
        const change = Math.round((tendered - cash)*100)/100;
        if(change < 0){
          changeWrap.innerHTML = `<span class="tag tag-red">Tendered is less than cash amount by ${fmtMoney(-change)}</span>`;
        } else if(change === 0){
          changeWrap.innerHTML = `<span class="tag tag-green">No change due</span>`;
        } else {
          changeWrap.innerHTML = `<strong>Change due: ${fmtMoney(change)}</strong><br><span class="muted" style="font-size:11.5px;">${denominationBreakdown(change)}</span>`;
        }
      };
      if(hasCash){
        document.getElementById('cashTenderedInput').addEventListener('input', recalcChange);
        // Enter on the cash-tendered field completes the sale immediately — the fastest
        // possible keyboard flow for a full-cash payment: type amount tendered, hit Enter.
        document.getElementById('cashTenderedInput').addEventListener('keydown', (e)=>{
          if(e.key==='Enter'){ e.preventDefault(); document.getElementById('confirmCheckoutBtn')?.click(); }
        });
        document.querySelectorAll('.tenderQuickBtn').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            const amt = btn.dataset.amt;
            document.getElementById('cashTenderedInput').value = amt==='exact' ? modeVal('Cash').toFixed(2) : amt;
            recalcChange();
          });
        });
      }
      enabledModes.forEach(m=>document.getElementById('pay_'+modeSlug(m)).addEventListener('input', recalc));
      if(loyaltyOn && customer){
        document.getElementById('redeemPoints').addEventListener('input', recalc);
        document.getElementById('redeemMaxBtn').addEventListener('click', ()=>{
          document.getElementById('redeemPoints').value = maxRedeemPoints;
          recalc();
        });
      }
      if(customer && availableStoreCredit>0){
        document.getElementById('useStoreCredit').addEventListener('input', recalc);
        document.getElementById('useStoreCreditMaxBtn').addEventListener('click', ()=>{
          document.getElementById('useStoreCredit').value = maxStoreCreditUse;
          recalc();
        });
      }
      recalc();
      document.querySelectorAll('.quickPayBtn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const mode = btn.dataset.mode;
          enabledModes.forEach(m=>{ document.getElementById('pay_'+modeSlug(m)).value = (m===mode) ? getAmountDue().toFixed(2) : 0; });
          document.getElementById('splitPayWrap').style.display='';
          recalc();
        });
      });
      document.getElementById('splitPayToggleBtn').addEventListener('click', ()=>{
        const w = document.getElementById('splitPayWrap');
        w.style.display = w.style.display==='none' ? '' : 'none';
      });
      const fullCreditBtn = document.getElementById('payFullCreditBtn');
      fullCreditBtn.addEventListener('click', ()=>{
        if(!CART.customerId){ toast(t('toast_selectCustomerForCredit'),'error'); return; }
        enabledModes.forEach(m=>{ document.getElementById('pay_'+modeSlug(m)).value = 0; });
        document.getElementById('splitPayWrap').style.display='';
        recalc();
      });
      document.getElementById('confirmCheckoutBtn').addEventListener('click', ()=>finalizeCheckout(tot, getAmountDue));
    }
  });
}

async function finalizeCheckout(tot, getAmountDue){
  const amountDue = getAmountDue ? getAmountDue() : tot.grandTotal;
  const redeemPts = (SETTINGS.loyaltyEnabled && CART.customerId) ? Math.max(0, parseInt(document.getElementById('redeemPoints')?.value)||0) : 0;
  const redeemValue = redeemPts * (SETTINGS.loyaltyRedeemValue||1);
  const storeCreditRequested = (CART.customerId && document.getElementById('useStoreCredit')) ? Math.max(0, parseFloat(document.getElementById('useStoreCredit').value)||0) : 0;

  const enabledModes = (SETTINGS.enabledPaymentModes && SETTINGS.enabledPaymentModes.length) ? SETTINGS.enabledPaymentModes : ['Cash','UPI','Card'];
  const modeAmounts = {};
  let paid = 0;
  enabledModes.forEach(m=>{
    const el = document.getElementById('pay_'+modeSlug(m));
    const v = el ? (parseFloat(el.value)||0) : 0;
    modeAmounts[m] = v;
    paid += v;
  });
  const cash = modeAmounts['Cash']||0;
  const remaining = Math.round((amountDue - paid)*100)/100;

  if(remaining < -0.01){ toast(t('toast_enteredAmountExceedsTotal'),'error'); return; }
  if(remaining > 0.01 && !CART.customerId){ toast(t('toast_selectCustomerForCredit'),'error'); return; }

  let customer = null;
  if(CART.customerId){
    customer = await dbGet('customers', CART.customerId);
    if(redeemPts > 0 && redeemPts > (customer.loyaltyPoints||0)){
      toast(t('toast_notEnoughLoyaltyPoints'),'error');
      return;
    }
  }

  // Combined "All Firms" view is for reporting only — a sale must belong to one real firm
  // so its stock and invoice number go to the right place.
  if(multiFirmInUse() && !billableFirmId()){
    toast(t('toast_pickFirmBeforeBilling'),'error');
    return;
  }
  const saleFirmId = billableFirmId();

  // Re-validate stock right before committing (in case of concurrent changes)
  for(const it of CART.items){
    const product = await dbGet('products', it.productId);
    const variant = product.variants[it.variantIndex];
    if(!variant || sellableStock(variant) < it.qty){
      toast(t('toast_notEnoughStockFor').replace('{0}',it.name),'error');
      return;
    }
  }
  // Decrement stock — total and the selling firm's own slice move together
  for(const it of CART.items){
    const product = await dbGet('products', it.productId);
    adjustFirmStock(product.variants[it.variantIndex], saleFirmId, -it.qty);
    await dbPut('products', product);
  }

  const payments = [];
  enabledModes.forEach(m=>{ if(modeAmounts[m]>0) payments.push({mode:m, amount:modeAmounts[m]}); });

  const invoiceNo = await nextInvoiceNo(saleFirmId);
  const earnedPoints = (SETTINGS.loyaltyEnabled && CART.customerId && SETTINGS.loyaltyEarnPerRupee>0)
    ? Math.floor(tot.grandTotal / SETTINGS.loyaltyEarnPerRupee) : 0;

  const cashTenderedRaw = document.getElementById('cashTenderedInput')?.value;
  const cashTendered = cashTenderedRaw ? (parseFloat(cashTenderedRaw)||0) : null;
  const changeGiven = cashTendered!=null ? Math.max(0, Math.round((cashTendered-cash)*100)/100) : 0;

  const bill = {
    invoiceNo,
    firmId: saleFirmId,
    date: new Date().toISOString(),
    customerId: CART.customerId,
    items: CART.items.map(it=>({...it})),
    subtotal: tot.subtotal,
    discountTotal: tot.itemDiscount + tot.autoTierDiscount + tot.overallDiscount + tot.couponDiscount,
    autoTierDiscount: tot.autoTierDiscount,
    couponCode: CART.couponCode||'',
    couponDiscount: tot.couponDiscount,
    packagingCharge: tot.packagingCharge,
    deliveryEnabled: !!CART.deliveryEnabled,
    deliveryAddress: CART.deliveryAddress||'',
    deliveryCharge: tot.deliveryCharge,
    roundOff: tot.roundOff,
    taxTotal: tot.taxTotal,
    taxIncluded: tot.taxIncluded,
    grandTotal: tot.grandTotal,
    pointsRedeemed: redeemPts,
    pointsRedeemedValue: redeemValue,
    amountDue,
    pointsEarned: earnedPoints,
    payments,
    cashTendered, changeGiven,
    creditAmount: remaining>0.01 ? remaining : 0,
    status: remaining>0.01 ? (paid>0?'partial':'credit') : 'paid',
    // Who was logged in and processed this sale — powers the Staff Sales Performance report.
    soldByKey: CURRENT_USER ? staffKeyFor(CURRENT_USER) : 'owner',
    soldByName: CURRENT_USER ? CURRENT_USER.name : t('staff_ownerTag')
  };
  const billId = await dbAdd('bills', bill);
  bill.id = billId;

  let leftoverExchangeCredit = 0;
  const exchangeCreditApplied = CART.exchangeCredit || 0;
  const exchangeSettleMode = CART.exchangeSettleMode || 'cash';

  if(customer){
    let changed = false;
    if(bill.creditAmount>0){
      customer.creditBalance = (customer.creditBalance||0) + bill.creditAmount;
      customer.ledger = customer.ledger||[];
      customer.ledger.push({date:bill.date, type:'sale', amount:bill.creditAmount, billId, note:'Invoice '+invoiceNo});
      changed = true;
    }
    const storeCreditUsed = Math.min(storeCreditRequested, customer.storeCredit||0, Math.max(0, Math.round((tot.grandTotal - redeemValue)*100)/100));
    if(storeCreditUsed > 0.001){
      customer.storeCredit = Math.max(0, Math.round(((customer.storeCredit||0) - storeCreditUsed)*100)/100);
      customer.ledger = customer.ledger||[];
      customer.ledger.push({date:bill.date, type:'payment', amount:storeCreditUsed, billId, mode:'Store Credit', source:'store_credit', note:'Store credit used on '+invoiceNo});
      changed = true;
    }
    if(SETTINGS.loyaltyEnabled){
      customer.loyaltyPoints = (customer.loyaltyPoints||0);
      customer.pointsLedger = customer.pointsLedger||[];
      if(redeemPts>0){
        customer.loyaltyPoints -= redeemPts;
        customer.pointsLedger.push({date:bill.date, type:'redeem', points:redeemPts, billId, note:'Redeemed on '+invoiceNo});
        changed = true;
      }
      if(earnedPoints>0){
        customer.loyaltyPoints += earnedPoints;
        customer.pointsLedger.push({date:bill.date, type:'earn', points:earnedPoints, billId, note:'Earned on '+invoiceNo});
        changed = true;
      }
    }
    // Exchange flow: any return credit not fully used as a discount on this new bill
    // (e.g. the new item(s) cost less than the returned item's value) is settled now
    // rather than lost, per the settle mode chosen when the return was processed.
    if(exchangeCreditApplied > 0){
      const preDiscountTotal = Math.round((tot.subtotal - tot.itemDiscount + tot.taxAdded)*100)/100;
      leftoverExchangeCredit = Math.max(0, Math.round((exchangeCreditApplied - preDiscountTotal)*100)/100);
      if(leftoverExchangeCredit > 0.01){
        if(exchangeSettleMode==='store_credit'){
          customer.storeCredit = Math.round(((customer.storeCredit||0) + leftoverExchangeCredit)*100)/100;
          changed = true;
        }
      }
    }
    if(changed) await dbPut('customers', customer);
  }

  closeModal();
  emptyCart();
  const billedTabId = ACTIVE_TAB_ID;
  toast(t('toast_billCreatedPrefix')+invoiceNo+t('toast_billCreatedSuffix'),'success');
  if(leftoverExchangeCredit > 0.01){
    const msg = exchangeSettleMode==='store_credit'
      ? `${fmtMoney(leftoverExchangeCredit)} unused exchange credit added to customer's store credit`
      : `${fmtMoney(leftoverExchangeCredit)} unused exchange credit — hand this back in cash`;
    setTimeout(()=>toast(msg, 'success'), 600);
  }
  // The bill is done, so its tab goes; the counter lands on whichever customer is next.
  if(billedTabId) await closeBillTab(billedTabId, true);
  else await renderBilling();
  await refreshLowStockBadge();
  showInvoiceModal(bill);
}

// Builds the invoice's inner content HTML. format is 'thermal58' | 'thermal80' | 'a4' and
// controls font sizes / column layout so it reads well on a narrow receipt vs a full page.
function buildInvoiceContentHTML(bill, customerName, format, docTitle){
  const isThermal = format==='thermal58' || format==='thermal80';
  const narrow = format==='thermal58';

  // A bill made under a specific firm prints that firm's own name/address/GSTIN instead of
  // the shop-wide Settings — falls back to Settings for legacy bills with no firmId.
  const billFirm = bill.firmId ? firmById(bill.firmId) : null;
  const hName = billFirm ? billFirm.name : SETTINGS.name;
  const hAddress = billFirm ? (billFirm.address||'') : (SETTINGS.address||'');
  const hPhone = billFirm ? (billFirm.phone||'') : (SETTINGS.phone||'');
  const hGstin = billFirm ? (billFirm.gstin||'') : (SETTINGS.gstin||'');
  const stateName = (GST_STATE_CODES.find(s=>s.code===SETTINGS.stateCode)||{}).name || '';

  // The HSN column only appears when the shop has actually filled HSN codes in, so a shop
  // that doesn't need them never prints an empty column.
  const anyHSN = (bill.items||[]).some(it=>(it.hsn||'').trim());
  const cols = isThermal ? (narrow ? 3 : 4) : (anyHSN ? 5 : 4);

  const pad   = isThermal ? '4px 5px' : '7px 8px';
  const cell  = `border:1px solid #000;padding:${pad};`;
  const fsSm  = isThermal ? '.84em' : '.85em';

  const rowsHTML = (bill.items||[]).map(it=>{
    const variant = [it.size,it.color].filter(Boolean).join('/');
    const lineTotal = it.qty*it.rate - itemDiscountAmount(it);
    const note = it.note ? `<br><span class="muted" style="font-style:italic;font-size:${fsSm};">${escapeHTML(it.note)}</span>` : '';
    const sub  = variant ? `<br><span class="muted" style="font-size:${fsSm};">${escapeHTML(variant)}</span>` : '';
    if(narrow){
      // 58mm has room for three columns only — the rate rides under the item name.
      return `<tr>
        <td style="${cell}">${escapeHTML(it.name)}${sub}<br><span class="muted" style="font-size:${fsSm};">@ ${fmtMoney(it.rate)}</span>${note}</td>
        <td class="num" style="${cell}">${it.qty}</td>
        <td class="num" style="${cell}">${fmtMoney(lineTotal)}</td>
      </tr>`;
    }
    if(isThermal){
      return `<tr>
        <td style="${cell}">${escapeHTML(it.name)}${sub}${note}</td>
        <td class="num" style="${cell}">${it.qty}</td>
        <td class="num" style="${cell}">${fmtMoney(it.rate)}</td>
        <td class="num" style="${cell}">${fmtMoney(lineTotal)}</td>
      </tr>`;
    }
    return `<tr>
      <td style="${cell}">${escapeHTML(it.name)}${sub}${note}</td>
      ${anyHSN?`<td style="${cell}text-align:center;" class="muted">${escapeHTML(it.hsn||'-')}</td>`:''}
      <td class="num" style="${cell}">${it.qty}</td>
      <td class="num" style="${cell}">${fmtMoney(it.rate)}</td>
      <td class="num" style="${cell}">${fmtMoney(lineTotal)}</td>
    </tr>`;
  }).join('');

  const headCell = `border:1px solid #000;padding:${pad};font-size:${isThermal?'.82em':'.84em'};font-weight:700;`;
  const tableHead = `<thead><tr>
      <th style="${headCell}text-align:left;">${t('th_item')}</th>
      ${(!isThermal && anyHSN)?`<th style="${headCell}text-align:center;">${t('print_hsnCol')}</th>`:''}
      <th class="num" style="${headCell}">${t('th_qty')}</th>
      ${!narrow?`<th class="num" style="${headCell}">${t('th_rate')}</th>`:''}
      <th class="num" style="${headCell}">${narrow?t('th_amt'):t('th_amount')}</th>
    </tr></thead>`;

  const logoSize = isThermal ? 52 : 78;
  const logoHTML = SETTINGS.logo
    ? `<div style="margin-bottom:4px;"><img src="${SETTINGS.logo}" style="width:${logoSize}px;height:${logoSize}px;object-fit:contain;display:inline-block;"></div>` : '';

  // Intra-state sales split each rate's tax evenly into CGST + SGST, matching the GSTR-1 screen.
  // Tax that was added on top is part of the total; tax that is INCLUDED in the prices is
  // shown as information only (the total does not change).
  const gstRows = billTaxBreakdown(bill).filter(r=>r.tax>0);
  const anyIncluded = gstRows.some(r=>r.included);
  const halfRate = r=>String(+(r/2).toFixed(2));
  const line = (label, value, opts={}) => `<div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline;${opts.bold?'font-weight:700;':''}${opts.style||''}"><span${opts.bold?'':' class="muted"'} style="min-width:0;">${label}</span><span class="num" style="white-space:nowrap;">${value}</span></div>`;

  let totals = '';
  totals += line(t('bill_subtotal'), fmtMoney(bill.subtotal));
  if(bill.discountTotal>0)
    totals += line(t('print_discountLabel')+((bill.couponCode && !isThermal)?t('print_inclCouponPrefix')+escapeHTML(bill.couponCode)+')':''), '-'+fmtMoney(bill.discountTotal));
  if(anyIncluded){
    const taxableIncl = gstRows.filter(r=>r.included).reduce((s,r)=>s+r.taxable,0);
    totals += line(t('print_taxableValueIncl'), fmtMoney(Math.round(taxableIncl*100)/100), {style:'font-size:.92em;'});
  }
  gstRows.forEach(r=>{
    const sfx = r.included ? t('print_inclSuffix') : '';
    totals += line(t('print_cgstAt').replace('{0}',halfRate(r.rate))+sfx, fmtMoney(r.cgst), r.included?{style:'font-size:.92em;font-style:italic;'}:{});
    totals += line(t('print_sgstAt').replace('{0}',halfRate(r.rate))+sfx, fmtMoney(r.sgst), r.included?{style:'font-size:.92em;font-style:italic;'}:{});
  });
  if(bill.packagingCharge>0) totals += line(t('bill_packagingLabel'), fmtMoney(bill.packagingCharge));
  if(bill.deliveryCharge>0)  totals += line(t('bill_deliveryLabel'), fmtMoney(bill.deliveryCharge));
  if(bill.roundOff)          totals += line(t('bill_roundOff'), (bill.roundOff>0?'+':'')+fmtMoney(bill.roundOff));
  totals += line(t('bill_grandTotal'), fmtMoney(bill.grandTotal), {bold:true, style:'border-top:1px solid #000;margin-top:3px;padding-top:3px;font-size:1.1em;'});
  if(bill.pointsRedeemed>0){
    totals += line(t('print_loyaltyPointsRedeemedPrefix')+bill.pointsRedeemed+')', '-'+fmtMoney(bill.pointsRedeemedValue));
    totals += line(t('print_amountPayable'), fmtMoney(bill.amountDue!=null?bill.amountDue:bill.grandTotal), {bold:true});
  }
  if(bill.creditAmount>0) totals += line(t('print_onCredit'), fmtMoney(bill.creditAmount), {bold:true});
  if(bill.pointsEarned>0) totals += line(t('print_loyaltyPointsEarned'), '+'+bill.pointsEarned);
  if(bill.cashTendered!=null){
    totals += line(t('print_cashTendered'), fmtMoney(bill.cashTendered));
    totals += line(t('print_changeGiven'), fmtMoney(bill.changeGiven||0));
  }

  const payHTML = (bill.payments||[]).length
    ? (bill.payments||[]).map(p=>`<div style="display:flex;justify-content:space-between;gap:10px;"><span class="muted">${escapeHTML(dv(p.mode||''))}</span><span class="num">${fmtMoney(p.amount)}</span></div>`).join('')
    : `<span class="muted">—</span>`;

  let qrHTML = '';
  // Most shops print the bill first and let the customer scan it afterwards, so the QR shows
  // by default even on a bill already marked paid. A shop that collects before printing can
  // switch it to "only when payment is pending" in Settings.
  const qrMode = SETTINGS.billQrMode || 'always';
  if(SETTINGS.upiId && !docTitle && qrMode !== 'never'){
    const payable = bill.amountDue!=null ? bill.amountDue : bill.grandTotal;
    const paidSoFar = (bill.payments||[]).reduce((s,p)=>s+Number(p.amount||0),0);
    const stillDue = Math.round((Number(bill.creditAmount||0) > 0 ? Number(bill.creditAmount) : (payable - paidSoFar))*100)/100;
    // Scan for whatever is still owed; on a settled bill that is the full total.
    const payAmount = stillDue > 0 ? stillDue : Math.round(Number(payable||0)*100)/100;
    if(payAmount > 0 && (qrMode === 'always' || stillDue > 0)){
      const qrSvg = renderUPIQRSVG(SETTINGS.upiId, SETTINGS.name, payAmount, bill.invoiceNo, isThermal?3:4);
      if(qrSvg){
        qrHTML = `<div style="text-align:center;border-top:1px solid #000;padding:${isThermal?'6px 4px':'10px 8px'};">
          <div style="display:inline-block;">${qrSvg}</div>
          <div style="font-size:${isThermal?'.82em':'.85em'};" class="muted">${t('print_scanToPay')}${fmtMoney(payAmount)}${t('print_viaUpi')}</div>
        </div>`;
      }
    }
  }

  const foot = (SETTINGS.billFooterText||'').trim() || t('print_thankYouShopping');
  const stack = isThermal;   // panels stack on a roll, sit side by side on A4

  return `
    <div style="font-family:inherit;">
      <div style="border:2px solid #000;">

        <div style="text-align:center;padding:${isThermal?'6px 5px':'10px 8px'};border-bottom:1px solid #000;">
          <div style="font-weight:700;letter-spacing:.16em;font-size:${isThermal?'.8em':'.82em'};">${escapeHTML(docTitle || t('print_taxInvoice'))}</div>
          ${bill.cancelled?`<div style="border:2px solid #000;display:inline-block;padding:2px 10px;margin-top:4px;font-weight:700;letter-spacing:.12em;font-size:${isThermal?'.85em':'.95em'};">${escapeHTML(t('print_cancelledStamp'))}</div>`:''}
          ${logoHTML}
          <div style="font-size:${isThermal?'14px':'18px'};font-weight:700;margin-top:2px;">${escapeHTML(hName)}</div>
          ${hAddress?`<div class="muted" style="font-size:${fsSm};">${escapeHTML(hAddress)}</div>`:''}
          <div class="muted" style="font-size:${fsSm};">${hPhone?(t('print_phLabel')+escapeHTML(hPhone)):''}${hPhone&&hGstin?' · ':''}${hGstin?('GSTIN '+escapeHTML(hGstin)):''}</div>
          ${stateName?`<div class="muted" style="font-size:${fsSm};">${t('print_placeOfSupply')}${escapeHTML(stateName)}</div>`:''}
        </div>

        <div style="display:flex;${stack?'flex-wrap:wrap;':''}border-bottom:1px solid #000;font-size:${isThermal?'.9em':'.92em'};">
          <div style="flex:1;min-width:0;padding:${pad};${stack?'border-bottom:1px solid #000;':'border-right:1px solid #000;'}">
            <span class="muted" style="font-size:${fsSm};">${t('print_billTo')}</span><br>
            <strong>${escapeHTML(customerName||t('acct_customerFallback'))}</strong>
          </div>
          <div style="flex:1;min-width:0;padding:${pad};">
            <span class="muted" style="font-size:${fsSm};">${docTitle?t('print_quotationNoLabel'):t('modal_invoicePrefix')}</span><strong>${escapeHTML(bill.invoiceNo)}</strong><br>
            <span class="muted" style="font-size:${fsSm};">${t('th_date')} </span>${fmtDate(bill.date)}
          </div>
        </div>

        <table style="width:100%;border-collapse:collapse;">
          ${tableHead}
          <tbody>${rowsHTML}</tbody>
        </table>

        ${docTitle ? `
        <div style="display:flex;border-top:1px solid #000;font-size:${isThermal?'.92em':'.93em'};">
          ${isThermal?'':`<div style="flex:1;min-width:0;padding:${pad};border-right:1px solid #000;"></div>`}
          <div style="flex:1;min-width:0;padding:${pad};">${totals}</div>
        </div>` : (stack ? `
        <div style="border-top:1px solid #000;font-size:.92em;">
          <div style="padding:${pad};border-bottom:1px solid #000;">${totals}</div>
          <div style="padding:${pad};">
            <span class="muted" style="font-size:${fsSm};">${t('print_paymentDetails')}</span>
            ${payHTML}
          </div>
        </div>` : `
        <div style="display:flex;border-top:1px solid #000;font-size:.93em;">
          <div style="flex:1;min-width:0;padding:${pad};border-right:1px solid #000;">
            <span class="muted" style="font-size:${fsSm};">${t('print_paymentDetails')}</span>
            ${payHTML}
          </div>
          <div style="flex:1;min-width:0;padding:${pad};">${totals}</div>
        </div>`)}

        ${bill.deliveryEnabled?`<div style="border-top:1px solid #000;padding:${pad};font-size:${fsSm};" class="muted">${t('print_homeDeliveryToPrefix')}${escapeHTML(bill.deliveryAddress||'')}</div>`:''}
        ${qrHTML}
        ${(!isThermal && !docTitle)?`<div style="border-top:1px solid #000;padding:22px 8px 7px;text-align:right;font-size:.85em;" class="muted">${t('print_authorisedSignatory')}</div>`:''}
      </div>

      <div style="text-align:center;margin-top:${isThermal?'6px':'10px'};font-size:${isThermal?'.82em':'.85em'};white-space:pre-wrap;" class="muted">${escapeHTML(foot)}</div>
    </div>
  `;
}

function buildInvoicePrintDocument(bill, customerName, format, docTitle){
  const content = buildInvoiceContentHTML(bill, customerName, format, docTitle);
  let pageCSS, bodyCSS;
  if(format==='thermal58'){
    pageCSS = `@page{ size:58mm auto; margin:2mm; }`;
    bodyCSS = `width:54mm;font-size:11px;`;
  } else if(format==='thermal80'){
    pageCSS = `@page{ size:80mm auto; margin:3mm; }`;
    bodyCSS = `width:74mm;font-size:12px;`;
  } else {
    pageCSS = `@page{ size:A4; margin:14mm; }`;
    bodyCSS = `max-width:680px;font-size:13px;`;
  }
  const isThermal = format!=='a4';
  return `<!DOCTYPE html><html><head><title>${escapeHTML(bill.invoiceNo)}</title>
    <style>
      ${pageCSS}
      body{ font-family:Arial,Helvetica,sans-serif; margin:0 auto; padding:${isThermal?'4px':'0'}; color:#000; ${bodyCSS} }
      table{width:100%;border-collapse:collapse;}
      th,td{font-size:inherit;text-align:left;}
      .num{text-align:right;font-variant-numeric:tabular-nums;}
      /* Thermal paper is one colour: grey text dithers into a noisy halftone at small
         sizes, so labels print solid black there and rely on weight for hierarchy. */
      .muted{color:${isThermal?'#000':'#555'};}
    </style>
  </head><body>${content}</body></html>`;
}

async function showInvoiceModal(bill){
  let customerName = t('bill_walkInCustomerOption');
  if(bill.customerId){
    const c = await dbGet('customers', bill.customerId);
    if(c) customerName = c.name + (c.phone?(' — '+c.phone):'');
  }
  const invoiceHTML = buildInvoiceContentHTML(bill, customerName, 'a4');
  let customerPhone = null;
  if(bill.customerId){
    const c = await dbGet('customers', bill.customerId);
    if(c) customerPhone = c.phone;
  }
  openModal({
    title:t('modal_invoicePrefix')+bill.invoiceNo,
    bodyHTML: `
      <div class="field" style="max-width:260px;margin-bottom:10px;">
        <label>${t('print_printFormatLabel')}</label>
        <select id="invoicePaperFormat">
          <option value="thermal58" ${SETTINGS.paperSize==='thermal58'?'selected':''}>${t('print_thermal58Option')}</option>
          <option value="thermal80" ${SETTINGS.paperSize==='thermal80'?'selected':''}>${t('print_thermal80Option')}</option>
          <option value="a4" ${SETTINGS.paperSize==='a4'?'selected':''}>${t('print_a4LetterOption')}</option>
        </select>
      </div>
      ${invoiceHTML}
    `,
    footerHTML: `
      <button class="btn btn-outline" onclick="closeModal()">${t('print_closeBtn')}</button>
      <button class="btn btn-outline" id="emailInvoiceBtn">${iconSVG('mail',15)} ${t('vendor_emailLabel')}</button>
      <button class="btn btn-whatsapp" id="waInvoiceBtn">${iconSVG('whatsapp',15)} ${t('print_sendViaWhatsAppBtn')}</button>
      <button class="btn btn-primary" id="printInvoiceBtn">${t('print_printBtn')}</button>
    `,
    onMount:()=>{
      document.getElementById('printInvoiceBtn').addEventListener('click', ()=>{
        const format = document.getElementById('invoicePaperFormat').value;
        const isThermal = format!=='a4';
        const w = openPrintWindow(isThermal ? 'width=380,height=600' : 'width=780,height=900');
        w.document.write(buildInvoicePrintDocument(bill, customerName, format));
        w.document.close();
        w.focus();
        setTimeout(()=>{ w.print(); }, 250);
      });
      document.getElementById('waInvoiceBtn').addEventListener('click', ()=>{
        sendInvoiceOnWhatsApp(bill, customerPhone, customerName);
      });
      document.getElementById('emailInvoiceBtn').addEventListener('click', ()=>{
        sendInvoiceByEmail(bill, customerName);
      });
    }
  });
}
</script>

<!-- MODULE:CUSTOMERS -->
<script>
let CUST_SEARCH = '';


/* ---------- Credit reminders ----------
   Pays each payment off against the OLDEST unpaid credit sale first (how a shop
   actually settles a khata), so "days overdue" means the age of the money that is
   still genuinely outstanding — not the age of the customer's first ever purchase. */
function creditAgeInfo(customer){
  const due = Math.round((customer.creditBalance||0)*100)/100;
  if(due <= 0.009) return {due:0, oldestDate:null, days:0};
  const entries = (customer.ledger||[]).slice()
    .sort((a,b)=> (a.date||'') < (b.date||'') ? -1 : 1);
  const open = [];
  entries.forEach(l=>{
    if(l.type==='sale'){ open.push({date:l.date, left:Number(l.amount)||0}); }
    else {
      let pay = Number(l.amount)||0;
      while(pay > 0.009 && open.length){
        const take = Math.min(pay, open[0].left);
        open[0].left -= take; pay -= take;
        if(open[0].left <= 0.009) open.shift();
      }
    }
  });
  const oldest = open.find(o=>o.left > 0.009);
  if(!oldest) return {due, oldestDate:null, days:0};
  const days = Math.max(0, Math.floor((Date.now() - new Date(oldest.date).getTime())/86400000));
  return {due, oldestDate:oldest.date, days};
}

async function overdueCreditCustomers(){
  const limit = Math.max(0, parseInt(SETTINGS.creditReminderDays)||0);
  const customers = await scopedGetAll('customers');
  return customers
    .map(c=>({c, ...creditAgeInfo(c)}))
    .filter(x=>x.due > 0.009 && x.days >= limit)
    .sort((a,b)=> b.days - a.days);
}

function creditReminderText(customer, due, days){
  const tpl = SETTINGS.creditReminderTemplate || DEFAULT_SETTINGS.creditReminderTemplate;
  return tpl
    .replace(/\{shop\}/g, SETTINGS.name || t('wa_ourShopFallback'))

    .replace(/\{days\}/g, String(days));
}

async function sendCreditReminder(customerId){
  const customer = await dbGet('customers', customerId);
  if(!customer) return;
  const {due, days} = creditAgeInfo(customer);
  if(due <= 0.009){ toast(t('toast_noCreditDue'),'error'); return; }
  const text = creditReminderText(customer, due, days);
  if(customer.phone){ openExternal(buildWhatsAppLink(customer.phone, text), '_blank'); }
  else { promptPhoneThenOpen(text); }
}

async function sendAllCreditReminders(){

    }, i*700);

}

/* ---- Message many customers at once --------------------------------------------
   WhatsApp will not let any app send to many people silently (that needs the paid WhatsApp
   Business API), so this does the next best thing: it builds every personalised message,
   then opens each customer's chat with the text already typed — one tap on Send per customer.
   Progress is tracked so a long list can be done in several sittings without repeats. */
let BULK_STATE = null;
function bulkMessageText(tpl, c){
  return tpl.replace(/\{name\}/g, (c.name||'').trim() || t('acct_customerFallback'))
            .replace(/\{shop\}/g, SETTINGS.name || t('wa_ourShopFallback'));
}
async function bulkAudience(kind){
  const customers = await scopedGetAll('customers');
  const bills = await scopedLiveBills();
  const last = {};
  bills.forEach(b=>{ if(b.customerId!=null){ const ts = new Date(b.date).getTime(); if(!(last[b.customerId]>ts)) last[b.customerId] = ts; } });
  const now = Date.now(), DAY = 86400000;
  const lapsedDays = Math.max(1, parseInt(SETTINGS.lapsedCustomerDays)||60);
  const thisMonth = new Date().getMonth();
  return customers.filter(c=>{
    if(kind==='credit') return (c.creditBalance||0) > 0.009;
    if(kind==='recent') return last[c.id] && (now - last[c.id]) <= 30*DAY;
    if(kind==='lapsed') return !last[c.id] || (now - last[c.id]) > lapsedDays*DAY;
    if(kind==='birthday') return c.birthday && new Date(c.birthday+'T00:00:00').getMonth()===thisMonth;
    return true;
  });
}
async function openBulkMessageModal(){
  const tpl0 = SETTINGS.bulkMessageTemplate || DEFAULT_SETTINGS.bulkMessageTemplate;
  openModal({
    title: t('bulk_title'),
    wide: true,
    bodyHTML: `
      <div class="row">
        <div class="col field">
          <label>${t('bulk_audienceLabel')}</label>
          <select id="bm_audience">
            <option value="all">${t('bulk_aud_all')}</option>
            <option value="recent">${t('bulk_aud_recent')}</option>
            <option value="lapsed">${t('bulk_aud_lapsed')}</option>
            <option value="credit">${t('bulk_aud_credit')}</option>
            <option value="birthday">${t('bulk_aud_birthday')}</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>${t('bulk_messageLabel')}</label>
        <textarea id="bm_text" rows="5" style="width:100%;">${escapeHTML(tpl0)}</textarea>
        <p class="muted" style="font-size:12px;margin:4px 0 0;">${t('bulk_placeholderHint')}</p>
      </div>
      <div id="bm_summary" style="font-size:13px;font-weight:600;margin:6px 0;"></div>
      <div id="bm_preview" style="background:var(--paper-soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;white-space:pre-wrap;"></div>
      <p class="muted" style="font-size:12px;margin-top:8px;">${t('bulk_whatsappNote')}</p>
    `,
    footerHTML: `
      <button class="btn btn-outline" onclick="closeModal()">${t('btn_close')}</button>
      <button class="btn btn-outline" id="bm_copy">${t('bulk_copyNumbers')}</button>
      <button class="btn btn-outline" id="bm_csv">${t('bulk_downloadCsv')}</button>
      <button class="btn btn-whatsapp" id="bm_start">${iconSVG('whatsapp',15)} ${t('bulk_startBtn')}</button>
    `,
    onMount: ()=>{
      let recipients = [];
      const refresh = async ()=>{
        const list = await bulkAudience(document.getElementById('bm_audience').value);
        const seen = new Set(); recipients = []; let skipped = 0;
        list.sort((a,b)=>(a.name||'').localeCompare(b.name||'')).forEach(c=>{
          if(!isValidMobile(c.phone)){ skipped++; return; }
          const m = cleanMobile(c.phone);
          if(seen.has(m)){ skipped++; return; }
          seen.add(m); recipients.push({id:c.id, name:c.name, phone:m, status:'pending'});
        });
        document.getElementById('bm_summary').textContent = t('bulk_summary').replace('{0}', recipients.length).replace('{1}', skipped);
        document.getElementById('bm_start').disabled = recipients.length===0;
        updatePreview();
      };
      const updatePreview = ()=>{
        const tpl = document.getElementById('bm_text').value;
        const sample = recipients[0] || {name: t('acct_customerFallback')};
        document.getElementById('bm_preview').textContent = bulkMessageText(tpl, sample);
      };
      document.getElementById('bm_audience').addEventListener('change', refresh);
      document.getElementById('bm_text').addEventListener('input', updatePreview);
      document.getElementById('bm_copy').addEventListener('click', async ()=>{
        const txt = recipients.map(r=>r.phone).join('\n');
        try{ await navigator.clipboard.writeText(txt); toast(t('bulk_copied').replace('{0}', recipients.length),'success'); }
        catch(e){ toast(t('bulk_copyFailed'),'error'); }
      });
      document.getElementById('bm_csv').addEventListener('click', ()=>{
        const lines = [toCSVRow(['Name','Mobile'])];
        recipients.forEach(r=>lines.push(toCSVRow([r.name, '91'+r.phone])));
        const blob = new Blob([lines.join('\r\n')], {type:'text/csv'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'customers-mobile-'+todayISO()+'.csv'; a.click();
        URL.revokeObjectURL(url);
      });
      document.getElementById('bm_start').addEventListener('click', async ()=>{
        const tpl = document.getElementById('bm_text').value.trim();
        if(!tpl){ toast(t('bulk_messageEmpty'),'error'); return; }
        await saveSettings({bulkMessageTemplate: tpl});
        BULK_STATE = {tpl, list: recipients.map(r=>({...r}))};
        renderBulkSending();
      });
      refresh();
    }
  });
}
function renderBulkSending(){
  const S = BULK_STATE;
  if(!S) return;
  const sent = S.list.filter(r=>r.status==='sent').length;
  const nextIdx = S.list.findIndex(r=>r.status==='pending');
  const next = nextIdx>=0 ? S.list[nextIdx] : null;
  document.getElementById('modalTitle').textContent = t('bulk_sendingTitle');
  document.getElementById('modalBody').innerHTML = `
    <div style="font-size:15px;font-weight:700;margin-bottom:6px;">${t('bulk_progress').replace('{0}', sent).replace('{1}', S.list.length)}</div>
    <div style="height:8px;background:var(--paper-soft);border-radius:6px;overflow:hidden;margin-bottom:12px;"><div style="height:100%;width:${S.list.length?Math.round(sent*100/S.list.length):0}%;background:#25D366;"></div></div>
    ${next ? `<button class="btn btn-whatsapp" id="bs_next" style="width:100%;padding:12px;font-size:15px;">${iconSVG('whatsapp',16)} ${t('bulk_openNext').replace('{0}', escapeHTML(next.name))}</button>
      <p class="muted" style="font-size:12px;margin:6px 0 12px;">${t('bulk_afterOpenHint')}</p>` : `<div class="tag tag-green" style="font-size:14px;padding:8px 12px;">${t('bulk_allDone')}</div>`}
    <div style="max-height:300px;overflow:auto;margin-top:10px;">
      <table><thead><tr><th>${t('th_name')}</th><th>${t('th_phone')}</th><th>${t('th_status')}</th><th></th></tr></thead><tbody>
        ${S.list.map((r,i)=>`<tr>
          <td>${escapeHTML(r.name)}</td><td>${escapeHTML(r.phone)}</td>
          <td>${r.status==='sent'?`<span class="tag tag-green">${t('bulk_statusSent')}</span>`:(r.status==='skipped'?`<span class="tag">${t('bulk_statusSkipped')}</span>`:`<span class="tag tag-red">${t('bulk_statusPending')}</span>`)}</td>
          <td style="white-space:nowrap;">
            <button class="btn btn-whatsapp btn-sm" data-open="${i}">${t('bulk_openChat')}</button>
            ${r.status==='pending'?`<button class="btn btn-outline btn-sm" data-skip="${i}">${t('bulk_skip')}</button>`:''}
          </td></tr>`).join('')}
      </tbody></table>
    </div>`;
  document.getElementById('modalFooter').innerHTML = `<button class="btn btn-outline" id="bs_back">${t('bulk_editMessage')}</button><button class="btn btn-primary" onclick="closeModal()">${t('btn_close')}</button>`;
  const openChat = (i)=>{
    const r = S.list[i];
    openExternal(buildWhatsAppLink(r.phone, bulkMessageText(S.tpl, r)), '_blank');
    r.status = 'sent';
    renderBulkSending();
  };
  const nb = document.getElementById('bs_next');
  if(nb) nb.addEventListener('click', ()=>openChat(nextIdx));
  document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click', ()=>openChat(parseInt(b.dataset.open))));
  document.querySelectorAll('[data-skip]').forEach(b=>b.addEventListener('click', ()=>{ S.list[parseInt(b.dataset.skip)].status='skipped'; renderBulkSending(); }));
  document.getElementById('bs_back').addEventListener('click', openBulkMessageModal);
}

      bodyHTML:`

        <div class="field"><label>${t('cust_mobileLabel')}</label><input id="cf_phone" type="tel" inputmode="numeric" maxlength="16" placeholder="${t('cust_mobilePlaceholder')}" value="${escapeHTML(customer?customer.phone:'')}"></div>

        <button class="btn btn-primary" id="saveCustomerBtn">${customer?'Save':'Add'}</button>
      `,
      onMount:()=>{
        document.getElementById('saveCustomerBtn').addEventListener('click', async ()=>{
          const name = document.getElementById('cf_name').value.trim();
          if(!name){ toast(t('toast_nameRequired'),'error'); document.getElementById('cf_name').focus(); return; }
          const phoneRaw = document.getElementById('cf_phone').value.trim();
          if(!phoneRaw){ toast(t('toast_mobileRequired'),'error'); document.getElementById('cf_phone').focus(); return; }
          if(!isValidMobile(phoneRaw)){ toast(t('toast_mobileInvalid'),'error'); document.getElementById('cf_phone').focus(); return; }

          const birthday = document.getElementById('cf_birthday').value || '';

          if(customer){
            customer.name=name; customer.phone=phone; customer.birthday=birthday; customer.anniversary=anniversary;

            await dbAdd('customers', {name, phone, birthday, anniversary, firmId: firmIdForStockOps(), creditBalance:0, storeCredit:0, ledger:[], loyaltyPoints:0, pointsLedger:[]});
          }
          closeModal();
          toast(t('toast_saved'),'success');
          await renderCustomerTable();
        });
      }
    });
  });
}

}
async function openCustomerInsightsModal(){
  const [customers, bills] = await Promise.all([scopedGetAll('customers'), scopedLiveBills()]);

  // Build a per-customer purchase summary from their bills. Walk-in bills (no customerId)
  // aren't attributable to anyone, so they're left out of segmentation entirely.
  const summary = new Map();
  bills.forEach(b=>{
    if(!b.customerId) return;
    const s = summary.get(b.customerId) || {spend:0, count:0, lastDate:null, firstDate:null};
    s.spend += b.grandTotal||0;
    s.count += 1;
    if(!s.lastDate || new Date(b.date) > new Date(s.lastDate)) s.lastDate = b.date;
    if(!s.firstDate || new Date(b.date) < new Date(s.firstDate)) s.firstDate = b.date;
    summary.set(b.customerId, s);
  });

  const now = Date.now();
  const rows = customers.filter(c=>summary.has(c.id)).map(c=>{
    const s = summary.get(c.id);
    return {
      customer:c,
      spend: Math.round(s.spend*100)/100,
      count: s.count,
      lastDate: s.lastDate,
      firstDate: s.firstDate,
      daysSinceLast: Math.floor((now-new Date(s.lastDate).getTime())/86400000),
      daysSinceFirst: Math.floor((now-new Date(s.firstDate).getTime())/86400000)
    };
  });
  const noHistoryCount = customers.length - rows.length;

  openModal({
    title:t('modal_customerInsights'),
    wide:true,
    bodyHTML:`
      <p class="muted" style="font-size:12px;">Based on ${rows.length} customer${rows.length===1?'':'s'} with at least one purchase on file${noHistoryCount>0?` (${noHistoryCount} more customer${noHistoryCount===1?'':'s'} on file haven't purchased yet)`:''}.</p>
      <div class="row" style="align-items:center;gap:10px;margin:6px 0 14px;">
        <div class="col field" style="max-width:220px;margin-bottom:0;">
          <label style="font-size:11px;">${t('cust_lapsedDaysLabel')}</label>
          <input id="ci_lapsedDays" type="number" min="1" step="1" value="${SETTINGS.lapsedCustomerDays!=null?SETTINGS.lapsedCustomerDays:60}">
        </div>
        <div class="col" style="flex:0 0 auto;align-self:flex-end;">
          <button type="button" class="btn btn-outline btn-sm" id="ci_exportLapsedBtn">${iconSVG('download',13)} ${t('cust_exportLapsedListBtn')}</button>
        </div>
      </div>
      <div class="row" style="align-items:flex-start;flex-wrap:wrap;">
        <div class="col card" style="min-width:300px;">
          <h2 class="section-title">🏆 Best Customers</h2>
          <div id="ciBestWrap" style="max-height:320px;overflow:auto;"></div>
        </div>
        <div class="col card" style="min-width:300px;">
          <h2 class="section-title">✨ New Customers <span class="muted" style="font-weight:400;font-size:11px;">${t('cust_newCustomersNote')}</span></h2>
          <div id="ciNewWrap" style="max-height:320px;overflow:auto;"></div>
        </div>
      </div>
      <div class="card" style="margin-top:12px;">
        <h2 class="section-title">💤 Lapsed / At-Risk Customers</h2>
        <div id="ciLapsedWrap" style="max-height:360px;overflow:auto;"></div>
      </div>
    `,
    footerHTML:`<button class="btn btn-outline" onclick="closeModal()">${t('print_closeBtn')}</button>`,
    onMount:()=>{
      let lastLapsed = [];
      const render = ()=>{
        const thresholdDays = Math.max(1, parseInt(document.getElementById('ci_lapsedDays').value)||60);

        const best = rows.slice().sort((a,b)=>b.spend-a.spend).slice(0,10);
        document.getElementById('ciBestWrap').innerHTML = best.length===0 ? `<div class="empty-state">${t('cust_noPurchaseHistoryYet')}</div>` : `
          <table>
            <thead><tr><th>${t('th_customer')}</th><th class="num">${t('th_spend')}</th><th class="num">${t('th_visits')}</th><th>${t('th_lastVisit')}</th></tr></thead>
            <tbody>${best.map(r=>`
              <tr>
                <td><strong>${escapeHTML(r.customer.name)}</strong>${r.customer.phone?`<br><span class="muted" style="font-size:11px;">${escapeHTML(r.customer.phone)}</span>`:''}</td>
                <td class="num">${fmtMoney(r.spend)}</td>
                <td class="num">${r.count}</td>
                <td>${daysAgoLabel(r.daysSinceLast)}</td>
              </tr>
            `).join('')}</tbody>
          </table>`;

        const fresh = rows.filter(r=>r.daysSinceFirst<=30).sort((a,b)=>a.daysSinceFirst-b.daysSinceFirst);
        document.getElementById('ciNewWrap').innerHTML = fresh.length===0 ? `<div class="empty-state">${t('cust_noNewCustomers30d')}</div>` : `
          <table>
            <thead><tr><th>${t('th_customer')}</th><th class="num">${t('th_spend')}</th><th>${t('th_firstVisit')}</th></tr></thead>
            <tbody>${fresh.map(r=>`
              <tr>
                <td><strong>${escapeHTML(r.customer.name)}</strong>${r.customer.phone?`<br><span class="muted" style="font-size:11px;">${escapeHTML(r.customer.phone)}</span>`:''}</td>
                <td class="num">${fmtMoney(r.spend)}</td>
                <td>${daysAgoLabel(r.daysSinceFirst)}</td>
              </tr>
            `).join('')}</tbody>
          </table>`;

        lastLapsed = rows.filter(r=>r.daysSinceLast>=thresholdDays).sort((a,b)=>b.spend-a.spend);
        document.getElementById('ciLapsedWrap').innerHTML = lastLapsed.length===0 ? `<div class="empty-state">${t('cust_noCustomersPastThreshold')}</div>` : `
          <table>
            <thead><tr><th>${t('th_customer')}</th><th class="num">${t('th_lifetimeSpend')}</th><th class="num">${t('th_visits')}</th><th>${t('th_lastVisit')}</th><th></th></tr></thead>
            <tbody>${lastLapsed.map(r=>`
              <tr>
                <td><strong>${escapeHTML(r.customer.name)}</strong>${r.customer.phone?`<br><span class="muted" style="font-size:11px;">${escapeHTML(r.customer.phone)}</span>`:''}</td>
                <td class="num">${fmtMoney(r.spend)}</td>
                <td class="num">${r.count}</td>
                <td><span class="tag tag-amber">${daysAgoLabel(r.daysSinceLast)}</span></td>
                <td><button type="button" class="btn btn-whatsapp btn-sm ci-winback-btn" data-id="${r.customer.id}">${iconSVG('whatsapp',13)} ${t('cust_winBack')}</button></td>
              </tr>
            `).join('')}</tbody>
          </table>`;

        document.querySelectorAll('.ci-winback-btn').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            const r = rows.find(x=>x.customer.id===Number(btn.dataset.id));
            if(!r) return;
            const template = SETTINGS.winBackTemplate || DEFAULT_SETTINGS.winBackTemplate;
            const text = template.replace(/\{shop\}/g, SETTINGS.name||t('wa_ourShopFallback'));
            if(r.customer.phone){ openExternal(buildWhatsAppLink(r.customer.phone, text), '_blank'); }
            else { promptPhoneThenOpen(text); }
          });
        });
      };
      document.getElementById('ci_lapsedDays').addEventListener('input', render);
      document.getElementById('ci_exportLapsedBtn').addEventListener('click', ()=>{
        const rowsCsv = [toCSVRow(['Name','Phone','Lifetime Spend','Visits','Last Visit','Days Since Last Visit'])];
        lastLapsed.forEach(r=>{
          rowsCsv.push(toCSVRow([r.customer.name, r.customer.phone||'', r.spend, r.count, fmtDate(r.lastDate), r.daysSinceLast]));
        });
        const blob = new Blob([rowsCsv.join('\n')], {type:'text/csv'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'lapsed-customers-'+todayISO()+'.csv';
        a.click();
        URL.revokeObjectURL(url);
      });
      render();
    }
  });
}

<script>
let SALES_RANGE = 'today';
let SALES_CUSTOM_FROM = '';
let SALES_CUSTOM_TO = '';

function rangeToDates(range){
  const now = new Date();
  let from, to;
  to = new Date(now); to.setHours(23,59,59,999);
  if(range==='today'){
    from = new Date(now); from.setHours(0,0,0,0);
  } else if(range==='week'){
    from = new Date(now); from.setDate(now.getDate()-6); from.setHours(0,0,0,0);
  } else if(range==='month'){
    from = new Date(now.getFullYear(), now.getMonth(), 1);
  } else if(range==='custom'){
    from = SALES_CUSTOM_FROM ? new Date(SALES_CUSTOM_FROM+'T00:00:00') : new Date(2000,0,1);
    to = SALES_CUSTOM_TO ? new Date(SALES_CUSTOM_TO+'T23:59:59.999') : to;
    if(from>to){ const t=from; from=to; to=t; } // guard against an inverted From/To pick
  } else { // all
    from = new Date(2000,0,1);
  }
  return {from, to};
}

          <option value="month">${t('staff_thisMonthOption')}</option>

          <option value="custom">${t('staff_customRangeOption')}</option>
