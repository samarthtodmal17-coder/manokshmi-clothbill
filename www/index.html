async function quickAdjustStock(productId, variantIndex, direction){
  const fresh = await dbGet('products', productId);
  if(!fresh || !fresh.variants[variantIndex]) return;
  const v = fresh.variants[variantIndex];
  const prevStock = Number(v.stock||0);
  if(direction==='remove' && prevStock<=0){ toast(t('toast_alreadyZeroStock'),'error'); return; }
  const delta = direction==='add' ? 1 : -1;
  adjustFirmStock(v, fresh.firmId, delta);
  await dbPut('products', fresh);
  await dbAdd('stockAdjustments', {
    productId, variantIndex,
    productName: fresh.name,
    variantLabel: [v.size,v.color].filter(Boolean).join('/') || v.sku || '',
    sku: v.sku||'',
    firmId: fresh.firmId,
    delta: v.stock - prevStock,
    previousStock: prevStock,
    newStock: v.stock,
    reason: 'Quick Adjustment', note: '+1/-1 from the product list',
    date: new Date().toISOString(),
    user: (typeof CURRENT_USER!=='undefined' && CURRENT_USER) ? CURRENT_USER.name : 'Owner'
  });
  await renderInventoryTable();
  await refreshLowStockBadge();
}

const INV_EXPANDED_VARIANTS = new Set();
async function renderInventoryTable(){
  const wrap = document.getElementById('invTableWrap');
  if(!wrap) return;
  let products = await scopedGetAll('products');
  const totalProductCount = products.length;
  if(INV_STATE.category) products = products.filter(p=>p.category===INV_STATE.category);
  if(INV_STATE.brand) products = products.filter(p=>p.brand===INV_STATE.brand);
  if(INV_STATE.size) products = products.filter(p=>(p.variants||[]).some(v=>v.size===INV_STATE.size));
  if(INV_STATE.color) products = products.filter(p=>(p.variants||[]).some(v=>v.color===INV_STATE.color));
  const priceMin = INV_STATE.priceMin!=='' ? parseFloat(INV_STATE.priceMin) : null;
  const priceMax = INV_STATE.priceMax!=='' ? parseFloat(INV_STATE.priceMax) : null;
  if(priceMin!=null || priceMax!=null){
    products = products.filter(p=>(p.variants||[]).some(v=>{
      const price = Number(v.sellPrice||0);
      if(priceMin!=null && price<priceMin) return false;
      if(priceMax!=null && price>priceMax) return false;
      return true;
    }));
  }
  if(INV_STATE.search){
    const q = INV_STATE.search.toLowerCase();
    products = products.filter(p=>{
      if(p.name.toLowerCase().includes(q) || (p.brand||'').toLowerCase().includes(q)) return true;
      return (p.variants||[]).some(v=>(v.sku||'').toLowerCase().includes(q));
    });
  }
  if(INV_STATE.stockFilter==='low') products = products.filter(p=>(p.variants||[]).some(variantIsLow));
  else if(INV_STATE.stockFilter==='out') products = products.filter(p=>(p.variants||[]).some(variantIsOut));
  else if(INV_STATE.stockFilter==='sale') products = products.filter(p=>(p.variants||[]).some(isVariantOnSale));

  const totalStockOf = (p)=>(p.variants||[]).reduce((s,v)=>s+Number(v.stock||0),0);
  const minPriceOf = (p)=>Math.min(...(p.variants||[{sellPrice:0}]).map(v=>Number(v.sellPrice||0)));
  const dir = INV_STATE.sortDir==='desc' ? -1 : 1;
  products.sort((a,b)=>{
    if(INV_STATE.sortBy==='stock') return (totalStockOf(a)-totalStockOf(b))*dir;
    if(INV_STATE.sortBy==='price') return (minPriceOf(a)-minPriceOf(b))*dir;
    return a.name.localeCompare(b.name)*dir;
  });

  const anyFilterActive = INV_STATE.search || INV_STATE.category || INV_STATE.brand || INV_STATE.size || INV_STATE.color || INV_STATE.priceMin!=='' || INV_STATE.priceMax!=='' || INV_STATE.stockFilter!=='all';
  const filteredCount = products.length;

  if(filteredCount===0){
    wrap.innerHTML = `<div class="empty-state">${t('inv_noProductsMatch')}${isOwner() && !anyFilterActive ? t('inv_clickAddProductHint') : t('inv_tryClearingFilters')}</div>`;
    return;
  }

  // Paginate — with a large catalog (100+ SKUs), rendering every row (each with several
  // buttons per variant) at once gets slow and overwhelming to scroll through.
  const pageSize = INV_STATE.pageSize==='all' ? filteredCount : Number(INV_STATE.pageSize);
  const totalPages = Math.max(1, Math.ceil(filteredCount/pageSize));
  if(INV_STATE.page > totalPages) INV_STATE.page = totalPages;
  if(INV_STATE.page < 1) INV_STATE.page = 1;
  const pageStart = (INV_STATE.page-1)*pageSize;
  const pageProducts = products.slice(pageStart, pageStart+pageSize);

  const sortArrow = (col)=> INV_STATE.sortBy===col ? (INV_STATE.sortDir==='desc'?' ▼':' ▲') : '';
  const sortTh = (col,label)=>`<th class="sortable-th" data-sort="${col}" style="cursor:pointer;user-select:none;white-space:nowrap;">${label}${sortArrow(col)}</th>`;
  const stepBtnStyle = 'width:17px;height:17px;line-height:15px;padding:0;border-radius:4px;border:1px solid rgba(0,0,0,0.15);background:#fff;cursor:pointer;font-size:12px;font-weight:700;';

  let rows = '';
  pageProducts.forEach(p=>{
    const totalStock = totalStockOf(p);
    const allVariants = (p.variants||[]);
    const chipCap = 8;
    const expanded = INV_EXPANDED_VARIANTS.has(p.id);
    const shownVariants = (expanded || allVariants.length<=chipCap) ? allVariants : allVariants.slice(0, chipCap);
    const hiddenCount = allVariants.length - shownVariants.length;
    const variantChips = shownVariants.map((v,vi)=>{
      // vi matches the real position because slicing only ever drops the tail
      const out = variantIsOut(v), low = variantIsLow(v);
      const cls = out ? 'tag-red' : (low ? 'tag-amber' : 'tag-green');
      const label = [v.size,v.color].filter(Boolean).join('/') || v.sku || 'default';
      const onSale = isVariantOnSale(v);
      const saleInfo = onSale ? ` &middot; ${iconSVG('tag',11)} <strong>${fmtMoney(variantSalePrice(v))}</strong> <span style="text-decoration:line-through;opacity:0.6;">${fmtMoney(v.sellPrice)}</span>` : '';
      const saleBtn = isOwner() ? `<button type="button" class="saleStepBtn" data-pid="${p.id}" data-vi="${vi}" title="${onSale?t('inv_editEndSaleTitle'):t('inv_putOnSaleChipTitle')}" style="${stepBtnStyle}${onSale?'background:var(--wine);border-color:var(--wine);color:#fff;':''}">${iconSVG('tag',11)}</button>` : '';
      const stepper = isOwner() ? `
        <button type="button" class="qtyStepBtn" data-pid="${p.id}" data-vi="${vi}" data-dir="remove" title="${t('inv_removeOneTitle')}" style="${stepBtnStyle}">&minus;</button>
        <button type="button" class="qtyStepBtn" data-pid="${p.id}" data-vi="${vi}" data-dir="add" title="${t('inv_addOneTitle')}" style="${stepBtnStyle}">+</button>
        ${saleBtn}
      ` : '';
      return `<span class="tag ${cls}" title="${escapeHTML('SKU: '+(v.sku||''))}" style="display:inline-flex;align-items:center;gap:4px;margin:2px 4px 2px 0;">${escapeHTML(label)}: ${v.stock}${saleInfo}${stepper}</span>`;
    }).join(' ')
      + (hiddenCount>0 ? ` <button type="button" class="inv-variant-more" data-pid="${p.id}">${t('inv_showMoreVariants').replace('{0}', hiddenCount)}</button>` : '')
      + (expanded && allVariants.length>chipCap ? ` <button type="button" class="inv-variant-more" data-pid="${p.id}">${t('inv_showFewerVariants')}</button>` : '');
    const thumb = p.photo
      ? `<img src="${p.photo}" style="width:36px;height:36px;object-fit:cover;border-radius:8px;flex:none;">`
      : `<div style="width:36px;height:36px;border-radius:8px;background:var(--paper-soft);border:1px solid var(--line);flex:none;"></div>`;
    rows += `
      <tr>
        <td>
          <div style="display:flex;align-items:center;gap:8px;">
            ${thumb}
            <div>
              <strong>${escapeHTML(p.name)}</strong>${isCombinedFirmView() && multiFirmInUse() ? ` <span class="tag" style="font-size:10px;">${escapeHTML((firmById(p.firmId)||{}).name||'—')}</span>` : ''}<br>
              <span class="muted" style="font-size:11.5px">${escapeHTML(p.brand||'')}</span>
            </div>
          </div>
        </td>
        <td>${escapeHTML(p.category||'-')}</td>
        <td>${variantChips}</td>
        <td class="num">${totalStock}</td>
        <td class="num">${fmtMoney(minPriceOf(p))}</td>
        <td>
          ${isOwner()?`<button class="btn btn-outline btn-sm" onclick="openProductModal(${p.id})">${t('acct_editBtn')}</button>`:''}
          ${isOwner()?`<button class="btn btn-outline btn-sm" onclick="openStockAdjustModal(${p.id})" title="${t('inv_adjustStockTitle')}">${iconSVG('adjust',13)} ${t('inv_adjustBtn')}</button>`:''}
          ${isOwner()?`<button class="btn btn-outline btn-sm" onclick="openProductSaleModal(${p.id})" title="${t('inv_putOnSaleTitle')}">${iconSVG('tag',13)} ${t('acct_typeSale')}</button>`:''}

  const pageEnd = Math.min(filteredCount, pageStart+pageProducts.length);
  wrap.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:2px 2px 10px;">
      <span class="muted" style="font-size:12.5px;">${t('inv_showingRange').replace('{0}', pageStart+1).replace('{1}', pageEnd).replace('{2}', filteredCount)}${anyFilterActive?(' '+t('inv_totalParen').replace('{0}', totalProductCount)):''}</span>
      <div style="display:flex;align-items:center;gap:6px;">
        <label class="muted" style="font-size:11.5px;">${t('inv_perPageLabel')}</label>
        <select id="invPageSize" style="padding:4px 6px;font-size:12.5px;">
          ${['25','50','100','all'].map(sz=>`<option value="${sz}" ${String(INV_STATE.pageSize)===sz?'selected':''}>${sz==='all'?t('inv_pageSizeAll'):sz}</option>`).join('')}
        </select>
      </div>
    </div>
    <div style="overflow-x:auto;">
    <table class="inv-table">
      <thead><tr>${sortTh('name',t('vendor_labelProduct'))}<th>${t('th_category')}</th><th>${t('th_variantsStock')}</th>${sortTh('stock',t('inv_totalStockCol'))}${sortTh('price',t('staff_fromLabel'))}<th>${t('th_actions')}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${totalPages>1?`
    <div style="display:flex;justify-content:center;align-items:center;gap:10px;padding:12px 2px 2px;">
      <button type="button" class="btn btn-outline btn-sm" id="invPrevPage" ${INV_STATE.page<=1?'disabled':''}>${t('inv_prevPage')}</button>
      <span class="muted" style="font-size:12.5px;">${t('inv_pageXofY').replace('{0}', INV_STATE.page).replace('{1}', totalPages)}</span>
      <button type="button" class="btn btn-outline btn-sm" id="invNextPage" ${INV_STATE.page>=totalPages?'disabled':''}>${t('inv_nextPage')}</button>
    </div>`:''}
  `;
  wrap.querySelectorAll('.sortable-th').forEach(th=>{
    th.addEventListener('click', ()=>{
      const col = th.dataset.sort;
      if(INV_STATE.sortBy===col) INV_STATE.sortDir = INV_STATE.sortDir==='asc' ? 'desc' : 'asc';
      else { INV_STATE.sortBy = col; INV_STATE.sortDir = 'asc'; }
      INV_STATE.page = 1;
      renderInventoryTable();
    });
  });
  wrap.querySelectorAll('.inv-variant-more').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const pid = parseInt(btn.dataset.pid);
      if(INV_EXPANDED_VARIANTS.has(pid)) INV_EXPANDED_VARIANTS.delete(pid);
      else INV_EXPANDED_VARIANTS.add(pid);
      renderInventoryTable();
    });
  });
  wrap.querySelectorAll('.qtyStepBtn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      quickAdjustStock(parseInt(btn.dataset.pid), parseInt(btn.dataset.vi), btn.dataset.dir);

  });
  wrap.querySelectorAll('.saleStepBtn').forEach(btn=>{

  });

  });
  const prevBtn = document.getElementById('invPrevPage');
  const nextBtn = document.getElementById('invNextPage');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ INV_STATE.page--; renderInventoryTable(); });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ INV_STATE.page++; renderInventoryTable(); });
}

async function openProductModal(productId){
  let product = null;
  if(productId){
    product = await dbGet('products', productId);
  } else if(!requireWorkingFirm(t('action_addProduct'))){
    return;
  }
  openProductModalCore(product, productId, product?t('modal_editProduct'):t('modal_addProduct'));
}

async function duplicateProduct(productId){
  const original = await dbGet('products', productId);
  if(!original) return;
  const copy = {
    name: original.name + ' (Copy)',
    brand: original.brand || '',
    category: original.category || '',
    taxRate: original.taxRate,
    taxInclusive: !!original.taxInclusive,
    photo: original.photo || '',
    firmId: original.firmId,
    preferredSupplierId: original.preferredSupplierId || null,
    variants: (original.variants||[]).map(v=>({...v, sku:'', stock:0}))
  };
  openProductModalCore(copy, null, t('modal_duplicateProduct'));
  toast(t('toast_reviewDuplicatedProduct'),'success');
}

// ---- Live "bill for this stock" shown inside the stock forms when a vendor is chosen ----
let PUR_SUP_MAP = {};   // supplier id -> supplier (fresh when the form opened)
let PUR_INV_LIST = [];  // stock-entry purchase bills, to spot "same supplier bill number"
let LAST_STOCK_BILL = null;   // {supplierId, billNo, at}: lets the next product continue the same bill
async function loadPurchaseBills(){ try{ PUR_INV_LIST = (await scopedGetAll('purchaseInvoices')).filter(i=>i.source==='stock-entry'); }catch(e){ PUR_INV_LIST = []; } }
function findStockBill(supplierId, billNo){
  const k = normBillNo(billNo); if(!k || !supplierId) return null;
  return PUR_INV_LIST.find(i=>i.supplierId===supplierId && normBillNo(i.billNo)===k) || null;
}
// Bill-number box helpers shared by the product form ('pf') and Adjust Stock ('sa').
function billNoFieldHTML(px){
  return `<div class="row" style="margin-bottom:0;"><div class="col field" style="margin-bottom:8px;"><label>${t('pu_supplierBillNo')}</label>
    <input id="${px}_billNo" list="${px}_billList" autocomplete="off" placeholder="${escapeHTML(t('pu_billNoPlaceholder'))}"><datalist id="${px}_billList"></datalist></div>
    <div class="col field" style="margin-bottom:8px;max-width:170px;"><label>${t('pu_billDate')}</label><input type="date" id="${px}_billDate" value="${localISODate()}" max="${localISODate()}"></div></div>
    <div class="muted" style="font-size:11.5px;margin:-4px 0 8px;">${t('pu_billNoHint')}</div>`;
}
function syncBillNoField(px, supplierId, prefill){
  const inp = document.getElementById(px+'_billNo'), dl = document.getElementById(px+'_billList');
  if(!inp || !dl) return;
  const seen = new Set();
  dl.innerHTML = PUR_INV_LIST.filter(i=>i.supplierId===supplierId && i.billNo).sort((a,b)=>String(b.date).localeCompare(String(a.date)))
    .filter(i=>{ const k = normBillNo(i.billNo); if(seen.has(k)) return false; seen.add(k); return true; }).slice(0,20)
    .map(i=>`<option value="${escapeHTML(i.billNo)}"></option>`).join('');
  // Continue the bill the last product was added to (same vendor, within the hour).
  if(prefill && !inp.value && supplierId && LAST_STOCK_BILL && LAST_STOCK_BILL.supplierId===supplierId && Date.now()-LAST_STOCK_BILL.at < 3600000) inp.value = LAST_STOCK_BILL.billNo;
}
let PF_OLD_PRODUCT = null;
function supplierOptionLabel(s){
  const due = Number(s.balanceDue)||0;
  return escapeHTML(s.name) + (due>0.005 ? ' — ' + escapeHTML(fillTpl(t('pur_outstandingTag'),[fmtMoney(due)])) : '');
}
// px: 'pf' (product form) or 'sa' (adjust stock). lines: [{label, qty, rate}]
function purchaseSummaryRender(px, lines, gstRate){
  const box = document.getElementById(px+'_purSummary');
  if(!box) return;
  const ids = px==='pf' ? {sup:'pf_supplier', gst:'pf_purGst', paid:'pf_purPaid'} : {sup:'sa_vendor', gst:'sa_gst', paid:'sa_paid'};
  const supSel = document.getElementById(ids.sup);
  const sid = supSel && supSel.value ? parseInt(supSel.value) : null;
  const sup = sid ? PUR_SUP_MAP[sid] : null;
  if(!sup){ box.innerHTML = ''; box.dataset.total = '0'; return; }
  const r2 = x=>Math.round(x*100)/100;
  const billEl = document.getElementById(px+'_billNo');
  const bill = findStockBill(sid, billEl ? billEl.value : '');
  const bdEl = document.getElementById(px+'_billDate');
  if(bdEl){ if(bill){ bdEl.value = localISODate(new Date(bill.date)); bdEl.disabled = true; } else bdEl.disabled = false; }
  const gstSel = document.getElementById(ids.gst);
  if(gstSel){ if(bill){ gstSel.value = bill.gstMode==='report' ? 'report' : 'none'; gstSel.disabled = true; } else gstSel.disabled = false; }
  const row = (l, v, strong, color)=>`<div style="display:flex;justify-content:space-between;gap:10px;${strong?'font-weight:700;':''}${color?'color:'+color+';':''}"><span>${l}</span><span style="white-space:nowrap;">${v}</span></div>`;
  const prevDue = r2(Number(sup.balanceDue)||0);
  const subtotal = r2(lines.reduce((s,l)=>s+l.qty*l.rate,0));
  const rate = document.getElementById(ids.gst).value==='report' ? Math.max(0, Number(gstRate)||0) : 0;
  const gst = r2(subtotal*rate/100);
  const total = r2(subtotal+gst);
  const billPaidBefore = bill ? r2(invoicePaid(bill)) : 0;
  const billTotalAfter = bill ? r2(bill.total + total) : total;
  const payRoom = r2(billTotalAfter - billPaidBefore);     // most that can still be paid on this bill
  box.dataset.total = String(Math.max(0, payRoom));
  const paid = r2(Math.min(Math.max(0, payRoom), Math.max(0, parseFloat(document.getElementById(ids.paid).value)||0)));
  const thisDue = r2(payRoom-paid);
  const newDue = bill ? r2(prevDue + total - paid) : r2(prevDue+(total-paid));
  let h = `<div style="border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;font-size:12.5px;display:flex;flex-direction:column;gap:3px;">`;
  h += `<div style="font-weight:700;font-size:12px;letter-spacing:.3px;color:var(--ink-soft);text-transform:uppercase;">${bill ? escapeHTML(fillTpl(t('pur_sumJoin'),[bill.billNo, bill.invoiceNumber])) : t('pur_sumTitle')}</div>`;
  if(bill) h += `<div class="muted">${escapeHTML(fillTpl(t('pur_sumGstFollows'),[bill.gstMode==='report' ? t('pur_gstFollowsReport') : t('pur_gstFollowsNone')]))}</div>`;
  if(!lines.length){
    h += `<div class="muted">${t('pur_sumNoStock')}</div>`;
  } else {
    lines.forEach(l=>{ h += row(`${escapeHTML(l.label)}: +${l.qty} × ${fmtMoney(l.rate)}`, fmtMoney(l.qty*l.rate)); });
    if(lines.some(l=>!(l.rate>0))) h += `<div style="color:var(--red);">${t('pur_sumNoCost')}</div>`;
    h += row(t('pur_sumSubtotal'), fmtMoney(subtotal));
    if(rate>0) h += row(fillTpl(t('pur_sumGst'),[rate]), fmtMoney(gst));
    if(bill){
      h += row(t('pur_sumThisStock'), fmtMoney(total), true);
      h += row(t('pur_sumJoinSoFar'), fmtMoney(bill.total));
      h += row(t('pur_sumBillAfter'), fmtMoney(billTotalAfter), true);
      h += row(t('pur_sumBillPaid'), fmtMoney(billPaidBefore));
      h += row(t('pur_sumPaid'), '− '+fmtMoney(paid));
      h += row(t('pur_sumThisDue'), fmtMoney(thisDue));
    } else {
      h += row(t('pur_sumTotal'), fmtMoney(total), true);
      h += row(t('pur_sumPaid'), '− '+fmtMoney(paid));
      h += row(t('pur_sumThisDue'), fmtMoney(thisDue));
    }
  }
  h += row(escapeHTML(fillTpl(t('pur_sumEarlier'),[sup.name])), fmtMoney(prevDue));
  h += `<div style="border-top:1px solid var(--line);margin-top:3px;padding-top:4px;">${row(escapeHTML(fillTpl(t('pur_sumNewDue'),[sup.name])), fmtMoney(newDue), true, newDue>0.005?'var(--red)':'var(--green)')}</div>`;
  h += `</div>`;
  box.innerHTML = h;
}
// Product form: added units = new stock minus what the saved product had (matched by SKU, same as saving does).
function pfPurchaseLines(){
  const lines = [];
  (typeof VARIANT_ROWS!=='undefined' ? VARIANT_ROWS : []).forEach((v,i)=>{
    const prev = PF_OLD_PRODUCT ? (PF_OLD_PRODUCT.variants||[]).find(x=>x.sku && x.sku===(v.sku||'').trim()) : null;
    const added = (parseInt(v.stock)||0) - (prev ? Number(prev.stock||0) : 0);
    if(added>0) lines.push({label:[v.size,v.color].filter(Boolean).join('/') || (v.sku||'').trim() || (t('inv_variantFallbackPrefix')+(i+1)), qty:added, rate:parseFloat(v.costPrice)||0});
  });
  return lines;
}
function updatePfPurchaseSummary(){

// Fills {0},{1}… in a translated sentence (every occurrence, not just the first).
function fillTpl(str, args){ return args.reduce((s,a,i)=>s.split('{'+i+'}').join(String(a)), str); }
// Live example under the GST fields so the owner sees exactly what a price will do.
function updateProductTaxPreview(){
  const el = document.getElementById('pf_taxPreview');
  if(!el) return;
  const rate = parseFloat(document.getElementById('pf_tax').value)||0;
  const incl = document.getElementById('pf_taxmode').value==='incl';
  const row = (typeof VARIANT_ROWS!=='undefined' ? VARIANT_ROWS : []).find(v=>parseFloat(v.sellPrice)>0);
  const price = row ? parseFloat(row.sellPrice) : 999;
  const r2 = x=>Math.round(x*100)/100;
  if(!(rate>0)){ el.textContent = ''; return; }
  if(incl){
    const tax = r2(price*rate/(100+rate)), taxable = r2(price-tax), cg = r2(tax/2), sg = r2(tax-cg);
    el.textContent = fillTpl(t('prod_gstExampleIncl'), [fmtMoney(price), rate, fmtMoney(taxable), String(+(rate/2).toFixed(2)), fmtMoney(cg), fmtMoney(sg)]);
  } else {
    const tax = r2(price*rate/100);
    el.textContent = fillTpl(t('prod_gstExampleExcl'), [fmtMoney(price), rate, fmtMoney(tax), fmtMoney(r2(price+tax))]);
  }
}

async function saveProductFromModal(productId){
  const name = document.getElementById('pf_name').value.trim();
  if(!name){ toast(t('toast_productNameRequired'),'error'); return; }
  const cleanVariants = VARIANT_ROWS.map(v=>{
    const stock = parseInt(v.stock)||0;
    return {
    sku: (v.sku||'').trim(),
    size: (v.size||'').trim(),
    color: (v.color||'').trim(),
    costPrice: parseFloat(v.costPrice)||0,
    sellPrice: parseFloat(v.sellPrice)||0,
    stock,
    lowStock: v.lowStock===''||v.lowStock==null ? null : parseInt(v.lowStock),
    // Sale fields aren't editable from this form (they're managed from the Inventory list),
    // but must be carried through here or every product edit would silently clear any active sale.
    saleType: v.saleType||null,
    saleValue: v.saleValue||0,
    saleStart: v.saleStart||'',
    saleEnd: v.saleEnd||''
  };}).filter(v=>v.sellPrice>0 || v.stock>0 || v.sku || v.size || v.color);

  if(cleanVariants.length===0){ toast(t('toast_addVariantWithSellPrice'),'error'); return; }

  const record = {
    name,
    brand: document.getElementById('pf_brand').value.trim(),
    category: document.getElementById('pf_category').value.trim(),
    taxRate: parseFloat(document.getElementById('pf_tax').value)||0,
    taxInclusive: document.getElementById('pf_taxmode').value==='incl',
    hsn: (document.getElementById('pf_hsn').value||'').trim(),
    photo: PRODUCT_PHOTO || '',
    // Editing (or duplicating) keeps the product in its original firm's catalog; a
    // genuinely new product is filed under whichever firm is currently being worked as.
    firmId: CURRENT_PRODUCT_FIRM_ID!=null ? CURRENT_PRODUCT_FIRM_ID : firmIdForStockOps(),
    preferredSupplierId: document.getElementById('pf_supplier').value ? parseInt(document.getElementById('pf_supplier').value) : null,
    variants: cleanVariants,
    createdAt: new Date().toISOString()
  };
  const oldProduct = productId ? await dbGet('products', productId) : null;
  let savedId = productId;
  if(productId){
    record.id = productId;
    record.variants.forEach((v,i)=>{ if(!v.sku) v.sku = autoSKU(productId, i); });
    await dbPut('products', record);
    toast(t('toast_productUpdated'),'success');
  } else {
    const newId = await dbAdd('products', record);
    savedId = newId;
    const needsSku = record.variants.some(v=>!v.sku);
    if(needsSku){
      record.variants.forEach((v,i)=>{ if(!v.sku) v.sku = autoSKU(newId, i); });
      record.id = newId;
      await dbPut('products', record);
    }
    toast(t('toast_productAdded'),'success');
  }
  // Stock added with a vendor chosen = a purchase from that vendor. Records it under Purchases
  // (and the vendor's ledger) so the books match the shelves.
  const vendorId = record.preferredSupplierId;
  if(vendorId && document.getElementById('pf_recordPurchase') && document.getElementById('pf_recordPurchase').checked){
    const lines = [];
    record.variants.forEach((v,i)=>{
      const prev = oldProduct ? (oldProduct.variants||[]).find(x=>x.sku && x.sku===v.sku) : null;
      const added = (Number(v.stock)||0) - (prev ? Number(prev.stock||0) : 0);
      if(added>0) lines.push({productId:savedId, variantIndex:i, qty:added, rate:Number(v.costPrice)||0});
    });
    if(lines.length){
      const inv = await recordStockPurchase({
        supplierId: vendorId, lines,
        gstMode: document.getElementById('pf_purGst').value, gstRate: record.taxRate,
        paidNow: parseFloat(document.getElementById('pf_purPaid').value)||0, payMode:'Cash',
        billNo: document.getElementById('pf_billNo').value, billDate: document.getElementById('pf_billDate').value
      });
      if(inv){
        const sup = await dbGet('suppliers', vendorId);
        toast(inv.__merged ? fillTpl(t('toast_purchaseMerged'), [inv.billNo, inv.invoiceNumber, sup?sup.name:'']) : t('toast_purchaseFromStockRecorded').replace('{0}', inv.invoiceNumber).replace('{1}', sup?sup.name:''),'success');
      } else {
        toast(t('toast_purchaseNeedsCost'),'error');
      }
    }
  }
  closeModal();
  await renderInventoryTable();
  await refreshLowStockBadge();
  await refreshSupplierSurfaces();
}

// ---- Barcode label printing -------------------------------------------------------
// Every label printer behaves a little differently (paper size, feed direction, offset), so the
// label setup is fully adjustable here: size presets, shift, rotation, a live preview and a test label.
const LABEL_PRESETS = [['50x25',50,25],['38x25',38,25],['40x30',40,30],['50x30',50,30],['58x40',58,40],['75x50',75,50],['100x50',100,50],['100x150',100,150]];
function labelConfig(src){
  src = src || SETTINGS;
  const num = (x, d)=>{ const n = Number(x); return (x==null || x==='' || isNaN(n)) ? d : n; };
  const rot = [0,90,180,270].includes(Number(src.labelRot)) ? Number(src.labelRot) : 0;
  return {
    paper: src.labelPaper==='a4' ? 'a4' : 'roll',
    w: Math.max(20, num(src.labelWidthMm, 50) || 50),
    h: Math.max(15, num(src.labelHeightMm, 25) || 25),
    cols: (rot===90||rot===270) ? 1 : Math.min(4, Math.max(1, parseInt(src.labelCols)||1)),
    gap: Math.max(0, num(src.labelGapMm, 2)),
    offX: num(src.labelOffX, 0), offY: num(src.labelOffY, 0), rot,
    method: ['tspl','zpl'].includes(src.labelMethod) ? src.labelMethod : 'driver',
    printer: String(src.labelPrinter||''),
    dpi: [200,203,300,600].includes(Number(src.labelDpi)) ? Number(src.labelDpi) : 203,
    rawGap: Math.max(0, num(src.labelRawGapMm, 2)),
    invert: src.labelRawInvert===true || src.labelRawInvert==='1' || src.labelRawInvert==='true'
  };
}
function readLabelCfgFromModal(){
  const g = id=>document.getElementById(id).value;
  const has = id=>!!document.getElementById(id);
  return labelConfig({labelPaper:g('lb_paper'), labelWidthMm:g('lb_w'), labelHeightMm:g('lb_h'), labelCols:g('lb_cols'), labelGapMm:g('lb_gap'), labelOffX:g('lb_offx'), labelOffY:g('lb_offy'), labelRot:g('lb_rot'),
    labelMethod: has('lb_method')?g('lb_method'):'driver', labelPrinter: has('lb_printer')?g('lb_printer'):'', labelDpi: has('lb_dpi')?g('lb_dpi'):203,
    labelRawGapMm: has('lb_rawgap')?g('lb_rawgap'):2, labelRawInvert: has('lb_invert') ? document.getElementById('lb_invert').checked : false});
}
// The physical page the printer receives (swapped when the label is fed sideways).
function labelPageSize(cfg){
  if(cfg.paper==='a4') return {w:210, h:297};
  if(cfg.rot===90 || cfg.rot===270) return {w:cfg.h, h:cfg.w};
  return {w: cfg.w*cfg.cols + cfg.gap*(cfg.cols-1), h: cfg.h};
}
function labelItemHTML(product, productId, v, i, extra){
  const sku = v.sku || autoSKU(productId, i);
  const label = [v.size,v.color].filter(Boolean).join(' / ');
  const onSale = isVariantOnSale(v);
  // Bars are stretched to the label width (never in height) so the quiet zone stays and the code scans.
  const bars = renderBarcodeSVG(sku,{barWidth:1,height:34,showText:false}).replace('<svg ','<svg preserveAspectRatio="none" ');
  return `
    <div class="lbl${extra||''}">
      ${SETTINGS.name?`<div class="lbl-shop">${escapeHTML(SETTINGS.name)}</div>`:''}
      ${bars}
      <div class="lbl-name">${escapeHTML(product.name)}${label?(' — '+escapeHTML(label)):''}</div>
      <div class="lbl-price">${onSale
        ? `<span class="lbl-mrp">${fmtMoney(v.sellPrice)}</span> <span class="lbl-sale">${fmtMoney(variantSalePrice(v))}</span>`
        : fmtMoney(v.sellPrice)}</div>
    </div>`;
}
// CSS + markup for a roll of labels: each row of labels is exactly ONE page of the label's own
// size, so the printer's gap sensor lines every page up with a physical sticker.
function buildLabelPage(items, cfg){
  const s = Math.min(cfg.w/50, cfg.h/25);            // scale text with the label size
  const pt = n => (Math.round(n*s*10)/10)+'pt';
  const pg = labelPageSize(cfg);
  const bh = Math.round(cfg.h*0.34*10)/10;
  const sideways = cfg.rot===90 || cfg.rot===270;
  const move = `translate(${cfg.offX}mm,${cfg.offY}mm)`;
  let place;
  if(sideways){
    place = cfg.rot===90 ? `${move} translate(${cfg.h}mm,0) rotate(90deg)` : `${move} translate(0,${cfg.w}mm) rotate(-90deg)`;
  } else {
    place = cfg.rot===180 ? `${move} rotate(180deg)` : move;
  }
  const style = `
    @page{ size:${pg.w}mm ${pg.h}mm; margin:0; }
    html,body{ margin:0; padding:0; width:${pg.w}mm; background:#fff; }
    body{ font-family:Arial,Helvetica,sans-serif; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .prow{ position:relative; display:flex; gap:${cfg.gap}mm; width:${pg.w}mm; height:${pg.h-0.3}mm; break-after:page; page-break-after:always; }
    .prow:last-child{ break-after:auto; page-break-after:auto; }
    .lbl{ box-sizing:border-box; width:${cfg.w}mm; height:${cfg.h-0.3}mm; flex:none; padding:${(cfg.h*0.05).toFixed(1)}mm ${(cfg.w*0.05).toFixed(1)}mm; overflow:hidden;
          display:flex; flex-direction:column; justify-content:center; align-items:stretch; text-align:center; gap:${(cfg.h*0.012).toFixed(2)}mm;
          transform:${place}; transform-origin:${sideways?'0 0':'50% 50%'}; ${sideways?'position:absolute; left:0; top:0;':''} }
    .lbl.test{ border:0.35mm solid #000; }
    .lbl-shop{ font-size:${pt(6)}; letter-spacing:.2px; text-transform:uppercase; color:#000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.1; }
    .lbl svg{ display:block; width:90%; height:${bh}mm; flex:none; margin:0 auto; }
    .lbl-name{ font-size:${pt(7.5)}; font-weight:700; line-height:1.15; max-height:2.35em; overflow:hidden; }
    .lbl-price{ font-size:${pt(9.5)}; font-weight:800; line-height:1.1; }
    .lbl-mrp{ text-decoration:line-through; font-weight:400; font-size:${pt(7.5)}; margin-right:2px; }
    .lbl-sale{ font-size:${pt(10)}; font-weight:800; }`;
  const rows = [];
  for(let i=0;i<items.length;i+=cfg.cols) rows.push(items.slice(i,i+cfg.cols).join(''));
  return {style, body: rows.map(r=>`<div class="prow">${r}</div>`).join('')};
}


// ---- Direct label-printer mode (TSPL / ZPL) --------------------------------------------------
// The whole label is drawn as a picture at the printer's own resolution and sent straight to the
// printer as a RAW job, so the Windows driver's paper size / orientation / margins cannot matter.
function labelRawActive(cfg){ return !!(window.IS_TAURI && cfg && cfg.method!=='driver' && cfg.paper==='roll'); }
function labelItemData(product, productId, v, i){
  const onSale = isVariantOnSale(v);
  const label = [v.size,v.color].filter(Boolean).join(' / ');
  return {
    shop: SETTINGS.name || '', sku: v.sku || autoSKU(productId, i),
    name: String(product.name||'') + (label ? (' — '+label) : ''),
    mrp: onSale ? fmtMoney(v.sellPrice) : '', priceText: fmtMoney(onSale ? variantSalePrice(v) : v.sellPrice)
  };
}
// Draws one upright label into ctx at (x0,y0) inside a box of wd x hd dots.
function drawRawLabel(ctx, d, x0, y0, wd, hd, cfg){
  const dpmm = cfg.dpi/25.4, s = Math.min(cfg.w/50, cfg.h/25), pxPt = cfg.dpi/72;
  const padX = Math.round(cfg.w*0.05*dpmm), padY = Math.round(cfg.h*0.05*dpmm);
  const innerW = wd - 2*padX;
  const FONT = '"Nirmala UI","Segoe UI",Arial,sans-serif';
  const font = (pt,bold)=>`${bold?'700 ':''}${Math.max(6,Math.round(pt*s*pxPt))}px ${FONT}`;
  ctx.fillStyle = '#000'; ctx.strokeStyle = '#000'; ctx.textBaseline = 'top'; ctx.textAlign = 'center';
  if(d.test){ const bw = Math.max(2, Math.round(0.35*dpmm)); ctx.lineWidth = bw; ctx.strokeRect(x0+bw/2, y0+bw/2, wd-bw, hd-bw); }
  const fit = (txt, f, maxW)=>{ ctx.font = f; if(ctx.measureText(txt).width<=maxW) return txt; let a = txt; while(a.length>1 && ctx.measureText(a+'…').width>maxW) a = a.slice(0,-1); return a+'…'; };
  const wrap = (txt, f, maxW, maxLines)=>{
    ctx.font = f; const words = txt.split(/\s+/), lines = []; let cur = '';
    for(const w of words){ const tst = cur ? cur+' '+w : w; if(ctx.measureText(tst).width<=maxW || !cur) cur = tst; else { lines.push(cur); cur = w; } }
    if(cur) lines.push(cur);
    if(lines.length>maxLines){ const keep = lines.slice(0,maxLines); keep[maxLines-1] = fit(lines.slice(maxLines-1).join(' '), f, maxW); return keep; }
    return lines.map(l=>fit(l,f,maxW));
  };
  const gap = Math.max(1, Math.round(cfg.h*0.012*dpmm));
  const shopF = font(6,false), nameF = font(7.5,true), priceF = font(9.5,true), mrpF = font(7.5,false);
  const shopTxt = d.shop ? fit(String(d.shop).toUpperCase(), shopF, innerW) : '';
  const lh = f=>Math.round(parseInt(f.match(/(\d+)px/)[1])*1.15);
  const nameLines = wrap(d.name||'', nameF, innerW, 2);
  const bh = Math.round(cfg.h*0.34*dpmm);
  const parts = [];
  if(shopTxt) parts.push({k:'shop', h:lh(shopF)});
  parts.push({k:'bar', h:bh});
  nameLines.forEach(()=>parts.push({k:'name', h:lh(nameF)}));
  parts.push({k:'price', h:lh(priceF)});
  const total = parts.reduce((a,b)=>a+b.h,0) + gap*(parts.length-1);
  let y = y0 + Math.max(padY, Math.round((hd-total)/2));
  let nameIdx = 0; const cx = x0 + wd/2;
  for(const pt of parts){
    if(pt.k==='shop'){ ctx.font = shopF; ctx.fillText(shopTxt, cx, y); }
    else if(pt.k==='name'){ ctx.font = nameF; ctx.fillText(nameLines[nameIdx++], cx, y); }
    else if(pt.k==='price'){
      if(d.mrp){
        ctx.font = mrpF; const mw = ctx.measureText(d.mrp).width; ctx.font = priceF; const pw = ctx.measureText(d.priceText).width, g = Math.round(6*pxPt/2);
        const startX = cx - (mw+g+pw)/2;
        ctx.textAlign = 'left'; ctx.font = mrpF; ctx.fillText(d.mrp, startX, y+2);
        ctx.fillRect(startX, y+Math.round(lh(mrpF)/2), mw, Math.max(1,Math.round(dpmm*0.2)));
        ctx.font = priceF; ctx.fillText(d.priceText, startX+mw+g, y); ctx.textAlign = 'center';
      } else { ctx.font = priceF; ctx.fillText(fit(d.priceText, priceF, innerW), cx, y); }
    } else if(pt.k==='bar'){
      const bin = code39Encode(d.sku).bin, availW = Math.floor(innerW*0.92);
      const m = Math.max(0.5, Math.min(6, Math.floor(availW/bin.length) || availW/bin.length));
      const bwTot = bin.length*m, bx = Math.round(cx - bwTot/2);
      for(let i=0;i<bin.length;i++){ if(bin[i]==='1'){ const xa = Math.round(bx+i*m), xb = Math.round(bx+(i+1)*m); ctx.fillRect(xa, y, Math.max(1,xb-xa), bh); } }
    }
    y += pt.h + gap;
  }
}
// One printed sticker row -> final page canvas (rotation + shift applied).
function renderRawPage(rowItems, cfg){
  const dpmm = cfg.dpi/25.4, mm = x=>Math.round(x*dpmm);
  const rowWmm = cfg.w*cfg.cols + cfg.gap*(cfg.cols-1);
  const rw = mm(rowWmm), rh = mm(cfg.h);
  const row = document.createElement('canvas'); row.width = rw; row.height = rh;
  const rc = row.getContext('2d'); rc.fillStyle = '#fff'; rc.fillRect(0,0,rw,rh);
  rowItems.forEach((it,i)=>{ drawRawLabel(rc, it, mm(i*(cfg.w+cfg.gap)), 0, mm(cfg.w), rh, cfg); });
  const sideways = cfg.rot===90 || cfg.rot===270;
  const pw = sideways ? rh : rw, ph = sideways ? rw : rh;
  const page = document.createElement('canvas'); page.width = pw; page.height = ph;
  const pc = page.getContext('2d'); pc.fillStyle = '#fff'; pc.fillRect(0,0,pw,ph);
  pc.save();
  pc.translate(mm(cfg.offX), mm(cfg.offY));
  if(cfg.rot===90){ pc.translate(pw,0); pc.rotate(Math.PI/2); }
  else if(cfg.rot===270){ pc.translate(0,ph); pc.rotate(-Math.PI/2); }
  else if(cfg.rot===180){ pc.translate(pw,ph); pc.rotate(Math.PI); }
  pc.drawImage(row, 0, 0);
  pc.restore();
  return {canvas:page, w:pw, h:ph, wmm:(sideways?cfg.h:rowWmm), hmm:(sideways?rowWmm:cfg.h)};
}
// 1 bit per dot, MSB first, rows padded to whole bytes. black=true -> bit 1 for black.
function canvasToBits(canvas, blackIsOne){
  const w = canvas.width, h = canvas.height, wb = Math.ceil(w/8);
  const px = canvas.getContext('2d').getImageData(0,0,w,h).data;
  const out = new Uint8Array(wb*h);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i = (y*w+x)*4;
      const lum = px[i]*0.299 + px[i+1]*0.587 + px[i+2]*0.114;
      const black = px[i+3]>20 && lum<150;
      const bit = blackIsOne ? black : !black;
      if(bit) out[y*wb + (x>>3)] |= (0x80 >> (x&7));
    }
    // padding bits beyond the width must be "white"
    if(w%8){ for(let x=w;x<wb*8;x++){ if(!blackIsOne) out[y*wb+(x>>3)] |= (0x80>>(x&7)); } }
  }
  return {bytes:out, wb, h};
}
function buildRawLabelJob(dataItems, cfg){
  const out = [];
  const push = s=>{ for(const ch of s) out.push(ch.charCodeAt(0)&255); };
  const pages = [];
  for(let i=0;i<dataItems.length;i+=cfg.cols) pages.push(dataItems.slice(i,i+cfg.cols));
  const nm = x=>String(Math.round(x*10)/10);
  pages.forEach((rowItems, pi)=>{
    const pg = renderRawPage(rowItems, cfg);
    if(cfg.method==='tspl'){
      const b = canvasToBits(pg.canvas, cfg.invert);       // TSPL BITMAP: 1 = white (unless inverted by the user)
      if(pi===0) push(`SIZE ${nm(pg.wmm)} mm,${nm(pg.hmm)} mm\r\nGAP ${nm(cfg.rawGap)} mm,0 mm\r\nDIRECTION 0,0\r\nREFERENCE 0,0\r\n`);
      push(`CLS\r\nBITMAP 0,0,${b.wb},${b.h},0,`);
      b.bytes.forEach(v=>out.push(v));
      push(`\r\nPRINT 1,1\r\n`);
    } else {
      const b = canvasToBits(pg.canvas, !cfg.invert);       // ZPL ^GFA: 1 = black
      let hex = ''; const H = '0123456789ABCDEF';
      for(let i=0;i<b.bytes.length;i++){ hex += H[b.bytes[i]>>4] + H[b.bytes[i]&15]; }
      const total = b.bytes.length;
      push(`^XA^CI28^PW${pg.w}^LL${pg.h}^LH0,0^FO0,0^GFA,${total},${total},${b.wb},${hex}^FS^PQ1^XZ\r\n`);
    }
  });
  return Uint8Array.from(out);
}
async function printLabelsRaw(dataItems, cfg){
  if(!dataItems.length) return;
  try{
    const bytes = buildRawLabelJob(dataItems, cfg);
    await window.__TAURI__.core.invoke('print_raw', {printer: cfg.printer, data: Array.from(bytes)});
    toast(fillTpl(t('toast_labelSent'), [dataItems.length, cfg.printer || t('lb_printerDefault')]), 'success');
  }catch(e){
    toast(fillTpl(t('toast_labelSendFail'), [String(e && e.message || e)]), 'error');
  }
}

function printBarcodeLabels(product, productId){
  const cfg = labelConfig();
  if(labelRawActive(cfg)){
    const data = [];
    (product.variants||[]).forEach((v,i)=>{
      const qty = LABEL_QTY[i] || 1;
      for(let n=0;n<qty;n++) data.push(labelItemData(product, productId, v, i));
    });
    return printLabelsRaw(data, cfg);
  }
  const items = [];
  (product.variants||[]).forEach((v,i)=>{
    const qty = LABEL_QTY[i] || 1;
    for(let n=0;n<qty;n++) items.push(labelItemHTML(product, productId, v, i));
  });
  let style, body;
  if(cfg.paper==='roll'){
    const parts = buildLabelPage(items, cfg);
    style = parts.style; body = parts.body;
  } else {
    style = `
      @page{ margin:8mm; }
      body{ font-family:Arial,Helvetica,sans-serif; margin:0; }
      .sheet{ display:flex; flex-wrap:wrap; gap:6mm; }
      .lbl{ width:45mm; border:1px dashed #999; padding:2mm 2mm 3mm; text-align:center; break-inside:avoid; }
      .lbl-shop{ font-size:7.5px; letter-spacing:.3px; text-transform:uppercase; color:#444; margin-bottom:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .lbl-name{ font-size:9px; font-weight:700; margin-top:1px; line-height:1.2;
                 display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
      .lbl svg{ width:100%; height:auto; }
      .lbl-price{ font-size:11px; font-weight:700; margin-top:1px; }
      .lbl-mrp{ text-decoration:line-through; font-weight:400; font-size:9px; color:#666; margin-right:3px; }
      .lbl-sale{ font-size:12px; font-weight:800; }`;
    body = `<div class="sheet">${items.join('')}</div>`;
  }
  
  const win = (window.openLabelPrintWindow||openPrintWindow)();
  win.document.write(`
    <!DOCTYPE html><html><head><title>${t('inv_barcodeLabelsPageTitle')}</title>
    <style>${style}</style>
    </head><body>
      ${body}
      <script>window.onload = ()=>{ window.print(); }<\/script>
    </body></html>
  `);
  win.document.close();
}

// One outlined test label: shows exactly where the sticker edges fall, so the shift/size can be tuned.
function printTestLabel(){
  const cfg = labelConfig();
  if(labelRawActive(cfg)){
    return printLabelsRaw([{shop:t('lb_testLine1'), sku:'TEST-123', name:cfg.w+' × '+cfg.h+' mm', priceText:t('lb_testLine2'), test:true}], cfg);
  }
  const bars = renderBarcodeSVG('TEST-123',{barWidth:1,height:34,showText:false}).replace('<svg ','<svg preserveAspectRatio="none" ');
  const item = `<div class="lbl test"><div class="lbl-shop">${t('lb_testLine1')}</div>${bars}<div class="lbl-name">${cfg.w} × ${cfg.h} mm</div><div class="lbl-price">${t('lb_testLine2')}</div></div>`;
  const parts = buildLabelPage([item], cfg);
  const win = (window.openLabelPrintWindow||openPrintWindow)();
  win.document.write(`<!DOCTYPE html><html><head><title>Test label</title><style>${parts.style}</style></head><body>${parts.body}<script>window.onload = ()=>{ window.print(); }<\/script></body></html>`);
  win.document.close();
}
</script>

    `,

        const vi = parseInt(document.getElementById('sa_variant').value);
        const qty = Math.max(1, parseInt(document.getElementById('sa_qty').value)||1);
        const dir = document.getElementById('sa_direction').value;
        const vendorId = (dir==='add' && document.getElementById('sa_vendor').value) ? parseInt(document.getElementById('sa_vendor').value) : null;
        const vendorCost = vendorId ? (parseFloat(document.getElementById('sa_cost').value)||0) : 0;
        if(vendorId && vendorCost<=0){ toast(t('toast_purchaseNeedsCost'),'error'); return; }
        const reason = vendorId ? 'Purchased from Vendor' : document.getElementById('sa_reason').value;
        const note = document.getElementById('sa_note').value.trim();
        const fresh = await dbGet('products', productId);
        const v = fresh.variants[vi];
        const prevStock = Number(v.stock||0);
        const delta = dir==='add'? qty : -qty;
        adjustFirmStock(v, fresh.firmId, delta);
        await dbPut('products', fresh);
        await dbAdd('stockAdjustments', {
          productId, variantIndex: vi,
          productName: fresh.name,
          variantLabel: [v.size,v.color].filter(Boolean).join('/') || v.sku || '',
          sku: v.sku||'',
          firmId: fresh.firmId,
          delta: v.stock - prevStock,
          previousStock: prevStock,
          newStock: v.stock,
          reason, note,
          date: new Date().toISOString(),
          user: (typeof CURRENT_USER!=='undefined' && CURRENT_USER) ? CURRENT_USER.name : 'Owner'
        });
        if(vendorId){
          fresh.variants[vi].costPrice = vendorCost;
          await dbPut('products', fresh);
          const inv = await recordStockPurchase({
            supplierId: vendorId, lines:[{productId, variantIndex:vi, qty, rate:vendorCost}],
            gstMode: document.getElementById('sa_gst').value, gstRate: fresh.taxRate,
            paidNow: parseFloat(document.getElementById('sa_paid').value)||0, payMode:'Cash',
            billNo: document.getElementById('sa_billNo').value, billDate: document.getElementById('sa_billDate').value
          });
          if(inv){
            const sup = await dbGet('suppliers', vendorId);
            toast(inv.__merged ? fillTpl(t('toast_purchaseMerged'), [inv.billNo, inv.invoiceNumber, sup?sup.name:'']) : t('toast_purchaseFromStockRecorded').replace('{0}', inv.invoiceNumber).replace('{1}', sup?sup.name:''),'success');
          }
        }
        closeModal();
        if(!vendorId) toast(t('toast_stockAdjusted'),'success');
        await renderInventoryTable();
        await refreshLowStockBadge();
        if(vendorId) await refreshSupplierSurfaces();
      });
    }
  });
}

/* ---------- CSV import / export ---------- */
function csvEscape(val){
  val = String(val==null?'':val);
  if(/[",\n]/.test(val)) return '"' + val.replace(/"/g,'""') + '"';
  return val;
}
function toCSVRow(arr){ return arr.map(csvEscape).join(','); }

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ /* skip, \n handles line break */ }
      else field += c;
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(r=> !(r.length===1 && r[0].trim()===''));
}

async function importInventoryCSV(file){
  if(!requireWorkingFirm(t('action_importProducts'))) return;
  let text;
  try{ text = await file.text(); }catch(e){ toast(t('toast_couldNotReadFile'),'error'); return; }
  const rows = parseCSV(text);
  if(rows.length<2){ toast(t('toast_csvEmpty'),'error'); return; }
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idx = {
    name: header.indexOf('name'), brand: header.indexOf('brand'), category: header.indexOf('category'),
    taxrate: header.indexOf('taxrate'), size: header.indexOf('size'), color: header.indexOf('color'),
    sku: header.indexOf('sku'), costprice: header.indexOf('costprice'), sellprice: header.indexOf('sellprice'),
    stock: header.indexOf('stock'), lowstock: header.indexOf('lowstock'), gstincluded: header.indexOf('gstincluded')
  };
  if(idx.name<0 || idx.sellprice<0 || idx.stock<0){
    toast(t('toast_csvMissingColumns'),'error');
    return;
  }
  const dataRows = rows.slice(1).filter(r=>r.some(c=>c && c.trim()));
  // Only match/update products already in the working firm's own catalog — a SKU that
  // happens to match a different firm's product must never cross-update it.
  const existingProducts = await scopedGetAll('products');
  const skuMap = {};
  const nameMap = {};
  existingProducts.forEach(p=>{
    (p.variants||[]).forEach((v,i)=>{ if(v.sku) skuMap[v.sku.toLowerCase()] = {productId:p.id, variantIndex:i}; });
    nameMap[(p.name+'|'+(p.brand||'')).toLowerCase()] = p.id;
  });

  let newProducts = 0, updatedVariants = 0, addedVariants = 0, skipped = 0;
  const touchedProducts = new Map();
  const getOrCloneById = (id)=>{
    if(touchedProducts.has(id)) return touchedProducts.get(id);
    const orig = existingProducts.find(p=>p.id===id);
    const clone = JSON.parse(JSON.stringify(orig));
    touchedProducts.set(id, clone);
    return clone;
  };

  for(const r of dataRows){
    const name = (r[idx.name]||'').trim();
    if(!name){ skipped++; continue; }
    const brand = idx.brand>=0 ? (r[idx.brand]||'').trim() : '';
    const category = idx.category>=0 ? (r[idx.category]||'').trim() : '';
    const taxRate = idx.taxrate>=0 && r[idx.taxrate]!=='' ? (parseFloat(r[idx.taxrate])||0) : SETTINGS.defaultTaxRate;
    const taxInclusive = idx.gstincluded>=0 && (r[idx.gstincluded]||'').trim()!=='' ? /^(y|yes|true|1)/i.test((r[idx.gstincluded]||'').trim()) : (SETTINGS.defaultTaxInclusive!==false);
    const size = idx.size>=0 ? (r[idx.size]||'').trim() : '';
    const color = idx.color>=0 ? (r[idx.color]||'').trim() : '';
    const sku = idx.sku>=0 ? (r[idx.sku]||'').trim() : '';
    const costPrice = idx.costprice>=0 && r[idx.costprice]!=='' ? (parseFloat(r[idx.costprice])||0) : 0;
    const sellPrice = parseFloat(r[idx.sellprice])||0;
    const stock = parseInt(r[idx.stock])||0;
    const lowStock = idx.lowstock>=0 && r[idx.lowstock]!=='' ? parseInt(r[idx.lowstock]) : null;

    const skuMatch = sku ? skuMap[sku.toLowerCase()] : null;
    if(skuMatch){
      const p = getOrCloneById(skuMatch.productId);
      const v = p.variants[skuMatch.variantIndex];
      if(size) v.size = size;
      if(color) v.color = color;
      if(costPrice) v.costPrice = costPrice;
      if(sellPrice) v.sellPrice = sellPrice;
      v.stock = stock;
      if(lowStock!=null) v.lowStock = lowStock;
      if(brand) p.brand = brand;
      if(category) p.category = category;
      updatedVariants++;
    } else {
      const nameKey = (name+'|'+brand).toLowerCase();
      const existingId = nameMap[nameKey];
      if(existingId!=null){
        const p = getOrCloneById(existingId);
        p.variants.push({sku:'', size, color, costPrice, sellPrice, stock, lowStock});
      } else {
        const newKey = 'new:'+nameKey;
        let obj = touchedProducts.get(newKey);
        if(!obj){
          obj = {name, brand, category, taxRate, taxInclusive, photo:'', firmId: firmIdForStockOps(), variants:[], createdAt:new Date().toISOString()};
          touchedProducts.set(newKey, obj);
          newProducts++;
        }
        obj.variants.push({sku:'', size, color, costPrice, sellPrice, stock, lowStock});
      }
      addedVariants++;
    }
  }

  if(touchedProducts.size===0){
    toast(t('toast_noValidRowsToImport'),'error');
    return;
  }

  openModal({
    title:t('modal_confirmCsvImport'),
    bodyHTML:`
      <p style="font-size:13.5px;">Ready to import:</p>
      <ul style="font-size:13.5px;line-height:1.8;padding-left:20px;">
        <li><strong>${newProducts}</strong> new product(s)</li>
        <li><strong>${addedVariants}</strong> variant row(s) added (new products or extra variants on existing ones)</li>
        <li><strong>${updatedVariants}</strong> existing variant(s) updated by SKU match</li>
        ${skipped>0?`<li>${skipped} row(s) skipped (missing product name)</li>`:''}
      </ul>
      <p class="muted" style="font-size:12px;">This can't be automatically undone — export a backup first if you're unsure.</p>
    `,
    footerHTML:`
      <button class="btn btn-outline" onclick="closeModal()">${t('acct_cancelBtn')}</button>
      <button class="btn btn-primary" id="confirmImportBtn">Confirm Import</button>
    `,
    onMount:()=>{
      document.getElementById('confirmImportBtn').addEventListener('click', async ()=>{
        for(const [key, obj] of touchedProducts.entries()){
          if(typeof key === 'number'){
            obj.variants.forEach((v,i)=>{ if(!v.sku) v.sku = autoSKU(key, i); });
            await dbPut('products', obj);
          } else {
            const newId = await dbAdd('products', obj);
            obj.variants.forEach((v,i)=>{ if(!v.sku) v.sku = autoSKU(newId, i); });
            obj.id = newId;
            await dbPut('products', obj);
          }
        }
        closeModal();
        toast(t('toast_importComplete'),'success');
        await renderInventoryTable();
        await refreshLowStockBadge();
      });
    }
  });
}

async function openBulkPriceModal(){

  openModal({

      <div class="field">

        <select id="bp_scope">
          <option value="all">${t('vendor_allProductsOption')}</option>
          ${categories.map(c=>`<option value="${escapeHTML(c)}">${t('inv_categoryPrefix')}${escapeHTML(c)}</option>`).join('')}
        </select>
      </div>
      <div class="row">
        <div class="col field">
          <label>Field</label>
          <select id="bp_field">
            <option value="sell">Sell Price</option>
            <option value="cost">Cost Price</option>
            <option value="both">Both</option>
          </select>
        </div>
        <div class="col field">
          <label>Operation</label>
          <select id="bp_op">
            <option value="incpct">Increase by %</option>
            <option value="decpct">Decrease by %</option>
            <option value="incflat">Increase by flat ₹</option>
            <option value="decflat">Decrease by flat ₹</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Value</label><input id="bp_value" type="number" min="0" step="0.01" value="10"></div>
      <div id="bp_preview" class="muted" style="font-size:12.5px;"></div>
    `,
    footerHTML:`
      <button class="btn btn-outline" onclick="closeModal()">${t('acct_cancelBtn')}</button>
      <button class="btn btn-primary" id="bp_apply">Preview Changes</button>
    `,
    onMount:()=>{
      let confirmed = false;
      const computeAffected = ()=>{
        const scope = document.getElementById('bp_scope').value;
        const filtered = scope==='all' ? products : products.filter(p=>p.category===scope);
        const variantCount = filtered.reduce((s,p)=>s+(p.variants||[]).length,0);
        return {filtered, variantCount};
      };
      const resetPreview = ()=>{
        const {filtered, variantCount} = computeAffected();
        document.getElementById('bp_preview').textContent = `This will affect ${filtered.length} product(s), ${variantCount} variant(s).`;
        confirmed = false;
        document.getElementById('bp_apply').textContent = 'Preview Changes';
      };
      ['bp_scope','bp_field','bp_op','bp_value'].forEach(id=>document.getElementById(id).addEventListener('input', resetPreview));
      resetPreview();

      document.getElementById('bp_apply').addEventListener('click', async ()=>{
        if(!confirmed){
          confirmed = true;
          document.getElementById('bp_apply').textContent = 'Confirm & Apply';
          document.getElementById('bp_preview').innerHTML += '<br><strong>Click again to confirm and apply this change.</strong>';
          return;
        }
        const {filtered} = computeAffected();
        const field = document.getElementById('bp_field').value;
        const op = document.getElementById('bp_op').value;
        const value = parseFloat(document.getElementById('bp_value').value)||0;
        const applyOp = (price)=>{
          let p = Number(price)||0;
          if(op==='incpct') p = p * (1+value/100);
          else if(op==='decpct') p = p * (1-value/100);
          else if(op==='incflat') p = p + value;
          else if(op==='decflat') p = p - value;
          return Math.max(0, Math.round(p*100)/100);
        };
        for(const p of filtered){
          (p.variants||[]).forEach(v=>{
            if(field==='sell' || field==='both') v.sellPrice = applyOp(v.sellPrice);
            if(field==='cost' || field==='both') v.costPrice = applyOp(v.costPrice);
          });
          await dbPut('products', p);
        }
        closeModal();
        toast(t('toast_pricesUpdated'),'success');
        await renderInventoryTable();
      });
    }
  });
}

/* ---------- Stock valuation report ---------- */
async function showStockValuationReport(){
  const products = await scopedGetAll('products');
  const byCategory = {};
  let totalCost=0, totalRetail=0;
  products.forEach(p=>{
    const cat = p.category || t('inv_uncategorized');
    if(!byCategory[cat]) byCategory[cat] = {cost:0, retail:0, units:0};
    (p.variants||[]).forEach(v=>{
      const cost = (v.costPrice||0)*(v.stock||0);
      const retail = (v.sellPrice||0)*(v.stock||0);
      byCategory[cat].cost += cost;
      byCategory[cat].retail += retail;
      byCategory[cat].units += (v.stock||0);
      totalCost += cost;
      totalRetail += retail;
    });
  });
  const catRows = Object.entries(byCategory).sort((a,b)=>b[1].retail-a[1].retail);
  const chartData = catRows.slice(0,8).map(([name,d])=>({label:name, value:Math.round(d.retail)}));

  openModal({
    title:t('modal_stockValuation'),
    bodyHTML:`

/* ---------- Dead stock report ---------- */
async function showDeadStockReport(){
  const [products, bills] = await Promise.all([scopedGetAll('products'), scopedLiveBills()]);
  const lastSold = {};
  bills.forEach(b=>{
    (b.items||[]).forEach(it=>{
      const key = it.productId+'-'+it.variantIndex;
      if(!lastSold[key] || new Date(b.date) > new Date(lastSold[key])) lastSold[key] = b.date;
    });
  });
  const today = new Date();
  const rows = [];
  products.forEach(p=>{
    (p.variants||[]).forEach((v,i)=>{
      if((v.stock||0)<=0) return;
      const key = p.id+'-'+i;
      const last = lastSold[key] || null;
      const days = last ? Math.floor((today - new Date(last))/86400000) : null;
      if(days===null || days>=60){
        rows.push({
          name:p.name, label:[v.size,v.color].filter(Boolean).join('/'), stock:v.stock,
          value:(v.costPrice||0)*v.stock, last, days
        });
      }
    });
  });
  rows.sort((a,b)=> (b.days==null?99999:b.days) - (a.days==null?99999:a.days));
  const totalValue = rows.reduce((s,r)=>s+r.value,0);

  openModal({
    title:t('modal_deadStock'),
    bodyHTML:`
      <div class="stat-tiles" style="grid-template-columns:1fr 1fr;margin-bottom:10px;">
        <div class="stat-tile"><div class="label">Items Flagged</div><div class="value">${rows.length}</div></div>
        <div class="stat-tile"><div class="label">Cost Tied Up</div><div class="value small">${fmtMoney(totalValue)}</div></div>
      </div>
      <div style="max-height:340px;overflow:auto;">
        <table>
          <thead><tr><th>${t('th_product')}</th><th class="num">${t('th_stock')}</th><th class="num">${t('th_value')}</th><th>${t('th_lastSold')}</th></tr></thead>
          <tbody>
            ${rows.length===0?'<tr><td colspan="4" class="muted">No dead stock — everything is moving within 60 days.</td></tr>':
              rows.map(r=>`<tr>
                <td>${escapeHTML(r.name)}${r.label?` <span class="muted" style="font-size:11px;">(${escapeHTML(r.label)})</span>`:''}</td>
                <td class="num">${r.stock}</td>
                <td class="num">${fmtMoney(r.value)}</td>
                <td>${r.last?fmtDate(r.last)+' ('+r.days+'d ago)':'Never sold'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `,
    footerHTML:`<button class="btn btn-outline" onclick="closeModal()">${t('print_closeBtn')}</button>`
  });
}

        } else if (0xE040 <= c && c <= 0xEBBF) {
          c -= 0xC140;
        } else {
          throw 'illegal char at ' + (i + 1) + '/' + c;
        }

        c = ( (c >>> 8) & 0xff) * 0xC0 + (c & 0xff);

        buffer.put(c, 13);

        i += 2;
      }

      if (i < data.length) {
        throw 'illegal char at ' + (i + 1);
      }
    };

    return _this;
  };

  //=====================================================================
  // GIF Support etc.
  //

  //---------------------------------------------------------------------
  // byteArrayOutputStream
  //---------------------------------------------------------------------

  var byteArrayOutputStream = function() {

    var _bytes = [];

    var _this = {};

    _this.writeByte = function(b) {
      _bytes.push(b & 0xff);
    };

    _this.writeShort = function(i) {
      _this.writeByte(i);
      _this.writeByte(i >>> 8);
    };

    _this.writeBytes = function(b, off, len) {
      off = off || 0;
      len = len || b.length;
      for (var i = 0; i < len; i += 1) {
        _this.writeByte(b[i + off]);
      }
    };

    _this.writeString = function(s) {
      for (var i = 0; i < s.length; i += 1) {
        _this.writeByte(s.charCodeAt(i) );
      }
    };

    _this.toByteArray = function() {
      return _bytes;
    };

    _this.toString = function() {
      var s = '';
      s += '[';
      for (var i = 0; i < _bytes.length; i += 1) {
        if (i > 0) {
          s += ',';
        }
        s += _bytes[i];
      }
      s += ']';
      return s;
    };

    return _this;
  };

  //---------------------------------------------------------------------
  // base64EncodeOutputStream
  //---------------------------------------------------------------------

  var base64EncodeOutputStream = function() {

    var _buffer = 0;
    var _buflen = 0;
    var _length = 0;
    var _base64 = '';

    var _this = {};

    var writeEncoded = function(b) {
      _base64 += String.fromCharCode(encode(b & 0x3f) );
    };

    var encode = function(n) {
      if (n < 0) {
        // error.
      } else if (n < 26) {
        return 0x41 + n;
      } else if (n < 52) {
        return 0x61 + (n - 26);
      } else if (n < 62) {
        return 0x30 + (n - 52);
      } else if (n == 62) {
        return 0x2b;
      } else if (n == 63) {
        return 0x2f;
      }
      throw 'n:' + n;
    };

    _this.writeByte = function(n) {

      _buffer = (_buffer << 8) | (n & 0xff);
      _buflen += 8;
      _length += 1;

      while (_buflen >= 6) {
        writeEncoded(_buffer >>> (_buflen - 6) );
        _buflen -= 6;
      }
    };

    _this.flush = function() {

      if (_buflen > 0) {
        writeEncoded(_buffer << (6 - _buflen) );
        _buffer = 0;
        _buflen = 0;
      }

      if (_length % 3 != 0) {
        // padding
        var padlen = 3 - _length % 3;
        for (var i = 0; i < padlen; i += 1) {
          _base64 += '=';
        }
      }
    };

    _this.toString = function() {
      return _base64;
    };

    return _this;
  };

  //---------------------------------------------------------------------
  // base64DecodeInputStream
  //---------------------------------------------------------------------

  var base64DecodeInputStream = function(str) {

    var _str = str;
    var _pos = 0;
    var _buffer = 0;
    var _buflen = 0;

    var _this = {};

    _this.read = function() {

      while (_buflen < 8) {

        if (_pos >= _str.length) {
          if (_buflen == 0) {
            return -1;
          }
          throw 'unexpected end of file./' + _buflen;
        }

        var c = _str.charAt(_pos);
        _pos += 1;

        if (c == '=') {
          _buflen = 0;
          return -1;
        } else if (c.match(/^\s$/) ) {
          // ignore if whitespace.
          continue;
        }

        _buffer = (_buffer << 6) | decode(c.charCodeAt(0) );
        _buflen += 6;
      }

      var n = (_buffer >>> (_buflen - 8) ) & 0xff;
      _buflen -= 8;
      return n;
    };

    var decode = function(c) {
      if (0x41 <= c && c <= 0x5a) {
        return c - 0x41;
      } else if (0x61 <= c && c <= 0x7a) {
        return c - 0x61 + 26;
      } else if (0x30 <= c && c <= 0x39) {
        return c - 0x30 + 52;
      } else if (c == 0x2b) {
        return 62;
      } else if (c == 0x2f) {
        return 63;
      } else {
        throw 'c:' + c;
      }
    };

    return _this;
  };

  //---------------------------------------------------------------------
  // gifImage (B/W)
  //---------------------------------------------------------------------

  var gifImage = function(width, height) {

    var _width = width;
    var _height = height;
    var _data = new Array(width * height);

    var _this = {};

    _this.setPixel = function(x, y, pixel) {
      _data[y * _width + x] = pixel;
    };

    _this.write = function(out) {

      //---------------------------------
      // GIF Signature

      out.writeString('GIF87a');

      //---------------------------------
      // Screen Descriptor

      out.writeShort(_width);
      out.writeShort(_height);

      out.writeByte(0x80); // 2bit
      out.writeByte(0);
      out.writeByte(0);

      //---------------------------------
      // Global Color Map

      // black
      out.writeByte(0x00);
      out.writeByte(0x00);
      out.writeByte(0x00);

      // white
      out.writeByte(0xff);
      out.writeByte(0xff);
      out.writeByte(0xff);

      //---------------------------------
      // Image Descriptor

      out.writeString(',');
      out.writeShort(0);
      out.writeShort(0);
      out.writeShort(_width);
      out.writeShort(_height);
      out.writeByte(0);

      //---------------------------------
      // Local Color Map

      //---------------------------------
      // Raster Data

      var lzwMinCodeSize = 2;
      var raster = getLZWRaster(lzwMinCodeSize);

      out.writeByte(lzwMinCodeSize);

      var offset = 0;

      while (raster.length - offset > 255) {
        out.writeByte(255);
        out.writeBytes(raster, offset, 255);
        offset += 255;
      }

      out.writeByte(raster.length - offset);
      out.writeBytes(raster, offset, raster.length - offset);
      out.writeByte(0x00);

      //---------------------------------
      // GIF Terminator
      out.writeString(';');
    };

    var bitOutputStream = function(out) {

      var _out = out;
      var _bitLength = 0;
      var _bitBuffer = 0;

      var _this = {};

      _this.write = function(data, length) {

        if ( (data >>> length) != 0) {
          throw 'length over';
        }

        while (_bitLength + length >= 8) {
          _out.writeByte(0xff & ( (data << _bitLength) | _bitBuffer) );
          length -= (8 - _bitLength);
          data >>>= (8 - _bitLength);
          _bitBuffer = 0;
          _bitLength = 0;
        }

        _bitBuffer = (data << _bitLength) | _bitBuffer;
        _bitLength = _bitLength + length;
      };

      _this.flush = function() {
        if (_bitLength > 0) {
          _out.writeByte(_bitBuffer);
        }
      };

      return _this;
    };

    var getLZWRaster = function(lzwMinCodeSize) {

      var clearCode = 1 << lzwMinCodeSize;
      var endCode = (1 << lzwMinCodeSize) + 1;
      var bitLength = lzwMinCodeSize + 1;

      // Setup LZWTable
      var table = lzwTable();

      for (var i = 0; i < clearCode; i += 1) {
        table.add(String.fromCharCode(i) );
      }
      table.add(String.fromCharCode(clearCode) );
      table.add(String.fromCharCode(endCode) );

      var byteOut = byteArrayOutputStream();
      var bitOut = bitOutputStream(byteOut);

      // clear code
      bitOut.write(clearCode, bitLength);

      var dataIndex = 0;

      var s = String.fromCharCode(_data[dataIndex]);
      dataIndex += 1;

      while (dataIndex < _data.length) {

        var c = String.fromCharCode(_data[dataIndex]);
        dataIndex += 1;

        if (table.contains(s + c) ) {

          s = s + c;

        } else {

          bitOut.write(table.indexOf(s), bitLength);

          if (table.size() < 0xfff) {

            if (table.size() == (1 << bitLength) ) {
              bitLength += 1;
            }

            table.add(s + c);
          }

          s = c;
        }
      }

      bitOut.write(table.indexOf(s), bitLength);

      // end code
      bitOut.write(endCode, bitLength);

      bitOut.flush();

      return byteOut.toByteArray();
    };

    var lzwTable = function() {

      var _map = {};
      var _size = 0;

      var _this = {};

      _this.add = function(key) {
        if (_this.contains(key) ) {
          throw 'dup key:' + key;
        }
        _map[key] = _size;
        _size += 1;
      };

      _this.size = function() {
        return _size;
      };

      _this.indexOf = function(key) {
        return _map[key];
      };

      _this.contains = function(key) {
        return typeof _map[key] != 'undefined';
      };

      return _this;
    };

    return _this;
  };

  var createDataURL = function(width, height, getPixel) {
    var gif = gifImage(width, height);
    for (var y = 0; y < height; y += 1) {
      for (var x = 0; x < width; x += 1) {
        gif.setPixel(x, y, getPixel(x, y) );
      }
    }

    var b = byteArrayOutputStream();
    gif.write(b);

    var base64 = base64EncodeOutputStream();
    var bytes = b.toByteArray();
    for (var i = 0; i < bytes.length; i += 1) {
      base64.writeByte(bytes[i]);
    }
    base64.flush();

    return 'data:image/gif;base64,' + base64;
  };

  //---------------------------------------------------------------------
  // returns qrcode function.

  return qrcode;
}();

// multibyte support
!function() {

  qrcode.stringToBytesFuncs['UTF-8'] = function(s) {
    // http://stackoverflow.com/questions/18729405/how-to-convert-utf8-string-to-byte-array
    function toUTF8Array(str) {
      var utf8 = [];
      for (var i=0; i < str.length; i++) {
        var charcode = str.charCodeAt(i);
        if (charcode < 0x80) utf8.push(charcode);
        else if (charcode < 0x800) {
          utf8.push(0xc0 | (charcode >> 6),
              0x80 | (charcode & 0x3f));
        }
        else if (charcode < 0xd800 || charcode >= 0xe000) {
          utf8.push(0xe0 | (charcode >> 12),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
        // surrogate pair
        else {
          i++;
          // UTF-16 encodes 0x10000-0x10FFFF by
          // subtracting 0x10000 and splitting the
          // 20 bits of 0x0-0xFFFFF into two halves
          charcode = 0x10000 + (((charcode & 0x3ff)<<10)
            | (str.charCodeAt(i) & 0x3ff));
          utf8.push(0xf0 | (charcode >>18),
              0x80 | ((charcode>>12) & 0x3f),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
      }
      return utf8;
    }
    return toUTF8Array(s);
  };

}();

// Renders a UPI payment QR as an inline SVG string for a given amount + invoice note.
function renderUPIQRSVG(upiId, payeeName, amount, invoiceNo, cellSize){
  cellSize = cellSize || 4;
  if(!upiId) return '';
  const link = 'upi://pay?pa=' + encodeURIComponent(upiId) +
    '&pn=' + encodeURIComponent(payeeName||'Shop') +
    '&am=' + encodeURIComponent(Number(amount||0).toFixed(2)) +
    '&cu=INR' +
    '&tn=' + encodeURIComponent(invoiceNo||'');
  try{
    const qr = qrcode(0, 'M');
    qr.addData(link);
    qr.make();
    return qr.createSvgTag(cellSize, 4);
  }catch(e){
    return '';
  }
}

// Per-item discount amount, honoring 'amount' (₹) or 'percent' (%) type.
function itemDiscountAmount(it){
  const base = it.qty*it.rate;
  if(it.discountType==='percent'){
    return Math.min(base, base * (Number(it.discount)||0) / 100);
  }
  return Math.min(base, Number(it.discount)||0);
}

// GST for one bill line. A shop quotes prices in one of two ways:
//  - GST added on top (how this app always worked): price 999 -> customer pays 999 + tax.
//  - GST included in the price (it.taxInclusive): the price IS what the customer pays. The tax
//    is worked out from inside it (999 @5% -> taxable 951.43 + GST 47.57), so the price on the
//    tag never changes and no odd paise appear in the rate.
function lineTaxParts(it){
  const gross = Math.max(0, it.qty*it.rate - itemDiscountAmount(it));
  const r = Number(it.taxRate)||0;
  if(!(r>0)) return {gross, taxable:gross, tax:0, included:false, rate:r};
  if(it.taxInclusive){
    const tax = gross*r/(100+r);
    return {gross, taxable:gross-tax, tax, included:true, rate:r};
  }
  return {gross, taxable:gross, tax:gross*r/100, included:false, rate:r};
}

async function doBillLookup(){
  const q = document.getElementById('billLookupInput').value.trim().toLowerCase();
  const wrap = document.getElementById('billLookupResults');
  if(!q){ wrap.innerHTML = ''; return; }
  const [rawBills, customers] = await Promise.all([scopedLiveBills(), scopedGetAll('customers')]);
  const bills = scopeBillsToActiveFirm(rawBills);
  const matchingCustomerIds = new Set(customers.filter(c=>(c.phone||'').includes(q)).map(c=>c.id));
  const matches = bills.filter(b=>
    b.invoiceNo.toLowerCase().includes(q) || (b.customerId && matchingCustomerIds.has(b.customerId))
  ).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,20);
  if(matches.length===0){
    wrap.innerHTML = `<p class="muted" style="font-size:12px;">No matching bills found.</p>`;
    return;
  }
  const custName = (id)=> id ? ((customers.find(c=>c.id===id)||{}).name || t('acct_customerFallback')) : t('bill_walkIn');
  wrap.innerHTML = matches.map(b=>`
    <div class="row" style="align-items:center;border-bottom:1px solid var(--line);padding:6px 0;">
      <div class="col" style="font-size:12.5px;">
        <strong>${escapeHTML(b.invoiceNo)}</strong> — ${escapeHTML(custName(b.customerId))}<br>

      <div class="col" style="flex:0 0 auto;"><button class="btn btn-outline btn-sm" onclick="openReturnModal(${b.id})">Return / Exchange</button></div>

  `).join('');
}

  document.getElementById('billSearch').addEventListener('input', (e)=>{
    BILL_SEARCH = e.target.value;
    renderBillProductResults();
  });
  // Barcode scanners act like a fast keyboard typing the SKU and pressing Enter. Typed
  // searches work the same way for a keyboard-only cashier: Arrow Up/Down highlights a
  // result (auto-highlighted already once you've typed something) and Enter adds it —
  // no mouse click on a variant button ever required.
  document.getElementById('billSearch').addEventListener('keydown', async (e)=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); moveBillNav(1); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); moveBillNav(-1); return; }
    if(e.key==='Escape'){
      if(e.target.value){ e.target.value=''; BILL_SEARCH=''; renderBillProductResults(); }
      return;
    }
    if(e.key !== 'Enter') return;
    e.preventDefault();
    const raw = e.target.value.trim();
    const addAndReset = async (productId, variantIndex, label)=>{
      await addToCart(productId, variantIndex);
      if(label) toast(label, 'success');
      BILL_SEARCH = '';
      e.target.value = '';
      renderBillProductResults();
      e.target.focus();
    };

      const match = await findVariantBySKU(raw);
      if(match){ await addAndReset(match.productId, match.variantIndex, `${t('bill_scannedPrefix')}${match.name}${match.label?' — '+match.label:''}`); return; }
    }
    if(BILL_NAV_INDEX>=0 && BILL_NAV_ITEMS[BILL_NAV_INDEX]){
      const pick = BILL_NAV_ITEMS[BILL_NAV_INDEX];

    renderBillTotals();
  });
  document.getElementById('deliveryChargeInput').addEventListener('input',(e)=>{
    CART.deliveryCharge = Math.max(0, parseFloat(e.target.value)||0);
    renderBillTotals();
  });
  document.getElementById('deliveryAddressInput')?.addEventListener('input',(e)=>{ CART.deliveryAddress = e.target.value; });
  document.getElementById('saveQuotationBtn').addEventListener('click', saveCurrentAsQuotation);
  document.getElementById('clearBillBtn').addEventListener('click', ()=>{
    if(CART.items.length===0) return;
    if(confirm(t('modal_clearCurrentBillQ'))){ emptyCart(); renderBilling(); }
  });
  document.getElementById('checkoutBtn').addEventListener('click', openCheckoutModal);
  document.getElementById('quickAddCustomerBtn').addEventListener('click', quickAddCustomerFromBilling);

  document.getElementById('moreActionsBtn').addEventListener('click', (e)=>{
    e.stopPropagation();
    const menu = document.getElementById('moreActionsMenu');
    menu.style.display = menu.style.display==='none' ? '' : 'none';
  });
  if(!window._billingMoreMenuOutsideClickBound){
    document.addEventListener('click', (e)=>{
      const menu = document.getElementById('moreActionsMenu');
      const btn = document.getElementById('moreActionsBtn');
      if(!menu || menu.style.display==='none') return;

  el.querySelectorAll('[data-collapse-toggle]').forEach(header=>{
    const toggle = ()=>{
      const id = header.dataset.collapseToggle;
      const panel = document.getElementById(id);
      const arrow = el.querySelector(`[data-collapse-arrow="${id}"]`);
      const isOpen = panel.style.display !== 'none';
      panel.style.display = isOpen ? 'none' : '';
      if(arrow) arrow.textContent = isOpen ? '▸' : '▾';
      header.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
    };
    header.addEventListener('click', toggle);
    // These headers aren't real <button> elements, so Enter/Space need wiring by hand for
    // keyboard users (tabindex="0" + role="button" is set on the header itself).
    header.addEventListener('keydown', (e)=>{
