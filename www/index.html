async function renderTodaysSalesStrip(){
  const wrap = document.getElementById('todaysSalesStrip');
  if(!wrap) return;
  const bills = scopeBillsToActiveFirm(await scopedLiveBills());
  const todayStr = new Date().toDateString();
  const todays = bills.filter(b=>new Date(b.date).toDateString()===todayStr);
  const salesTotal = todays.reduce((sum,b)=>sum+(b.grandTotal||0),0);
  const cashTotal = todays.reduce((sum,b)=>sum+((b.payments||[]).filter(p=>p.mode==='Cash').reduce((s,p)=>s+p.amount,0)),0);
  wrap.innerHTML = `
    <div class="stat-tiles" style="grid-template-columns:repeat(3,1fr);">
      <div class="stat-tile"><div class="label">${t('bill_billsToday')}</div><div class="value">${todays.length}</div></div>
      <div class="stat-tile"><div class="label">${t('bill_salesToday')}</div><div class="value">${fmtMoney(salesTotal)}</div></div>
      <div class="stat-tile"><div class="label">${t('bill_cashCollectedToday')}</div><div class="value">${fmtMoney(cashTotal)}</div></div>
    </div>
  `;
}

/* ---- Coupons at billing ---- */
async function applyOrRemoveCoupon(){
  if(CART.couponCode){
    CART.couponCode = '';
    CART.couponDiscount = 0;
    renderBilling();
    return;
  }
  const code = (document.getElementById('couponCodeInput').value||'').trim().toUpperCase();
  if(!code){ toast(t('toast_enterCouponCode'),'error'); return; }
  const coupons = await scopedGetAll('coupons');
  const coupon = coupons.find(c=>c.code===code && c.active);
  if(!coupon){ toast(t('toast_invalidCouponCode'),'error'); return; }
  const tot = computeTotals();
  const baseForMin = tot.subtotal - tot.itemDiscount;
  if(coupon.minBillAmount>0 && baseForMin < coupon.minBillAmount){
    toast(t('toast_couponMinBill').replace('{0}',fmtMoney(coupon.minBillAmount)),'error');
    return;
  }
  const discount = coupon.type==='percent' ? Math.round(baseForMin*coupon.value/100*100)/100 : Math.min(baseForMin, coupon.value);
  CART.couponCode = code;
  CART.couponDiscount = discount;
  toast(t('toast_couponAppliedDiscount').replace('{0}', fmtMoney(discount)),'success');
  renderBilling();
}

async function renderBillProductResults(){
  const wrap = document.getElementById('billProductResults');
  if(!wrap) return;
  let products = await scopedGetAll('products');
  if(BILL_SEARCH){
    const q = BILL_SEARCH.toLowerCase();
    products = products.filter(p=> p.name.toLowerCase().includes(q) || (p.brand||'').toLowerCase().includes(q) ||
      (p.variants||[]).some(v=>(v.sku||'').toLowerCase().includes(q)));
  }
  products.sort((a,b)=>a.name.localeCompare(b.name));
  const countEl = document.getElementById('billProductCount');
  if(countEl) countEl.textContent = products.length ? t('bill_productCount').replace('{0}', products.length) : '';
  if(products.length===0){
    wrap.innerHTML = `<div class="empty-state">${t('bill_noMatchingProducts')}</div>`;
    BILL_NAV_ITEMS = [];
    BILL_NAV_INDEX = -1;
    return;
  }
  // Flatten every buyable (in-stock, at the active firm) variant into one ordered list, in
  // the same order the buttons render below — Arrow Up/Down walks this list and Enter adds
  // whichever is highlighted, so the whole search-to-cart flow works without ever touching
  // the mouse. sellableStock() is the active firm's own slice when multi-firm is in use, and
  // the plain total otherwise, so a single-shop install behaves exactly as it always has.
  BILL_NAV_ITEMS = [];
  products.forEach(p=>(p.variants||[]).forEach((v,i)=>{
    if(sellableStock(v) - stockHeldInOtherTabs(p.id, i) > 0) BILL_NAV_ITEMS.push({productId:p.id, variantIndex:i});
  }));
  // Auto-highlight the first match once there's an active search, so typing a few letters and
  // hitting Enter immediately adds the top result — but leave nothing highlighted when the box
  // is empty (browsing the full catalog), so Enter can't add a random item by accident.
  BILL_NAV_INDEX = (BILL_SEARCH && BILL_NAV_ITEMS.length) ? 0 : -1;
  wrap.innerHTML = products.map(p=>`
    <div style="border-bottom:1px solid var(--line);padding:5px 2px;">
      <div style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;line-height:1.25;">
        ${p.photo?`<img src="${p.photo}" style="width:22px;height:22px;object-fit:cover;border-radius:5px;flex:none;">`:''}
        <span>${escapeHTML(p.name)} ${p.brand?`<span class="muted" style="font-weight:400;">— ${escapeHTML(p.brand)}</span>`:''}</span>
      </div>
      <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;">
        ${(p.variants||[]).map((v,i)=>{
          const label = [v.size,v.color].filter(Boolean).join(' / ') || (v.sku || t('inv_defaultVariant'));
          const heldElsewhere = stockHeldInOtherTabs(p.id, i);
          const avail = Math.max(0, sellableStock(v) - heldElsewhere);
          const out = avail<=0;
          const onSale = isVariantOnSale(v);
          const priceHTML = onSale
            ? `${iconSVG('tag',10)} ${fmtMoney(variantSalePrice(v))} <span style="text-decoration:line-through;opacity:0.6;">${fmtMoney(v.sellPrice)}</span>`
            : fmtMoney(v.sellPrice);
          const navIdx = out ? -1 : BILL_NAV_ITEMS.findIndex(n=>n.productId===p.id && n.variantIndex===i);
          return `<button type="button" class="btn btn-sm btn-outline bill-variant-btn" data-navidx="${navIdx}" style="padding:3px 7px;font-size:11px;line-height:1.3;${out?'opacity:.45;cursor:not-allowed;':''}${onSale?'border-color:var(--wine);':''}"
            onclick="${out?'':`addToCart(${p.id}, ${i})`}" ${out?'disabled':''}>
            ${escapeHTML(label)} · ${priceHTML} ${out?t('bill_outOfStockParen'):t('bill_leftCountParen').replace('{0}', avail)}${heldElsewhere>0?` <span class="muted">${t('tabs_heldInOther').replace('{0}', heldElsewhere)}</span>`:''}
          </button>`;
        }).join('')}
      </div>
    </div>
  `).join('');
  updateBillNavHighlight();
}

// Applies the "highlighted" look to whichever product/variant BILL_NAV_INDEX points at, and
// scrolls it into view within the fixed-height results box (never scrolls the whole page).
function updateBillNavHighlight(){
  document.querySelectorAll('.bill-variant-btn').forEach(btn=>{
    const isSelected = BILL_NAV_INDEX>=0 && Number(btn.dataset.navidx)===BILL_NAV_INDEX;
    btn.classList.toggle('nav-selected', isSelected);
    if(isSelected) btn.scrollIntoView({block:'nearest'});
  });
}
// Moves the keyboard highlight by `delta` (1 = next, -1 = previous) through BILL_NAV_ITEMS.
function moveBillNav(delta){
  if(BILL_NAV_ITEMS.length===0) return;
  if(BILL_NAV_INDEX<0) BILL_NAV_INDEX = delta>0 ? 0 : BILL_NAV_ITEMS.length-1;
  else BILL_NAV_INDEX = (BILL_NAV_INDEX + delta + BILL_NAV_ITEMS.length) % BILL_NAV_ITEMS.length;
  updateBillNavHighlight();
}

let BILL_CUST_LIST = [];
let BILL_CUST_NAV = -1;

// Matches on name or phone so a long customer list never needs scrolling.
function filterCustomers(list, q){
  const s = (q||'').trim().toLowerCase();
  if(!s) return list.slice(0, 50);
  const digits = s.replace(/\D/g,'');
  return list.filter(c=>{
    const name = (c.name||'').toLowerCase();
    const phone = (c.phone||'').replace(/\D/g,'');
    return name.includes(s) || (digits && phone.includes(digits));
  }).slice(0, 50);
}

function billCustomerLabel(c){
  return c.name + (c.phone ? ' (' + c.phone + ')' : '');
}

function renderBillCustomerResults(q){
  const box = document.getElementById('billCustomerResults');
  if(!box) return;
  const matches = filterCustomers(BILL_CUST_LIST, q);
  BILL_CUST_NAV = matches.length ? 0 : -1;
  if(!matches.length){
    box.innerHTML = `<div class="muted" style="padding:10px 12px;font-size:12.5px;">${t('bill_noCustomerMatch')}</div>`;
  } else {
    box.innerHTML = matches.map((c,i)=>`
      <div class="bill-cust-opt" data-id="${c.id}" data-i="${i}"
        style="padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line);">
        <strong>${escapeHTML(c.name)}</strong>${c.phone?` <span class="muted" style="font-size:11.5px;">${escapeHTML(c.phone)}</span>`:''}
        ${c.creditDue>0?`<span class="muted" style="font-size:11px;float:right;">${fmtMoney(c.creditDue)}</span>`:''}
      </div>`).join('');
    box.querySelectorAll('.bill-cust-opt').forEach(el=>{
      el.addEventListener('mousedown', (ev)=>{ ev.preventDefault(); pickBillCustomer(parseInt(el.dataset.id)); });
    });
  }
  box.style.display = '';
  highlightBillCustomer();
}

function highlightBillCustomer(){
  document.querySelectorAll('#billCustomerResults .bill-cust-opt').forEach((el,i)=>{
    el.style.background = (i===BILL_CUST_NAV) ? 'var(--paper-soft)' : '';
  });
}

function pickBillCustomer(id){
  const c = BILL_CUST_LIST.find(x=>x.id===id);
  CART.customerId = c ? c.id : null;
  setActiveTabLabel(c ? c.name : '');
  const inp = document.getElementById('billCustomerSearch');
  const box = document.getElementById('billCustomerResults');
  const clr = document.getElementById('billCustomerClear');
  if(inp) inp.value = c ? billCustomerLabel(c) : '';
  if(box) box.style.display = 'none';
  if(clr) clr.style.display = c ? '' : 'none';
  renderBillTotals();
}

async function renderCustomerSelect(){
  const inp = document.getElementById('billCustomerSearch');
  if(!inp) return;
  const customers = await scopedGetAll('customers');
  customers.sort((a,b)=>a.name.localeCompare(b.name));
  BILL_CUST_LIST = customers.map(c=>({
    id:c.id, name:c.name, phone:c.phone||'',
    creditDue: (c.ledger||[]).reduce((s,l)=>s + (l.type==='sale' ? l.amount : -l.amount), 0)
  }));
  const chosen = CART.customerId ? BILL_CUST_LIST.find(c=>c.id===CART.customerId) : null;
  inp.value = chosen ? billCustomerLabel(chosen) : '';
  const clr = document.getElementById('billCustomerClear');
  if(clr) clr.style.display = chosen ? '' : 'none';

  if(inp.dataset.wired) return;      // listeners are attached once, not on every re-render
  inp.dataset.wired = '1';
  const box = document.getElementById('billCustomerResults');
  inp.addEventListener('focus', ()=>renderBillCustomerResults(CART.customerId ? '' : inp.value));
  inp.addEventListener('input', ()=>{
    if(CART.customerId){ CART.customerId = null; if(clr) clr.style.display='none'; }
    renderBillCustomerResults(inp.value);
  });
  inp.addEventListener('blur', ()=>{ setTimeout(()=>{ if(box) box.style.display='none'; }, 120); });
  inp.addEventListener('keydown', (e)=>{
    const opts = document.querySelectorAll('#billCustomerResults .bill-cust-opt');
    if(e.key==='ArrowDown'){ e.preventDefault(); if(opts.length){ BILL_CUST_NAV=Math.min(BILL_CUST_NAV+1,opts.length-1); highlightBillCustomer(); opts[BILL_CUST_NAV].scrollIntoView({block:'nearest'}); } }
    else if(e.key==='ArrowUp'){ e.preventDefault(); if(opts.length){ BILL_CUST_NAV=Math.max(BILL_CUST_NAV-1,0); highlightBillCustomer(); opts[BILL_CUST_NAV].scrollIntoView({block:'nearest'}); } }
    else if(e.key==='Enter'){ if(BILL_CUST_NAV>=0 && opts[BILL_CUST_NAV]){ e.preventDefault(); pickBillCustomer(parseInt(opts[BILL_CUST_NAV].dataset.id)); } }
    else if(e.key==='Escape'){ if(box) box.style.display='none'; }
  });
  if(clr) clr.addEventListener('click', ()=>{ pickBillCustomer(null); inp.focus(); });
}


async function findVariantBySKU(sku){
  const q = String(sku).trim().toLowerCase();
  if(!q) return null;
  const products = await scopedGetAll('products');
  for(const p of products){
    const idx = (p.variants||[]).findIndex(v=>(v.sku||'').toLowerCase() === q);
    if(idx>=0){
      const v = p.variants[idx];
      return { productId:p.id, variantIndex:idx, name:p.name, label:[v.size,v.color].filter(Boolean).join('/') };
    }
  }
  return null;
}

async function addToCart(productId, variantIndex){
  const product = await dbGet('products', productId);
  const variant = product.variants[variantIndex];
  // Whatever other open bills have already claimed is not available to this one.
  const heldElsewhere = stockHeldInOtherTabs(productId, variantIndex);
  const avail = Math.max(0, sellableStock(variant) - heldElsewhere);
  if(!variant || avail<=0){
    toast(heldElsewhere>0 ? t('toast_allOnOtherBills') : t('toast_outOfStock'),'error');
    return;
  }
  const existing = CART.items.find(it=>it.productId===productId && it.variantIndex===variantIndex);
  const alreadyInCart = existing ? existing.qty : 0;
  if(alreadyInCart + 1 > avail){
    toast(heldElsewhere>0 ? t('toast_restOnOtherBills').replace('{0}', heldElsewhere) : t('toast_notEnoughStock'),'error');
    return;
  }
  if(existing){
    existing.qty += 1;
  } else {
    const onSale = isVariantOnSale(variant);
    CART.items.push({
      productId, variantIndex,
      name: product.name,
      category: product.category||'',
      size: variant.size, color: variant.color, sku: variant.sku,
      qty: 1, rate: variant.sellPrice,
      // A variant currently on sale pre-fills its configured discount here — the cashier can
      // still change or clear it like any other item discount, this just saves the typing.
      discount: onSale ? Number(variant.saleValue||0) : 0,
      discountType: onSale ? variant.saleType : 'amount',
      autoSale: onSale,
      note: '',
      hsn: product.hsn||'',
      taxRate: product.taxRate||0,
      taxInclusive: !!product.taxInclusive,
      maxStock: avail
    });
    if(onSale) toast(t('toast_addedAtSalePrice').replace('{0}',product.name).replace('{1}',variant.saleType==='percent'?variant.saleValue+'% off':fmtMoney(variant.saleValue)+' off'), 'success');
  }
  renderCartItems();
  renderBillTotals();
  const searchBox = document.getElementById('billSearch');
  if(searchBox) searchBox.focus();
}

                <button type="button" class="btn btn-outline btn-sm" style="padding:0;width:24px;height:24px;font-size:15px;font-weight:800;line-height:1;flex:none;" onclick="stepCartQty(${i}, 1)" title="${t('bill_increaseQty')}">&plus;</button>
              </div>
            </td>
            <td><input type="number" min="0" step="0.01" value="${it.rate}" style="padding:4px;font-size:12px;" onchange="updateCartRate(${i}, this.value)"></td>
            <td>
              <div style="display:flex;gap:2px;">
                <input type="number" min="0" step="0.01" value="${it.discount}" style="padding:4px;font-size:12px;width:56px;" onchange="updateCartDiscount(${i}, this.value)">
                <select style="padding:4px 2px;font-size:11px;width:44px;" onchange="updateCartDiscountType(${i}, this.value)">
                  <option value="amount" ${it.discountType!=='percent'?'selected':''}>₹</option>
                  <option value="percent" ${it.discountType==='percent'?'selected':''}>%</option>
                </select>

            <td class="num">${fmtMoney(lineTotal)}</td>
            <td><button class="btn btn-danger btn-sm" onclick="removeCartItem(${i})">&times;</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
}
function toggleItemNote(i){
  const el = document.getElementById('itemNoteWrap'+i);
  if(el) el.style.display = el.style.display==='none' ? 'block' : 'none';
}
function updateItemNote(i, val){ CART.items[i].note = val.trim(); renderCartItems(); }
function updateCartQty(i, val){
  const it = CART.items[i]; let q = parseInt(val)||1;
  if(q<1) q=1; if(q>it.maxStock){ q=it.maxStock; toast(t('toast_onlyXInStock').replace('{0}', it.maxStock),'error'); }
  it.qty = q; renderCartItems(); renderBillTotals();
}
function stepCartQty(i, delta){
  const it = CART.items[i];
  updateCartQty(i, (it.qty||1) + delta);
}
function updateCartRate(i,val){ CART.items[i].rate = parseFloat(val)||0; renderCartItems(); renderBillTotals(); }
// A manual edit means the cashier is taking over from the auto-applied sale discount, so the
// SALE badge (which implies "this is the configured sale price") no longer applies here.
function updateCartDiscount(i,val){ CART.items[i].discount = Math.max(0, parseFloat(val)||0); CART.items[i].autoSale = false; renderCartItems(); renderBillTotals(); }
function updateCartDiscountType(i,val){ CART.items[i].discountType = val==='percent'?'percent':'amount'; CART.items[i].autoSale = false; renderCartItems(); renderBillTotals(); }
function removeCartItem(i){ CART.items.splice(i,1); renderCartItems(); renderBillTotals(); }

// Highest matching automatic tiered discount for a given bill amount (after item discounts).
function autoTierDiscountAmount(baseAmount){
  const tiers = SETTINGS.tieredDiscounts||[];
  let best = 0;
  tiers.forEach(t=>{ if(baseAmount >= t.minAmount && t.percent > best) best = t.percent; });
  return Math.round(baseAmount * best / 100 * 100)/100;
}

// Prices a cart. With no argument it prices the bill the counter is on right now; a parked
// tab passes its own cart so the tab bar can show a running total without switching to it.
function computeTotals(cartArg){
  const C = cartArg || CART;
  let subtotal=0, itemDiscount=0, taxTotal=0, taxIncluded=0;
  C.items.forEach(it=>{
    subtotal += it.qty*it.rate;
    itemDiscount += itemDiscountAmount(it);
    const lp = lineTaxParts(it);
    taxTotal += lp.tax;
    if(lp.included) taxIncluded += lp.tax;
  });
  taxTotal = Math.round(taxTotal*100)/100;
  taxIncluded = Math.round(taxIncluded*100)/100;
  // Only tax that is added ON TOP changes what the customer pays; included tax is already in the prices.
  const taxAdded = Math.round((taxTotal - taxIncluded)*100)/100;
  const afterItemDiscount = Math.max(0, subtotal - itemDiscount);
  const autoTierDiscount = autoTierDiscountAmount(afterItemDiscount);
  const overallDiscount = C.overallDiscountType==='percent'
    ? Math.round(Math.max(0, afterItemDiscount - autoTierDiscount) * (Number(C.overallDiscount)||0) / 100 * 100)/100
    : Math.max(0, Number(C.overallDiscount)||0);
  const couponDiscount = Math.max(0, Number(C.couponDiscount)||0);
  const packagingCharge = Math.max(0, Number(C.packagingCharge)||0);
  const deliveryCharge = C.deliveryEnabled ? Math.max(0, Number(C.deliveryCharge)||0) : 0;

  const preRound = Math.max(0, subtotal - itemDiscount - autoTierDiscount - overallDiscount - couponDiscount + taxAdded + packagingCharge + deliveryCharge);
  const roundOff = SETTINGS.roundOffEnabled ? Math.round((Math.round(preRound) - preRound)*100)/100 : 0;
  const grandTotal = Math.round((preRound + roundOff)*100)/100;

  return {subtotal, itemDiscount, taxTotal, taxIncluded, taxAdded, autoTierDiscount, overallDiscount, couponDiscount, packagingCharge, deliveryCharge, roundOff, grandTotal};
}
function renderBillTotals(){
  const wrap = document.getElementById('billTotalsWrap');
  if(!wrap) return;
  const tot = computeTotals();
  wrap.innerHTML = `
    <div style="font-size:13px;line-height:1.9;">
      <div style="display:flex;justify-content:space-between;"><span class="muted">${t('bill_subtotal')}</span><span>${fmtMoney(tot.subtotal)}</span></div>
      <div style="display:flex;justify-content:space-between;"><span class="muted">${t('bill_itemDiscounts')}</span><span>-${fmtMoney(tot.itemDiscount)}</span></div>
      ${tot.autoTierDiscount>0?`<div style="display:flex;justify-content:space-between;"><span class="muted">${t('bill_automaticDiscount')}</span><span>-${fmtMoney(tot.autoTierDiscount)}</span></div>`:''}
      ${(tot.taxAdded>0 || tot.taxIncluded<=0)?`<div style="display:flex;justify-content:space-between;"><span class="muted">${t('bill_gst')}</span><span>${fmtMoney(tot.taxAdded)}</span></div>`:''}
      ${tot.taxIncluded>0?`<div style="display:flex;justify-content:space-between;"><span class="muted" style="font-style:italic;">${t('bill_gstIncludedRow')}</span><span class="muted" style="font-style:italic;">${fmtMoney(tot.taxIncluded)}</span></div>`:''}
      <div style="display:flex;justify-content:space-between;"><span class="muted">${t('bill_overallDiscountLabel')}</span><span>-${fmtMoney(tot.overallDiscount)}</span></div>
      ${tot.couponDiscount>0?`<div style="display:flex;justify-content:space-between;"><span class="muted">Coupon (${escapeHTML(CART.couponCode||'')})</span><span>-${fmtMoney(tot.couponDiscount)}</span></div>`:''}
      ${tot.packagingCharge>0?`<div style="display:flex;justify-content:space-between;"><span class="muted">${t('bill_packagingLabel')}</span><span>${fmtMoney(tot.packagingCharge)}</span></div>`:''}
      ${tot.deliveryCharge>0?`<div style="display:flex;justify-content:space-between;"><span class="muted">${t('bill_deliveryLabel')}</span><span>${fmtMoney(tot.deliveryCharge)}</span></div>`:''}
      ${tot.roundOff!==0?`<div style="display:flex;justify-content:space-between;"><span class="muted">${t('bill_roundOff')}</span><span>${tot.roundOff>0?'+':''}${fmtMoney(tot.roundOff)}</span></div>`:''}
      <div style="display:flex;justify-content:space-between;font-weight:700;font-size:16px;border-top:1px solid var(--line);margin-top:4px;padding-top:4px;color:var(--ink);">
        <span>${t('bill_grandTotal')}</span><span>${fmtMoney(tot.grandTotal)}</span>
      </div>
    </div>
  `;
}

/* ---- Parallel bills (tabs) ----------------------------------------------
   At a rush the counter has three customers half-served at once. Each open bill is a tab:
   the active tab's cart IS the live CART, so every existing billing function keeps working
   untouched; switching a tab just swaps which cart CART points at. Tabs are written to
   IndexedDB (debounced) so a reload, a power cut or tomorrow morning finds them intact. */

const MAX_BILL_TABS = 12;
let BILL_TABS = [];         // [{id, firmId, label, cart, createdAt}]
let ACTIVE_TAB_ID = null;
let TAB_SAVE_TIMER = null;

function tabsFirmId(){ return billableFirmId() || firmIdForStockOps() || null; }
function activeBillTab(){ return BILL_TABS.find(x=>x.id===ACTIVE_TAB_ID) || null; }

function billTabTitle(tab, index){
  if((tab.label||'').trim()) return tab.label.trim();
  return t('tabs_billN').replace('{0}', index+1);
}

// Debounced so typing a quantity doesn't hit the database on every keystroke.
function scheduleTabSave(){
  const tab = activeBillTab();
  if(tab) tab.cart = CART;
  refreshActiveTabChip();
  if(TAB_SAVE_TIMER) clearTimeout(TAB_SAVE_TIMER);
  TAB_SAVE_TIMER = setTimeout(()=>{ TAB_SAVE_TIMER=null; persistActiveTab(); }, 500);
}

// Updates just the live tab's caption as items go on the bill. Rewriting the whole bar on
// every keystroke would tear down the other tabs' click handlers for no reason.
function refreshActiveTabChip(){
  const tab = activeBillTab();
  if(!tab) return;
  const el = document.querySelector(`.bill-tab[data-id="${tab.id}"]`);
  if(!el) return;
  const idx = BILL_TABS.findIndex(x=>x.id===tab.id);
  const count = (tab.cart.items||[]).length;
  const nameEl = el.querySelector('.bill-tab-name');
  const metaEl = el.querySelector('.bill-tab-meta');
  if(nameEl) nameEl.textContent = billTabTitle(tab, idx);
  if(metaEl) metaEl.textContent = count ? fmtMoney(computeTotals(tab.cart).grandTotal)+' · '+count : t('tabs_empty');
}
async function persistActiveTab(){
  const tab = activeBillTab();
  if(!tab) return;
  tab.cart = CART;
  try{ await dbPut('openBills', {id:tab.id, firmId:tab.firmId, label:tab.label||'', cart:tab.cart, createdAt:tab.createdAt}); }
  catch(e){ /* a failed autosave must never block billing */ }
}
async function flushTabSave(){
  if(TAB_SAVE_TIMER){ clearTimeout(TAB_SAVE_TIMER); TAB_SAVE_TIMER=null; }
  await persistActiveTab();
}

async function loadBillTabs(){
  const firmId = tabsFirmId();
  let rows = (await dbGetAll('openBills')).filter(r=>(r.firmId||null)===firmId);

  // One-time migration: bills parked with the old Hold button lived in localStorage.
  try{
    const legacy = JSON.parse(localStorage.getItem('heldBills')||'[]');
    if(Array.isArray(legacy) && legacy.length){
      for(const h of legacy){
        const rec = {id:'t'+(h.id||Date.now())+Math.random().toString(36).slice(2,6), firmId,
          label:h.label||'', cart:{...freshCart(), ...(h.cart||{})}, createdAt:h.savedAt||new Date().toISOString()};
        await dbPut('openBills', rec);
        rows.push(rec);
      }
      localStorage.removeItem('heldBills');
    }
  }catch(e){ /* nothing to migrate */ }

  rows.sort((a,b)=> (a.createdAt||'') < (b.createdAt||'') ? -1 : 1);
  BILL_TABS = rows.map(r=>({id:r.id, firmId:r.firmId, label:r.label||'', cart:{...freshCart(), ...(r.cart||{})}, createdAt:r.createdAt}));

  if(BILL_TABS.length===0){
    const tab = {id:newTabId(), firmId, label:'', cart:freshCart(), createdAt:new Date().toISOString()};
    BILL_TABS.push(tab);
    await dbPut('openBills', {...tab});
  }
  // Keep whatever tab was active if it still exists, else go to the first.
  if(!BILL_TABS.some(x=>x.id===ACTIVE_TAB_ID)) ACTIVE_TAB_ID = BILL_TABS[0].id;
  CART = activeBillTab().cart;
}

function newTabId(){ return 't'+Date.now()+Math.random().toString(36).slice(2,6); }

async function switchBillTab(id){
  if(id===ACTIVE_TAB_ID) return;
  const target = BILL_TABS.find(x=>x.id===id);
  if(!target) return;
  await flushTabSave();          // park the bill we're leaving, exactly as it stands
  ACTIVE_TAB_ID = id;
  CART = target.cart;
  BILL_SEARCH = '';
  await renderBilling();
}

async function newBillTab(){
  if(!requireWorkingFirm(t('tabs_newBill'))) return;
  if(BILL_TABS.length >= MAX_BILL_TABS){ toast(t('toast_tooManyOpenBills').replace('{0}', MAX_BILL_TABS),'error'); return; }
  await flushTabSave();
  const tab = {id:newTabId(), firmId:tabsFirmId(), label:'', cart:freshCart(), createdAt:new Date().toISOString()};
  BILL_TABS.push(tab);
  await dbPut('openBills', {...tab});
  ACTIVE_TAB_ID = tab.id;
  CART = tab.cart;
  BILL_SEARCH = '';
  await renderBilling();
  document.getElementById('billSearch')?.focus();
}

// Drops a tab without billing it. `silent` is used after a completed sale, where there is
// nothing to confirm.
async function closeBillTab(id, silent){
  const idx = BILL_TABS.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const tab = BILL_TABS[idx];
  if(!silent && (tab.cart.items||[]).length>0){
    if(!confirm(t('tabs_confirmClose').replace('{0}', billTabTitle(tab, idx)))) return;
  }
  BILL_TABS.splice(idx,1);
  try{ await dbDelete('openBills', id); }catch(e){}
  if(BILL_TABS.length===0){
    const fresh = {id:newTabId(), firmId:tabsFirmId(), label:'', cart:freshCart(), createdAt:new Date().toISOString()};
    BILL_TABS.push(fresh);
    await dbPut('openBills', {...fresh});
  }
  if(id===ACTIVE_TAB_ID){
    const next = BILL_TABS[Math.min(idx, BILL_TABS.length-1)];
    ACTIVE_TAB_ID = next.id;
    CART = next.cart;
    BILL_SEARCH = '';
  }
  await renderBilling();
}

// Called by the customer picker so a tab names itself the moment a customer is chosen.
function setActiveTabLabel(name){
  const tab = activeBillTab();
  if(!tab) return;
  tab.label = (name||'').trim();
  persistActiveTab();
  renderBillTabs();
}

// How much of a variant is already sitting on OTHER open bills. During a rush two tabs can
// otherwise both claim the last piece, and only the second checkout would find out.
function stockHeldInOtherTabs(productId, variantIndex){
  let held = 0;
  BILL_TABS.forEach(tab=>{
    if(tab.id===ACTIVE_TAB_ID) return;
    (tab.cart.items||[]).forEach(it=>{
      if(it.productId===productId && it.variantIndex===variantIndex) held += Number(it.qty||0);
    });
  });
  return held;
}

function renameBillTab(id){
  const idx = BILL_TABS.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const tab = BILL_TABS[idx];
  const name = prompt(t('tabs_renamePrompt'), tab.label||'');
  if(name===null) return;
  tab.label = name.trim();
  dbPut('openBills', {id:tab.id, firmId:tab.firmId, label:tab.label, cart:tab.cart, createdAt:tab.createdAt});
  renderBillTabs();
}

function renderBillTabs(){
  const wrap = document.getElementById('billTabsWrap');
  if(!wrap) return;
  wrap.innerHTML = BILL_TABS.map((tab,i)=>{
    const active = tab.id===ACTIVE_TAB_ID;
    const count = (tab.cart.items||[]).length;
    const total = count ? computeTotals(tab.cart).grandTotal : 0;
    return `<div class="bill-tab${active?' active':''}" data-id="${tab.id}" role="button" tabindex="0"
        title="${escapeHTML(t('tabs_switchHint'))}">
      <span class="bill-tab-name">${escapeHTML(billTabTitle(tab,i))}</span>
      <span class="bill-tab-meta">${count?fmtMoney(total)+' · '+count:t('tabs_empty')}</span>
      <button type="button" class="bill-tab-x" data-close="${tab.id}" title="${escapeHTML(t('tabs_closeHint'))}">&times;</button>
    </div>`;
  }).join('') +
  `<button type="button" class="bill-tab-add" id="newBillTabBtn" title="${escapeHTML(t('tabs_newBillHint'))}">+ ${escapeHTML(t('tabs_newBill'))}</button>`;

  wrap.querySelectorAll('.bill-tab').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.bill-tab-x')) return;
      switchBillTab(el.dataset.id);
    });
    el.addEventListener('dblclick', (e)=>{
      if(e.target.closest('.bill-tab-x')) return;
      renameBillTab(el.dataset.id);
    });
    el.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); switchBillTab(el.dataset.id); } });
  });
  wrap.querySelectorAll('.bill-tab-x').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); closeBillTab(btn.dataset.close); });
  });
  document.getElementById('newBillTabBtn')?.addEventListener('click', newBillTab);
}

/* ---- Quotations (saved estimates, no stock/invoice impact) ---- */
async function saveCurrentAsQuotation(){
  if(CART.items.length===0){ toast(t('toast_cartEmpty'),'error'); return; }
  const quoteNumber = await nextQuotationNo();
  const totals = computeTotals();
  const record = {
    quoteNumber,
    date: new Date().toISOString(),
    firmId: billableFirmId(),
    customerId: CART.customerId,
    items: CART.items.map(it=>({...it})),
    overallDiscount: CART.overallDiscount, overallDiscountType: CART.overallDiscountType,
    packagingCharge: CART.packagingCharge, deliveryEnabled: CART.deliveryEnabled,
    deliveryAddress: CART.deliveryAddress, deliveryCharge: CART.deliveryCharge,
    couponCode: CART.couponCode, couponDiscount: CART.couponDiscount,
    totals
  };
  await dbAdd('quotations', record);
  emptyCart();
  toast(t('toast_quotationSaved').replace('{0}', quoteNumber));
  renderBilling();
}
async function renderQuotationsList(){
  const wrap = document.getElementById('quotationsWrap');
  if(!wrap) return;
  const quotations = await scopedGetAll('quotations');
  const badge = document.getElementById('quotationsCountBadge');
  if(badge){ if(quotations.length>0){ badge.style.display=''; badge.textContent = quotations.length; } else { badge.style.display='none'; } }
  if(quotations.length===0){ wrap.innerHTML = `<div class="muted" style="font-size:12.5px;">No saved quotations.</div>`; return; }
  quotations.sort((a,b)=>new Date(b.date)-new Date(a.date));
  const customers = await scopedGetAll('customers');
  const custName = (id)=> id ? ((customers.find(c=>c.id===id)||{}).name || t('acct_customerFallback')) : t('bill_walkIn');
  wrap.innerHTML = quotations.map(q=>`
    <div class="row" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:6px 0;">
      <div style="font-size:12.5px;"><strong>${escapeHTML(q.quoteNumber)}</strong> — ${escapeHTML(custName(q.customerId))}<br><span class="muted" style="font-size:11px;">${fmtDate(q.date)} · ${q.items.length} item(s) · ${fmtMoney(q.totals.grandTotal)}</span></div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;">
        <button class="btn btn-outline btn-sm" onclick="resumeQuotation(${q.id})">${t('bill_resume')}</button>
        <button class="btn btn-outline btn-sm" onclick="printQuotation(${q.id})">${t('print_printBtn')}</button>
        <button class="btn btn-danger btn-sm" onclick="deleteQuotationConfirm(${q.id})">${t('acct_deleteBtn')}</button>
      </div>
    </div>

async function resumeQuotation(id){
  const q = await dbGet('quotations', id);
  if(!q) return;
  if(CART.items.length>0 && !confirm(t('modal_replaceBillWithQuotation'))) return;
  CART = {
    ...freshCart(),
    items: q.items.map(it=>({...it})),
    customerId: q.customerId,
    overallDiscount: q.overallDiscount||0, overallDiscountType: q.overallDiscountType||'amount',
    packagingCharge: q.packagingCharge||0, deliveryEnabled: !!q.deliveryEnabled,
    deliveryAddress: q.deliveryAddress||'', deliveryCharge: q.deliveryCharge||0,
    couponCode: q.couponCode||'', couponDiscount: q.couponDiscount||0
  };
  // CART was replaced wholesale, so the open tab has to point at the new object.
  const qTab = activeBillTab();
  if(qTab){ qTab.cart = CART; await persistActiveTab(); }
  renderBilling();
  toast(t('toast_quotationLoaded'));
}
async function printQuotation(id){
  const q = await dbGet('quotations', id);
  if(!q) return;
  let customerName = t('bill_walkInCustomerOption');
  if(q.customerId){ const c = await dbGet('customers', q.customerId); if(c) customerName = c.name + (c.phone?(' — '+c.phone):''); }
  const fakeBill = {
    invoiceNo: q.quoteNumber, date: q.date, items: q.items,
    subtotal: q.totals.subtotal,
    discountTotal: q.totals.itemDiscount + q.totals.autoTierDiscount + q.totals.overallDiscount + q.totals.couponDiscount,
    taxTotal: q.totals.taxTotal, taxIncluded: q.totals.taxIncluded||0, grandTotal: q.totals.grandTotal, amountDue: q.totals.grandTotal,
    pointsRedeemed:0, pointsEarned:0, creditAmount:0
  };
  const format = SETTINGS.paperSize || 'thermal80';
  const isThermal = format!=='a4';
  let doc = buildInvoicePrintDocument(fakeBill, customerName, format, t('print_quotationTitle'));
  doc = doc.replace('</body>', `<p style="text-align:center;font-size:11px;margin-top:8px;">${t('print_quotationNote')}</p></body>`);
  const w = openPrintWindow(isThermal ? 'width=380,height=600' : 'width=780,height=900');
  w.document.write(doc);
  w.document.close();
  w.focus();
  setTimeout(()=>{ w.print(); }, 250);
}
function deleteQuotationConfirm(id){
  if(!confirm(t('modal_deleteQuotationQ'))) return;
  dbDelete('quotations', id).then(()=>{ toast(t('toast_quotationDeleted')); renderQuotationsList(); });
}

      <div class="col field" style="margin-bottom:6px;flex:0 0 90px;"><label style="font-size:11px;">${t('bk_estRateLabel')}</label><input type="number" class="bk-rate" min="0" step="0.01" value="${item?item.rate:0}"></div>
      <button class="btn btn-danger btn-sm bk-remove" type="button" style="margin-bottom:6px;">&times;</button>
    </div>`;
  };
  openModal({
    title:t('modal_newAdvanceBooking'),
    bodyHTML:`
      <div class="field"><label>${t('bk_customerRequiredLabel')}</label>
        <select id="bk_customer"><option value="">${t('bk_selectCustomerOption')}</option>${customers.map(c=>`<option value="${c.id}">${escapeHTML(c.name)} ${c.phone?'('+escapeHTML(c.phone)+')':''}</option>`).join('')}</select>
      </div>
      <div id="bkRowsWrap"></div>
      <button class="btn btn-outline btn-sm" id="bkAddRowBtn" type="button">${t('inv_addItemBtn')}</button>
      <div class="row" style="margin-top:10px;">
        <div class="col field"><label>${t('bk_advanceAmountLabel')}</label><input id="bk_advance" type="number" min="0" step="0.01" value="0"></div>
        <div class="col field"><label>${t('bk_advanceModeLabel')}</label><select id="bk_advanceMode">${paymentModeOptionsHTML('Cash')}</select></div>
        <div class="col field"><label>${t('bk_estimatedTotalLabel')}</label><div id="bk_estimate" style="padding:8px 0;font-weight:700;">${fmtMoney(0)}</div></div>
      </div>
      <div class="field"><label>${t('alter_notesLabel')}</label><input id="bk_notes" placeholder="${t('bk_notesPlaceholder')}"></div>
      <p class="muted" style="font-size:11.5px;">${t('bk_advanceNote')}</p>
    `,
    footerHTML:`<button class="btn btn-outline" onclick="closeModal()">${t('acct_cancelBtn')}</button><button class="btn btn-primary" id="bk_save">${t('bk_saveBookingBtn')}</button>`,
    onMount:()=>{
      const wrap = document.getElementById('bkRowsWrap');
      const addRow = (item)=>{
        const div = document.createElement('div');
        div.innerHTML = rowHTML(wrap.children.length, item);
        const rowEl = div.firstElementChild;
        wrap.appendChild(rowEl);
        wireRow(rowEl);
        recalcEstimate();
      };
      const wireRow = (rowEl)=>{
        const productSel = rowEl.querySelector('.bk-product');
        const variantSel = rowEl.querySelector('.bk-variant');
        const rateInput = rowEl.querySelector('.bk-rate');
        productSel.addEventListener('change', ()=>{
          const p = products.find(pp=>pp.id===parseInt(productSel.value));
          variantSel.innerHTML = p ? p.variants.map((v,i)=>`<option value="${i}">${[v.size,v.color].filter(Boolean).join('/')||(t('bk_itemPrefix')+(i+1))}</option>`).join('') : '';
          if(p && p.variants[0]) rateInput.value = p.variants[0].sellPrice;
          recalcEstimate();
        });
        variantSel.addEventListener('change', ()=>{
          const p = products.find(pp=>pp.id===parseInt(productSel.value));
          const v = p && p.variants[parseInt(variantSel.value)];
          if(v) rateInput.value = v.sellPrice;
          recalcEstimate();
        });
        rowEl.querySelector('.bk-qty').addEventListener('input', recalcEstimate);
        rateInput.addEventListener('input', recalcEstimate);
        rowEl.querySelector('.bk-remove').addEventListener('click', ()=>{ rowEl.remove(); recalcEstimate(); });
      };
      const recalcEstimate = ()=>{
        let total = 0;
        wrap.querySelectorAll('.bk-row').forEach(rowEl=>{
          const qty = parseFloat(rowEl.querySelector('.bk-qty').value)||0;
          const rate = parseFloat(rowEl.querySelector('.bk-rate').value)||0;
          total += qty*rate;
        });
        document.getElementById('bk_estimate').textContent = fmtMoney(total);
      };
      document.getElementById('bkAddRowBtn').addEventListener('click', ()=>addRow(null));
      addRow(null);
      document.getElementById('bk_save').addEventListener('click', async ()=>{
        const customerId = parseInt(document.getElementById('bk_customer').value)||null;
        if(!customerId){ toast(t('toast_selectCustomer'),'error'); return; }
        const advance = Math.max(0, parseFloat(document.getElementById('bk_advance').value)||0);
        const advanceMode = document.getElementById('bk_advanceMode').value || 'Cash';
        if(advance<=0){ toast(t('toast_enterAdvanceAmount'),'error'); return; }
        const items = [];
        wrap.querySelectorAll('.bk-row').forEach(rowEl=>{
          const productId = parseInt(rowEl.querySelector('.bk-product').value)||null;
          if(!productId) return;
          const variantIndex = parseInt(rowEl.querySelector('.bk-variant').value)||0;
          const p = products.find(pp=>pp.id===productId);
          const v = p && p.variants[variantIndex];
          const qty = Math.max(1, parseInt(rowEl.querySelector('.bk-qty').value)||1);
          const rate = Math.max(0, parseFloat(rowEl.querySelector('.bk-rate').value)||0);
          items.push({productId, variantIndex, name:p?p.name:'', size:v?v.size:'', color:v?v.color:'', qty, rate});
        });
        const totalEstimate = items.reduce((s,it)=>s+it.qty*it.rate,0);
        const bookingNumber = await nextBookingNo();
        const date = new Date().toISOString();
        await dbAdd('bookings', {
          bookingNumber, customerId, items, advanceAmount:advance, totalEstimate,
          notes: document.getElementById('bk_notes').value.trim(),
          status:'open', date, firmId: firmIdForStockOps()
        });
        const customer = await dbGet('customers', customerId);
        customer.storeCredit = Math.round(((customer.storeCredit||0)+advance)*100)/100;
        customer.ledger = customer.ledger||[];
        customer.ledger.push({date, type:'payment', amount:advance, mode:advanceMode, source:'booking_advance', note:'Advance for booking '+bookingNumber});
        await dbPut('customers', customer);
        closeModal();
        toast(t('toast_bookingSavedAdvance').replace('{0}', bookingNumber),'success');
        renderBookingsList();
      });
    }
  });
}
async function renderBookingsList(){
  const wrap = document.getElementById('bookingsWrap');
  if(!wrap) return;
  const bookings = await scopedGetAll('bookings');
  const open = bookings.filter(b=>b.status==='open').sort((a,b)=>new Date(b.date)-new Date(a.date));
  const badge = document.getElementById('bookingsCountBadge');
  if(badge){ if(open.length>0){ badge.style.display=''; badge.textContent = open.length; } else { badge.style.display='none'; } }
  if(open.length===0){ wrap.innerHTML = `<div class="muted" style="font-size:12.5px;">No open bookings.</div>`; return; }
  const customers = await scopedGetAll('customers');
  const custName = (id)=> ((customers.find(c=>c.id===id)||{}).name || t('acct_customerFallback'));
  wrap.innerHTML = open.map(b=>`
    <div class="row" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:6px 0;">
      <div style="font-size:12.5px;"><strong>${escapeHTML(b.bookingNumber)}</strong> — ${escapeHTML(custName(b.customerId))}<br><span class="muted" style="font-size:11px;">${fmtDate(b.date)} · ${b.items.length} item(s) · Advance ${fmtMoney(b.advanceAmount)} of est. ${fmtMoney(b.totalEstimate)}</span></div>
      <div style="display:flex;gap:4px;">
        <button class="btn btn-outline btn-sm" onclick="markBookingStatus(${b.id},'fulfilled')">Mark Fulfilled</button>
        <button class="btn btn-danger btn-sm" onclick="markBookingStatus(${b.id},'cancelled')">${t('acct_cancelBtn')}</button>
      </div>
    </div>
  `).join('');
}
async function markBookingStatus(id, status){
  const msg = status==='cancelled' ? t('modal_cancelBookingQ') : t('modal_markBookingFulfilledQ');
  if(!confirm(msg)) return;
  const b = await dbGet('bookings', id);
  if(!b) return;
  b.status = status;
  await dbPut('bookings', b);
  toast(t('toast_bookingUpdated'));
  renderBookingsList();
}

/* ---- Quick add customer from billing screen ---- */
function quickAddCustomerFromBilling(){
  openModal({
    title:t('modal_newCustomer'),

      <div class="field"><label>${t('staff_nameLabel')}</label><input id="qc_name"></div>
      <div class="field"><label>${t('cust_mobileLabel')}</label><input id="qc_phone" type="tel" inputmode="numeric" maxlength="16" placeholder="${t('cust_mobilePlaceholder')}"></div>
    `,
    footerHTML:`<button class="btn btn-outline" onclick="closeModal()">${t('acct_cancelBtn')}</button><button class="btn btn-primary" id="qc_save">Save</button>`,
    onMount: ()=>{
      document.getElementById('qc_save').addEventListener('click', async ()=>{
        const name = document.getElementById('qc_name').value.trim();
        if(!name){ toast(t('toast_nameRequired'),'error'); document.getElementById('qc_name').focus(); return; }
        const phoneRaw = document.getElementById('qc_phone').value.trim();
        if(!phoneRaw){ toast(t('toast_mobileRequired'),'error'); document.getElementById('qc_phone').focus(); return; }
        if(!isValidMobile(phoneRaw)){ toast(t('toast_mobileInvalid'),'error'); document.getElementById('qc_phone').focus(); return; }

          CART.customerId = dup.id;
          closeModal();
          toast(t('toast_customerAlreadyExistsSelected').replace('{0}', dup.name),'success');
          await renderCustomerSelect();
          return;
        }
        const id = await dbAdd('customers', {name, phone, firmId: billableFirmId(), creditBalance:0, storeCredit:0, ledger:[], loyaltyPoints:0, pointsLedger:[]});

        closeModal();
        toast(t('toast_customerAdded'),'success');
        await renderCustomerSelect();
      });
    }
  });
