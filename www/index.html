      <div id="salesCustomRangeWrap" class="col" style="display:${SALES_RANGE==='custom'?'flex':'none'};gap:8px;flex-wrap:wrap;">
        <div class="field" style="max-width:150px;margin-bottom:0;"><label style="font-size:11px;">${t('staff_fromLabel')}</label><input type="date" id="salesCustomFrom" value="${SALES_CUSTOM_FROM}"></div>
        <div class="field" style="max-width:150px;margin-bottom:0;"><label style="font-size:11px;">${t('staff_toLabel')}</label><input type="date" id="salesCustomTo" value="${SALES_CUSTOM_TO}"></div>
      </div>
      <div class="col" style="flex:0 0 auto;">
        <button class="btn btn-outline" id="noBillReturnBtn" title="${t('bill_returnWithoutBillTooltip')}">${t('sales_returnNoBillBtn')}</button>
      </div>
    </div>
    <div class="stat-tiles" id="salesStatTiles"></div>
    <div class="row" style="align-items:flex-start;">
      <div class="col" style="flex:1.4;min-width:320px;">
        <div class="card">
          <h2 class="section-title">${t('sales_salesHistoryTitle')}</h2>
          <div id="salesHistoryWrap" style="max-height:420px;overflow:auto;"></div>
        </div>
      </div>
      <div class="col" style="flex:1;min-width:280px;">
        <div class="card">
          <h2 class="section-title">${t('sales_bestSellersTitle')}</h2>
          <div id="bestSellersWrap"></div>
        </div>
        <div class="card" style="margin-top:12px;">
          <h2 class="section-title">${t('sales_paymentModeCollectionsTitle')}</h2>
          <div id="paymentBreakdownWrap"></div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('salesRangeSelect').value = SALES_RANGE;
  document.getElementById('salesRangeSelect').addEventListener('change',(e)=>{
    SALES_RANGE = e.target.value;
    document.getElementById('salesCustomRangeWrap').style.display = SALES_RANGE==='custom' ? 'flex' : 'none';
    if(SALES_RANGE==='custom' && !SALES_CUSTOM_FROM && !SALES_CUSTOM_TO){
      SALES_CUSTOM_FROM = todayISO(); SALES_CUSTOM_TO = todayISO();
      document.getElementById('salesCustomFrom').value = SALES_CUSTOM_FROM;
      document.getElementById('salesCustomTo').value = SALES_CUSTOM_TO;
    }
    renderSalesData();
  });
  document.getElementById('salesCustomFrom').addEventListener('change',(e)=>{
    SALES_CUSTOM_FROM = e.target.value;
    renderSalesData();
  });
  document.getElementById('salesCustomTo').addEventListener('change',(e)=>{
    SALES_CUSTOM_TO = e.target.value;
    renderSalesData();
  });
  document.getElementById('noBillReturnBtn').addEventListener('click', openNoBillReturnModal);
  await renderSalesData();
}

async function renderSalesData(){
  // Guard: this can be called (e.g. after processing a return from Billing) even when the
  // Sales view — owner-only — has never been rendered in this session, so its elements don't exist yet.
  if(!document.getElementById('salesStatTiles')) return;
  const allBills = scopeBillsToActiveFirm(await scopedGetAll('bills'));
  const {from,to} = rangeToDates(SALES_RANGE);
  const bills = allBills.filter(b=>{
    const d = new Date(b.date);
    return d>=from && d<=to;
  }).sort((a,b)=> new Date(b.date)-new Date(a.date));

  // The list below shows cancelled bills (greyed, for audit); every number ignores them.
  const live = liveBills(bills);

  // Stat tiles
  const totalRevenue = live.reduce((s,b)=>s+b.grandTotal,0);
  const totalTax = live.reduce((s,b)=>s+b.taxTotal,0);
  const totalCredit = live.reduce((s,b)=>s+(b.creditAmount||0),0);
  const avgBill = live.length ? totalRevenue/live.length : 0;
  document.getElementById('salesStatTiles').innerHTML = `
    <div class="stat-tile"><div class="label">${t('acct_csvRowSales')}</div><div class="value">${fmtMoney(totalRevenue)}</div></div>
    <div class="stat-tile"><div class="label">${t('sales_tileBills')}</div><div class="value">${live.length}</div></div>
    <div class="stat-tile"><div class="label">${t('sales_tileAvgBillValue')}</div><div class="value small">${fmtMoney(avgBill)}</div></div>
    <div class="stat-tile"><div class="label">${t('sales_tileGstCollected')}</div><div class="value small">${fmtMoney(totalTax)}</div></div>
    <div class="stat-tile"><div class="label">${t('sales_tileNewCreditGiven')}</div><div class="value small">${fmtMoney(totalCredit)}</div></div>
  `;

  // History table
  const histWrap = document.getElementById('salesHistoryWrap');
  if(bills.length===0){
    histWrap.innerHTML = `<div class="empty-state">${t('staff_noSalesEmpty')}</div>`;
  } else {
    const customerCache = {};
    for(const b of bills){
      if(b.customerId && !(b.customerId in customerCache)){
        customerCache[b.customerId] = await dbGet('customers', b.customerId);
      }
    }
    histWrap.innerHTML = `
      <table>
        <thead><tr><th>${t('th_invoice')}</th><th>${t('th_date')}</th><th>${t('th_customer')}</th><th class="num">${t('th_amount')}</th><th>${t('th_status')}</th><th></th></tr></thead>
        <tbody>
          ${bills.map(b=>{
            const cust = b.customerId ? customerCache[b.customerId] : null;
            const statusTag = b.cancelled ? `<span class="tag tag-grey">${t('sales_cancelledTag')}</span>`
              : b.status==='paid' ? `<span class="tag tag-green">${t('sales_paidTag')}</span>`
              : b.status==='partial' ? `<span class="tag tag-amber">${t('sales_partialTag')}</span>`
              : `<span class="tag tag-red">${t('sales_creditTag')}</span>`;
            const reasonLine = b.cancelled && b.cancelReason
              ? `<br><span class="muted" style="font-size:11px;">${escapeHTML(b.cancelReason)}</span>` : '';
            return `<tr${b.cancelled?' class="row-cancelled"':''}>
              <td>${escapeHTML(b.invoiceNo)}${reasonLine}</td>
              <td>${fmtDate(b.date)}</td>
              <td>${cust?escapeHTML(cust.name):t('bill_walkIn')}</td>
              <td class="num">${fmtMoney(b.grandTotal)}</td>
              <td>${statusTag}</td>
              <td style="white-space:nowrap;">
                <button class="btn btn-outline btn-sm" onclick="viewBillDetail(${b.id})">${t('sales_viewBtn')}</button>
                ${b.cancelled?'':`<button class="btn btn-outline btn-sm" onclick="openReturnModal(${b.id})">${t('sales_returnExchangeBtn')}</button>`}
                ${(!b.cancelled && isOwner())?`<button class="btn btn-danger btn-sm" onclick="openCancelBillModal(${b.id})">${t('sales_cancelBillBtn')}</button>`:''}
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    `;
  }

  // Best sellers
  const salesByItem = {};
  live.forEach(b=>{
    (b.items||[]).forEach(it=>{
      const key = it.name + (it.size||it.color? ' ('+[it.size,it.color].filter(Boolean).join('/')+')':'');
      if(!salesByItem[key]) salesByItem[key] = {qty:0, revenue:0};
      salesByItem[key].qty += it.qty;
      salesByItem[key].revenue += (it.qty*it.rate - itemDiscountAmount(it));
    });
  });
  const bestList = Object.entries(salesByItem).sort((a,b)=>b[1].qty-a[1].qty).slice(0,10);
  const bsWrap = document.getElementById('bestSellersWrap');
  if(bestList.length===0){
    bsWrap.innerHTML = `<div class="empty-state">${t('sales_noItemSalesYet')}</div>`;
  } else {
    bsWrap.innerHTML = `
      <table>
        <thead><tr><th>${t('th_item')}</th><th class="num">${t('th_qty')}</th><th class="num">${t('th_revenue')}</th></tr></thead>
        <tbody>${bestList.map(([name,d])=>`<tr><td>${escapeHTML(name)}</td><td class="num">${d.qty}</td><td class="num">${fmtMoney(d.revenue)}</td></tr>`).join('')}</tbody>
      </table>
    `;
  }

  // Payment breakdown
  const modeTotals = {};
  live.forEach(b=>(b.payments||[]).forEach(p=>{ modeTotals[p.mode] = (modeTotals[p.mode]||0)+p.amount; }));
  const pbWrap = document.getElementById('paymentBreakdownWrap');
  const modeEntries = Object.entries(modeTotals);
  if(modeEntries.length===0){
    pbWrap.innerHTML = `<div class="empty-state">${t('sales_noPaymentsRecorded')}</div>`;
  } else {
    pbWrap.innerHTML = modeEntries.map(([mode,amt])=>`
      <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px;">
        <span>${escapeHTML(dv(mode))}</span><span>${fmtMoney(amt)}</span>
      </div>
    `).join('');
  }
}

async function viewBillDetail(billId){
  const bill = await dbGet('bills', billId);
  if(bill) showInvoiceModal(bill);
}

/* ---------- Cancel a bill ----------
   A mis-keyed bill used to be uncorrectable: Return/Exchange assumes the goods come back,
   so a wrong amount stayed in the day book, P&L and GST returns forever. Cancelling keeps
   the invoice number (so the series has no holes an auditor would query), puts the stock
   back, undoes the customer's credit / points / store credit, and takes the bill out of
   every total. It is deliberately not a delete — the record stays, marked and dated. */

async function billHasReturns(billId){
  const allReturns = await dbGetAll('returns');
  return allReturns.some(r=>r.billId===billId);
}

function openCancelBillModal(billId){
  requireOwnerApproval(t('sales_cancelBillBtn'), ()=>doOpenCancelBillModal(billId));
}

async function doOpenCancelBillModal(billId){
  const bill = await dbGet('bills', billId);
  if(!bill) return;
  if(bill.cancelled){ toast(t('toast_billAlreadyCancelled'),'error'); return; }
  if(await billHasReturns(billId)){ toast(t('toast_cannotCancelHasReturns'),'error'); return; }

  const customer = bill.customerId ? await dbGet('customers', bill.customerId) : null;
  const effects = [];
  const totalQty = (bill.items||[]).reduce((n,it)=>n+Number(it.qty||0),0);
  if(totalQty>0) effects.push(t('cancel_effectStock').replace('{0}', totalQty));
  if(customer){
    if(bill.creditAmount>0) effects.push(t('cancel_effectCredit').replace('{0}', fmtMoney(bill.creditAmount)).replace('{1}', customer.name));
    if(bill.pointsEarned>0) effects.push(t('cancel_effectPointsEarned').replace('{0}', bill.pointsEarned));
    if(bill.pointsRedeemed>0) effects.push(t('cancel_effectPointsRedeemed').replace('{0}', bill.pointsRedeemed));
    const scUsed = storeCreditUsedOnBill(customer, billId);
    if(scUsed>0) effects.push(t('cancel_effectStoreCredit').replace('{0}', fmtMoney(scUsed)));
  }
  const paidTotal = (bill.payments||[]).reduce((n,p)=>n+Number(p.amount||0),0);
  if(paidTotal>0) effects.push(t('cancel_effectRefund').replace('{0}', fmtMoney(paidTotal)));

  openModal({
    title: t('cancel_modalTitle').replace('{0}', bill.invoiceNo),
    bodyHTML: `
      <p style="font-size:13.5px;margin-top:0;">${t('cancel_intro')}</p>
      <div class="stat-tiles" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px;">
        <div class="stat-tile"><div class="label">${t('th_invoice')}</div><div class="value small">${escapeHTML(bill.invoiceNo)}</div></div>
        <div class="stat-tile"><div class="label">${t('th_date')}</div><div class="value small">${fmtDate(bill.date)}</div></div>
        <div class="stat-tile"><div class="label">${t('bill_grandTotal')}</div><div class="value small">${fmtMoney(bill.grandTotal)}</div></div>
      </div>
      <h3 class="sub-title">${t('cancel_whatHappens')}</h3>
      <ul style="font-size:13px;margin:0 0 12px;padding-left:20px;">
        ${effects.map(e=>`<li>${escapeHTML(e)}</li>`).join('') || `<li>${escapeHTML(t('cancel_effectNone'))}</li>`}
      </ul>
      <div class="field">
        <label>${t('cancel_reasonLabel')}</label>
        <input id="cb_reason" placeholder="${t('cancel_reasonPlaceholder')}" maxlength="120">
      </div>
      <div id="cb_error" class="muted" style="font-size:12px;color:var(--red);"></div>
    `,
    footerHTML: `
      <button class="btn btn-outline" onclick="closeModal()">${t('cancel_keepBillBtn')}</button>
      <button class="btn btn-danger" id="cb_go">${t('cancel_confirmBtn')}</button>
    `,
    onMount: ()=>{
      const go = document.getElementById('cb_go');
      go.addEventListener('click', async ()=>{
        const reason = document.getElementById('cb_reason').value.trim();
        if(!reason){ document.getElementById('cb_error').textContent = t('cancel_errReasonRequired'); return; }
        go.disabled = true;
        await cancelBill(billId, reason);
      });
    }
  });
}

// How much store credit this bill consumed, read back from the customer's ledger — the bill
// itself doesn't store it, and parsing the note would break in Marathi.
function storeCreditUsedOnBill(customer, billId){
  return (customer && customer.ledger || [])
    .filter(l=>l.billId===billId && l.type==='payment' && l.source==='store_credit')
    .reduce((n,l)=>n+Number(l.amount||0), 0);
}

async function cancelBill(billId, reason){
  const bill = await dbGet('bills', billId);
  if(!bill || bill.cancelled) return;

  // 1. Stock back. Match the variant by SKU first — a product's variants can be reordered
  //    after the sale, so the stored index alone is not safe to trust.
  for(const it of (bill.items||[])){
    if(!it.productId) continue;
    const product = await dbGet('products', it.productId);
    if(!product || !product.variants) continue;
    let idx = -1;
    if(it.sku) idx = product.variants.findIndex(v=>v.sku && v.sku===it.sku);
    if(idx < 0 && it.variantIndex!=null && product.variants[it.variantIndex]) idx = it.variantIndex;
    if(idx < 0) continue;
    adjustFirmStock(product.variants[idx], bill.firmId, Number(it.qty||0));
    await dbPut('products', product);
  }

  // 2. Undo everything the sale did to the customer's account.
  if(bill.customerId){
    const customer = await dbGet('customers', bill.customerId);
    if(customer){
      const when = new Date().toISOString();
      const ref = t('cancel_ledgerNote').replace('{0}', bill.invoiceNo);
      if(bill.creditAmount>0){
        customer.creditBalance = Math.max(0, Math.round(((customer.creditBalance||0) - bill.creditAmount)*100)/100);
        customer.ledger = customer.ledger||[];
        customer.ledger.push({date:when, type:'cancellation', amount:-bill.creditAmount, billId, note:ref});
      }
      const scUsed = storeCreditUsedOnBill(customer, billId);
      if(scUsed>0){
        customer.storeCredit = Math.round(((customer.storeCredit||0) + scUsed)*100)/100;
        customer.ledger = customer.ledger||[];
        customer.ledger.push({date:when, type:'cancellation', amount:scUsed, billId, note:ref});
      }
      if(bill.pointsEarned>0 || bill.pointsRedeemed>0){
        customer.pointsLedger = customer.pointsLedger||[];
        const net = Number(bill.pointsRedeemed||0) - Number(bill.pointsEarned||0);
        customer.loyaltyPoints = Math.max(0, (customer.loyaltyPoints||0) + net);
        customer.pointsLedger.push({date:when, type:'cancel', points:net, billId, note:ref});
      }
      await dbPut('customers', customer);
    }
  }

  // 3. Mark the bill. Never deleted — the invoice number stays in the series.
  bill.cancelled = true;
  bill.cancelledAt = new Date().toISOString();
  bill.cancelReason = reason;
  bill.cancelledBy = (typeof CURRENT_USER!=='undefined' && CURRENT_USER) ? CURRENT_USER.name : t('staff_ownerTag');
  await dbPut('bills', bill);

  closeModal();
  toast(t('toast_billCancelled').replace('{0}', bill.invoiceNo), 'success');
  if(typeof renderSalesData==='function') await renderSalesData();
  await refreshLowStockBadge();
}

/* ---------- Returns / Exchange ---------- */
async function returnedQtyByItem(billId){
  const allReturns = await scopedGetAll('returns');
  const map = {};
  allReturns.filter(r=>r.billId===billId).forEach(r=>{
    (r.items||[]).forEach(it=>{
      map[it.itemIndex] = (map[it.itemIndex]||0) + it.qty;
    });
  });
  return map;
}

const RETURN_REASONS = ['Defective / Damaged','Wrong Size or Fit','Wrong Color','Wrong Item Delivered','Changed Mind','Other'];

async function openReturnModal(billId){
  const bill = await dbGet('bills', billId);
  if(!bill) return;
  const alreadyReturned = await returnedQtyByItem(billId);
  let customer = null;
  if(bill.customerId) customer = await dbGet('customers', bill.customerId);

  const rowsHTML = bill.items.map((it,i)=>{
    const returned = alreadyReturned[i]||0;
    const maxQty = it.qty - returned;
    const variant = [it.size,it.color].filter(Boolean).join('/');
    return `
      <div class="row" style="align-items:center;border-bottom:1px solid var(--line);padding:8px 0;">
        <div class="col" style="min-width:160px;">
          <strong style="font-size:13px;">${escapeHTML(it.name)}</strong>${variant?` <span class="muted" style="font-size:11px;">(${escapeHTML(variant)})</span>`:''}<br>
          <span class="muted" style="font-size:11px;">Sold ${it.qty} · ${fmtMoney(it.rate)} each${returned>0?` · ${returned} already returned`:''}</span>
        </div>
        <div class="col field" style="max-width:100px;">
          <label style="font-size:11px;">Return Qty</label>
          <input type="number" min="0" max="${maxQty}" value="0" data-i="${i}" class="returnQtyInput" ${maxQty<=0?'disabled':''}>
        </div>
      </div>
    `;
  }).join('');

  const canRedeemBack = SETTINGS.loyaltyEnabled && customer && bill.pointsEarned>0;

  const daysSince = Math.floor((Date.now() - new Date(bill.date).getTime()) / 86400000);
  const periodDays = SETTINGS.returnPeriodDays!=null ? SETTINGS.returnPeriodDays : 30;
  const outsidePolicy = periodDays>0 && daysSince>periodDays;
  const needsOverride = outsidePolicy && !isOwner();

  openModal({
    title: t('modal_returnExchangePrefix') + bill.invoiceNo,
    bodyHTML: `
      <p class="muted" style="font-size:12px;">${t('sales_returnInstructions')}</p>
      ${outsidePolicy ? `<div class="tag tag-amber" style="display:block;margin-bottom:10px;padding:8px 10px;font-size:12px;">
        This bill was purchased ${daysSince} day(s) ago — outside the ${periodDays}-day return policy.
        ${needsOverride ? t('sales_ownerApprovalNote') : ''}
      </div>` : ''}
      <div id="returnRowsWrap">${rowsHTML}</div>
      <div id="returnSummaryWrap" style="margin-top:10px;font-size:13.5px;font-weight:700;"></div>
      <div class="row" style="margin-top:8px;">
        <div class="col field">
          <label>${t('sales_reasonForReturnLabel')}</label>
          <select id="returnReason">
            <option value="">${t('sales_selectReasonPlaceholder')}</option>
            ${RETURN_REASONS.map(r=>`<option value="${escapeHTML(r)}">${escapeHTML(dv(r))}</option>`).join('')}
          </select>
        </div>
        <div class="col field">
          <label>${t('sales_noteOptionalLabel')}</label>
          <input id="returnNote" placeholder="${t('sales_anyExtraDetailPlaceholder')}">
        </div>
      </div>
      ${bill.customerId ? `
      <div class="field" style="margin-top:4px;">
        <label>${t('sales_settleRefundAsLabel')}</label>
        <select id="returnSettleMode">
          ${bill.creditAmount>0?`<option value="reduce_credit">${t('sales_settleReduceCreditBalance')}</option>`:''}
          <option value="cash">${t('sales_settleCashNoLedgerChange')}</option>
          <option value="store_credit">${t('sales_settleStoreCredit')}</option>
        </select>
      </div>` : `<p class="muted" style="font-size:11.5px;">${t('sales_walkInSaleRefundNote')}</p>`}
      <p class="muted" style="font-size:11px;">${canRedeemBack? t('sales_loyaltyPointsReducedNote') : ''}</p>
    `,
    footerHTML: `
      <button class="btn btn-outline" onclick="closeModal()">${t('acct_cancelBtn')}</button>
      <button class="btn btn-primary" id="confirmReturnBtn" disabled>${t('sales_processReturnBtn')}</button>
      <button class="btn btn-gold" id="exchangeBtn" disabled>${t('sales_processStartExchangeBtn')}</button>
    `,
    onMount: ()=>{
      const recalcSummary = ()=>{
        let refund = 0, anyQty = false;
        document.querySelectorAll('.returnQtyInput').forEach(inp=>{
          const i = parseInt(inp.dataset.i);
          const qty = Math.max(0, parseInt(inp.value)||0);
          if(qty>0) anyQty = true;
          const it = bill.items[i];
          const lineNet = it.qty*it.rate - itemDiscountAmount(it);
          const perUnit = it.qty>0 ? lineNet/it.qty : 0;
          const base = perUnit*qty;
          const tax = it.taxInclusive ? 0 : base*(it.taxRate||0)/100;
          refund += base+tax;
        });
        const reasonChosen = !!document.getElementById('returnReason').value;
        document.getElementById('returnSummaryWrap').textContent = t('sales_refundAmountPrefix') + fmtMoney(refund);
        document.getElementById('confirmReturnBtn').disabled = !anyQty || !reasonChosen;
        document.getElementById('exchangeBtn').disabled = !anyQty || !reasonChosen;
        return refund;
      };
      document.querySelectorAll('.returnQtyInput').forEach(inp=>inp.addEventListener('input', recalcSummary));
      document.getElementById('returnReason').addEventListener('change', recalcSummary);
      recalcSummary();

      // Captures everything the return needs from the currently-open form. Called BEFORE any
      // owner-approval prompt might replace this modal's DOM, so processReturn never has to
      // re-query form fields that could already be gone by the time it actually runs.
      const captureReturnInput = ()=>{
        const refund = recalcSummary();
        const items = [];
        for(const inp of document.querySelectorAll('.returnQtyInput')){
          const i = parseInt(inp.dataset.i);
          const qty = Math.max(0, parseInt(inp.value)||0);
          if(qty<=0) continue;
          const it = bill.items[i];
          const lineNet = it.qty*it.rate - itemDiscountAmount(it);
          const perUnit = it.qty>0 ? lineNet/it.qty : 0;
          const base = perUnit*qty;
          const tax = it.taxInclusive ? 0 : base*(it.taxRate||0)/100;
          items.push({itemIndex:i, productId:it.productId, variantIndex:it.variantIndex, name:it.name, size:it.size, color:it.color, qty, refundAmount:base+tax});
        }
        const reason = document.getElementById('returnReason').value;
        const note = document.getElementById('returnNote').value.trim();
        const settleMode = bill.customerId ? document.getElementById('returnSettleMode').value : 'cash';
        return {refund, items, reason, note, settleMode};
      };

      const processReturn = async (startExchange, captured)=>{
        const {refund, items, reason, note, settleMode} = captured;
        if(items.length===0) return;

        // Restock — back into the firm that made the original sale, so a retail return
        // doesn't quietly pad out wholesale's stock or vice versa.
        const restockFirmId = bill.firmId || firmIdForStockOps();
        for(const it of items){
          const product = await dbGet('products', it.productId);
          if(product && product.variants[it.variantIndex]){
            adjustFirmStock(product.variants[it.variantIndex], restockFirmId, it.qty);
            await dbPut('products', product);
          }
        }

        const returnRec = {
          billId, date:new Date().toISOString(), items, totalRefund:refund, settleMode, reason, note,
          outsidePolicy, approvedByOwner: outsidePolicy ? true : undefined,
          firmId: restockFirmId
        };
        await dbAdd('returns', returnRec);

        if(customer){
          let changed = false;
          // For a straight return, settle immediately per the chosen mode. For an exchange,
          // the credit is applied as a discount on the new bill instead (see CART.exchangeCredit
          // below) — settling it here too would refund/credit the customer twice.
          if(!startExchange){
            if(settleMode==='reduce_credit'){
              customer.creditBalance = Math.max(0, (customer.creditBalance||0) - refund);
              customer.ledger = customer.ledger||[];
              customer.ledger.push({date:returnRec.date, type:'payment', amount:refund, mode:'Store Credit', source:'return_credit', note:'Return credit against '+bill.invoiceNo});
              changed = true;
            } else if(settleMode==='store_credit'){
              customer.storeCredit = Math.round(((customer.storeCredit||0) + refund)*100)/100;
              changed = true;
            }
          }
          if(SETTINGS.loyaltyEnabled && bill.pointsEarned>0 && bill.grandTotal>0){
            const reversePts = Math.round(bill.pointsEarned * (refund/bill.grandTotal));
            if(reversePts>0){
              customer.loyaltyPoints = Math.max(0, (customer.loyaltyPoints||0)-reversePts);
              customer.pointsLedger = customer.pointsLedger||[];
              customer.pointsLedger.push({date:returnRec.date, type:'redeem', points:reversePts, billId, note:'Reversed for return on '+bill.invoiceNo});
              changed = true;
            }
          }
          if(changed) await dbPut('customers', customer);
        }

        closeModal();
        toast(t('toast_returnProcessedRefunded').replace('{0}', fmtMoney(refund)),'success');
        await renderSalesData();
        await refreshLowStockBadge();

        if(startExchange){
          emptyCart();
          if(bill.customerId) CART.customerId = bill.customerId;
          CART.exchangeCredit = refund;
          CART.exchangeSettleMode = settleMode==='store_credit' ? 'store_credit' : 'cash';
          CART.overallDiscount = refund;
          showView('billing');
          setTimeout(()=>toast(t('toast_exchangeStarted').replace('{0}',fmtMoney(refund)), 'success'), 400);
        }
      };
      const doReturn = (startExchange)=>{
        const captured = captureReturnInput();
        if(captured.items.length===0) return;
        if(needsOverride){
          requireOwnerApproval(t('sales_ownerApprovalReturnOutsidePolicy'), ()=>processReturn(startExchange, captured));
        } else {
          processReturn(startExchange, captured);
        }
      };
      document.getElementById('confirmReturnBtn').addEventListener('click', ()=>doReturn(false));
      document.getElementById('exchangeBtn').addEventListener('click', ()=>doReturn(true));
    }
  });
}

// "Return without bill" — lets the shop process a return/exchange for a customer who
// doesn't have their invoice, gated behind Owner approval since there's no bill to verify against.
function openNoBillReturnModal(){
  if(!requireWorkingFirm(t('action_processReturn'))) return;
  requireOwnerApproval(t('sales_ownerApprovalNoBillReturn'), async ()=>{
    const [products, customers] = await Promise.all([scopedGetAll('products'), scopedGetAll('customers')]);
    products.sort((a,b)=>a.name.localeCompare(b.name));
    customers.sort((a,b)=>a.name.localeCompare(b.name));
    let rowCount = 0;
    const rowHTML = (idx)=>`
      <div class="row nbr-row" data-idx="${idx}" style="align-items:flex-end;margin-bottom:6px;">
        <div class="col field">
          <label style="font-size:11px;">${t('vendor_labelProduct')}</label>
          <select class="nbr-product">${products.map(p=>`<option value="${p.id}">${escapeHTML(p.name)}</option>`).join('')}</select>
        </div>
        <div class="col field" style="max-width:140px;">
          <label style="font-size:11px;">${t('vendor_labelVariant')}</label>
          <select class="nbr-variant"></select>
        </div>
        <div class="col field" style="max-width:80px;">
          <label style="font-size:11px;">${t('vendor_labelQty')}</label>
          <input type="number" class="nbr-qty" min="1" value="1">
        </div>
        <div class="col field" style="max-width:100px;">
          <label style="font-size:11px;">${t('sales_priceRupeeLabel')}</label>
          <input type="number" class="nbr-price" min="0" step="0.01" value="0">
        </div>
        <div class="col" style="flex:0 0 auto;"><button type="button" class="btn btn-outline btn-sm nbr-remove">✕</button></div>
      </div>
    `;

    openModal({
      title:t('modal_returnWithoutBill'),
      bodyHTML:`
        <p class="muted" style="font-size:12px;">${t('sales_ownerApprovedManualReturnNote')}</p>
        <div class="field">
          <label>${t('sales_customerOptionalLabel')}</label>
          <select id="nbr_customer">
            <option value="">${t('sales_walkInNoCustomerRecordOption')}</option>
            ${customers.map(c=>`<option value="${c.id}">${escapeHTML(c.name)}${c.phone?' ('+escapeHTML(c.phone)+')':''}</option>`).join('')}
          </select>
        </div>
        <div id="nbrRowsWrap"></div>
        <button type="button" class="btn btn-outline btn-sm" id="nbr_addRow">${t('inv_addItemBtn')}</button>
        <div class="row" style="margin-top:10px;">
          <div class="col field">
            <label>${t('sales_reasonForReturnLabel')}</label>
            <select id="nbr_reason">
              <option value="">${t('sales_selectReasonPlaceholder')}</option>
              ${RETURN_REASONS.map(r=>`<option value="${escapeHTML(r)}">${escapeHTML(dv(r))}</option>`).join('')}
              <option value="No bill available">${t('sales_reasonNoBillAvailable')}</option>
            </select>
          </div>
          <div class="col field">
            <label>${t('sales_noteOptionalLabel')}</label>
            <input id="nbr_note" placeholder="${t('sales_anyExtraDetailPlaceholder')}">
          </div>
        </div>
        <div id="nbr_customerSettle"></div>
        <div id="nbrSummaryWrap" style="margin-top:10px;font-size:13.5px;font-weight:700;"></div>
      `,
      footerHTML:`
        <button class="btn btn-outline" onclick="closeModal()">${t('acct_cancelBtn')}</button>
        <button class="btn btn-primary" id="nbr_save" disabled>${t('sales_processReturnBtn')}</button>
      `,
      onMount:()=>{
        const wrap = document.getElementById('nbrRowsWrap');
        const populateVariants = (rowEl)=>{
          const pid = parseInt(rowEl.querySelector('.nbr-product').value);
          const product = products.find(p=>p.id===pid);
          const variantSel = rowEl.querySelector('.nbr-variant');
          variantSel.innerHTML = (product.variants||[]).map((v,i)=>{
            const label = [v.size,v.color].filter(Boolean).join('/') || v.sku || (t('inv_variantFallbackPrefix')+(i+1));
            return `<option value="${i}">${escapeHTML(label)}</option>`;
          }).join('');
          const vi = parseInt(variantSel.value)||0;
          const variant = product.variants[vi];
          if(variant) rowEl.querySelector('.nbr-price').value = variant.sellPrice||0;
        };
        const addRow = ()=>{
          const idx = rowCount++;
          const div = document.createElement('div');
          div.innerHTML = rowHTML(idx);
          wrap.appendChild(div.firstElementChild);
          const rowEl = wrap.querySelector(`.nbr-row[data-idx="${idx}"]`);
          if(products.length===0) return;
          populateVariants(rowEl);
          rowEl.querySelector('.nbr-product').addEventListener('change', ()=>{ populateVariants(rowEl); recalc(); });
          rowEl.querySelector('.nbr-variant').addEventListener('change', ()=>{ populateVariants(rowEl); recalc(); });
          rowEl.querySelectorAll('.nbr-qty,.nbr-price').forEach(inp=>inp.addEventListener('input', recalc));
          rowEl.querySelector('.nbr-remove').addEventListener('click', ()=>{ rowEl.remove(); recalc(); });
          recalc();
        };
        const customerSelect = document.getElementById('nbr_customer');
        const renderSettleOptions = ()=>{
          const custId = customerSelect.value ? parseInt(customerSelect.value) : null;
          const wrap2 = document.getElementById('nbr_customerSettle');
          if(!custId){ wrap2.innerHTML = `<p class="muted" style="font-size:11.5px;">${t('sales_noCustomerRefundCashNote')}</p>`; return; }
          wrap2.innerHTML = `
            <div class="field" style="margin-top:4px;">
              <label>${t('sales_settleRefundAsLabel')}</label>
              <select id="nbr_settle">
                <option value="cash">${t('sales_settleCashNow')}</option>
                <option value="store_credit">${t('sales_settleStoreCredit')}</option>
                <option value="reduce_credit">${t('sales_settleReduceCreditBalance')}</option>
              </select>
            </div>
          `;
        };
        customerSelect.addEventListener('change', renderSettleOptions);
        renderSettleOptions();

        const recalc = ()=>{
          let total = 0, anyRow = false;
          wrap.querySelectorAll('.nbr-row').forEach(rowEl=>{
            const qty = Math.max(0, parseInt(rowEl.querySelector('.nbr-qty').value)||0);
            const price = Math.max(0, parseFloat(rowEl.querySelector('.nbr-price').value)||0);
            if(qty>0 && price>=0){ total += qty*price; anyRow = true; }
          });
          document.getElementById('nbrSummaryWrap').textContent = t('sales_refundAmountPrefix') + fmtMoney(total);
          const reasonChosen = !!document.getElementById('nbr_reason').value;
          document.getElementById('nbr_save').disabled = !anyRow || !reasonChosen;
          return total;
        };
        document.getElementById('nbr_reason').addEventListener('change', recalc);
        document.getElementById('nbr_addRow').addEventListener('click', addRow);
        if(products.length>0) addRow(); else toast(t('toast_addProductFirst'),'error');

        document.getElementById('nbr_save').addEventListener('click', async ()=>{
          const total = recalc();
          const items = [];
          for(const rowEl of wrap.querySelectorAll('.nbr-row')){
            const pid = parseInt(rowEl.querySelector('.nbr-product').value);
            const vi = parseInt(rowEl.querySelector('.nbr-variant').value);
            const qty = Math.max(0, parseInt(rowEl.querySelector('.nbr-qty').value)||0);
            const price = Math.max(0, parseFloat(rowEl.querySelector('.nbr-price').value)||0);
            if(qty<=0) continue;
            const product = products.find(p=>p.id===pid);
            const variant = product.variants[vi];
            items.push({productId:pid, variantIndex:vi, name:product.name, size:variant.size, color:variant.color, qty, refundAmount:qty*price});
          }
          if(items.length===0) return;
          const reason = document.getElementById('nbr_reason').value;
          const note = document.getElementById('nbr_note').value.trim();
          const custId = customerSelect.value ? parseInt(customerSelect.value) : null;
          const settleMode = custId ? document.getElementById('nbr_settle').value : 'cash';

          for(const it of items){
            const product = await dbGet('products', it.productId);
            if(product && product.variants[it.variantIndex]){
              adjustFirmStock(product.variants[it.variantIndex], firmIdForStockOps(), it.qty);
              await dbPut('products', product);
            }
          }

          const returnRec = {
            billId:null, manualEntry:true, approvedBy:(typeof CURRENT_USER!=='undefined' && CURRENT_USER)?CURRENT_USER.name:'Owner',
            date:new Date().toISOString(), items, totalRefund:total, settleMode, reason, note, customerId:custId,
            firmId: firmIdForStockOps()
          };
          await dbAdd('returns', returnRec);

          if(custId){
            const customer = await dbGet('customers', custId);
            if(customer){
              if(settleMode==='reduce_credit'){
                customer.creditBalance = Math.max(0, (customer.creditBalance||0) - total);
                customer.ledger = customer.ledger||[];
                customer.ledger.push({date:returnRec.date, type:'payment', amount:total, mode:'Store Credit', source:'return_credit', note:'Return credit (no bill)'});
              } else if(settleMode==='store_credit'){
                customer.storeCredit = Math.round(((customer.storeCredit||0) + total)*100)/100;
              }
              await dbPut('customers', customer);
            }
          }

          closeModal();
          toast(t('toast_returnProcessedRefunded').replace('{0}', fmtMoney(total)),'success');
          await renderSalesData();
          await refreshLowStockBadge();
        });
      }
    });
  });
}
</script>

<!-- MODULE:PURCHASES (Purchase Orders, Purchase Invoices, Purchase Returns, Purchase Reports —
     lives under Requirements > these subtabs, alongside the existing Suppliers & reorder tools) -->
<script>
let PO_STATE = {filter:'all'};

/* ---- Purchase Orders ---- */
async function renderPurchaseOrdersTab(){
  const wrap = document.getElementById('reqSubtabContent');
  wrap.innerHTML = `
    <div class="row" style="margin-bottom:12px;align-items:flex-end;">
      <div class="col" style="max-width:200px;">
        <label>${t('alter_statusLabel')}</label>
        <select id="poFilterSelect">
          <option value="all">${t('alter_filterAll')}</option>
          <option value="draft">${t('vendor_statusDraft')}</option>
          <option value="sent">${t('vendor_statusSent')}</option>
          <option value="received">${t('vendor_statusReceived')}</option>
          <option value="cancelled">${t('vendor_statusCancelled')}</option>
        </select>
      </div>
      <div class="col" style="flex:0 0 auto;">
        <button class="btn btn-primary" id="addPOBtn">${t('vendor_newPurchaseOrderBtn')}</button>
      </div>
    </div>
    <div class="card" id="poTableWrap"></div>
  `;
  document.getElementById('poFilterSelect').value = PO_STATE.filter;
  document.getElementById('poFilterSelect').addEventListener('change', (e)=>{ PO_STATE.filter = e.target.value; renderPOTable(); });
  document.getElementById('addPOBtn').addEventListener('click', ()=>openPOModal());
  await renderPOTable();
}

async function renderPOTable(){
  const wrap = document.getElementById('poTableWrap');
  let pos = await scopedGetAll('purchaseOrders');
  const suppliers = await scopedGetAll('suppliers');
  const supplierName = (id)=> (suppliers.find(s=>s.id===id)||{}).name || t('vendor_unknownSupplier');
  if(PO_STATE.filter!=='all') pos = pos.filter(p=>p.status===PO_STATE.filter);
  pos.sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(pos.length===0){
    wrap.innerHTML = `<div class="empty-state">No purchase orders${PO_STATE.filter!=='all'?' with this status':''} yet.</div>`;
    return;
  }
  const statusTag = (s)=>({
    draft:'<span class="tag">Draft</span>',
    sent:'<span class="tag tag-amber">Sent</span>',
    received:'<span class="tag tag-green">Received</span>',
    cancelled:'<span class="tag tag-red">Cancelled</span>'
  }[s]||s);
  wrap.innerHTML = `
    <table>
      <thead><tr><th>${t('th_poHash')}</th><th>${t('th_date')}</th><th>${t('th_supplier')}</th><th class="num">${t('th_items')}</th><th>${t('th_status')}</th><th>${t('th_actions')}</th></tr></thead>
      <tbody>
        ${pos.map(po=>`
          <tr>

async function openPOModal(poId){

  let rowCount = 0;
  const rowHTML = (idx, item)=>`
    <div class="row po-row" data-idx="${idx}" style="align-items:flex-end;margin-bottom:6px;">
      <div class="col field">
        <label style="font-size:11px;">${t('vendor_labelProduct')}</label>
        <select class="po-product">${products.map(p=>`<option value="${p.id}" ${item&&item.productId===p.id?'selected':''}>${escapeHTML(p.name)}</option>`).join('')}</select>
      </div>
      <div class="col field" style="max-width:140px;">
        <label style="font-size:11px;">${t('vendor_labelVariant')}</label>
        <select class="po-variant"></select>
      </div>
      <div class="col field" style="max-width:80px;">
        <label style="font-size:11px;">${t('vendor_labelQty')}</label>
        <input type="number" class="po-qty" min="1" value="${item?item.qty:1}">
      </div>
      <div class="col field" style="max-width:100px;">
        <label style="font-size:11px;">${t('vendor_labelRateRupee')}</label>
        <input type="number" class="po-rate" min="0" step="0.01" value="${item?item.rate:0}">
      </div>
      <div class="col" style="flex:0 0 auto;"><button type="button" class="btn btn-outline btn-sm po-remove">✕</button></div>
    </div>
  `;

  openModal({
    title: po?(t('modal_editPOPrefix')+po.poNumber):t('modal_newPO'),
    bodyHTML:`
      <div class="field">
        <label>${t('vendor_supplierRequiredLabel')}</label>
        <select id="po_supplier">
          <option value="">${t('vendor_selectSupplierPlaceholder')}</option>
          ${suppliers.map(s=>`<option value="${s.id}" ${po&&po.supplierId===s.id?'selected':''}>${escapeHTML(s.name)}</option>`).join('')}
        </select>
      </div>
      <div id="poRowsWrap"></div>
      <button type="button" class="btn btn-outline btn-sm" id="po_addRow">${t('inv_addItemBtn')}</button>
      <div class="field" style="margin-top:8px;"><label>${t('vendor_notesOptionalLabel')}</label><input id="po_notes" value="${po?escapeHTML(po.notes||''):''}"></div>
      <div id="poSummaryWrap" style="margin-top:10px;font-size:13.5px;font-weight:700;"></div>
    `,
    footerHTML:`
      <button class="btn btn-outline" onclick="closeModal()">${t('acct_cancelBtn')}</button>
      <button class="btn btn-outline" id="po_saveDraft">${t('vendor_saveAsDraftBtn')}</button>
      <button class="btn btn-primary" id="po_saveSent">${t('vendor_saveMarkSentBtn')}</button>
    `,
    onMount:()=>{
      const wrap = document.getElementById('poRowsWrap');
      const buildVariantOptions = (rowEl, presetVi)=>{
        const pid = parseInt(rowEl.querySelector('.po-product').value);
        const product = products.find(p=>p.id===pid);
        const variantSel = rowEl.querySelector('.po-variant');
        variantSel.innerHTML = (product.variants||[]).map((v,i)=>{
          const label = [v.size,v.color].filter(Boolean).join('/') || v.sku || (t('inv_variantFallbackPrefix')+(i+1));
          return `<option value="${i}" ${presetVi===i?'selected':''}>${escapeHTML(label)}</option>`;
        }).join('');
      };
      const applyDefaultRate = (rowEl)=>{
        const pid = parseInt(rowEl.querySelector('.po-product').value);
        const product = products.find(p=>p.id===pid);
        const vi = parseInt(rowEl.querySelector('.po-variant').value)||0;
        const variant = product.variants[vi];
        if(variant) rowEl.querySelector('.po-rate').value = variant.costPrice||0;
      };
      const addRow = (item)=>{
        const idx = rowCount++;
        const div = document.createElement('div');
        div.innerHTML = rowHTML(idx, item);
        const rowEl = div.firstElementChild;
        wrap.appendChild(rowEl);
        buildVariantOptions(rowEl, item?item.variantIndex:null);
        if(!item) applyDefaultRate(rowEl);
        rowEl.querySelector('.po-product').addEventListener('change', ()=>{ buildVariantOptions(rowEl, null); applyDefaultRate(rowEl); recalc(); });
        rowEl.querySelector('.po-variant').addEventListener('change', ()=>{ applyDefaultRate(rowEl); recalc(); });
        rowEl.querySelectorAll('.po-qty,.po-rate').forEach(inp=>inp.addEventListener('input', recalc));
        rowEl.querySelector('.po-remove').addEventListener('click', ()=>{ rowEl.remove(); recalc(); });
        recalc();
      };
      const recalc = ()=>{
        let total = 0;
        wrap.querySelectorAll('.po-row').forEach(rowEl=>{
          const qty = Math.max(0, parseInt(rowEl.querySelector('.po-qty').value)||0);
          const rate = Math.max(0, parseFloat(rowEl.querySelector('.po-rate').value)||0);
          total += qty*rate;
        });
        document.getElementById('poSummaryWrap').textContent = t('vendor_estimatedTotalPrefix') + fmtMoney(total);
      };
      if(po && po.items && po.items.length) po.items.forEach(it=>addRow(it));
      else addRow();
      document.getElementById('po_addRow').addEventListener('click', ()=>addRow());

      const collectItems = ()=>{
        const items = [];
        wrap.querySelectorAll('.po-row').forEach(rowEl=>{
          const pid = parseInt(rowEl.querySelector('.po-product').value);
          const vi = parseInt(rowEl.querySelector('.po-variant').value);
          const qty = Math.max(0, parseInt(rowEl.querySelector('.po-qty').value)||0);
          const rate = Math.max(0, parseFloat(rowEl.querySelector('.po-rate').value)||0);
          if(qty<=0) return;
          const product = products.find(p=>p.id===pid);
          const variant = product.variants[vi];
          const variantLabel = [variant.size,variant.color].filter(Boolean).join('/') || variant.sku || '';
          items.push({productId:pid, variantIndex:vi, productName:product.name, variantLabel, qty, rate});
        });
        return items;
      };

      const savePO = async (status)=>{
        const supplierId = document.getElementById('po_supplier').value ? parseInt(document.getElementById('po_supplier').value) : null;
        if(!supplierId){ toast(t('toast_selectSupplier'),'error'); return; }
        const items = collectItems();
        if(items.length===0){ toast(t('toast_addAtLeastOneItem'),'error'); return; }
        const notes = document.getElementById('po_notes').value.trim();
        if(po){
          po.supplierId = supplierId; po.items = items; po.notes = notes; po.status = status;
          await dbPut('purchaseOrders', po);
        } else {
          const newId = await dbAdd('purchaseOrders', {supplierId, items, notes, status, date:new Date().toISOString(), firmId: firmIdForStockOps()});
          const fresh = await dbGet('purchaseOrders', newId);
          fresh.poNumber = 'PO-' + String(newId).padStart(4,'0');
          await dbPut('purchaseOrders', fresh);
        }
        closeModal();
        toast(t('toast_poSaved'),'success');
        await renderPOTable();
      };
      document.getElementById('po_saveDraft').addEventListener('click', ()=>savePO('draft'));
      document.getElementById('po_saveSent').addEventListener('click', ()=>savePO('sent'));
    }
  });
}

// Backward-compatible helpers: invoices saved before the payment-tracking upgrade only have paidNow.

/* ===== Strict supplier records =====
   Every purchase / payment / adjustment / return is stamped with the exact time it was entered and who
   entered it. Entries are never edited or deleted: a wrong one is VOIDED (Owner PIN + written reason),
   which keeps the original, marks it VOID and adds a reversal row. */
function r2m(x){ return Math.round((Number(x)||0)*100)/100; }
function stampNow(){ return {at:new Date().toISOString(), by:(typeof CURRENT_USER!=='undefined' && CURRENT_USER) ? CURRENT_USER.name : 'Owner'}; }
function newEntryId(){ return 'E'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function localISODate(d){ d = d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// The supplier's bill date as a stored timestamp. Today (or blank) = the exact moment of entry.
function billDateToISO(v){ if(!v || v>=localISODate()) return new Date().toISOString(); return new Date(v+'T12:00:00').toISOString(); }
function fmtStamp(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString(localeTag(),{day:'2-digit',month:'short',year:'numeric'}) + ', ' + d.toLocaleTimeString(localeTag(),{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function supAudit(supplier, action, detail){
  const s = stampNow();
  supplier.audit = supplier.audit||[];
  supplier.audit.push({at:s.at, by:s.by, action, detail});
}
// Posts one stamped ledger row and moves the vendor's balances. The effect is stored on the row
// (bal / adv) so that a void can undo exactly what this row did.
function supPost(supplier, row, dBal, dAdv){
  const b0 = supplier.balanceDue||0, a0 = supplier.advanceBalance||0;
  supplier.balanceDue = Math.max(0, r2m(b0 + (dBal||0)));
  supplier.advanceBalance = Math.max(0, r2m(a0 + (dAdv||0)));
  const s = stampNow();
  const e = Object.assign({entryId:newEntryId(), at:s.at, by:s.by}, row, {bal:r2m(supplier.balanceDue-b0), adv:r2m(supplier.advanceBalance-a0)});
  supplier.ledger = supplier.ledger||[];
  supplier.ledger.push(e);
  return e;
}
function isVoidable(l){ return !!(l && l.entryId && !l.voided && l.type!=='reversal' && l.type!=='opening' && l.bal!==undefined); }
function ledgerTypeWord(l){
  if(l.type==='purchase') return 'purchase';
  if(l.type==='payment') return 'payment';
  if(l.type==='return') return 'return';
  if(l.type==='adjustment') return 'adjustment';
  return l.type;
}
// Undoes a ledger row's effect and adds a reversal row. Throws if an advance it created was already used.
function reverseLedgerRow(supplier, row, reason){
  const b0 = supplier.balanceDue||0, a0 = supplier.advanceBalance||0;
  let nb = r2m(b0 - (row.bal||0)), na = r2m(a0 - (row.adv||0));
  if(na < -0.005) throw new Error(t('toast_voidAdvanceUsed'));
  if(nb < 0){ na = r2m(na - nb); nb = 0; }      // paid more than is now owed: the surplus becomes the vendor's advance
  if(nb > 0.004 && na > 0.004){ const m = Math.min(nb, na); nb = r2m(nb - m); na = r2m(na - m); }   // owed and advance cancel out
  supplier.balanceDue = nb; supplier.advanceBalance = Math.max(0, na);
  const s = stampNow();
  const rev = {entryId:newEntryId(), at:s.at, by:s.by, date:s.at, type:'reversal', direction: isLedgerDebit(row) ? 'credit' : 'debit', amount:row.amount,
    reversalOf:row.entryId, reversalType:ledgerTypeWord(row), invoiceId:row.invoiceId||null, invoiceNo:row.invoiceNo||'',
    note:'VOID of '+ledgerTypeWord(row)+(row.invoiceNo?(' '+row.invoiceNo):'')+' — '+reason,
    bal:r2m(supplier.balanceDue-b0), adv:r2m(supplier.advanceBalance-a0)};
  supplier.ledger.push(rev);
  row.voided = true; row.voidedAt = s.at; row.voidedBy = s.by; row.voidReason = reason; row.reversedBy = rev.entryId;
  return rev;
}
// After anything that changes purchases / payments, re-draw whatever screen is open so it shows up everywhere at once.
async function refreshSupplierSurfaces(){
  try{
    const act = document.querySelector('[id^="view-"].active');
    if(act && typeof showView==='function') showView(act.id.slice(5));
    if(typeof refreshLowStockBadge==='function') await refreshLowStockBadge();
  }catch(e){}
}
function invoicePaid(inv){ return inv.paid!=null ? inv.paid : (inv.paidNow||0); }
function invoiceStatus(inv){
  if(inv.voided) return 'void';
  if(inv.status) return inv.status;
  const paid = invoicePaid(inv);
  return paid<=0.001 ? 'unpaid' : (paid+0.01>=inv.total ? 'paid' : 'partial');
}
function statusTag(status){
  if(status==='void') return `<span class="tag tag-red" style="text-decoration:line-through;">${t('st_voidTag')}</span>`;
  if(status==='paid') return `<span class="tag tag-green">${t('vendor_tagPaidStatus')}</span>`;
  if(status==='partial') return `<span class="tag tag-amber">${t('vendor_tagPartialStatus')}</span>`;
  return `<span class="tag tag-red">${t('vendor_tagUnpaidStatus')}</span>`;
}

        ` : ''}

      `
    });
  });
}

/* Records a vendor purchase for stock that has ALREADY been added to the shelves (by the
   product form or the Adjust Stock screen), so adding stock "from a vendor" always shows up under
   Purchases, in the vendor's ledger and in purchase price history — without adding the stock twice.
   lines: [{productId, variantIndex, qty, rate}] */
function normBillNo(s){ return String(s==null?'':s).trim().replace(/\s+/g,' ').toLowerCase(); }
// Re-works an invoice's GST figures from its items (each item can have its own GST rate).
function recomputeStockBill(inv){
  const r2 = x=>Math.round(x*100)/100;
  const report = inv.gstMode==='report';
  const byRate = {};
  let subtotal = 0;
  (inv.items||[]).forEach(it=>{
    const amt = it.qty*it.rate; subtotal += amt;
    const rate = report ? (it.gstRate!=null ? Number(it.gstRate) : Number(inv.gstRate)||0) : 0;
    byRate[rate] = (byRate[rate]||0) + amt;
  });
  subtotal = r2(subtotal);
  const rates = Object.keys(byRate).map(Number).sort((a,b)=>a-b);
  const splits = rates.map(rt=>({rate:rt, taxable:r2(byRate[rt]), tax:r2(byRate[rt]*rt/100)}));
  const gstAmount = r2(splits.reduce((s,x)=>s+x.tax,0));
  inv.subtotal = subtotal; inv.taxableValue = subtotal; inv.gstAmount = gstAmount;
  inv.gstRate = splits.length ? splits[splits.length-1].rate : 0;
  if(splits.length>1) inv.gstSplits = splits; else delete inv.gstSplits;
  inv.total = r2(subtotal - (inv.discount||0) + (inv.freight||0) + (inv.otherExpenses||0) + gstAmount);
  return inv;
}
async function recordStockPurchase({supplierId, lines, gstMode, gstRate, paidNow, payMode, billNo, billDate}){
  const supplier = await dbGet('suppliers', supplierId);
  if(!supplier || !lines.length) return null;
  const stamp = stampNow();
  const invoiceDate = billDateToISO(billDate);
  const items = [];
  let firmId = null;
  for(const l of lines){
    const product = await dbGet('products', l.productId);
    if(!product || !product.variants[l.variantIndex]) continue;
    const v = product.variants[l.variantIndex];
    if(firmId==null) firmId = product.firmId;
    items.push({productId:l.productId, variantIndex:l.variantIndex, productName:product.name,
      variantLabel:[v.size,v.color].filter(Boolean).join('/') || v.sku || '', qty:l.qty, rate:l.rate, at:stamp.at, by:stamp.by});
  }
  if(!items.length) return null;
  const r2 = r2m;
  const subtotal = r2(items.reduce((s,it)=>s+it.qty*it.rate,0));
  if(subtotal<=0) return null;
  const billKey = normBillNo(billNo);
  const billText = String(billNo==null?'':billNo).trim().replace(/\s+/g,' ');
  const mode2 = payMode || 'Cash';
  const histRows = (invId)=>items.map(it=>({
    productId:it.productId, variantIndex:it.variantIndex, productName:it.productName, variantLabel:it.variantLabel,
    price:it.rate, qty:it.qty, supplierId, supplierName:supplier.name, invoiceId:invId, date:stamp.at}));
  // Same vendor + same supplier bill number = the SAME bill: add these items to it.
  if(billKey){
    const existing = (await dbGetAll('purchaseInvoices')).find(i=>!i.voided && i.supplierId===supplierId && i.source==='stock-entry' && normBillNo(i.billNo)===billKey);
    if(existing){
      const rate0 = existing.gstMode==='report' ? Math.max(0, Number(gstRate)||0) : 0;
      existing.items = (existing.items||[]).map(it=>it.gstRate!=null ? it : Object.assign({}, it, {gstRate: Number(existing.gstRate)||0}));
      items.forEach(it=>{ it.gstRate = rate0; existing.items.push(it); });
      const oldTotal = existing.total, oldPaid = invoicePaid(existing), oldGst = existing.gstAmount||0;
      recomputeStockBill(existing);
      const addedTotal = r2(existing.total - oldTotal), addedGst = r2((existing.gstAmount||0) - oldGst);
      const paid = r2(Math.min(Math.max(0, existing.total - oldPaid), Math.max(0, Number(paidNow)||0)));
      existing.payments = existing.payments || [];
      supPost(supplier, {type:'purchase', date:stamp.at, amount:addedTotal, invoiceId:existing.id, invoiceNo:existing.invoiceNumber, billNo:existing.billNo||'',
        gst:{mode:existing.gstMode, amount:addedGst},
        note:'Added to bill '+(existing.billNo||'')+' ('+existing.invoiceNumber+') — '+items.length+' item line'+(items.length>1?'s':'')}, addedTotal, 0);
      if(paid>0){
        const pr = supPost(supplier, {type:'payment', mode:mode2, date:stamp.at, amount:paid, invoiceId:existing.id, invoiceNo:existing.invoiceNumber,
          note:mode2+' paid at purchase — '+existing.invoiceNumber}, -paid, 0);
        existing.payments.push({entryId:pr.entryId, at:stamp.at, by:stamp.by, date:stamp.at, amount:paid, mode:mode2, reference:'', note:'Paid at purchase'});
      }
      existing.paid = r2(oldPaid + paid); existing.paidNow = existing.paid;
      existing.status = existing.paid<=0.001 ? 'unpaid' : (existing.paid+0.01>=existing.total ? 'paid' : 'partial');
      existing.lastAddedAt = stamp.at; existing.lastAddedBy = stamp.by;
      await dbPut('purchaseInvoices', existing);
      for(const h of histRows(existing.id)) await dbAdd('purchasePriceHistory', h);
      await dbPut('suppliers', supplier);
      existing.__merged = true;
      LAST_STOCK_BILL = {supplierId, billNo:billText, at:Date.now()};
      return existing;
    }
  }
  const mode = gstMode==='report' ? 'report' : 'none';
  const rate = mode==='report' ? Math.max(0, Number(gstRate)||0) : 0;
  items.forEach(it=>{ it.gstRate = rate; });
  const gstAmount = r2(subtotal*rate/100);
  const total = r2(subtotal + gstAmount);
  const paid = r2(Math.min(total, Math.max(0, Number(paidNow)||0)));
  const dueDays = paymentTermsDays(supplier.paymentTerms);
  const newId = await dbAdd('purchaseInvoices', {
    supplierId, poId:null, items, discount:0, freight:0, otherExpenses:0,
    gstMode:mode, gstRate:rate, taxableValue:subtotal, gstAmount,
    subtotal, total, paidNow:paid, paid, payments:[],
    status: paid<=0.001 ? 'unpaid' : (paid+0.01>=total ? 'paid' : 'partial'),
    dueDate: new Date(Date.now()+dueDays*86400000).toISOString(), date:invoiceDate, enteredAt:stamp.at, enteredBy:stamp.by,
    firmId: firmId!=null ? firmId : firmIdForStockOps(), source:'stock-entry', billNo: billText
  });
  const fresh = await dbGet('purchaseInvoices', newId);
  fresh.invoiceNumber = 'PINV-' + String(newId).padStart(4,'0');
  supPost(supplier, {type:'purchase', date:invoiceDate, amount:total, invoiceId:newId, invoiceNo:fresh.invoiceNumber, billNo:billText,
    gst:{mode, rate, amount:gstAmount},
    note:'Invoice '+fresh.invoiceNumber+(billText?(' (bill '+billText+')'):'')+' ('+items.length+' item line'+(items.length>1?'s':'')+')'}, total, 0);
  if(paid>0){
    const pr = supPost(supplier, {type:'payment', mode:mode2, date:stamp.at, amount:paid, invoiceId:newId, invoiceNo:fresh.invoiceNumber,
      note:mode2+' paid at purchase — '+fresh.invoiceNumber}, -paid, 0);
    fresh.payments.push({entryId:pr.entryId, at:stamp.at, by:stamp.by, date:stamp.at, amount:paid, mode:mode2, reference:'', note:'Paid at purchase'});
  }
  await dbPut('purchaseInvoices', fresh);
  for(const h of histRows(newId)) await dbAdd('purchasePriceHistory', h);
  await dbPut('suppliers', supplier);
  if(billKey) LAST_STOCK_BILL = {supplierId, billNo:billText, at:Date.now()};
  return fresh;
}

    `,

        rowEl.querySelector('.pinv-variant').addEventListener('change', ()=>{ applyDefaultRate(rowEl); recalc(); });
        rowEl.querySelectorAll('.pinv-qty,.pinv-rate').forEach(inp=>inp.addEventListener('input', recalc));
        rowEl.querySelector('.pinv-remove').addEventListener('click', ()=>{ rowEl.remove(); recalc(); });
        recalc();
      };
      const recalc = ()=>{
        let subtotal = 0;
        wrap.querySelectorAll('.pinv-row').forEach(rowEl=>{
          const qty = Math.max(0, parseInt(rowEl.querySelector('.pinv-qty').value)||0);
          const rate = Math.max(0, parseFloat(rowEl.querySelector('.pinv-rate').value)||0);
          subtotal += qty*rate;
        });
        const discount = Math.max(0, parseFloat(document.getElementById('pinv_discount').value)||0);
        const freight = Math.max(0, parseFloat(document.getElementById('pinv_freight').value)||0);
        const other = Math.max(0, parseFloat(document.getElementById('pinv_other').value)||0);
        const gstMode = document.getElementById('pinv_gstmode')?.value==='none' ? 'none' : 'report';
        const gstRateWrap = document.getElementById('pinv_gstrateWrap');
        if(gstRateWrap) gstRateWrap.style.display = gstMode==='none' ? 'none' : '';
        const gstHelp = document.getElementById('pinv_gstHelp');
        if(gstHelp) gstHelp.textContent = gstMode==='none' ? t('pu_gstNoneHelp') : t('vendor_gstHelpText');
        const gstRate = gstMode==='none' ? 0 : Math.max(0, parseFloat(document.getElementById('pinv_gstrate')?.value)||0);
        const taxableValue = Math.max(0, subtotal - discount);
        const gstAmount = Math.round(taxableValue * gstRate/100 * 100)/100;
        const total = Math.max(0, taxableValue + freight + other + gstAmount);
        const advanceUse = Math.max(0, parseFloat(document.getElementById('pinv_advanceUse')?.value)||0);
        const paidNow = Math.max(0, parseFloat(document.getElementById('pinv_paidnow')?.value)||0);
        const due = Math.max(0, total - paidNow - advanceUse);
        document.getElementById('pinvSummaryWrap').textContent = `${t('vendor_subtotalPrefix')}${fmtMoney(subtotal)}${gstAmount>0?`  •  GST (${gstRate}%): ${fmtMoney(gstAmount)}`:''}  •  Total: ${fmtMoney(total)}  •  Due after payment: ${fmtMoney(due)}`;
        return {subtotal, discount, freight, other, gstRate, gstMode, taxableValue, gstAmount, total, advanceUse};
      };
      const refreshAdvanceSection = async ()=>{
        const advWrap = document.getElementById('pinvAdvanceWrap');
        const supplierId = document.getElementById('pinv_supplier').value ? parseInt(document.getElementById('pinv_supplier').value) : null;
        if(!supplierId){ advWrap.innerHTML=''; recalc(); return; }
        const supplier = await dbGet('suppliers', supplierId);
        const avail = supplier ? (supplier.advanceBalance||0) : 0;
        if(avail<=0){ advWrap.innerHTML=''; recalc(); return; }
        advWrap.innerHTML = `

            <label>${t('vendor_applyAdvanceBalanceLabel')} <span class="muted" style="font-weight:400;">(${fmtMoney(avail)} available for this supplier)</span></label>
            <div class="row" style="gap:6px;">
              <input id="pinv_advanceUse" type="number" min="0" max="${avail}" step="0.01" value="0" style="flex:1">
              <button type="button" class="btn btn-outline btn-sm" id="pinv_advanceMaxBtn">${t('vendor_useMaxBtn')}</button>
            </div>
          </div>
        `;
        document.getElementById('pinv_advanceUse').addEventListener('input', recalc);
        document.getElementById('pinv_advanceMaxBtn').addEventListener('click', ()=>{
          document.getElementById('pinv_advanceUse').value = avail;
          recalc();
        });
        recalc();
      };
      if(prefill.items && prefill.items.length) prefill.items.forEach(it=>addRow(it));
      else addRow();
      document.getElementById('pinv_addRow').addEventListener('click', ()=>addRow());
      ['pinv_discount','pinv_freight','pinv_other','pinv_gstrate','pinv_gstmode','pinv_paidnow'].forEach(id=>document.getElementById(id).addEventListener('input', recalc));
      document.getElementById('pinv_supplier').addEventListener('change', refreshAdvanceSection);
      refreshAdvanceSection();
      recalc();

      document.getElementById('pinv_save').addEventListener('click', async ()=>{
        const items = [];
        wrap.querySelectorAll('.pinv-row').forEach(rowEl=>{
          const pid = parseInt(rowEl.querySelector('.pinv-product').value);
          const vi = parseInt(rowEl.querySelector('.pinv-variant').value);
          const qty = Math.max(0, parseInt(rowEl.querySelector('.pinv-qty').value)||0);
          const rate = Math.max(0, parseFloat(rowEl.querySelector('.pinv-rate').value)||0);
          if(qty<=0) return;
          const product = products.find(p=>p.id===pid);
          const variant = product.variants[vi];
          const variantLabel = [variant.size,variant.color].filter(Boolean).join('/') || variant.sku || '';
          items.push({productId:pid, variantIndex:vi, productName:product.name, variantLabel, qty, rate});
        });
        if(items.length===0){ toast(t('toast_addAtLeastOneItem'),'error'); return; }
        const {subtotal, discount, freight, other, gstRate, gstMode, taxableValue, gstAmount, total, advanceUse} = recalc();

        const payMode = document.getElementById('pinv_paymode').value;
        const supplierId = document.getElementById('pinv_supplier').value ? parseInt(document.getElementById('pinv_supplier').value) : null;
        const stamp = stampNow();
        const invoiceDate = billDateToISO((document.getElementById('pinv_date')||{}).value);

        if(billNoText && supplierId){
          const dup = (await dbGetAll('purchaseInvoices')).find(i=>!i.voided && i.supplierId===supplierId && normBillNo(i.billNo)===normBillNo(billNoText));
          if(dup){ toast(t('toast_dupBillNo'),'error'); return; }
        }

        const doSave = async ()=>{
          let supplierName = '';
          if(supplierId){
            const supplier = suppliers.find(s=>s.id===supplierId);
            supplierName = supplier ? supplier.name : '';
          }
          for(const it of items){
            const product = await dbGet('products', it.productId);
            if(!product || !product.variants[it.variantIndex]) continue;
            adjustFirmStock(product.variants[it.variantIndex], firmIdForStockOps(), it.qty);
            product.variants[it.variantIndex].costPrice = it.rate;
            await dbPut('products', product);
          }

          const paidTotal = Math.round((paidNow + advanceUse)*100)/100;
          const dueDays = supplierId ? paymentTermsDays((suppliers.find(s=>s.id===supplierId)||{}).paymentTerms) : 0;
          const dueDate = new Date(Date.now() + dueDays*86400000).toISOString();
          const payments = [];
          // Cash purchases have no vendor ledger, so their payment is recorded on the bill itself.
          if(!supplierId){
            if(paidNow>0) payments.push({at:stamp.at, by:stamp.by, date:stamp.at, amount:paidNow, mode:payMode, reference:'', note:'Paid at purchase'});
          }

          const newId = await dbAdd('purchaseInvoices', {
            supplierId, poId: prefill.poId||null, items, discount, freight, otherExpenses:other,
            gstRate, gstMode, taxableValue, gstAmount,
            subtotal, total, paidNow, paid:paidTotal, payments,
            status: paidTotal<=0.001 ? 'unpaid' : (paidTotal+0.01>=total ? 'paid' : 'partial'),
            dueDate, date:invoiceDate, enteredAt:stamp.at, enteredBy:stamp.by, billNo:billNoText, firmId: firmIdForStockOps()
          });
          const fresh = await dbGet('purchaseInvoices', newId);
          fresh.invoiceNumber = 'PINV-' + String(newId).padStart(4,'0');
          await dbPut('purchaseInvoices', fresh);

          for(const it of items){
            await dbAdd('purchasePriceHistory', {
              productId:it.productId, variantIndex:it.variantIndex, productName:it.productName, variantLabel:it.variantLabel,
              price:it.rate, qty:it.qty, supplierId, supplierName, invoiceId:newId, date:invoiceDate
            });
          }

          if(supplierId){
            const supplier = await dbGet('suppliers', supplierId);
            supPost(supplier, {type:'purchase', date:invoiceDate, amount:total, invoiceId:newId, invoiceNo:fresh.invoiceNumber, billNo:billNoText,
              gst:{mode:gstMode, rate:gstRate, amount:gstAmount},
              note:'Invoice '+fresh.invoiceNumber+(billNoText?(' (bill '+billNoText+')'):'')+' ('+items.length+' item line'+(items.length>1?'s':'')+')'}, total, 0);
            fresh.payments = fresh.payments||[];
            if(paidNow>0){
              const pr = supPost(supplier, {type:'payment', mode:payMode, date:stamp.at, amount:paidNow, invoiceId:newId, invoiceNo:fresh.invoiceNumber,
                note:payMode+' paid at purchase — '+fresh.invoiceNumber}, -paidNow, 0);
              fresh.payments.push({entryId:pr.entryId, at:stamp.at, by:stamp.by, date:stamp.at, amount:paidNow, mode:payMode, reference:'', note:'Paid at purchase'});
            }
            if(advanceUse>0){
              const ar = supPost(supplier, {type:'payment', mode:'Advance', source:'advance', date:stamp.at, amount:advanceUse, invoiceId:newId, invoiceNo:fresh.invoiceNumber,
                note:'Advance applied to '+fresh.invoiceNumber}, -advanceUse, -advanceUse);
              fresh.payments.push({entryId:ar.entryId, at:stamp.at, by:stamp.by, date:stamp.at, amount:advanceUse, mode:'Advance', reference:'', note:'Applied from advance balance'});
            }
            await dbPut('purchaseInvoices', fresh);
            await dbPut('suppliers', supplier);
          }

          if(prefill.poId){
            const po = await dbGet('purchaseOrders', prefill.poId);
            if(po){ po.status = 'received'; await dbPut('purchaseOrders', po); }
          }

          closeModal();
          toast(t('toast_purchaseInvoiceRecorded').replace('{0}', fresh.invoiceNumber),'success');
          await refreshLowStockBadge();
          await refreshSupplierSurfaces();
        };

        const threshold = SETTINGS.purchaseApprovalThreshold||0;
        if(threshold>0 && total>threshold && !isOwner()){
          requireOwnerApproval(t('vendor_ownerApprovalPurchaseInvoiceOver')+fmtMoney(threshold), doSave);
        } else {
          await doSave();
        }
      });
    }
  });
}

async function openPurchaseReturnModal(){

  const [products, suppliers] = await Promise.all([scopedGetAll('products'), scopedGetAll('suppliers')]);
  products.sort((a,b)=>a.name.localeCompare(b.name));
