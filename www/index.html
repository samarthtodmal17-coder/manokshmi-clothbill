  if(products.length===0){ toast(t('toast_addProductFirst'),'error'); return; }
  if(suppliers.length===0){ toast(t('toast_addSupplierFirst'),'error'); return; }

  let rowCount = 0;
  const rowHTML = (idx)=>`
    <div class="row pret-row" data-idx="${idx}" style="align-items:flex-end;margin-bottom:6px;">
      <div class="col field">
        <label style="font-size:11px;">${t('vendor_labelProduct')}</label>
        <select class="pret-product">${products.map(p=>`<option value="${p.id}">${escapeHTML(p.name)}</option>`).join('')}</select>
      </div>
      <div class="col field" style="max-width:140px;">
        <label style="font-size:11px;">${t('vendor_labelVariant')}</label>
        <select class="pret-variant"></select>
      </div>
      <div class="col field" style="max-width:70px;">
        <label style="font-size:11px;">${t('vendor_labelQty')}</label>
        <input type="number" class="pret-qty" min="1" value="1">
      </div>
      <div class="col field" style="max-width:90px;">
        <label style="font-size:11px;">${t('vendor_labelRateRupee')}</label>
        <input type="number" class="pret-rate" min="0" step="0.01" value="0">
      </div>
      <div class="col" style="flex:0 0 auto;"><button type="button" class="btn btn-outline btn-sm pret-remove">✕</button></div>
    </div>
  `;

  openModal({
    title:t('modal_newPurchaseReturn'),
    bodyHTML:`
      <div class="field">
        <label>${t('vendor_supplierRequiredLabel')}</label>
        <select id="pret_supplier">
          <option value="">${t('vendor_selectSupplierPlaceholder')}</option>
          ${suppliers.map(s=>`<option value="${s.id}">${escapeHTML(s.name)}</option>`).join('')}
        </select>
      </div>
      <div id="pretRowsWrap"></div>
      <button type="button" class="btn btn-outline btn-sm" id="pret_addRow">${t('inv_addItemBtn')}</button>
      <div class="row" style="margin-top:10px;">
        <div class="col field">
          <label>${t('vendor_reasonRequiredLabel')}</label>
          <select id="pret_reason">
            <option value="">${t('sales_selectReasonPlaceholder')}</option>
            <option value="Defective / Damaged">${t('sales_reasonDefectiveDamaged')}</option>
            <option value="Wrong Item Received">${t('vendor_reasonWrongItemReceived')}</option>
            <option value="Excess Stock">${t('vendor_reasonExcessStock')}</option>
            <option value="Damaged in Transit">${t('vendor_reasonDamagedInTransit')}</option>
            <option value="Other">${t('sales_reasonOther')}</option>
          </select>
        </div>
        <div class="col field"><label>${t('sales_noteOptionalLabel')}</label><input id="pret_note"></div>
      </div>
      <div id="pretSummaryWrap" style="margin-top:10px;font-size:13.5px;font-weight:700;"></div>
    `,
    footerHTML:`
      <button class="btn btn-outline" onclick="closeModal()">${t('acct_cancelBtn')}</button>
      <button class="btn btn-primary" id="pret_save" disabled>${t('sales_processReturnBtn')}</button>
    `,
    onMount:()=>{
      const wrap = document.getElementById('pretRowsWrap');
      const buildVariantOptions = (rowEl)=>{
        const pid = parseInt(rowEl.querySelector('.pret-product').value);
        const product = products.find(p=>p.id===pid);
        const variantSel = rowEl.querySelector('.pret-variant');
        variantSel.innerHTML = (product.variants||[]).map((v,i)=>{
          const label = [v.size,v.color].filter(Boolean).join('/') || v.sku || (t('inv_variantFallbackPrefix')+(i+1));
          return `<option value="${i}">${escapeHTML(label)}${t('pu_stockPrefix')}${v.stock})</option>`;
        }).join('');
      };
      const applyDefaultRate = (rowEl)=>{
        const pid = parseInt(rowEl.querySelector('.pret-product').value);
        const product = products.find(p=>p.id===pid);
        const vi = parseInt(rowEl.querySelector('.pret-variant').value)||0;
        const variant = product.variants[vi];
        if(variant) rowEl.querySelector('.pret-rate').value = variant.costPrice||0;
      };
      const addRow = ()=>{
        const idx = rowCount++;
        const div = document.createElement('div');
        div.innerHTML = rowHTML(idx);
        const rowEl = div.firstElementChild;
        wrap.appendChild(rowEl);
        buildVariantOptions(rowEl);
        applyDefaultRate(rowEl);
        rowEl.querySelector('.pret-product').addEventListener('change', ()=>{ buildVariantOptions(rowEl); applyDefaultRate(rowEl); recalc(); });
        rowEl.querySelector('.pret-variant').addEventListener('change', ()=>{ applyDefaultRate(rowEl); recalc(); });
        rowEl.querySelectorAll('.pret-qty,.pret-rate').forEach(inp=>inp.addEventListener('input', recalc));
        rowEl.querySelector('.pret-remove').addEventListener('click', ()=>{ rowEl.remove(); recalc(); });
        recalc();
      };
      const recalc = ()=>{
        let total = 0, any=false;
        wrap.querySelectorAll('.pret-row').forEach(rowEl=>{
          const qty = Math.max(0, parseInt(rowEl.querySelector('.pret-qty').value)||0);
          const rate = Math.max(0, parseFloat(rowEl.querySelector('.pret-rate').value)||0);
          if(qty>0){ total += qty*rate; any=true; }
        });
        document.getElementById('pretSummaryWrap').textContent = t('vendor_totalPrefix') + fmtMoney(total);
        const reasonChosen = !!document.getElementById('pret_reason').value;
        const supplierChosen = !!document.getElementById('pret_supplier').value;
        document.getElementById('pret_save').disabled = !any || !reasonChosen || !supplierChosen;
        return total;
      };
      addRow();
      document.getElementById('pret_addRow').addEventListener('click', addRow);
      document.getElementById('pret_reason').addEventListener('change', recalc);
      document.getElementById('pret_supplier').addEventListener('change', recalc);
      recalc();

      document.getElementById('pret_save').addEventListener('click', async ()=>{
        const supplierId = parseInt(document.getElementById('pret_supplier').value);
        const items = [];
        for(const rowEl of wrap.querySelectorAll('.pret-row')){
          const pid = parseInt(rowEl.querySelector('.pret-product').value);
          const vi = parseInt(rowEl.querySelector('.pret-variant').value);
          const qty = Math.max(0, parseInt(rowEl.querySelector('.pret-qty').value)||0);
          const rate = Math.max(0, parseFloat(rowEl.querySelector('.pret-rate').value)||0);
          if(qty<=0) continue;
          const product = products.find(p=>p.id===pid);
          const variant = product.variants[vi];
          const variantLabel = [variant.size,variant.color].filter(Boolean).join('/') || variant.sku || '';
          items.push({productId:pid, variantIndex:vi, productName:product.name, variantLabel, qty, rate});
        }
        if(items.length===0) return;
        const total = items.reduce((s,it)=>s+it.qty*it.rate,0);
        const reason = document.getElementById('pret_reason').value;
        const note = document.getElementById('pret_note').value.trim();
        const date = new Date().toISOString();

        for(const it of items){
          const product = await dbGet('products', it.productId);
          if(product && product.variants[it.variantIndex]){
            adjustFirmStock(product.variants[it.variantIndex], firmIdForStockOps(), -it.qty);
            await dbPut('products', product);
          }
        }

        const rStamp = stampNow();
        const newId = await dbAdd('purchaseReturns', {supplierId, items, reason, note, total, date, enteredAt:rStamp.at, enteredBy:rStamp.by, firmId: firmIdForStockOps()});
        const fresh = await dbGet('purchaseReturns', newId);
        fresh.returnNumber = 'PRET-' + String(newId).padStart(4,'0');
        await dbPut('purchaseReturns', fresh);

        const supplier = await dbGet('suppliers', supplierId);
        supPost(supplier, {date, type:'return', amount:total, returnId:newId, invoiceNo:fresh.returnNumber, note:'Return '+fresh.returnNumber+(reason?' — '+reason:'')}, -total, 0);
        await dbPut('suppliers', supplier);

        closeModal();
        toast(t('toast_purchaseReturnRecorded'),'success');
        await refreshLowStockBadge();
        await refreshSupplierSurfaces();
      });
    }
  });
}

/* ---- Purchase Reports ---- */
// The due date an invoice's aging bucket should be measured against — uses the invoice's own
// dueDate when tracked, else falls back to the supplier's current payment terms from invoice date.
function invoiceDueDate(inv, supplier){
  if(inv.dueDate) return new Date(inv.dueDate);
  const days = supplier ? paymentTermsDays(supplier.paymentTerms) : 0;
  return new Date(new Date(inv.date).getTime() + days*86400000);
}
async function renderPurchaseReportsTab(){
  const wrap = document.getElementById('reqSubtabContent');
  const [suppliers, invoicesAll, returnsAll] = await Promise.all([scopedGetAll('suppliers'), scopedGetAll('purchaseInvoices'), scopedGetAll('purchaseReturns')]);
  const invoices = invoicesAll.filter(i=>!i.voided), returns = returnsAll.filter(r=>!r.voided);
  suppliers.sort((a,b)=>a.name.localeCompare(b.name));
  const now = Date.now();
  const rows = suppliers.map(s=>{
    const invForS = invoices.filter(i=>i.supplierId===s.id);
    const retForS = returns.filter(r=>r.supplierId===s.id);
    const totalPurchased = invForS.reduce((sum,i)=>sum+i.total,0);
    const totalPaid = (s.ledger||[]).filter(l=>l.type==='payment' && !l.voided).reduce((sum,l)=>sum+l.amount,0);
    const totalReturned = retForS.reduce((sum,r)=>sum+r.total,0);
    const returnRate = totalPurchased>0 ? Math.round((totalReturned/totalPurchased)*1000)/10 : 0;
    return {supplier:s, totalPurchased, totalPaid, totalReturned, returnRate, outstanding:s.balanceDue||0, invoiceCount:invForS.length};
  });

  // Payables aging: bucket every unpaid/partial invoice's outstanding amount by days past due.
  const aging = {};
  invoices.forEach(inv=>{
    const status = invoiceStatus(inv);
    if(status==='paid' || !inv.supplierId) return;
    const supplier = suppliers.find(s=>s.id===inv.supplierId);
    const outstanding = Math.round((inv.total-invoicePaid(inv))*100)/100;
    if(outstanding<=0.001) return;
    const daysPastDue = Math.floor((now - invoiceDueDate(inv, supplier).getTime())/86400000);
    const key = inv.supplierId;
    if(!aging[key]) aging[key] = {name: supplier?supplier.name:t('vendor_unknownSupplier'), current:0, b30:0, b60:0, b90:0};
    if(daysPastDue<=0) aging[key].current += outstanding;
    else if(daysPastDue<=30) aging[key].b30 += outstanding;
    else if(daysPastDue<=60) aging[key].b60 += outstanding;
    else aging[key].b90 += outstanding;
  });
  const agingRows = Object.values(aging).filter(a=>a.current+a.b30+a.b60+a.b90>0.01);

  wrap.innerHTML = `
    <div class="row" style="margin-bottom:12px;">
      <button class="btn btn-outline" id="viewPriceHistoryBtn">${iconSVG('chart',15)} ${t('vendor_purchasePriceHistoryBtn')}</button>
      <button class="btn btn-outline" id="viewPriceCompareBtn">${iconSVG('chart',15)} ${t('vendor_compareSupplierPricesBtn')}</button>
    </div>
    <div class="card">
      <h2 class="section-title">${t('vendor_supplierWisePurchaseSummaryTitle')}</h2>
      ${rows.length===0?'<div class="empty-state">No suppliers yet.</div>':`
      <table>
        <thead><tr><th>${t('th_supplier')}</th><th class="num">${t('th_invoices')}</th><th class="num">${t('th_totalPurchased')}</th><th class="num">${t('th_totalPaid')}</th><th class="num">${t('th_returned')}</th><th class="num">${t('th_returnRate')}</th><th class="num">${t('th_outstanding')}</th></tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td>${escapeHTML(r.supplier.name)}</td>
              <td class="num">${r.invoiceCount}</td>
              <td class="num">${fmtMoney(r.totalPurchased)}</td>
              <td class="num">${fmtMoney(r.totalPaid)}</td>
              <td class="num">${fmtMoney(r.totalReturned)}</td>
              <td class="num">${r.returnRate}%</td>
              <td class="num">${r.outstanding>0?`<span class="tag tag-red">${fmtMoney(r.outstanding)}</span>`:`<span class="tag tag-green">${fmtMoney(0)}</span>`}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`}
    </div>
    <div class="card" style="margin-top:14px;">
      <h2 class="section-title">${t('vendor_payablesAgingTitle')}</h2>
      <p class="muted" style="font-size:12px;margin-top:-4px;">${t('vendor_payablesAgingHelp')}</p>
      ${agingRows.length===0?'<div class="empty-state">Nothing outstanding — all invoices are paid.</div>':`
      <table>
        <thead><tr><th>${t('th_supplier')}</th><th class="num">${t('th_notYetDue')}</th><th class="num">${t('th_0to30')}</th><th class="num">${t('th_31to60')}</th><th class="num">${t('th_60plus')}</th></tr></thead>
        <tbody>
          ${agingRows.map(a=>`
            <tr>
              <td>${escapeHTML(a.name)}</td>
              <td class="num">${a.current>0?fmtMoney(a.current):'-'}</td>
              <td class="num">${a.b30>0?fmtMoney(a.b30):'-'}</td>
              <td class="num">${a.b60>0?`<span class="tag tag-amber">${fmtMoney(a.b60)}</span>`:'-'}</td>
              <td class="num">${a.b90>0?`<span class="tag tag-red">${fmtMoney(a.b90)}</span>`:'-'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`}
    </div>
  `;
  document.getElementById('viewPriceHistoryBtn').addEventListener('click', showPurchasePriceHistoryLog);
  document.getElementById('viewPriceCompareBtn').addEventListener('click', showPriceComparisonTool);
}

/* ---- Supplier price comparison: for one product, who's cheapest? ---- */
async function showPriceComparisonTool(){
  const records = await dbGetAll('purchasePriceHistory');
  const productNames = [...new Set(records.map(r=>r.productName))].sort((a,b)=>a.localeCompare(b));
  const renderComparison = (productName)=>{
    if(!productName) return `<p class="muted" style="font-size:12.5px;">${t('vendor_chooseProductCompareNote')}</p>`;
    const forProduct = records.filter(r=>r.productName===productName);
    // Latest price paid per supplier for this product
    const bySupplier = {};
    forProduct.forEach(r=>{
      const key = r.supplierId || 'cash';
      if(!bySupplier[key] || new Date(r.date) > new Date(bySupplier[key].date)) bySupplier[key] = r;
    });
    const list = Object.values(bySupplier).sort((a,b)=>a.price-b.price);
    if(list.length===0) return `<p class="muted" style="font-size:12.5px;">${t('vendor_noPurchaseHistoryForProduct')}</p>`;
    const cheapest = list[0].price;
    return `
      <table>
        <thead><tr><th>${t('th_supplier')}</th><th class="num">${t('th_lastPricePaid')}</th><th>${t('th_lastPurchased')}</th><th></th></tr></thead>
        <tbody>
          ${list.map(r=>`
            <tr>
              <td>${escapeHTML(r.supplierName||t('vendor_cashPurchaseLabel'))}</td>
              <td class="num">${fmtMoney(r.price)}</td>
              <td>${fmtDate(r.date)}</td>
              <td>${r.price===cheapest?'<span class="tag tag-green">Best Price</span>':''}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  };
  openModal({
    title:t('modal_compareSupplierPrices'),
    bodyHTML:`
      <div class="field" style="max-width:280px;">
        <label>${t('vendor_labelProduct')}</label>
        <select id="pcProduct"><option value="">${t('vendor_chooseProductPlaceholder')}</option>${productNames.map(n=>`<option value="${escapeHTML(n)}">${escapeHTML(n)}</option>`).join('')}</select>
      </div>
      <div id="pcResultWrap" style="margin-top:10px;">${renderComparison('')}</div>
    `,
    footerHTML:`<button class="btn btn-outline" onclick="closeModal()">${t('print_closeBtn')}</button>`,
    onMount:()=>{
      document.getElementById('pcProduct').addEventListener('change',(e)=>{
        document.getElementById('pcResultWrap').innerHTML = renderComparison(e.target.value);
      });
    }
  });
}

<script>
function svgBarChart(data, opts={}){
  const w = opts.width||520, h = opts.height||190, pad=30;
  const max = Math.max(1, ...data.map(d=>d.value));
  const gap = (w - pad*2) / data.length;
  const barW = Math.min(46, gap*0.55);
  const color = opts.color || 'var(--wine)';
  let bars = '';
  data.forEach((d,i)=>{
    const barH = max>0 ? (d.value/max) * (h - pad*2 - 14) : 0;
    const x = pad + i*gap + (gap-barW)/2;
    const y = h - pad - barH;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(barH,1).toFixed(1)}" rx="4" fill="${color}"><title>${escapeHTML(d.label)}: ${opts.valueFormatter?opts.valueFormatter(d.value):d.value}</title></rect>`;
    bars += `<text x="${(x+barW/2).toFixed(1)}" y="${h-10}" font-size="10.5" text-anchor="middle" fill="var(--ink-soft)">${escapeHTML(d.label)}</text>`;
    if(opts.showValue){
      bars += `<text x="${(x+barW/2).toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="10.5" text-anchor="middle" fill="var(--ink)" font-weight="700">${opts.valueFormatter?opts.valueFormatter(d.value):d.value}</text>`;
    }
  });
  bars += `<line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)" stroke-width="1"/>`;
  return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">${bars}</svg></div>`;
}

function svgHBarChart(data, opts={}){
  const rowH = opts.rowH||26, labelW = opts.labelW||130, w = opts.width||520;
  const h = data.length*rowH + 20;
  const max = Math.max(1, ...data.map(d=>d.value));
  const barAreaW = w - labelW - 60;
  const color = opts.color || 'var(--wine)';
  let rows = '';
  data.forEach((d,i)=>{
    const y = 10 + i*rowH;
    const barW = max>0 ? (d.value/max)*barAreaW : 0;
    rows += `<text x="${labelW-8}" y="${y+rowH*0.62}" font-size="11.5" text-anchor="end" fill="var(--ink)">${escapeHTML(d.label)}</text>`;
    rows += `<rect x="${labelW}" y="${y+4}" width="${Math.max(barW,2).toFixed(1)}" height="${rowH-10}" rx="4" fill="${color}"><title>${escapeHTML(d.label)}: ${opts.valueFormatter?opts.valueFormatter(d.value):d.value}</title></rect>`;
    rows += `<text x="${labelW+barW+8}" y="${y+rowH*0.62}" font-size="11" fill="var(--ink-soft)">${opts.valueFormatter?opts.valueFormatter(d.value):d.value}</text>`;
  });
  return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${rows}</svg></div>`;
}

function svgLineChart(data, opts={}){
  const w = opts.width||620, h = opts.height||200, pad=32;
  const max = Math.max(1, ...data.map(d=>d.value));
  const stepX = (w - pad*2) / Math.max(1,(data.length-1));
  const color = opts.color || 'var(--wine)';
  let points = data.map((d,i)=>{
    const x = pad + i*stepX;
    const y = h - pad - (d.value/max)*(h-pad*2-14);
    return {x,y,d};
  });
  const pathD = points.map((p,i)=> (i===0?'M':'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  const areaD = pathD + ` L ${points[points.length-1].x.toFixed(1)} ${h-pad} L ${points[0].x.toFixed(1)} ${h-pad} Z`;
  let dots = points.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${color}"><title>${escapeHTML(p.d.label)}: ${opts.valueFormatter?opts.valueFormatter(p.d.value):p.d.value}</title></circle>`).join('');
  let labels = points.map(p=>`<text x="${p.x.toFixed(1)}" y="${h-10}" font-size="10.5" text-anchor="middle" fill="var(--ink-soft)">${escapeHTML(p.d.label)}</text>`).join('');
  return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <path d="${areaD}" fill="${color}" opacity="0.08"></path>
    <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.5"></path>
    ${dots}${labels}
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)" stroke-width="1"/>
  </svg></div>`;
}
</script>

<script>
// Indian mobile numbers are stored as plain 10 digits; "+91 98765 43210", "09876543210" and
// "98765-43210" all reduce to the same thing, so duplicates are caught and WhatsApp links work.
function cleanMobile(raw){
  let d = String(raw||'').replace(/\D/g,'');
  if(d.length===12 && d.startsWith('91')) d = d.slice(2);
  else if(d.length===11 && d.startsWith('0')) d = d.slice(1);
  return d;
}
function isValidMobile(raw){ return /^[6-9]\d{9}$/.test(cleanMobile(raw)); }
async function findCustomerByMobile(raw, exceptId){
  const m = cleanMobile(raw);
  if(!m) return null;
  const all = await dbGetAll('customers');
  return all.find(c=>c.id!==exceptId && cleanMobile(c.phone)===m) || null;
}
// The desktop app supplies its own openExternal (window.open is blocked there); in a plain browser tab fall back to window.open.
window.openExternal = window.openExternal || function(url){ window.open(url, '_blank'); return null; };
function buildWhatsAppLink(phone, text){
  let cleanPhone = (phone||'').replace(/[^0-9]/g,'');
  if(cleanPhone.length===10) cleanPhone = '91' + cleanPhone;   // wa.me needs the country code
  return 'https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(text);
}
function promptPhoneThenOpen(text){
  openModal({
    title:t('modal_sendViaWhatsApp'),
    bodyHTML:`
      <div class="field"><label>${t('wa_customerPhoneLabel')}</label><input id="wa_phone" placeholder="${t('wa_phonePlaceholder')}"></div>
      <p class="muted" style="font-size:11.5px;">${t('wa_openWhatsAppHint')}</p>
    `,
    footerHTML:`<button class="btn btn-outline" onclick="closeModal()">${t('acct_cancelBtn')}</button><button class="btn btn-whatsapp" id="wa_go">${iconSVG('whatsapp',15)} ${t('wa_openWhatsAppBtn')}</button>`,
    onMount:()=>{
      document.getElementById('wa_go').addEventListener('click', ()=>{
        const phone = document.getElementById('wa_phone').value.trim();
        if(!phone){ toast(t('toast_enterPhoneNumber'),'error'); return; }
        openExternal(buildWhatsAppLink(phone, text), '_blank');
        closeModal();
      });
    }
  });
}
function buildInvoiceMessageText(bill, plain){
  const bold = (s)=> plain ? s : `*${s}*`;
  const lines = [];
  lines.push(bold(SETTINGS.name));
  lines.push(`${t('wa_invoiceLabelPrefix')}${bill.invoiceNo}`);
  lines.push(`${t('wa_dateLabelPrefix')}${fmtDate(bill.date)}`);
  lines.push('');
  bill.items.forEach(it=>{
    const variant = [it.size,it.color].filter(Boolean).join('/');
    lines.push(`${it.name}${variant?' ('+variant+')':''} x${it.qty} - ${fmtMoney(it.qty*it.rate-itemDiscountAmount(it))}`);
  });
  lines.push('');
  if(bill.packagingCharge>0) lines.push(`${t('wa_packagingLabelPrefix')}${fmtMoney(bill.packagingCharge)}`);
  if(bill.deliveryCharge>0) lines.push(`${t('wa_deliveryLabelPrefix')}${fmtMoney(bill.deliveryCharge)}`);
  lines.push(`${t('vendor_totalPrefix')}${fmtMoney(bill.grandTotal)}`);
  if(bill.creditAmount>0) lines.push(`${t('wa_balanceDueLabelPrefix')}${fmtMoney(bill.creditAmount)}`);
  lines.push('');
  lines.push(t('print_thankYouShopping'));
  return lines.join('\n');
}
function sendInvoiceOnWhatsApp(bill, phone, customerName){
  const text = buildInvoiceMessageText(bill, false);
  if(phone){ openExternal(buildWhatsAppLink(phone, text), '_blank'); }
  else { promptPhoneThenOpen(text); }
}
function sendInvoiceByEmail(bill, customerName){
  const subject = encodeURIComponent(SETTINGS.name + t('wa_emailSubjectInvoiceSep') + bill.invoiceNo);
  const body = encodeURIComponent(buildInvoiceMessageText(bill, true));
  openExternal('mailto:?subject='+subject+'&body='+body, '_blank');
}
async function sendOccasionWish(customerId, type){
  const customer = await dbGet('customers', customerId);
  if(!customer) return;
  const template = type==='birthday' ? (SETTINGS.birthdayOfferTemplate||DEFAULT_SETTINGS.birthdayOfferTemplate) : (SETTINGS.anniversaryOfferTemplate||DEFAULT_SETTINGS.anniversaryOfferTemplate);
  const text = template.replace(/\{shop\}/g, SETTINGS.name||t('wa_ourShopFallback'));
  if(customer.phone){
    openExternal(buildWhatsAppLink(customer.phone, text), '_blank');
  } else {
    promptPhoneThenOpen(text);
  }
}
async function shareProductOnWhatsApp(productId){
  const p = await dbGet('products', productId);
  const lines = [];
  lines.push(`*${p.name}*${p.brand?' - '+p.brand:''}`);
  let any = false;
  (p.variants||[]).filter(v=>v.stock>0).forEach(v=>{
    any = true;
    const label = [v.size,v.color].filter(Boolean).join('/') || v.sku || t('wa_availableFallback');
    lines.push(`${label}: ${fmtMoney(v.sellPrice)} (${v.stock}${t('wa_inStockSuffix')}`);
  });
  if(!any) lines.push(t('wa_currentlyOutOfStock'));
  lines.push('');
  lines.push(`- ${SETTINGS.name}`);
  promptPhoneThenOpen(lines.join('\n'));
}
</script>

<script>
let TRENDS_RANGE = 'month';
let TRENDS_CUSTOM_FROM = '';
let TRENDS_CUSTOM_TO = '';

function trendsRangeToDates(range){
  const now = new Date();
  let from, to = new Date(now); to.setHours(23,59,59,999);
  if(range==='month'){ from = new Date(now.getFullYear(), now.getMonth(), 1); }
  else if(range==='3m'){ from = new Date(now); from.setMonth(now.getMonth()-3); from.setHours(0,0,0,0); }
  else if(range==='6m'){ from = new Date(now); from.setMonth(now.getMonth()-6); from.setHours(0,0,0,0); }
  else if(range==='custom'){
    from = TRENDS_CUSTOM_FROM ? new Date(TRENDS_CUSTOM_FROM+'T00:00:00') : new Date(2000,0,1);
    to = TRENDS_CUSTOM_TO ? new Date(TRENDS_CUSTOM_TO+'T23:59:59.999') : to;
    if(from>to){ const t=from; from=to; to=t; } // guard against an inverted From/To pick
  }
  else { from = new Date(2000,0,1); }
  return {from, to};
}
function previousPeriod(from,to){
  const len = to.getTime() - from.getTime();
  const prevTo = new Date(from.getTime()-1);
  const prevFrom = new Date(prevTo.getTime()-len);
  return {from:prevFrom, to:prevTo};
}
function variantKey(it){ return it.sku ? ('sku:'+it.sku) : ('pv:'+it.productId+':'+(it.size||'')+':'+(it.color||'')); }

async function renderTrends(){
  const el = document.getElementById('view-trends');
  const firmScopeNote = multiFirmInUse()
    ? `<p class="muted" style="font-size:12px;margin:-6px 0 10px;">${t('sales_showingPrefix')}<strong>${escapeHTML(isCombinedFirmView()?t('sales_allFirmsCombinedLabel'):((firmById(activeFirmId())||{}).name||''))}</strong></p>`
    : '';
  el.innerHTML = `
    ${firmScopeNote}
    <div class="row" style="margin-bottom:12px;align-items:flex-end;flex-wrap:wrap;">
      <div class="col" style="max-width:220px;">
        <label>${t('trends_analyzePeriodLabel')}</label>
        <select id="trendsRangeSelect">
          <option value="month">${t('staff_thisMonthOption')}</option>
          <option value="3m">${t('trends_rangeLast3Months')}</option>
          <option value="6m">${t('trends_rangeLast6Months')}</option>
          <option value="all">${t('staff_allTimeOption')}</option>
          <option value="custom">${t('staff_customRangeOption')}</option>
        </select>
      </div>
      <div id="trendsCustomRangeWrap" class="col" style="display:${TRENDS_RANGE==='custom'?'flex':'none'};gap:8px;flex-wrap:wrap;">
        <div class="field" style="max-width:150px;margin-bottom:0;"><label style="font-size:11px;">${t('staff_fromLabel')}</label><input type="date" id="trendsCustomFrom" value="${TRENDS_CUSTOM_FROM}"></div>
        <div class="field" style="max-width:150px;margin-bottom:0;"><label style="font-size:11px;">${t('staff_toLabel')}</label><input type="date" id="trendsCustomTo" value="${TRENDS_CUSTOM_TO}"></div>
      </div>
    </div>
    <div class="stat-tiles" id="trendsGrowthTiles"></div>
    <div class="card">
      <h2 class="section-title">${iconSVG('trends')} ${t('trends_monthlySalesTrendTitle')}</h2>
      <div id="trendsMonthlyChart"></div>
    </div>
    <div class="row" style="margin-top:12px;align-items:flex-start;">
      <div class="col card">
        <h2 class="section-title">${t('trends_salesByCategoryTitle')}</h2>
        <div id="trendsCategoryChart"></div>
      </div>
      <div class="col card">
        <h2 class="section-title">${t('trends_salesBySizeTitle')}</h2>
        <div id="trendsSizeChart"></div>
      </div>
    </div>
    <div class="row" style="margin-top:12px;align-items:flex-start;">
      <div class="col card">
        <h2 class="section-title">${t('trends_salesByColorTitle')}</h2>
        <div id="trendsColorChart"></div>
      </div>
      <div class="col card">
        <h2 class="section-title">${t('trends_fastVsSlowMoversTitle')}</h2>
        <div id="trendsMoversWrap"></div>
      </div>
    </div>
  `;
  document.getElementById('trendsRangeSelect').value = TRENDS_RANGE;
  document.getElementById('trendsRangeSelect').addEventListener('change',(e)=>{
    TRENDS_RANGE = e.target.value;
    document.getElementById('trendsCustomRangeWrap').style.display = TRENDS_RANGE==='custom' ? 'flex' : 'none';
    if(TRENDS_RANGE==='custom' && !TRENDS_CUSTOM_FROM && !TRENDS_CUSTOM_TO){
      const now = new Date();
      TRENDS_CUSTOM_FROM = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);
      TRENDS_CUSTOM_TO = todayISO();
      document.getElementById('trendsCustomFrom').value = TRENDS_CUSTOM_FROM;
      document.getElementById('trendsCustomTo').value = TRENDS_CUSTOM_TO;
    }
    renderTrendsData();
  });
  document.getElementById('trendsCustomFrom').addEventListener('change',(e)=>{
    TRENDS_CUSTOM_FROM = e.target.value;
    renderTrendsData();
  });
  document.getElementById('trendsCustomTo').addEventListener('change',(e)=>{
    TRENDS_CUSTOM_TO = e.target.value;
    renderTrendsData();
  });
  await renderTrendsData();
}

async function renderTrendsData(){
  const [rawBills, allProducts] = await Promise.all([scopedLiveBills(), scopedGetAll('products')]);
  const allBills = scopeBillsToActiveFirm(rawBills);
  const {from,to} = trendsRangeToDates(TRENDS_RANGE);
  const inRange = allBills.filter(b=>{ const d=new Date(b.date); return d>=from && d<=to; });
  const {from:pFrom, to:pTo} = previousPeriod(from,to);
  const prevRange = allBills.filter(b=>{ const d=new Date(b.date); return d>=pFrom && d<=pTo; });

  const curRevenue = inRange.reduce((s,b)=>s+b.grandTotal,0);
  const prevRevenue = prevRange.reduce((s,b)=>s+b.grandTotal,0);
  const growthPct = prevRevenue>0 ? ((curRevenue-prevRevenue)/prevRevenue*100) : (curRevenue>0?100:0);
  const curBillCount = inRange.length, prevBillCount = prevRange.length;
  const billGrowthPct = prevBillCount>0 ? ((curBillCount-prevBillCount)/prevBillCount*100) : (curBillCount>0?100:0);

  document.getElementById('trendsGrowthTiles').innerHTML = `
    <div class="stat-tile">
      <div class="label">${t('trends_revenuePeriodLabel')}</div><div class="value">${fmtMoney(curRevenue)}</div>
      <div class="delta ${growthPct>=0?'up':'down'}">${growthPct>=0?'▲':'▼'} ${Math.abs(growthPct).toFixed(1)}${t('trends_vsPreviousPeriodSuffix')}</div>
    </div>
    <div class="stat-tile">
      <div class="label">${t('trends_billsPeriodLabel')}</div><div class="value small">${curBillCount}</div>
      <div class="delta ${billGrowthPct>=0?'up':'down'}">${billGrowthPct>=0?'▲':'▼'} ${Math.abs(billGrowthPct).toFixed(1)}${t('trends_vsPreviousPeriodSuffix')}</div>
    </div>
  `;

  // Monthly trend - trailing 6 months regardless of filter
  const now = new Date();
  const months = [];
  for(let i=5;i>=0;i--){
    const m = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const mEnd = new Date(now.getFullYear(), now.getMonth()-i+1, 1);
    const total = allBills.filter(b=>{ const d=new Date(b.date); return d>=m && d<mEnd; }).reduce((s,b)=>s+b.grandTotal,0);
    months.push({label:m.toLocaleDateString(localeTag(),{month:'short'}), value:Math.round(total)});
  }
  document.getElementById('trendsMonthlyChart').innerHTML = svgLineChart(months, {valueFormatter:(v)=>SETTINGS.currency+v});

  // Aggregate items in range
  const byCategory = {}, bySize = {}, byColor = {};
  const soldByVariant = {};
  inRange.forEach(b=>(b.items||[]).forEach(it=>{
    const cat = it.category || t('inv_uncategorized');
    const rev = it.qty*it.rate - itemDiscountAmount(it);
    byCategory[cat] = (byCategory[cat]||0) + rev;
    if(it.size){ bySize[it.size] = (bySize[it.size]||0) + it.qty; }
    if(it.color){ byColor[it.color] = (byColor[it.color]||0) + it.qty; }
    const key = variantKey(it);
    soldByVariant[key] = (soldByVariant[key]||0) + it.qty;
  }));

  const toChartData = (obj)=> Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([label,value])=>({label, value:Math.round(value)}));
  const catData = toChartData(byCategory);
  const sizeData = toChartData(bySize);
  const colorData = toChartData(byColor);

  document.getElementById('trendsCategoryChart').innerHTML = catData.length ? svgHBarChart(catData, {valueFormatter:(v)=>fmtMoney(v)}) : `<div class="empty-state">${t('trends_noCategorySales')}</div>`;
  document.getElementById('trendsSizeChart').innerHTML = sizeData.length ? svgHBarChart(sizeData, {color:'var(--gold)', valueFormatter:(v)=>v+' sold'}) : `<div class="empty-state">${t('trends_noSizeData')}</div>`;
  document.getElementById('trendsColorChart').innerHTML = colorData.length ? svgHBarChart(colorData, {color:'var(--wine-light)', valueFormatter:(v)=>v+' sold'}) : `<div class="empty-state">${t('trends_noColorData')}</div>`;

  // Fast / slow movers using current stock vs sold-in-range
  const rows = [];
  allProducts.forEach(p=>(p.variants||[]).forEach(v=>{
    const key = v.sku ? ('sku:'+v.sku) : ('pv:'+p.id+':'+(v.size||'')+':'+(v.color||''));
    const sold = soldByVariant[key] || 0;
    if(sold===0 && v.stock===0) return;
    const sellThrough = (sold+v.stock)>0 ? sold/(sold+v.stock) : 0;
    rows.push({
      label: p.name + ([v.size,v.color].filter(Boolean).length ? ' ('+[v.size,v.color].filter(Boolean).join('/')+')' : ''),
      sold, stock: v.stock, sellThrough
    });
  }));
  const fastMovers = rows.filter(r=>r.sold>0).sort((a,b)=>b.sellThrough-a.sellThrough).slice(0,6);
  const slowMovers = rows.filter(r=>r.stock>0).sort((a,b)=>a.sellThrough-b.sellThrough).slice(0,6);
  const moversWrap = document.getElementById('trendsMoversWrap');
  const renderMoverRow = (r)=>`
    <tr><td>${escapeHTML(r.label)}</td><td class="num">${r.sold}</td><td class="num">${r.stock}</td><td class="num">${(r.sellThrough*100).toFixed(0)}%</td></tr>
  `;
  moversWrap.innerHTML = `
    <h3 class="sub-title">${t('trends_fastMoversTitle')}</h3>
    ${fastMovers.length? `<table><thead><tr><th>${t('th_item')}</th><th class="num">${t('th_sold')}</th><th class="num">${t('th_stock')}</th><th class="num">${t('th_sellThrough')}</th></tr></thead><tbody>${fastMovers.map(renderMoverRow).join('')}</tbody></table>` : `<div class="empty-state">${t('trends_noSalesYetPeriod')}</div>`}
    <h3 class="sub-title">${t('trends_slowMoversTitle')}</h3>
    ${slowMovers.length? `<table><thead><tr><th>${t('th_item')}</th><th class="num">${t('th_sold')}</th><th class="num">${t('th_stock')}</th><th class="num">${t('th_sellThrough')}</th></tr></thead><tbody>${slowMovers.map(renderMoverRow).join('')}</tbody></table>` : `<div class="empty-state">${t('trends_noStockToCompare')}</div>`}
  `;
}
</script>

/* ---- 1. Reorder Suggestions ---- */
async function renderReorderSuggestions(){
  const wrap = document.getElementById('reqSubtabContent');
  const [products, bills, suppliers] = await Promise.all([scopedGetAll('products'), scopedLiveBills(), scopedGetAll('suppliers')]);
  const since = new Date(); since.setDate(since.getDate()-30);
  const soldByVariant = {};
  bills.filter(b=>new Date(b.date)>=since).forEach(b=>(b.items||[]).forEach(it=>{
    const key = variantKey(it);
    soldByVariant[key] = (soldByVariant[key]||0) + it.qty;
  }));
  const supplierById = {}; suppliers.forEach(s=>supplierById[s.id]=s);

  const suggestions = [];
  products.forEach(p=>(p.variants||[]).forEach((v,vi)=>{
    const key = v.sku ? ('sku:'+v.sku) : ('pv:'+p.id+':'+(v.size||'')+':'+(v.color||''));
    const sold = soldByVariant[key] || 0;
    const velocity = sold/30;
    const threshold = (v.lowStock!=null?v.lowStock:SETTINGS.lowStockDefault);
    const daysOfStock = velocity>0 ? v.stock/velocity : Infinity;
    const needsReorder = v.stock<=threshold || (velocity>0 && daysOfStock<14);
    if(!needsReorder) return;
    const suggestedQty = velocity>0 ? Math.max(1, Math.ceil(velocity*30) - v.stock) : Math.max(1, threshold*2 - v.stock);
    suggestions.push({
      productId:p.id, variantIndex:vi, productName:p.name,
      variantLabel: [v.size,v.color].filter(Boolean).join('/') || v.sku || t('inv_defaultVariant'),
      stock:v.stock, sold30d:sold, daysOfStock: isFinite(daysOfStock)?Math.round(daysOfStock):null,
      suggestedQty, rate: v.costPrice||0,
      preferredSupplierId: p.preferredSupplierId || null
    });
  }));
  suggestions.sort((a,b)=> (a.daysOfStock==null?999:a.daysOfStock) - (b.daysOfStock==null?999:b.daysOfStock));

  if(suggestions.length===0){
    wrap.innerHTML = `<div class="card"><div class="empty-state">${t('vendor_noReorderNeeded')}</div></div>`;
    return;
  }
  wrap.innerHTML = `
    <div class="card">
      <h2 class="section-title">${iconSVG('requirements')} ${t('vendor_suggestedReordersTitle')}</h2>
      <p class="muted" style="font-size:12px;margin-top:-4px;">${t('vendor_reorderHelpText')}</p>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm" id="bulkCreatePOBtn">${t('vendor_createPOsForSelectedBtn')}</button>
        <span class="muted" id="bulkSelCount" style="font-size:12px;">0 selected</span>
      </div>
      <table>
        <thead><tr><th><input type="checkbox" id="reorderSelectAll"></th><th>${t('th_product')}</th><th>${t('th_variant')}</th><th class="num">${t('th_stock')}</th><th class="num">${t('th_sold30d')}</th><th class="num">${t('th_daysLeft')}</th><th class="num">${t('th_suggestedQty')}</th><th>${t('th_preferredSupplier')}</th><th></th></tr></thead>
        <tbody>
          ${suggestions.map((s,i)=>`
            <tr>
              <td><input type="checkbox" class="reorderChk" data-idx="${i}"></td>
              <td>${escapeHTML(s.productName)}</td>
              <td>${escapeHTML(s.variantLabel)}</td>
              <td class="num">${s.stock}</td>
              <td class="num">${s.sold30d}</td>
              <td class="num">${s.daysOfStock==null?'—':s.daysOfStock}</td>
              <td class="num">${s.suggestedQty}</td>
              <td>${s.preferredSupplierId && supplierById[s.preferredSupplierId] ? escapeHTML(supplierById[s.preferredSupplierId].name) : '<span class="muted" style="font-size:12px;">— not set</span>'}</td>
              <td><button class="btn btn-primary btn-sm" onclick="openPurchaseModal(${s.productId}, ${s.variantIndex}, ${s.suggestedQty})">Record Purchase</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;

  const updateSelCount = ()=>{
    const n = wrap.querySelectorAll('.reorderChk:checked').length;
    document.getElementById('bulkSelCount').textContent = n + ' selected';
  };
  wrap.querySelectorAll('.reorderChk').forEach(cb=>cb.addEventListener('change', updateSelCount));
  document.getElementById('reorderSelectAll').addEventListener('change', (e)=>{
    wrap.querySelectorAll('.reorderChk').forEach(cb=>cb.checked = e.target.checked);
    updateSelCount();
  });

  document.getElementById('bulkCreatePOBtn').addEventListener('click', async ()=>{
    if(!requireWorkingFirm(t('action_createPurchaseOrders'))) return;
    const checked = Array.from(wrap.querySelectorAll('.reorderChk:checked')).map(cb=>suggestions[parseInt(cb.dataset.idx)]);
    if(checked.length===0){ toast(t('toast_selectAtLeastOneItem'),'error'); return; }
    const withSupplier = checked.filter(s=>s.preferredSupplierId && supplierById[s.preferredSupplierId]);
    const withoutSupplier = checked.filter(s=>!(s.preferredSupplierId && supplierById[s.preferredSupplierId]));
    if(withSupplier.length===0){
      toast(t('toast_noPreferredSupplierSet'),'error');
      return;
    }
    const groups = {};
    withSupplier.forEach(s=>{
      if(!groups[s.preferredSupplierId]) groups[s.preferredSupplierId] = [];
      groups[s.preferredSupplierId].push(s);
    });
    let createdCount = 0;
    for(const supplierId of Object.keys(groups)){
      const items = groups[supplierId].map(s=>({
        productId:s.productId, variantIndex:s.variantIndex, productName:s.productName,
        variantLabel:s.variantLabel, qty:s.suggestedQty, rate:s.rate
      }));
      const newId = await dbAdd('purchaseOrders', {supplierId:parseInt(supplierId), items, notes:'Auto-generated from Reorder Suggestions', status:'draft', date:new Date().toISOString(), firmId: firmIdForStockOps()});
      const fresh = await dbGet('purchaseOrders', newId);
      fresh.poNumber = 'PO-' + String(newId).padStart(4,'0');
      await dbPut('purchaseOrders', fresh);
      createdCount++;
    }
    let msg = `Created ${createdCount} draft purchase order${createdCount===1?'':'s'}`;
    if(withoutSupplier.length>0) msg += ` (skipped ${withoutSupplier.length} item${withoutSupplier.length===1?'':'s'} with no Preferred Supplier)`;
    toast(msg, 'success');
    REQ_STATE.subtab = 'po';
    document.querySelectorAll('#reqSubtabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab==='po'));
    await renderReqSubtab();
  });
}

  wrap.innerHTML = `

      <thead><tr><th>${t('th_supplier')}</th><th>${t('th_type')}</th><th>${t('th_phone')}</th><th>${t('th_terms')}</th><th class="num">${t('th_balanceDue')}</th><th class="num">${t('th_advance')}</th><th>${t('th_actions')}</th></tr></thead>
      <tbody>
        ${suppliers.map(s=>`
          <tr style="${s.active===false?'opacity:.55;':''}">
            <td>${escapeHTML(s.name)}${s.active===false?` <span class="tag tag-red" style="font-size:10px;">${t('firm_inactiveTag')}</span>`:''}</td>
            <td>${escapeHTML(s.vendorType?dv(s.vendorType):'-')}</td>
            <td>${escapeHTML(s.phone||'-')}</td>
            <td>${escapeHTML(paymentTermsLabel(s.paymentTerms))}</td>
            <td class="num">${(s.balanceDue||0)>0?`<span class="tag tag-red">${fmtMoney(s.balanceDue)}</span>`:`<span class="tag tag-green">${fmtMoney(0)}</span>`}</td>
            <td class="num">${(s.advanceBalance||0)>0?`<span class="tag tag-green">${fmtMoney(s.advanceBalance)}</span>`:'-'}</td>
            <td>
              <button class="btn btn-outline btn-sm" onclick="viewSupplierLedger(${s.id})">${t('cust_ledgerBtn')}</button>
              <button class="btn btn-outline btn-sm" onclick="openSupplierModal(${s.id})">${t('acct_editBtn')}</button>
              <button class="btn btn-danger btn-sm" onclick="deleteSupplierConfirm(${s.id})">${t('acct_deleteBtn')}</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

const VENDOR_TYPES = ['Fabric','Accessories','Packaging','Trims','Other'];
const PAYMENT_TERMS = [
  {value:'cod', label:'Cash on Delivery', key:'terms_cod'},
  {value:'net15', label:'Net 15 days', key:'terms_net15'},
  {value:'net30', label:'Net 30 days', key:'terms_net30'},
  {value:'net45', label:'Net 45 days', key:'terms_net45'},
  {value:'advance', label:'Advance Required', key:'terms_advance'}
];
function paymentTermsLabel(v){ const e = PAYMENT_TERMS.find(x=>x.value===v); return e ? t(e.key) : t('terms_cod'); }
function paymentTermsDays(v){ return v==='net15'?15 : v==='net30'?30 : v==='net45'?45 : 0; }

function openSupplierModal(supplierId){
  if(!supplierId && !requireWorkingFirm(t('action_addVendor'))) return;
  const load = supplierId ? dbGet('suppliers', supplierId) : Promise.resolve(null);
  load.then(supplier=>{
    openModal({
      title: supplier?t('modal_editSupplier'):t('modal_addSupplier'),
      bodyHTML:`
        <div class="row">
          <div class="col field"><label>${t('staff_nameLabel')}</label><input id="sf_name" value="${escapeHTML(supplier?supplier.name:'')}"></div>
          <div class="col field"><label>${t('vendor_vendorTypeLabel')}</label>
            <select id="sf_type">${VENDOR_TYPES.map(vt=>`<option value="${escapeHTML(vt)}" ${supplier&&supplier.vendorType===vt?'selected':''}>${escapeHTML(dv(vt))}</option>`).join('')}</select>
          </div>
        </div>
        <div class="row">
          <div class="col field"><label>${t('settings_phone')}</label><input id="sf_phone" value="${escapeHTML(supplier?supplier.phone:'')}"></div>
          <div class="col field"><label>${t('vendor_contactPersonLabel')}</label><input id="sf_contact" value="${escapeHTML(supplier?(supplier.contactPerson||''):'')}" placeholder="${t('vendor_salesRepNamePlaceholder')}"></div>
        </div>
        <div class="row">
          <div class="col field"><label>${t('vendor_alternatePhoneLabel')}</label><input id="sf_altphone" value="${escapeHTML(supplier?(supplier.altPhone||''):'')}"></div>
          <div class="col field"><label>${t('vendor_emailLabel')}</label><input id="sf_email" type="email" value="${escapeHTML(supplier?(supplier.email||''):'')}"></div>
        </div>
        <div class="field"><label>${t('settings_address')}</label><input id="sf_address" value="${escapeHTML(supplier?(supplier.address||supplier.notes||''):'')}"></div>
        <div class="row">
          <div class="col field"><label>${t('settings_gstinOptional')}</label><input id="sf_gst" value="${escapeHTML(supplier?(supplier.gstNumber||''):'')}"></div>
          <div class="col field">
            <label>${t('vendor_openingBalanceLabel')}${supplier?' <span class="muted" style="font-weight:400;">(set once, at creation)</span>':''}</label>
            <input id="sf_opening" type="number" min="0" step="0.01" value="${supplier?(supplier.openingBalance||0):0}" ${supplier?'disabled':''}>
          </div>
        </div>
        <div class="row">
          <div class="col field"><label>${t('vendor_paymentTermsLabel')}</label>
            <select id="sf_terms">${PAYMENT_TERMS.map(pt=>`<option value="${pt.value}" ${supplier&&supplier.paymentTerms===pt.value?'selected':''}>${escapeHTML(t(pt.key))}</option>`).join('')}</select>
          </div>
          <div class="col field"><label>${t('vendor_creditLimitLabel')}</label><input id="sf_creditlimit" type="number" min="0" step="1" value="${supplier?(supplier.creditLimit||0):0}"></div>
        </div>
        <h3 class="sub-title">${t('vendor_bankUpiDetailsTitle')}</h3>
        <div class="row">
          <div class="col field"><label>${t('vendor_accountNameLabel')}</label><input id="sf_bankname" value="${escapeHTML(supplier?(supplier.bankAccountName||''):'')}"></div>
          <div class="col field"><label>${t('vendor_accountNumberLabel')}</label><input id="sf_bankacc" value="${escapeHTML(supplier?(supplier.bankAccountNumber||''):'')}"></div>
        </div>
        <div class="row">
          <div class="col field"><label>${t('vendor_ifscLabel')}</label><input id="sf_ifsc" value="${escapeHTML(supplier?(supplier.bankIFSC||''):'')}"></div>
          <div class="col field"><label>${t('vendor_upiIdLabel')}</label><input id="sf_upi" value="${escapeHTML(supplier?(supplier.upiId||''):'')}"></div>
        </div>
        <div class="field"><label>${t('alter_notesLabel')}</label><input id="sf_notes" value="${escapeHTML(supplier?(supplier.vendorNotes||''):'')}" placeholder="${t('vendor_vendorNotesPlaceholder')}"></div>
        ${supplier?`<label style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;cursor:pointer;margin-top:6px;">
          <input type="checkbox" id="sf_active" ${supplier.active!==false?'checked':''} style="width:auto;"> ${t('vendor_activeCheckboxLabel')}
        </label>`:''}
      `,
      footerHTML:`<button class="btn btn-outline" onclick="closeModal()">${t('acct_cancelBtn')}</button><button class="btn btn-primary" id="sf_save">${supplier?'Save':'Add'}</button>`,
      onMount:()=>{
        document.getElementById('sf_save').addEventListener('click', async ()=>{
          const name = document.getElementById('sf_name').value.trim();
          if(!name){ toast(t('toast_nameRequired'),'error'); return; }
          const common = {
            phone: document.getElementById('sf_phone').value.trim(),
            address: document.getElementById('sf_address').value.trim(),
            gstNumber: document.getElementById('sf_gst').value.trim(),
            vendorType: document.getElementById('sf_type').value,
            contactPerson: document.getElementById('sf_contact').value.trim(),

            email: document.getElementById('sf_email').value.trim(),

            upiId: document.getElementById('sf_upi').value.trim(),

            if(changed.length) supAudit(supplier, 'details edited', changed.map(k=>k+': "'+(k==='active'?(before.active!==false):(before[k]==null?'':before[k]))+'" → "'+(k==='active'?supplier.active:common[k])+'"').join('; '));

          } else {
            const openingBalance = Math.max(0, parseFloat(document.getElementById('sf_opening').value)||0);

/* ---- Advanced vendor ledger (debit/credit/running balance statement) ---- */
function isLedgerDebit(l){
  return l.type==='purchase' || l.type==='opening' || (l.type==='adjustment' && l.direction==='debit') || (l.type==='reversal' && l.direction==='debit');
}
function ledgerTypeTag(l){
  const v = l.voided ? ' <span class="tag tag-red">'+t('led_voidTag')+'</span>' : '';
  if(l.type==='reversal') return '<span class="tag tag-amber">'+t('led_reversalTag')+'</span>';
  if(l.voided){ const base = ledgerTypeTag(Object.assign({}, l, {voided:false})); return base + v; }
  if(l.type==='purchase') return '<span class="tag tag-red">Purchase</span>';
  if(l.type==='return') return '<span class="tag tag-amber">Return</span>';
  if(l.type==='opening') return '<span class="tag tag-amber">Opening Balance</span>';
  if(l.type==='adjustment') return l.direction==='debit' ? '<span class="tag tag-red">Adjustment (Dr)</span>' : '<span class="tag tag-green">Adjustment (Cr)</span>';
  return '<span class="tag tag-green">Payment</span>';
}

let LEDGER_INV_MAP = {};
// Is this ledger row (or the bill it belongs to) GST or Not GST?  {kind:'gst'|'none'|null, amount, own}
function ledgerGstInfo(l){
  const inv = l.invoiceId ? LEDGER_INV_MAP[l.invoiceId] : null;
  const fromInv = inv ? {kind: inv.gstMode==='none' ? 'none' : ((inv.gstAmount||0)>0 ? 'gst' : null), amount: inv.gstAmount||0} : {kind:null, amount:0};
  if(l.type==='purchase'){
    if(l.gst) return {kind: l.gst.mode==='report' ? 'gst' : 'none', amount: l.gst.amount||0, own:true};
    return Object.assign({own:true}, fromInv);
  }
  if(l.type==='payment' || l.type==='reversal') return Object.assign({own:false}, fromInv);
  return {kind:null, amount:0};
}
function ledgerGstTag(l){
  const g = ledgerGstInfo(l);
  if(!g.kind) return '';
  if(g.own) return g.kind==='gst' ? `<span class="tag tag-green" style="font-size:10.5px;">${escapeHTML(fillTpl(t('led_tagGst'),[g.amount>0?fmtMoney(g.amount):'']).trim())}</span>` : `<span class="tag" style="font-size:10.5px;">${t('led_tagNoGst')}</span>`;
  return g.kind==='gst' ? `<span class="tag tag-green" style="font-size:10.5px;">${t('led_tagGstBill')}</span>` : `<span class="tag" style="font-size:10.5px;">${t('led_tagNoGstBill')}</span>`;
}
function ledgerGstText(l){
  const g = ledgerGstInfo(l);
  if(!g.kind) return '';
  if(g.own) return g.kind==='gst' ? ('GST'+(g.amount>0?' '+g.amount:'')) : 'Not GST';
  return g.kind==='gst' ? 'GST bill' : 'Non-GST bill';
}
function ledgerVoidLine(l){
  return l.voided ? fillTpl(t('led_reasonLine'), [fmtStamp(l.voidedAt), l.voidedBy||'', l.voidReason||'']) : '';
}
function ledgerDetailsHTML(l){
  let h = escapeHTML(l.note||'');
  const tag = ledgerGstTag(l); if(tag) h += ' ' + tag;
  if(l.billNo) h += ` <span class="muted" style="font-size:11px;">[${escapeHTML(l.billNo)}]</span>`;
  if(l.voided) h = `<span style="text-decoration:line-through;">${h}</span><div style="color:var(--red);font-size:11.5px;">${escapeHTML(ledgerVoidLine(l))}</div>`;
  return h;
}

/* ---- Voiding (Owner PIN + reason): the only way to correct a purchase / payment / adjustment / return ---- */
async function voidInvoiceRecord(inv, reason, removeStock, stamp){
  inv.voided = true; inv.voidedAt = stamp.at; inv.voidedBy = stamp.by; inv.voidReason = reason; inv.status = 'void';
  if(removeStock){
    for(const it of (inv.items||[])){
      const product = await dbGet('products', it.productId);
      if(!product || !product.variants[it.variantIndex]) continue;
      const v = product.variants[it.variantIndex];
      const prev = Number(v.stock||0), take = Math.min(prev, it.qty);
      if(take<=0) continue;
      adjustFirmStock(v, product.firmId, -take);
      await dbPut('products', product);
      await dbAdd('stockAdjustments', {productId:it.productId, variantIndex:it.variantIndex, productName:product.name,
        variantLabel:[v.size,v.color].filter(Boolean).join('/') || v.sku || '', sku:v.sku||'', firmId:product.firmId,
        delta:v.stock-prev, previousStock:prev, newStock:v.stock, reason:'Purchase voided', note:(inv.invoiceNumber||'')+' — '+reason, date:stamp.at, user:stamp.by});
    }
    inv.stockRemoved = true;
  }
  for(const h of (await dbGetAll('purchasePriceHistory'))){ if(h.invoiceId===inv.id) await dbDelete('purchasePriceHistory', h.id); }
  await dbPut('purchaseInvoices', inv);
}

async function executeVoid(supplierId, entryId, invId, reason, stockFlag){
  const stamp = stampNow();
  if(supplierId){
    const supplier = await dbGet('suppliers', supplierId);
    const work = JSON.parse(JSON.stringify(supplier));      // all-or-nothing: only saved if every step works
    const row = work.ledger.find(l=>l.entryId===entryId);
    if(!isVoidable(row)){ toast(t('toast_voidAlready'),'error'); return false; }
    let targets = [row];
    if(row.type==='purchase' && row.invoiceId) targets = work.ledger.filter(l=>l.type==='purchase' && l.invoiceId===row.invoiceId && isVoidable(l));
    try{ targets.forEach(tg=>reverseLedgerRow(work, tg, reason)); }
    catch(e){ toast(String(e.message||e),'error'); return false; }
    if(row.type==='payment' && row.invoiceId){
      const inv = await dbGet('purchaseInvoices', row.invoiceId);
      const pay = inv && (inv.payments||[]).find(x=>x.entryId===row.entryId);
      if(pay){
        pay.voided = true; pay.voidedAt = stamp.at; pay.voidedBy = stamp.by; pay.voidReason = reason;
        inv.paid = r2m(Math.max(0, (inv.paid||0) - pay.amount)); inv.paidNow = inv.paid;
        inv.status = inv.voided ? 'void' : (inv.paid<=0.001 ? 'unpaid' : (inv.paid+0.01>=inv.total ? 'paid' : 'partial'));
        await dbPut('purchaseInvoices', inv);
      }
    }
    if(row.type==='purchase' && row.invoiceId){
      const inv = await dbGet('purchaseInvoices', row.invoiceId);
      if(inv) await voidInvoiceRecord(inv, reason, stockFlag, stamp);
    }
    if(row.type==='return' && row.returnId){
      const ret = await dbGet('purchaseReturns', row.returnId);
      if(ret){
        ret.voided = true; ret.voidedAt = stamp.at; ret.voidedBy = stamp.by; ret.voidReason = reason;
        if(stockFlag){
          for(const it of (ret.items||[])){
            const product = await dbGet('products', it.productId);
            if(!product || !product.variants[it.variantIndex]) continue;
            const v = product.variants[it.variantIndex], prev = Number(v.stock||0);
            adjustFirmStock(v, product.firmId, it.qty); await dbPut('products', product);
            await dbAdd('stockAdjustments', {productId:it.productId, variantIndex:it.variantIndex, productName:product.name,
              variantLabel:[v.size,v.color].filter(Boolean).join('/') || v.sku || '', sku:v.sku||'', firmId:product.firmId,
              delta:v.stock-prev, previousStock:prev, newStock:v.stock, reason:'Purchase return voided', note:(ret.returnNumber||'')+' — '+reason, date:stamp.at, user:stamp.by});
          }
        }
        await dbPut('purchaseReturns', ret);
      }
    }
    supAudit(work, 'void', ledgerTypeWord(row)+(row.invoiceNo?(' '+row.invoiceNo):'')+' '+row.amount+' — '+reason);
    await dbPut('suppliers', work);
    return true;
  }
  const inv = await dbGet('purchaseInvoices', invId);
  if(!inv || inv.voided) return false;
  await voidInvoiceRecord(inv, reason, stockFlag, stamp);
  return true;
}

function computeLedgerRows(supplier){
  // Sort by calendar day, then by original recording order within the same day — entries are
  // always pushed at the moment they occur, so array order is the true chronological tiebreaker.
  // (Some entries store an exact instant while others store a fixed noon time for a picked date,
  // so comparing raw timestamps can misorder two same-day entries; comparing just the day avoids that.)
  const entries = (supplier.ledger||[]).map((l,idx)=>({...l, _idx:idx}));
  entries.sort((a,b)=>{
    const dayA = (a.date||'').slice(0,10);
    const dayB = (b.date||'').slice(0,10);
    if(dayA !== dayB) return dayA < dayB ? -1 : 1;
    return a._idx - b._idx;
  });
  let running = 0;
  return entries.map(l=>{
    const debit = isLedgerDebit(l) ? l.amount : 0;
    const credit = !isLedgerDebit(l) ? l.amount : 0;
    running = Math.round((running + debit - credit)*100)/100;
    return {...l, debit, credit, balanceAfter: running};
  });
}

function shareVendorLedgerOnWhatsApp(supplier, rows){
  const recent = rows.slice(-5);
  const lines = recent.map(r=> `${fmtDate(r.date)}: ${r.debit>0?'Dr '+fmtMoney(r.debit):'Cr '+fmtMoney(r.credit)} — ${r.note||r.type}`);
  const text = `${t('wa_ledgerStatementPrefix')}${supplier.name}\nWith: ${SETTINGS.name||t('wa_usFallback')}\nBalance Due: ${fmtMoney(supplier.balanceDue||0)}\nAdvance Available: ${fmtMoney(supplier.advanceBalance||0)}${lines.length?`\n\nRecent entries:\n${lines.join('\n')}`:''}`;

function exportVendorLedgerCSV(supplier, rows){
  const lines = [toCSVRow(['Date','Entered at','Entered by','Type','Invoice','Supplier bill no','GST','Note','Debit','Credit','Balance','Status','Void reason'])];
  rows.forEach(r=>{
    lines.push(toCSVRow([fmtDate(r.date), r.at ? new Date(r.at).toLocaleString(localeTag()) : '', r.by||'', r.type==='adjustment'?('adjustment-'+(r.direction||'')):r.type, r.invoiceNo||'', r.billNo||'', ledgerGstText(r), r.note||'', r.debit||0, r.credit||0, r.balanceAfter,
      r.voided ? ('VOIDED '+(r.voidedAt?new Date(r.voidedAt).toLocaleString(localeTag()):'')+' by '+(r.voidedBy||'')) : (r.type==='reversal'?'reversal':''), r.voidReason||'']));
  });
  const blob = new Blob([lines.join('\r\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ledger-'+supplier.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'-'+todayISO()+'.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast(t('toast_ledgerExported'),'success');
}
function openLedgerAdjustmentModal(supplierId){
  openModal({
    title:t('modal_addLedgerAdjustment'),
    bodyHTML:`
      <p class="muted" style="font-size:12.5px;">Use this for corrections that aren't a purchase or payment — e.g. a discount the vendor granted, a damage/shortage claim, or fixing a data-entry mistake.</p>
      <div class="field">
        <label>Direction</label>
        <select id="adj_direction">
          <option value="credit">Decreases what we owe (Credit — e.g. discount, damage claim)</option>
          <option value="debit">Increases what we owe (Debit — e.g. extra charges)</option>
        </select>
      </div>
      <div class="row">
        <div class="col field"><label>${t('acct_expAmountLabel')}</label><input id="adj_amount" type="number" min="0" step="0.01" value="0"></div>
        <div class="col field"><label>${t('acct_csvDate')}</label><input id="adj_date" type="date" value="${todayISO()}"></div>
      </div>
      <div class="field"><label>Reason / Note *</label><input id="adj_note" placeholder="e.g. 5% discount on Invoice INV-0012"></div>
    `,
    footerHTML:`<button class="btn btn-outline" onclick="closeModal()">${t('acct_cancelBtn')}</button><button class="btn btn-primary" id="adj_save">Save Adjustment</button>`,
    onMount:()=>{
      document.getElementById('adj_save').addEventListener('click', ()=>{
        const amount = Math.max(0, parseFloat(document.getElementById('adj_amount').value)||0);
        const direction = document.getElementById('adj_direction').value;
        const note = document.getElementById('adj_note').value.trim();
        const dateVal = document.getElementById('adj_date').value || todayISO();
        const date = new Date(dateVal+'T12:00:00').toISOString();
        if(amount<=0){ toast(t('toast_enterValidAmount'),'error'); return; }
        if(!note){ toast(t('toast_enterAdjustmentReason'),'error'); return; }
        requireOwnerApproval('Adding a manual ledger adjustment', async ()=>{
          const fresh = await dbGet('suppliers', supplierId);
          if(direction==='debit'){
            supPost(fresh, {date, type:'adjustment', direction, amount, note}, amount, 0);
          } else {
            const fromBalance = Math.min(amount, fresh.balanceDue||0);
            const toAdvance = r2m(amount-fromBalance);
            supPost(fresh, {date, type:'adjustment', direction, amount, note}, -fromBalance, toAdvance);
          }
          supAudit(fresh, 'adjustment', (direction==='debit'?'Dr ':'Cr ')+amount+' — '+note);
          await dbPut('suppliers', fresh);
          toast(t('toast_adjustmentRecorded'),'success');
          await viewSupplierLedger(supplierId);
          refreshSupplierSurfaces();
        });
      });
    }
  });
}

/* ---- Vendor payments: advance / against-invoice, with mode + reference ---- */
async function openVendorPaymentModal(supplierId, prefillInvoiceId, returnToLedger){
  const supplier = await dbGet('suppliers', supplierId);
  const allInvoices = await scopedGetAll('purchaseInvoices');
  const openInvoices = allInvoices.filter(inv=>inv.supplierId===supplierId && !inv.voided && (inv.status||'unpaid')!=='paid')
    .sort((a,b)=>new Date(a.date)-new Date(b.date));

  const invoiceOptionsHTML = openInvoices.map(inv=>{
    const outstanding = Math.round((inv.total-(inv.paid||0))*100)/100;
    return `<option value="${inv.id}" ${prefillInvoiceId===inv.id?'selected':''}>${escapeHTML(inv.invoiceNumber)} — due ${fmtMoney(outstanding)}</option>`;
  }).join('');

  openModal({
    title:t('modal_recordPaymentPrefix')+supplier.name,
    bodyHTML:`
      <div class="field">
        <label>Payment Type</label>
        <select id="vp_type">
          <option value="invoice" ${openInvoices.length===0?'disabled':''}>Against a Purchase Invoice</option>
          <option value="advance">Advance / On Account (not tied to a specific invoice)</option>
        </select>
      </div>
      <div id="vp_invoiceWrap" class="field" style="${openInvoices.length===0?'display:none;':''}">
        <label>${t('acct_csvInvoice')}</label>
        <select id="vp_invoice">${invoiceOptionsHTML || '<option value="">No open invoices</option>'}</select>
      </div>
      <div class="row">
        <div class="col field"><label>${t('acct_expAmountLabel')}</label><input id="vp_amount" type="number" min="0" step="0.01" value="0"></div>
        <div class="col field"><label>${t('acct_csvMode')}</label><select id="vp_mode"><option value="Cash">${t('cust_cashOption')}</option><option value="UPI">${t('cust_upiOption')}</option><option value="Bank Transfer">${t('vendor_paymentModeBankTransfer')}</option><option value="Cheque">${t('vendor_paymentModeCheque')}</option></select></div>
      </div>
      <div class="row">
        <div class="col field"><label>Reference / Cheque # (optional)</label><input id="vp_ref"></div>
        <div class="col field"><label>${t('acct_csvDate')}</label><input id="vp_date" type="date" value="${todayISO()}"></div>
      </div>
      <div class="field"><label>${t('sales_noteOptionalLabel')}</label><input id="vp_note"></div>
      <p class="muted" style="font-size:11.5px;" id="vp_hint"></p>
    `,
    footerHTML:`<button class="btn btn-outline" onclick="closeModal()">${t('acct_cancelBtn')}</button><button class="btn btn-primary" id="vp_save">${t('vendor_recordPaymentBtn')}</button>`,
    onMount:()=>{
      const typeSel = document.getElementById('vp_type');
      const invWrap = document.getElementById('vp_invoiceWrap');
      const hint = document.getElementById('vp_hint');
      const updateHint = ()=>{
        if(typeSel.value==='invoice'){
          invWrap.style.display='';
          hint.textContent = 'This payment settles part or all of the selected invoice.';
        } else {
          invWrap.style.display='none';
          hint.textContent = 'Not linked to any invoice — reduces the outstanding balance first, and anything extra is kept as an advance for a future purchase.';
        }
      };
      if(prefillInvoiceId){ typeSel.value = 'invoice'; }
      else if(openInvoices.length===0){ typeSel.value = 'advance'; }
      updateHint();
      typeSel.addEventListener('change', updateHint);

      document.getElementById('vp_save').addEventListener('click', async ()=>{
        const amount = Math.max(0, parseFloat(document.getElementById('vp_amount').value)||0);
        if(amount<=0){ toast(t('toast_enterValidAmount'),'error'); return; }
        const mode = document.getElementById('vp_mode').value;
        const reference = document.getElementById('vp_ref').value.trim();
        const note = document.getElementById('vp_note').value.trim();
        const dateVal = document.getElementById('vp_date').value || todayISO();
        const date = new Date(dateVal+'T12:00:00').toISOString();
        const type = typeSel.value;
        const refSuffix = reference ? ' (Ref: '+reference+')' : '';

        const fresh = await dbGet('suppliers', supplierId);
        const pStamp = stampNow();

        if(type==='invoice'){
          const invId = parseInt(document.getElementById('vp_invoice').value);
          if(!invId){ toast(t('toast_selectInvoice'),'error'); return; }
          const inv = await dbGet('purchaseInvoices', invId);
          const outstanding = r2m(inv.total-(inv.paid||0));
          const applied = Math.min(amount, outstanding);
          const row = supPost(fresh, {date, type:'payment', amount:applied, mode, reference, invoiceId:inv.id, invoiceNo:inv.invoiceNumber,
            note: mode+' payment for '+inv.invoiceNumber+refSuffix+(note?' — '+note:'')}, -applied, 0);
          inv.payments = inv.payments||[];
          inv.payments.push({entryId:row.entryId, at:pStamp.at, by:pStamp.by, date, amount:applied, mode, reference, note});
          inv.paid = r2m((inv.paid||0)+applied);
          inv.status = inv.paid+0.01>=inv.total ? 'paid' : (inv.paid>0 ? 'partial' : 'unpaid');
          await dbPut('purchaseInvoices', inv);
          if(amount>applied){
            const leftover = r2m(amount-applied);
            supPost(fresh, {date, type:'payment', amount:leftover, mode, reference, source:'advance_extra', invoiceNo:inv.invoiceNumber,
              note: mode+' — extra beyond invoice due, kept as advance'+refSuffix}, 0, leftover);
          }
        } else {
          const fromBalance = Math.min(amount, fresh.balanceDue||0);
          const toAdvance = r2m(amount-fromBalance);
          supPost(fresh, {date, type:'payment', amount, mode, reference, note: mode+' advance/on-account payment'+refSuffix+(note?' — '+note:'')}, -fromBalance, toAdvance);
        }

        await dbPut('suppliers', fresh);
        toast(t('toast_paymentRecorded'),'success');        await dbPut('suppliers', fresh);
        toast(t('toast_paymentRecorded'),'success');
        if(returnToLedger){
          await viewSupplierLedger(supplierId);
          refreshSupplierSurfaces();
        } else {
          closeModal();
          await refreshSupplierSurfaces();
        }
      });
    }
  });
}

      const populateVariants = async ()=>{
        const pid = parseInt(document.getElementById('pu_product').value);
        const product = products.find(p=>p.id===pid);
        const variantSel = document.getElementById('pu_variant');
        variantSel.innerHTML = (product.variants||[]).map((v,i)=>{
          const label = [v.size,v.color].filter(Boolean).join('/') || v.sku || (t('inv_variantFallbackPrefix')+(i+1));
          return `<option value="${i}" ${i===presetVariantIndex?'selected':''}>${escapeHTML(label)}${t('pu_stockPrefix')}${v.stock})</option>`;
        }).join('');
        const vi = presetVariantIndex!=null && product.id===presetProductId ? presetVariantIndex : parseInt(variantSel.value)||0;
        const variant = product.variants[vi];
        if(variant) document.getElementById('pu_cost').value = variant.costPrice||0;
      };
      await populateVariants();
      document.getElementById('pu_product').addEventListener('change', populateVariants);

      const recalc = ()=>{
        const qty = parseFloat(document.getElementById('pu_qty').value)||0;
        const cost = parseFloat(document.getElementById('pu_cost').value)||0;
        const paid = parseFloat(document.getElementById('pu_paidnow').value)||0;
        const total = qty*cost;
        const due = Math.max(0, total-paid);
        const hasSupplier = !!document.getElementById('pu_supplier').value;
        document.getElementById('pu_summary').textContent = hasSupplier
          ? `${t('pu_totalCostPrefix')}${fmtMoney(total)}${t('pu_balanceDueSep')}${fmtMoney(due)}`
          : `${t('pu_totalCostPrefix')}${fmtMoney(total)}${t('pu_cashPurchaseNote')}${due>0?t('pu_unpaidNotTracked'):''}`;
      };
      ['pu_qty','pu_cost','pu_paidnow'].forEach(id=>document.getElementById(id).addEventListener('input', recalc));
      document.getElementById('pu_supplier').addEventListener('change', recalc);
      recalc();

      document.getElementById('pu_save').addEventListener('click', async ()=>{
        const pid = parseInt(document.getElementById('pu_product').value);
        const vi = parseInt(document.getElementById('pu_variant').value);
        const qty = parseInt(document.getElementById('pu_qty').value)||0;
        const cost = parseFloat(document.getElementById('pu_cost').value)||0;
        const paidNow = parseFloat(document.getElementById('pu_paidnow').value)||0;
        const supplierId = document.getElementById('pu_supplier').value ? parseInt(document.getElementById('pu_supplier').value) : null;
        if(qty<=0){ toast(t('toast_enterValidQuantity'),'error'); return; }

        const product = await dbGet('products', pid);
        product.variants[vi].stock = (product.variants[vi].stock||0) + qty;
        product.variants[vi].costPrice = cost;
        await dbPut('products', product);

        const total = qty*cost;
        const due = total - paidNow;
        const variantLabel = [product.variants[vi].size, product.variants[vi].color].filter(Boolean).join('/') || product.variants[vi].sku || '';
        let supplierName = '';
        if(supplierId){
          const supplier = await dbGet('suppliers', supplierId);
          supplierName = supplier.name;
          const nowIso = new Date().toISOString();
          supPost(supplier, {type:'purchase', date:nowIso, amount: total, gst:{mode:'none', amount:0}, note:`${qty} x ${product.name}${variantLabel?' ('+variantLabel+')':''}`}, total, 0);
          const puMode = (document.getElementById('pu_mode')||{}).value || 'Cash';
          if(paidNow>0) supPost(supplier, {type:'payment', date:nowIso, amount: paidNow, mode:puMode, note:'Paid at purchase'}, -paidNow, 0);
          await dbPut('suppliers', supplier);
        }
        await dbAdd('purchasePriceHistory', {
          productId:pid, variantIndex:vi, productName:product.name, variantLabel, price:cost, qty,
          supplierId, supplierName, invoiceId:null, date:new Date().toISOString()
        });
        closeModal();
        toast(t('toast_purchaseRecorded'),'success');
        await refreshLowStockBadge();
        await refreshSupplierSurfaces();
      });
    }
  });
}

/* ---- Shared helpers: period presets + per-bill tax breakdown ---- */
function periodPresetRange(preset){
  const now = new Date();
  if(preset==='thisMonth'){
    return { from: new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10), to: todayISO() };
  }
  if(preset==='lastMonth'){
    return { from: new Date(now.getFullYear(), now.getMonth()-1, 1).toISOString().slice(0,10), to: new Date(now.getFullYear(), now.getMonth(), 0).toISOString().slice(0,10) };
  }
  if(preset==='thisQuarter'){
    const q = Math.floor(now.getMonth()/3);
    return { from: new Date(now.getFullYear(), q*3, 1).toISOString().slice(0,10), to: todayISO() };
  }
  if(preset==='thisYear'){
    return { from: new Date(now.getFullYear(), 3, 1).getMonth()<=now.getMonth() ? new Date(now.getFullYear(), 3, 1).toISOString().slice(0,10) : new Date(now.getFullYear()-1, 3, 1).toISOString().slice(0,10), to: todayISO() };
  }
  return { from:'', to:'' };
}
function inRange(dateStr, from, to){
  const ts = new Date(dateStr).getTime();
  if(from){ const fromTs = new Date(from+'T00:00:00').getTime(); if(ts < fromTs) return false; }
  if(to){ const toTs = new Date(to+'T23:59:59').getTime(); if(ts > toTs) return false; }
  return true;
}
// One row per GST rate (and per way the price was quoted: tax added on top vs included in
// the price). Every GST report, the P&L and the printed bill read from here, so an
// inclusive-price bill (999 @5%) is reported as taxable 951.43 + GST 47.57 everywhere.
function billTaxBreakdown(bill){
  const byKey = {};
  (bill.items||[]).forEach(it=>{
    const lp = lineTaxParts(it);
    const tax = Math.round(lp.tax*100)/100;
    const taxable = Math.round((lp.gross - tax)*100)/100;
    const key = lp.rate + (lp.included?'i':'a');
    if(!byKey[key]) byKey[key] = {rate:lp.rate, included:lp.included, taxable:0, tax:0};
    byKey[key].taxable += taxable;
    byKey[key].tax += tax;
  });
  return Object.values(byKey).map(r=>{
    const tax = Math.round(r.tax*100)/100;
    const cgst = Math.round(tax/2*100)/100;
    return {
      rate:r.rate, included:r.included,
      taxable: Math.round(r.taxable*100)/100,
      tax, cgst,
      sgst: Math.round((tax-cgst)*100)/100     // CGST + SGST always add up to the exact tax (no stray paisa)
    };
  });
}
function renderPeriodFilterHTML(idPrefix){
  return `
    <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:flex-end;">
      <div class="col field" style="max-width:150px;margin-bottom:0;"><label style="font-size:11px;">${t('staff_fromLabel')}</label><input type="date" id="${idPrefix}_from"></div>

        <button type="button" class="btn btn-outline btn-sm" id="${idPrefix}_thisMonth">${t('acct_thisMonthBtn')}</button>
        <button type="button" class="btn btn-outline btn-sm" id="${idPrefix}_lastMonth">${t('acct_lastMonthBtn')}</button>
        <button type="button" class="btn btn-outline btn-sm" id="${idPrefix}_thisQuarter">${t('acct_thisQuarterBtn')}</button>
        <button type="button" class="btn btn-outline btn-sm" id="${idPrefix}_allTime">${t('acct_allTimeBtn')}</button>

function wirePeriodFilter(idPrefix, onChange){
  ['_from','_to'].forEach(suf=>document.getElementById(idPrefix+suf).addEventListener('change', onChange));
  document.getElementById(idPrefix+'_thisMonth').addEventListener('click', ()=>{
    const r = periodPresetRange('thisMonth');
    document.getElementById(idPrefix+'_from').value = r.from;
    document.getElementById(idPrefix+'_to').value = r.to;
    onChange();
  });
  document.getElementById(idPrefix+'_lastMonth').addEventListener('click', ()=>{
    const r = periodPresetRange('lastMonth');
    document.getElementById(idPrefix+'_from').value = r.from;
    document.getElementById(idPrefix+'_to').value = r.to;
    onChange();
  });
  document.getElementById(idPrefix+'_thisQuarter').addEventListener('click', ()=>{
    const r = periodPresetRange('thisQuarter');
    document.getElementById(idPrefix+'_from').value = r.from;
    document.getElementById(idPrefix+'_to').value = r.to;
    onChange();
  });
  document.getElementById(idPrefix+'_allTime').addEventListener('click', ()=>{
    document.getElementById(idPrefix+'_from').value = '';
    document.getElementById(idPrefix+'_to').value = '';
    onChange();
  });
}
function getPeriodValues(idPrefix){
  return { from: document.getElementById(idPrefix+'_from').value, to: document.getElementById(idPrefix+'_to').value };
