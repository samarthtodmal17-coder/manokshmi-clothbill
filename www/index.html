/* ---- GSTR-1: Outward Supplies ---- */
async function renderGSTR1(){
  const wrap = document.getElementById('accSubtabContent');
  const [bills, customers] = await Promise.all([scopedLiveBills(), scopedGetAll('customers')]);
  const custName = (id)=> id ? ((customers.find(c=>c.id===id)||{}).name || t('acct_customerFallback')) : t('bill_walkIn');

  wrap.innerHTML = `
    <div class="card">
      <h2 class="section-title">${iconSVG('accounts')} ${t('acct_gstr1Heading')}</h2>
      <p class="muted" style="font-size:12px;margin-top:-4px;">${t('acct_gstr1Desc')}</p>
      ${renderPeriodFilterHTML('g1')}
      <div id="g1SummaryWrap" class="stat-tiles" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px;"></div>
      <h3 class="sub-title">${t('acct_rateWiseSummary')}</h3>
      <div id="g1RateWrap" style="margin-bottom:14px;"></div>
      <div class="row" style="justify-content:space-between;align-items:center;">
        <h3 class="sub-title" style="margin:0;">${t('acct_invoiceWiseDetail')}</h3>
        <button class="btn btn-outline btn-sm" id="g1ExportBtn">${t('inv_exportCsvBtn')}</button>
      </div>
      <div style="max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:9px;margin-top:8px;">
        <table><thead><tr><th>${t('th_invoice')}</th><th>${t('th_date')}</th><th>${t('th_customer')}</th><th class="num">${t('th_taxableValue')}</th><th class="num">${t('th_cgst')}</th><th class="num">${t('th_sgst')}</th><th class="num">${t('th_totalTax')}</th><th class="num">${t('th_invoiceValue')}</th></tr></thead><tbody id="g1RowsBody"></tbody></table>
      </div>
    </div>
  `;

  let lastInvoiceRows = [];
  const compute = ()=>{
    const {from, to} = getPeriodValues('g1');
    const filtered = bills.filter(b=>inRange(b.date, from, to));
    const rateMap = {};
    const invoiceRows = filtered.map(b=>{
      const breakdown = billTaxBreakdown(b);
      let taxable=0, tax=0;
      breakdown.forEach(r=>{
        taxable += r.taxable; tax += r.tax;
        if(!rateMap[r.rate]) rateMap[r.rate] = {rate:r.rate, taxable:0, cgst:0, sgst:0, tax:0};
        rateMap[r.rate].taxable += r.taxable;
        rateMap[r.rate].cgst += r.cgst;
        rateMap[r.rate].sgst += r.sgst;
        rateMap[r.rate].tax += r.tax;
      });
      return {
        invoiceNo:b.invoiceNo, date:b.date, customer:custName(b.customerId),
        taxable: Math.round(taxable*100)/100, cgst: breakdown.reduce((s,r)=>s+r.cgst,0), sgst: breakdown.reduce((s,r)=>s+r.sgst,0),
        tax: Math.round(tax*100)/100, grandTotal: b.grandTotal
      };
    }).sort((a,b)=>new Date(a.date)-new Date(b.date));
    lastInvoiceRows = invoiceRows;

    const totalTaxable = Math.round(invoiceRows.reduce((s,r)=>s+r.taxable,0)*100)/100;
    const totalTax = Math.round(invoiceRows.reduce((s,r)=>s+r.tax,0)*100)/100;
    const totalCgst = Math.round(invoiceRows.reduce((s,r)=>s+r.cgst,0)*100)/100;
    const totalSgst = Math.round((totalTax-totalCgst)*100)/100;
    document.getElementById('g1SummaryWrap').innerHTML = `
      <div class="stat-tile"><div class="label">${t('acct_taxableValueLabel')}</div><div class="value small">${fmtMoney(totalTaxable)}</div></div>
      <div class="stat-tile"><div class="label">${t('acct_totalCgstLabel')}</div><div class="value small">${fmtMoney(totalCgst)}</div></div>
      <div class="stat-tile"><div class="label">${t('acct_totalSgstLabel')}</div><div class="value small">${fmtMoney(totalSgst)}</div></div>
      <div class="stat-tile"><div class="label">${t('acct_invoicesLabel')}</div><div class="value small">${invoiceRows.length}</div></div>
    `;

    const rateList = Object.values(rateMap).sort((a,b)=>a.rate-b.rate);
    document.getElementById('g1RateWrap').innerHTML = rateList.length ? `
      <table><thead><tr><th>${t('th_gstRate')}</th><th class="num">${t('th_taxableValue')}</th><th class="num">${t('th_cgst')}</th><th class="num">${t('th_sgst')}</th><th class="num">${t('th_totalTax')}</th></tr></thead>
      <tbody>${rateList.map(r=>`<tr><td>${r.rate}%</td><td class="num">${fmtMoney(r.taxable)}</td><td class="num">${fmtMoney(r.cgst)}</td><td class="num">${fmtMoney(r.sgst)}</td><td class="num">${fmtMoney(r.tax)}</td></tr>`).join('')}</tbody></table>
    ` : `<div class="empty-state">${t('staff_noSalesEmpty')}</div>`;

    document.getElementById('g1RowsBody').innerHTML = invoiceRows.length ? invoiceRows.map(r=>`
      <tr><td>${escapeHTML(r.invoiceNo)}</td><td>${fmtDate(r.date)}</td><td>${escapeHTML(r.customer)}</td><td class="num">${fmtMoney(r.taxable)}</td><td class="num">${fmtMoney(r.cgst)}</td><td class="num">${fmtMoney(r.sgst)}</td><td class="num">${fmtMoney(r.tax)}</td><td class="num">${fmtMoney(r.grandTotal)}</td></tr>
    `).join('') : `<tr><td colspan="8" class="muted" style="text-align:center;padding:16px;">${t('acct_noInvoicesInPeriodRow')}</td></tr>`;
  };
  wirePeriodFilter('g1', compute);
  compute();

  document.getElementById('g1ExportBtn').addEventListener('click', ()=>{
    const lines = [toCSVRow(['Invoice','Date','Customer','TaxableValue','CGST','SGST','TotalTax','InvoiceValue'])];
    lastInvoiceRows.forEach(r=>lines.push(toCSVRow([r.invoiceNo, fmtDate(r.date), r.customer, r.taxable, r.cgst, r.sgst, r.tax, r.grandTotal])));
    const blob = new Blob([lines.join('\r\n')], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'gstr1-'+todayISO()+'.csv';
    a.click();
    URL.revokeObjectURL(url);
    toast(t('toast_gstr1Exported'),'success');
  });
}

/* ---- Tax Rate-wise Summary (Sales + Purchases side by side) ---- */
async function renderTaxRateSummary(){
  const wrap = document.getElementById('accSubtabContent');
  const [bills, invoices] = await Promise.all([scopedLiveBills(), scopedGetAll('purchaseInvoices')]);

  wrap.innerHTML = `
    <div class="card">
      <h2 class="section-title">${iconSVG('accounts')} ${t('acct_taxRateSummaryHeading')}</h2>
      <p class="muted" style="font-size:12px;margin-top:-4px;">${t('acct_taxRateSummaryDesc')}</p>
      ${renderPeriodFilterHTML('tr')}
      <div class="row" style="align-items:flex-start;">
        <div class="col" style="flex:1;min-width:280px;">
          <h3 class="sub-title">${t('acct_salesByRate')}</h3>
          <div id="trSalesWrap"></div>
        </div>
        <div class="col" style="flex:1;min-width:280px;">
          <h3 class="sub-title">${t('acct_purchasesByRateInputTax')}</h3>
          <div id="trPurchWrap"></div>
        </div>
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="btn btn-outline btn-sm" id="trExportBtn">${t('inv_exportCsvBtn')}</button>
      </div>
    </div>
  `;

  let lastSalesRates = [], lastPurchRates = [];
  const compute = ()=>{
    const {from, to} = getPeriodValues('tr');
    const filteredBills = bills.filter(b=>inRange(b.date, from, to));
    const salesMap = {};
    filteredBills.forEach(b=>{
      billTaxBreakdown(b).forEach(r=>{
        if(!salesMap[r.rate]) salesMap[r.rate] = {rate:r.rate, taxable:0, tax:0};
        salesMap[r.rate].taxable += r.taxable;
        salesMap[r.rate].tax += r.tax;
      });
    });
    const salesRates = Object.values(salesMap).map(r=>({rate:r.rate, taxable:Math.round(r.taxable*100)/100, tax:Math.round(r.tax*100)/100})).sort((a,b)=>a.rate-b.rate);
    const totalSalesTaxable = Math.round(salesRates.reduce((s,r)=>s+r.taxable,0)*100)/100;
    lastSalesRates = salesRates;

    const filteredInv = invoices.filter(inv=>!inv.voided && inRange(inv.date, from, to) && (inv.gstAmount||0)>0);
    const purchMap = {};
    filteredInv.forEach(inv=>{
      const parts = (inv.gstSplits && inv.gstSplits.length) ? inv.gstSplits : [{rate:Number(inv.gstRate)||0, taxable:(inv.taxableValue||0), tax:(inv.gstAmount||0)}];
      parts.forEach(sp=>{
        const rate = Number(sp.rate)||0;
        if(!purchMap[rate]) purchMap[rate] = {rate, taxable:0, tax:0};
        purchMap[rate].taxable += (sp.taxable||0);
        purchMap[rate].tax += (sp.tax||0);
      });
    });
    const purchRates = Object.values(purchMap).map(r=>({rate:r.rate, taxable:Math.round(r.taxable*100)/100, tax:Math.round(r.tax*100)/100})).sort((a,b)=>a.rate-b.rate);
    lastPurchRates = purchRates;

    document.getElementById('trSalesWrap').innerHTML = salesRates.length ? `
      <table><thead><tr><th>${t('th_rate')}</th><th class="num">${t('th_taxable')}</th><th class="num">${t('th_tax')}</th><th class="num">${t('th_pctOfSales')}</th></tr></thead>
      <tbody>${salesRates.map(r=>`<tr><td>${r.rate}%</td><td class="num">${fmtMoney(r.taxable)}</td><td class="num">${fmtMoney(r.tax)}</td><td class="num">${totalSalesTaxable>0?Math.round(r.taxable/totalSalesTaxable*1000)/10:0}%</td></tr>`).join('')}</tbody></table>
    ` : `<div class="empty-state">${t('staff_noSalesEmpty')}</div>`;

    document.getElementById('trPurchWrap').innerHTML = purchRates.length ? `
      <table><thead><tr><th>${t('th_rate')}</th><th class="num">${t('th_taxable')}</th><th class="num">${t('th_taxItc')}</th></tr></thead>
      <tbody>${purchRates.map(r=>`<tr><td>${r.rate}%</td><td class="num">${fmtMoney(r.taxable)}</td><td class="num">${fmtMoney(r.tax)}</td></tr>`).join('')}</tbody></table>
    ` : `<div class="empty-state">${t('acct_noGstTaggedPurchases')}</div>`;
  };
  wirePeriodFilter('tr', compute);
  compute();

  document.getElementById('trExportBtn').addEventListener('click', ()=>{
    const lines = [toCSVRow(['Section','Rate','Taxable','Tax'])];
    lastSalesRates.forEach(r=>lines.push(toCSVRow(['Sales', r.rate, r.taxable, r.tax])));
    lastPurchRates.forEach(r=>lines.push(toCSVRow(['Purchases', r.rate, r.taxable, r.tax])));
    const blob = new Blob([lines.join('\r\n')], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'tax-rate-summary-'+todayISO()+'.csv';
    a.click();
    URL.revokeObjectURL(url);
    toast(t('toast_taxRateSummaryExported'),'success');
  });
}

async function renderGSTR3B(){

  wrap.innerHTML = `

    filteredBills.forEach(b=>{
      billTaxBreakdown(b).forEach(r=>{ outputTaxable+=r.taxable; outputCgst+=r.cgst; outputSgst+=r.sgst; outputTax+=r.tax; });
    });
    outputTaxable = Math.round(outputTaxable*100)/100; outputCgst = Math.round(outputCgst*100)/100;
    outputSgst = Math.round(outputSgst*100)/100; outputTax = Math.round(outputTax*100)/100;

    const filteredInv = invoices.filter(inv=>!inv.voided && inRange(inv.date, from, to) && (inv.gstAmount||0)>0);
    const inputTaxable = Math.round(filteredInv.reduce((s,inv)=>s+(inv.taxableValue||0),0)*100)/100;

    const inputCgst = Math.round(inputTax/2*100)/100;
    const inputSgst = Math.round(inputTax/2*100)/100;

    const net = Math.round((outputTax - inputTax)*100)/100;
    lastSummary = {from, to, outputTaxable, outputCgst, outputSgst, outputTax, inputTaxable, inputCgst, inputSgst, inputTax, net};

      <div style="display:flex;justify-content:space-between;font-weight:700;"><span>${t('acct_totalOutputTax')}</span><span>${fmtMoney(outputTax)}</span></div>
    `;
    document.getElementById('g3InputWrap').innerHTML = `
      <div style="display:flex;justify-content:space-between;"><span class="muted">${t('acct_taxableValueLabel')}</span><span>${fmtMoney(inputTaxable)}</span></div>

      <div style="display:flex;justify-content:space-between;font-weight:700;"><span>${t('acct_totalInputTaxCredit')}</span><span>${fmtMoney(inputTax)}</span></div>
    `;
    document.getElementById('g3NetWrap').innerHTML = net>=0
      ? `<div style="display:flex;justify-content:space-between;color:var(--red);"><span>${t('acct_netGstPayable')}</span><span>${fmtMoney(net)}</span></div>`
      : `<div style="display:flex;justify-content:space-between;color:var(--green);"><span>${t('acct_excessItcCarriedForward')}</span><span>${fmtMoney(-net)}</span></div>`;
  };
  wirePeriodFilter('g3', compute);
  compute();

  document.getElementById('g3PrintBtn').addEventListener('click', ()=>{
    if(!lastSummary) return;
    const s = lastSummary;
    const periodLabel = periodLabelFromRange(s.from, s.to);
    const doc = `<!DOCTYPE html><html><head><title>${t('acct_gstr3bHeading')}</title>
      <style>
        @page{ size:A4; margin:14mm; }
        body{ font-family:Arial,Helvetica,sans-serif; font-size:13px; color:#222; }
        h1{font-size:18px;margin:0 0 2px;} h2{font-size:14px;margin:0 0 12px;color:#555;}
        table{width:100%;border-collapse:collapse;margin-bottom:14px;}
        td{padding:5px 0;border-bottom:1px solid #eee;} .num{text-align:right;}
        .grand{font-weight:700;font-size:15px;}
      </style></head><body>
      <h1>${escapeHTML(SETTINGS.name||t('acct_myShopFallback'))}</h1>
      <h2>${t('acct_gstr3bPrintHeading')}${escapeHTML(periodLabel)}</h2>
      <table>
        <tr><td colspan="2" style="font-weight:700;">${t('acct_outputTaxSalesTd')}</td></tr>
        <tr><td>${t('acct_taxableValueLabel')}</td><td class="num">${fmtMoney(s.outputTaxable)}</td></tr>
        <tr><td>CGST</td><td class="num">${fmtMoney(s.outputCgst)}</td></tr>
        <tr><td>SGST</td><td class="num">${fmtMoney(s.outputSgst)}</td></tr>
        <tr><td>${t('acct_totalOutputTax')}</td><td class="num">${fmtMoney(s.outputTax)}</td></tr>
      </table>
      <table>
        <tr><td colspan="2" style="font-weight:700;">${t('acct_inputTaxCreditPurchasesTd')}</td></tr>
        <tr><td>${t('acct_taxableValueLabel')}</td><td class="num">${fmtMoney(s.inputTaxable)}</td></tr>
        <tr><td>${t('acct_cgstCreditLabel')}</td><td class="num">${fmtMoney(s.inputCgst)}</td></tr>
        <tr><td>${t('acct_sgstCreditLabel')}</td><td class="num">${fmtMoney(s.inputSgst)}</td></tr>

/* ---- Expenses ---- */
function openExpenseModal(existing){
  if(!existing && !requireWorkingFirm(t('action_addExpense'))) return;
  const cats = SETTINGS.expenseCategories||[];
  const modes = SETTINGS.enabledPaymentModes && SETTINGS.enabledPaymentModes.length ? SETTINGS.enabledPaymentModes : ALL_PAYMENT_MODES;
  openModal({
    title: existing ? t('modal_editExpense') : t('modal_addExpense'),
    bodyHTML:`
      <div class="row">
        <div class="col field"><label>${t('acct_expDateLabel')}</label><input id="exp_date" type="date" value="${existing ? existing.date.slice(0,10) : todayISO()}"></div>
        <div class="col field"><label>${t('acct_expAmountLabel')}</label><input id="exp_amount" type="number" min="0" step="0.01" value="${existing ? existing.amount : ''}"></div>
      </div>
      <div class="row">
        <div class="col field">
          <label>${t('acct_expCategoryLabel')}</label>
          <select id="exp_category">
            ${cats.map(c=>`<option value="${escapeHTML(c)}" ${existing && existing.category===c ? 'selected':''}>${escapeHTML(dv(c))}</option>`).join('')}
          </select>
        </div>
        <div class="col field">
          <label>${t('vendor_paymentModeLabel')}</label>
          <select id="exp_mode">
            ${modes.map(m=>`<option value="${escapeHTML(m)}" ${existing && existing.mode===m ? 'selected':''}>${escapeHTML(dv(m))}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field"><label>${t('acct_noteLabel')}</label><input id="exp_note" placeholder="${t('acct_expNotePlaceholder')}" value="${existing ? escapeHTML(existing.note||'') : ''}"></div>
      <div class="field"><label>${t('acct_expReferenceLabel')}</label><input id="exp_reference" placeholder="${t('acct_expReferencePlaceholder')}" value="${existing ? escapeHTML(existing.reference||'') : ''}"></div>
    `,
    footerHTML:`<button class="btn btn-outline" onclick="closeModal()">${t('acct_cancelBtn')}</button><button class="btn btn-primary" id="exp_save">${existing ? t('btn_saveChanges') : t('acct_addExpenseModalBtn')}</button>`,
    onMount:()=>{
      document.getElementById('exp_save').addEventListener('click', async ()=>{
        const dateVal = document.getElementById('exp_date').value || todayISO();
        const amount = Math.max(0, parseFloat(document.getElementById('exp_amount').value)||0);
        const category = document.getElementById('exp_category').value;
        const mode = document.getElementById('exp_mode').value;
        const note = document.getElementById('exp_note').value.trim();
        const reference = document.getElementById('exp_reference').value.trim();
        if(amount<=0){ toast(t('toast_enterValidAmount'),'error'); return; }
        if(!category){ toast(t('toast_selectCategory'),'error'); return; }
        const record = {
          date: new Date(dateVal+'T12:00:00').toISOString(),
          category, amount, mode, note, reference
        };
        if(existing){
          record.id = existing.id;
          record.firmId = existing.firmId;
          await dbPut('expenses', record);
          toast(t('toast_expenseUpdated'),'success');
        } else {
          record.firmId = firmIdForStockOps();
          await dbAdd('expenses', record);
          toast(t('toast_expenseAdded'),'success');
        }
        closeModal();
        await renderExpensesTab();
      });
    }
  });
}

async function renderExpensesTab(){

    filtered.sort((a,b)=> new Date(b.date) - new Date(a.date) || (b.id||0)-(a.id||0));

/* ---- Profit & Loss ---- */
function costPriceOf(productMap, productId, variantIndex){
  const p = productMap[productId];
  if(!p || !p.variants || !p.variants[variantIndex]) return 0;
  return p.variants[variantIndex].costPrice||0;
}

/* ---------- Day Close / Cash Reconciliation ----------
   Every shop counts the drawer at night. The app already knew what it had collected; it had
   no way to record what was actually there. This screen puts the two side by side, saves the
   difference, and carries the counted cash forward as tomorrow's opening float. */

const DC_DENOMS = [500, 200, 100, 50, 20, 10, 5, 2, 1];

function dcIsCash(m){ return (m.mode||'') === 'Cash'; }
// A movement with no mode predates mode tracking (or came from a flow that doesn't take one).
// It is reported on its own line rather than silently counted as cash.
function dcIsUnattributed(m){ return !(m.mode||'').trim(); }

async function dayCloseFor(dateISO){
  const all = await scopedGetAll('dayCloses');
  return all.find(c=>c.date===dateISO) || null;
}

async function computeDayCash(dateISO){
  const movements = await collectMoneyMovements(dateISO, dateISO);
  const cashIn  = movements.filter(m=>dcIsCash(m)).reduce((n,m)=>n+Number(m.amountIn||0), 0);
  const cashOut = movements.filter(m=>dcIsCash(m)).reduce((n,m)=>n+Number(m.amountOut||0), 0);
  const otherIn = movements.filter(m=>!dcIsCash(m) && !dcIsUnattributed(m)).reduce((n,m)=>n+Number(m.amountIn||0), 0);
  const unattrIn  = movements.filter(dcIsUnattributed).reduce((n,m)=>n+Number(m.amountIn||0), 0);
  const unattrOut = movements.filter(dcIsUnattributed).reduce((n,m)=>n+Number(m.amountOut||0), 0);

  // Opening float = what was counted and left in the drawer at the last close on or before
  // the previous day. No earlier close means the shop is starting fresh at zero.
  const closes = (await scopedGetAll('dayCloses')).filter(c=>c.date < dateISO).sort((a,b)=>a.date<b.date?1:-1);
  const prev = closes[0] || null;
  const openingCash = prev ? Math.max(0, Number(prev.counted||0) - Number(prev.deposited||0)) : 0;

  const r2 = n => Math.round(n*100)/100;
  return {
    movements,
    openingCash: r2(openingCash),
    cashIn: r2(cashIn), cashOut: r2(cashOut), otherIn: r2(otherIn),
    unattrIn: r2(unattrIn), unattrOut: r2(unattrOut),
    prevDate: prev ? prev.date : null
  };
}

                   : `<p class="muted" style="font-size:11.5px;margin:0 0 10px;">${t('dc_openingNone')}</p>`}

      </div>` : ''}

      <div class="row" style="flex-wrap:wrap;gap:14px;align-items:flex-start;">

    const denomTotal = ()=>{

      document.querySelectorAll('.dc-denom').forEach(inp=>{

        const qty = Math.max(0, parseInt(inp.value)||0);

        document.getElementById('dc_drow_'+d).textContent = fmtMoney(amt);
      });
      return total;
    };

    const recalc = ()=>{
      const dTotal = denomTotal();
      // Counting by note fills the counted box automatically, unless the owner typed over it.
      if(!countedTouched && dTotal > 0) countedEl.value = dTotal;
      const counted = Math.max(0, parseFloat(countedEl.value)||0);

      const {counted, deposited, expected, diff} = recalc();
      const denoms = {};

        firmId: firmIdForStockOps(),

      });

      await paint();
    });
  };

  await paint();
}

/* ---- Day Book / Cash Book ---- */
function shiftDateISO(dateStr, days){
  const base = dateStr ? new Date(dateStr+'T12:00:00') : new Date();
  base.setDate(base.getDate()+days);
  return base.toISOString().slice(0,10);
}

// Every movement of money in or out between two dates, from all five sources. The Day Book
// prints this as-is; Day Close filters it down to what should physically be in the drawer.
// `mode` is the payment mode where the record has one — older records saved before modes
// were stored leave it blank, and Day Close reports those separately rather than guessing.
async function collectMoneyMovements(from, to){
  const [allBills, suppliers, customers, expenses, returns] = await Promise.all([
    scopedGetAll('bills'), scopedGetAll('suppliers'), scopedGetAll('customers'),
    scopedGetAll('expenses'), scopedGetAll('returns')
  ]);
  const bills = liveBills(allBills);
  const cancelledBillIds = new Set(allBills.filter(b=>b.cancelled).map(b=>b.id));
  // Store credit, return credit and supplier advances settle on paper — no note or coin
  // changes hands — so they belong in the customer/vendor ledger but not in a cash book.
  const PAPER_SOURCES = new Set(['store_credit','return_credit','advance']);
  const isPaperOnly = (l) => PAPER_SOURCES.has(l.source||'') || (l.mode||'')==='Store Credit' || (l.mode||'')==='Advance';
  const countsAsMoney = (l) => !isPaperOnly(l) && !(l.billId && cancelledBillIds.has(l.billId));
  const movements = [];

  bills.filter(b=>inRange(b.date, from, to)).forEach(b=>{
    (b.payments||[]).forEach(p=>{
      if(!p.amount) return;
      movements.push({date:b.date, type:'Sale', description:t('modal_invoicePrefix')+(b.invoiceNo||b.id)+' — '+dv(p.mode||'Cash'),
        mode:p.mode||'Cash', amountIn:p.amount, amountOut:0});
    });
  });

  // Cash handed back on a return leaves the drawer. This was previously missing from the
  // Day Book entirely, which made every day with a cash refund look like it was short.
  returns.filter(r=>inRange(r.date, from, to) && (r.settleMode||'cash')==='cash' && Number(r.totalRefund||0)>0).forEach(r=>{
    movements.push({date:r.date, type:'Refund', description:t('acct_refundOnPrefix')+(r.billId?('#'+r.billId):t('ret_noBillTag')),
      mode:'Cash', amountIn:0, amountOut:Number(r.totalRefund||0)});
  });

  suppliers.forEach(sup=>{
    (sup.ledger||[]).filter(l=>l.type==='payment' && !l.voided && inRange(l.date, from, to) && countsAsMoney(l)).forEach(l=>{
      movements.push({date:l.date, type:'Vendor Payment', description:sup.name+' — '+(l.note||''),
        mode:l.mode||'', source:l.source||'', amountIn:0, amountOut:l.amount});
    });
  });

  customers.forEach(cust=>{
    (cust.ledger||[]).filter(l=>l.type==='payment' && inRange(l.date, from, to) && countsAsMoney(l)).forEach(l=>{
      movements.push({date:l.date, type:'Credit Collection', description:cust.name+' — '+(l.note||''),
        mode:l.mode||'', source:l.source||'', amountIn:l.amount, amountOut:0});
    });
  });

  expenses.filter(e=>inRange(e.date, from, to)).forEach(e=>{
    movements.push({date:e.date, type:'Expense', description:dv(e.category)+(e.note?': '+e.note:'')+(e.mode?' ('+dv(e.mode)+')':''),
      mode:e.mode||'', amountIn:0, amountOut:e.amount||0});
  });

  movements.sort((a,b)=>{
    const dayA=(a.date||'').slice(0,10), dayB=(b.date||'').slice(0,10);
    if(dayA!==dayB) return dayA<dayB ? -1 : 1;
    return 0;
  });
  return movements;
}

/* ---- Accountant-Ready Exports: GSTR-1 JSON (B2C) + Tally-compatible Sales Voucher XML ----
   Both are best-effort formats meant to save the shop's CA/accountant re-typing work, not
   guaranteed direct-upload/import compliant — the UI says so and so do these comments. */
function xmlEscape(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function tallyDateYYYYMMDD(iso){
  return (iso||'').slice(0,10).replace(/-/g,'');
}
function buildGSTR1Json(filteredBills, periodToDate){
  const rateMap = {};
  filteredBills.forEach(b=>{
    billTaxBreakdown(b).forEach(r=>{
      if(!rateMap[r.rate]) rateMap[r.rate] = {rate:r.rate, taxable:0, cgst:0, sgst:0};
      rateMap[r.rate].taxable += r.taxable;
      rateMap[r.rate].cgst += r.cgst;
      rateMap[r.rate].sgst += r.sgst;
    });
  });
  const pos = SETTINGS.stateCode || '';
  // All sales are treated as B2C (no customer GSTIN is captured) and intra-state, same
  // assumption the GSTR-1 report tab already makes — adjust manually for interstate customers.
  const b2cs = Object.values(rateMap).map(r=>({
    sply_ty: 'INTRA',
    rt: r.rate,
    typ: 'OE',
    pos: pos,
    txval: Math.round(r.taxable*100)/100,
    iamt: 0,
    camt: Math.round(r.cgst*100)/100,
    samt: Math.round(r.sgst*100)/100,
    csamt: 0
  })).sort((a,b)=>a.rt-b.rt);

  const periodDate = periodToDate || (filteredBills.length ? filteredBills.map(b=>b.date).sort().slice(-1)[0].slice(0,10) : todayISO());
  const [y,m] = periodDate.split('-');
  const fp = (m||'01') + (y||String(new Date().getFullYear()));

  return { gstin: SETTINGS.gstin || '', fp, b2cs };
}
function downloadGSTR1Json(filteredBills, periodToDate){
  const data = buildGSTR1Json(filteredBills, periodToDate);
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `gstr1-b2cs-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function buildTallyXML(filteredBills, customers){
  const custName = (id)=> id ? ((customers.find(c=>c.id===id)||{}).name || t('acct_cashSalesFallback')) : t('acct_cashSalesFallback');
  const sorted = filteredBills.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));

  const voucherXml = sorted.map(b=>{
    const breakdown = billTaxBreakdown(b);
    let linesTotal = 0;
    const lines = [];
    breakdown.forEach(r=>{
      if(r.taxable){ lines.push({ledger:`${t('acct_tallyLedgerSalesAt')}${r.rate}%`, amount:r.taxable}); linesTotal += r.taxable; }
      if(r.cgst){ lines.push({ledger:`${t('acct_tallyLedgerOutputCgstAt')}${Math.round(r.rate/2*100)/100}%`, amount:r.cgst}); linesTotal += r.cgst; }
      if(r.sgst){ lines.push({ledger:`${t('acct_tallyLedgerOutputSgstAt')}${Math.round(r.rate/2*100)/100}%`, amount:r.sgst}); linesTotal += r.sgst; }
    });
    // Packaging/delivery charges, coupon/tiered discounts and round-off aren't split into their
    // own ledgers here — they're folded into one reconciling line so the voucher always balances
    // exactly to the bill's grand total. Your accountant may want to re-map this line.
    linesTotal = Math.round(linesTotal*100)/100;
    const adjustment = Math.round(((b.grandTotal||0)-linesTotal)*100)/100;
    if(Math.abs(adjustment) >= 0.01) lines.push({ledger:'Other Charges & Discounts (Net)', amount:adjustment});

    const party = custName(b.customerId);
    const ledgerEntries = [
      `<ALLLEDGERENTRIES.LIST><LEDGERNAME>${xmlEscape(party)}</LEDGERNAME><ISDEEMEDPOSITIVE>Yes</ISDEEMEDPOSITIVE><AMOUNT>${(-(b.grandTotal||0)).toFixed(2)}</AMOUNT></ALLLEDGERENTRIES.LIST>`,
      ...lines.map(l=>`<ALLLEDGERENTRIES.LIST><LEDGERNAME>${xmlEscape(l.ledger)}</LEDGERNAME><ISDEEMEDPOSITIVE>No</ISDEEMEDPOSITIVE><AMOUNT>${l.amount.toFixed(2)}</AMOUNT></ALLLEDGERENTRIES.LIST>`)
    ].join('\n');

    return `<TALLYMESSAGE xmlns:UDF="TallyUDF">
<VOUCHER VCHTYPE="Sales" ACTION="Create">
<DATE>${tallyDateYYYYMMDD(b.date)}</DATE>
<VOUCHERTYPENAME>${t('acct_csvRowSales')}</VOUCHERTYPENAME>
<VOUCHERNUMBER>${xmlEscape(b.invoiceNo||b.id)}</VOUCHERNUMBER>
<PARTYLEDGERNAME>${xmlEscape(party)}</PARTYLEDGERNAME>
<EFFECTIVEDATE>${tallyDateYYYYMMDD(b.date)}</EFFECTIVEDATE>
${ledgerEntries}
</VOUCHER>
</TALLYMESSAGE>`;
  }).join('\n');

  return `<ENVELOPE>
<HEADER>
<TALLYREQUEST>Import Data</TALLYREQUEST>
</HEADER>
<BODY>
<IMPORTDATA>
<REQUESTDESC>
<REPORTNAME>Vouchers</REPORTNAME>
</REQUESTDESC>
<REQUESTDATA>
${voucherXml}
</REQUESTDATA>
</IMPORTDATA>
</BODY>
</ENVELOPE>`;
}
function downloadTallyXML(filteredBills, customers){
  const xml = buildTallyXML(filteredBills, customers);
  const blob = new Blob([xml], {type:'application/xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `tally-sales-vouchers-${todayISO()}.xml`;
  a.click();
  URL.revokeObjectURL(url);
}

      const cgst = Math.round(breakdown.reduce((s,r)=>s+r.cgst,0)*100)/100;
      const sgst = Math.round(breakdown.reduce((s,r)=>s+r.sgst,0)*100)/100;
      const custN = b.customerId ? ((customers.find(c=>c.id===b.customerId)||{}).name || t('acct_customerFallback')) : t('bill_walkIn');
      lines.push(toCSVRow([b.invoiceNo, fmtDate(b.date), custN, taxable, cgst, sgst, Math.round((cgst+sgst)*100)/100, b.grandTotal]));
    });
    const blob = new Blob([lines.join('\r\n')], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'gstr1-'+todayISO()+'.csv';
    a.click();
    URL.revokeObjectURL(url);
    toast(t('toast_gstr1CsvExported'),'success');
  });
  document.getElementById('axTallyBtn').addEventListener('click', ()=>{
    if(lastFiltered.length===0){ toast(t('toast_noInvoicesInPeriod'),'error'); return; }
    downloadTallyXML(lastFiltered, customers);
    toast(t('toast_tallyXmlExported'),'success');
  });
}
</script>

<!-- MODULE:ALTERATIONS -->
<script>
let ALTER_FILTER = 'active';

async function refreshAlterationsBadge(){
  const jobs = await scopedGetAll('alterations');
  const today = todayISO();
  const count = jobs.filter(j=> j.status==='ready' || (j.status==='pending' && j.expectedDate && j.expectedDate<=today)).length;
  const badge = document.getElementById('alterBadge');
  if(badge){
    if(count>0){ badge.style.display='inline-block'; badge.textContent = count; }
    else{ badge.style.display='none'; }
  }
  return count;
}

async function renderAlterations(){
  const el = document.getElementById('view-alterations');
  el.innerHTML = `
    <div class="row" style="margin-bottom:12px;align-items:flex-end;">
      <div class="col" style="max-width:220px;">
        <label>${t('alter_showFilterLabel')}</label>
        <select id="alterFilterSelect">
          <option value="active">${t('alter_filterPendingReady')}</option>
          <option value="pending">${t('alter_filterPendingOnly')}</option>
          <option value="ready">${t('alter_readyForPickup')}</option>
          <option value="delivered">${t('alter_filterDelivered')}</option>
          <option value="all">${t('alter_filterAll')}</option>
        </select>
      </div>
      <div class="col" style="flex:0 0 auto;">
        <button class="btn btn-primary" id="addAlterationBtn">${t('alter_newJobBtn')}</button>
      </div>
    </div>
    <div class="card" id="alterTableWrap"></div>
  `;
  document.getElementById('alterFilterSelect').value = ALTER_FILTER;
  document.getElementById('alterFilterSelect').addEventListener('change',(e)=>{
    ALTER_FILTER = e.target.value;
    renderAlterationsTable();
  });
  document.getElementById('addAlterationBtn').addEventListener('click', ()=>openAlterationModal());
  await renderAlterationsTable();
}

async function renderAlterationsTable(){
  const wrap = document.getElementById('alterTableWrap');
  if(!wrap) return;
  let jobs = await scopedGetAll('alterations');
  if(ALTER_FILTER==='active') jobs = jobs.filter(j=>j.status==='pending' || j.status==='ready');
  else if(ALTER_FILTER!=='all') jobs = jobs.filter(j=>j.status===ALTER_FILTER);
  jobs.sort((a,b)=> (a.expectedDate||'').localeCompare(b.expectedDate||''));

  if(jobs.length===0){
    wrap.innerHTML = `<div class="empty-state">${t('alter_noJobsEmpty')}</div>`;
    return;
  }
  const today = todayISO();
  wrap.innerHTML = `
    <table>
      <thead><tr><th>${t('th_customer')}</th><th>${t('th_itemWork')}</th><th>${t('th_received')}</th><th>${t('th_expected')}</th><th>${t('th_charges')}</th><th>${t('th_status')}</th><th>${t('th_actions')}</th></tr></thead>
      <tbody>
        ${jobs.map(j=>{
          const overdue = j.status==='pending' && j.expectedDate && j.expectedDate<today;
          const statusTag = j.status==='delivered' ? `<span class="tag tag-green">${t('alter_tagDelivered')}</span>` :
            j.status==='ready' ? `<span class="tag tag-amber">${t('alter_tagReady')}</span>` :
            overdue ? `<span class="tag tag-red">${t('alter_tagOverdue')}</span>` : `<span class="tag tag-red">${t('alter_tagPending')}</span>`;
          return `<tr>
            <td><strong>${escapeHTML(j.customerName||'')}</strong>${j.customerPhone?`<br><span class="muted" style="font-size:11px;">${escapeHTML(j.customerPhone)}</span>`:''}</td>
            <td>${escapeHTML(j.itemDescription||'')}${j.workDescription?`<br><span class="muted" style="font-size:11px;">${escapeHTML(j.workDescription)}</span>`:''}</td>
            <td>${j.receivedDate?fmtDate(j.receivedDate):'-'}</td>
            <td>${j.expectedDate?fmtDate(j.expectedDate):'-'}</td>
            <td class="num">${fmtMoney(j.charges||0)}</td>
            <td>${statusTag}</td>
            <td>
              ${j.status==='pending'?`<button class="btn btn-outline btn-sm" onclick="setAlterationStatus(${j.id},'ready')">${t('alter_markReadyBtn')}</button>`:''}
              ${j.status==='ready'?`<button class="btn btn-outline btn-sm" onclick="setAlterationStatus(${j.id},'delivered')">${t('alter_markDeliveredBtn')}</button>`:''}
              <button class="btn btn-outline btn-sm" onclick="openAlterationModal(${j.id})">${t('acct_editBtn')}</button>
              ${isOwner()?`<button class="btn btn-danger btn-sm" onclick="deleteAlterationConfirm(${j.id})">${t('acct_deleteBtn')}</button>`:''}
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
}

function openAlterationModal(jobId){
  if(!jobId && !requireWorkingFirm(t('action_addAlterationJob'))) return;
  const load = jobId ? dbGet('alterations', jobId) : Promise.resolve(null);
  load.then(job=>{
    openModal({
      title: job ? t('modal_editAlterationJob') : t('modal_newAlterationJob'),
      bodyHTML: `
        <div class="row">
          <div class="col field"><label>${t('alter_customerNameLabel')}</label><input id="al_name" value="${escapeHTML(job?job.customerName:'')}"></div>
          <div class="col field"><label>${t('settings_phone')}</label><input id="al_phone" value="${escapeHTML(job?job.customerPhone:'')}"></div>
        </div>
        <div class="field"><label>${t('alter_itemLabel')}</label><input id="al_item" value="${escapeHTML(job?job.itemDescription:'')}"></div>
        <div class="field"><label>${t('alter_workNeededLabel')}</label><input id="al_work" value="${escapeHTML(job?job.workDescription:'')}"></div>
        <div class="row">
          <div class="col field"><label>${t('alter_receivedDateLabel')}</label><input id="al_received" type="date" value="${job&&job.receivedDate?job.receivedDate:todayISO()}"></div>
          <div class="col field"><label>${t('alter_expectedPickupDateLabel')}</label><input id="al_expected" type="date" value="${job&&job.expectedDate?job.expectedDate:''}"></div>
        </div>
        <div class="row">
          <div class="col field"><label>${t('alter_chargesLabel')}</label><input id="al_charges" type="number" min="0" step="1" value="${job?job.charges:0}"></div>
          <div class="col field"><label>${t('alter_statusLabel')}</label>
            <select id="al_status">
              <option value="pending" ${(!job||job.status==='pending')?'selected':''}>${t('alter_pendingTag')}</option>
              <option value="ready" ${job&&job.status==='ready'?'selected':''}>${t('alter_readyForPickup')}</option>
              <option value="delivered" ${job&&job.status==='delivered'?'selected':''}>${t('alter_filterDelivered')}</option>
            </select>
          </div>
        </div>
        <div class="field"><label>${t('alter_notesLabel')}</label><input id="al_notes" value="${escapeHTML(job?job.notes:'')}"></div>
      `,
      footerHTML: `
        <button class="btn btn-outline" onclick="closeModal()">${t('acct_cancelBtn')}</button>
        <button class="btn btn-primary" id="saveAlterationBtn">${job?t('btn_saveChanges'):t('alter_addJobBtn')}</button>
      `,
      onMount: ()=>{
        document.getElementById('saveAlterationBtn').addEventListener('click', async ()=>{
          const customerName = document.getElementById('al_name').value.trim();
          if(!customerName){ toast(t('toast_customerNameRequired'),'error'); return; }
          const record = {
            customerName,
            customerPhone: document.getElementById('al_phone').value.trim(),
            itemDescription: document.getElementById('al_item').value.trim(),
            workDescription: document.getElementById('al_work').value.trim(),
            receivedDate: document.getElementById('al_received').value || todayISO(),
            expectedDate: document.getElementById('al_expected').value || '',
            charges: parseFloat(document.getElementById('al_charges').value)||0,
            status: document.getElementById('al_status').value,
            notes: document.getElementById('al_notes').value.trim()
          };
          if(job){
            record.id = job.id;
            record.firmId = job.firmId;
            await dbPut('alterations', record);
            toast(t('toast_jobUpdated'),'success');
          } else {
            record.firmId = firmIdForStockOps();
            await dbAdd('alterations', record);
            toast(t('toast_jobAdded'),'success');
          }
          closeModal();
          await renderAlterationsTable();
          await refreshAlterationsBadge();
        });
      }
    });
  });
}

async function setAlterationStatus(jobId, status){
  const job = await dbGet('alterations', jobId);
  job.status = status;
  await dbPut('alterations', job);
  toast(status==='ready'?t('toast_markedReadyForPickup'):t('toast_markedDelivered'),'success');
  await renderAlterationsTable();
  await refreshAlterationsBadge();
}

async function deleteAlterationConfirm(jobId){
  openModal({
    title:t('modal_deleteAlterationJobQ'),
    bodyHTML:`<p>${t('alter_deleteJobConfirmBody')}</p>`,
    footerHTML:`<button class="btn btn-outline" onclick="closeModal()">${t('acct_cancelBtn')}</button><button class="btn btn-danger" id="al_del">${t('acct_deleteBtn')}</button>`,
    onMount:()=>{
      document.getElementById('al_del').addEventListener('click', async ()=>{
        await dbDelete('alterations', jobId);
        closeModal(); toast(t('toast_deleted'));
        await renderAlterationsTable();
        await refreshAlterationsBadge();
      });
    }
  });
}
</script>

<!-- MODULE:AUTH -->
<script>
let CURRENT_USER = null;
const SESSION_KEY = 'boutique_session_v1';

function getSavedSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); }catch(e){ return null; }
}
function saveSession(user){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(user)); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

/* ---- Attendance (recorded on explicit login/logout, not on silent session restore) ---- */
function staffKeyFor(user){
  return user.role==='owner' ? 'owner' : ('staff-'+user.id);
}
async function recordCheckIn(user){
  try{
    await dbAdd('attendance', {
      staffKey: staffKeyFor(user),
      staffName: user.name,
      role: user.role,
      date: todayISO(),
      checkIn: new Date().toISOString(),
      checkOut: null
    });
  }catch(e){ /* best-effort, never block login */ }
}
async function recordCheckOut(user){
  if(!user) return;
  try{
    const key = staffKeyFor(user);
    const all = await dbGetAll('attendance');
    const open = all.filter(a=>a.staffKey===key && !a.checkOut).sort((a,b)=> new Date(b.checkIn)-new Date(a.checkIn));
    if(open[0]){
      open[0].checkOut = new Date().toISOString();
      await dbPut('attendance', open[0]);
    }
  }catch(e){ /* best-effort */ }
}

function showAuthScreen(){
  document.getElementById('authScreen').style.display='flex';
  document.getElementById('app').style.display='none';
}
function hideAuthScreen(){
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').style.display='flex';
}

async function initAuth(){
  const users = SETTINGS.users;
  if(!users || !users.ownerPin){
    showOwnerSetupScreen();
    return;
  }
  const saved = getSavedSession();
  if(saved && saved.role==='owner'){
    CURRENT_USER = {role:'owner', name:t('staff_ownerTag')};
    hideAuthScreen();
    await onAuthResolved();
    return;
  }
  if(saved && saved.role==='cashier'){
    const staff = (users.staff||[]).find(s=>s.id===saved.id);
    if(staff){
      CURRENT_USER = {role:'cashier', name:staff.name, id:staff.id};
      hideAuthScreen();
      await onAuthResolved();
      return;
    }
  }
  showLoginScreen('owner');
}

function generateRecoveryCode(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O/1/I to avoid confusion
  let code = '';
  for(let i=0;i<8;i++){ code += chars[Math.floor(Math.random()*chars.length)]; if(i===3) code+='-'; }
  return code;
}

function showOwnerSetupScreen(){
  showAuthScreen();
  document.getElementById('authCard').innerHTML = `
    <div class="logo">B</div>
    <h2 style="text-align:center;">${t('auth_setupOwnerPinTitle')}</h2>
    <p class="sub">${t('auth_setupOwnerPinSub')}</p>
    <div class="field"><label>${t('auth_choosePinLabel')}</label><input id="setup_pin" class="pin-input" type="password" inputmode="numeric" maxlength="6"></div>
    <div class="field"><label>${t('auth_confirmPinLabel')}</label><input id="setup_pin2" class="pin-input" type="password" inputmode="numeric" maxlength="6"></div>
    <button class="btn btn-gold btn-block" id="setup_go">${t('auth_createOwnerPinBtn')}</button>
    <div class="auth-error" id="setup_err"></div>
  `;
  document.getElementById('setup_go').addEventListener('click', async ()=>{
    const p1 = document.getElementById('setup_pin').value.trim();
    const p2 = document.getElementById('setup_pin2').value.trim();
    const err = document.getElementById('setup_err');
    if(!/^\d{4,6}$/.test(p1)){ err.textContent=t('auth_pinMustBe46'); return; }
    if(p1!==p2){ err.textContent=t('auth_pinsDoNotMatch'); return; }
    const recoveryCode = generateRecoveryCode();
    await saveSettings({ users: { ownerPin:p1, recoveryCode, staff:[] } });
    showRecoveryCodeScreen(recoveryCode, true);
  });
}

function showRecoveryCodeScreen(code, isFirstTime){
  showAuthScreen();
  document.getElementById('authCard').innerHTML = `
    <div class="logo">B</div>
    <h2 style="text-align:center;">${isFirstTime?t('auth_saveRecoveryTitle'):t('auth_newRecoveryTitle')}</h2>
    <p class="sub">${t('auth_recoverySub')}</p>
    <div style="background:var(--paper-soft);border:1px dashed var(--wine-light);border-radius:10px;padding:16px;text-align:center;font-size:22px;font-weight:800;letter-spacing:2px;color:var(--wine);margin-bottom:14px;">${code}</div>
    <button class="btn btn-outline btn-block" id="copyRecoveryBtn" style="margin-bottom:10px;">${t('auth_copyCodeBtn')}</button>
    <button class="btn btn-gold btn-block" id="recovery_continue">${t('auth_savedItContinueBtn')}</button>
  `;
  document.getElementById('copyRecoveryBtn').addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText(code); toast(t('toast_copied'),'success'); }
    catch(e){ toast(t('toast_couldNotCopyManual'),'error'); }
  });
  document.getElementById('recovery_continue').addEventListener('click', async ()=>{
    if(isFirstTime){
      CURRENT_USER = {role:'owner', name:t('staff_ownerTag')};
      saveSession({role:'owner'});
      hideAuthScreen();
      toast(t('toast_ownerPinCreated'),'success');
      await recordCheckIn(CURRENT_USER);
      await onAuthResolved();
    } else {
      showLoginScreen('owner');
    }
  });
}

function showForgotPinScreen(){
  showAuthScreen();
  document.getElementById('authCard').innerHTML = `
    <div class="logo">B</div>
    <h2 style="text-align:center;">${t('auth_resetOwnerPinTitle')}</h2>
    <p class="sub">${t('auth_resetSub')}</p>
    <div class="field"><label>${t('auth_recoveryCodeLabel')}</label><input id="rec_code" placeholder="e.g. AB3C-D4EF" style="text-transform:uppercase;letter-spacing:2px;text-align:center;"></div>
    <div class="field"><label>${t('staff_newPinLabel')}</label><input id="rec_newpin" class="pin-input" type="password" inputmode="numeric" maxlength="6"></div>
    <button class="btn btn-gold btn-block" id="rec_go">${t('auth_resetPinBtn')}</button>
    <div class="auth-error" id="rec_err"></div>
    <p class="muted" style="font-size:11.5px;text-align:center;margin-top:14px;">${t('auth_lostRecoveryHelp')}<code>resetShopPIN()</code>${t('auth_lostRecoveryHelp2')}</p>
    <button class="btn btn-outline btn-block" id="rec_back" style="margin-top:10px;">${t('auth_backToLoginBtn')}</button>
  `;
  document.getElementById('rec_back').addEventListener('click', ()=>showLoginScreen('owner'));
  document.getElementById('rec_go').addEventListener('click', async ()=>{
    const code = document.getElementById('rec_code').value.trim().toUpperCase();
    const newPin = document.getElementById('rec_newpin').value.trim();
    const err = document.getElementById('rec_err');
    if(code !== (SETTINGS.users.recoveryCode||'').toUpperCase()){ err.textContent = t('auth_recoveryIncorrect'); return; }
    if(!/^\d{4,6}$/.test(newPin)){ err.textContent = t('auth_newPinMustBe46'); return; }
    const users = SETTINGS.users;
    users.ownerPin = newPin;
    const newRecoveryCode = generateRecoveryCode();
    users.recoveryCode = newRecoveryCode;
    await saveSettings({users});
    toast(t('toast_pinReset'),'success');
    showRecoveryCodeScreen(newRecoveryCode, false);
  });
}

/* Last-resort console recovery: clears only the PIN lock, never business data */
window.resetShopPIN = async function(){
  if(!db) await openDB();
  const users = SETTINGS.users;
  if(users){ delete users.ownerPin; delete users.recoveryCode; users.staff = []; await saveSettings({users}); }
  clearSession();
  console.log('PIN lock cleared. Reload the page to set up a new owner PIN. Your products, bills and customers were not touched.');
  location.reload();
};

function showLoginScreen(activeTab){
  showAuthScreen();
  activeTab = activeTab || 'owner';
  const staff = (SETTINGS.users && SETTINGS.users.staff) || [];
  document.getElementById('authCard').innerHTML = `
    <div class="logo">B</div>
    <h2 style="text-align:center;">${escapeHTML(SETTINGS.name||t('auth_defaultShopName'))}</h2>
    <p class="sub">${t('auth_signInToContinue')}</p>
    <p class="sub" style="margin-top:-6px;font-size:11px;opacity:.8;">${t('brand_productLine')}</p>
    <div class="auth-tabs" id="authTabs">
      <button data-tab="owner" class="${activeTab==='owner'?'active':''}">${t('staff_ownerTag')}</button>
      <button data-tab="staff" class="${activeTab==='staff'?'active':''}">${t('auth_staffTab')}</button>
    </div>
    <div class="auth-pane ${activeTab==='owner'?'active':''}" id="pane-owner">
      <div class="field"><label>${t('staff_ownerPinSubtitle')}</label><input id="login_owner_pin" class="pin-input" type="password" inputmode="numeric" maxlength="6"></div>
      <button class="btn btn-gold btn-block" id="login_owner_go">${t('auth_loginBtn')}</button>
      <button type="button" id="forgotPinBtn" style="background:none;border:none;color:var(--wine);font-size:12px;text-decoration:underline;cursor:pointer;display:block;margin:10px auto 0;">${t('auth_forgotPinBtn')}</button>
    </div>
    <div class="auth-pane ${activeTab==='staff'?'active':''}" id="pane-staff">
      ${staff.length===0?`<p class="muted" style="font-size:12.5px;text-align:center;">${t('auth_noStaffProfiles')}</p>`:`
      <div class="field"><label>${t('auth_staffMemberLabel')}</label><select id="login_staff_select">${staff.map(s=>`<option value="${s.id}">${escapeHTML(s.name)}</option>`).join('')}</select></div>
      <div class="field"><label>${t('auth_pinLabel')}</label><input id="login_staff_pin" class="pin-input" type="password" inputmode="numeric" maxlength="6"></div>
      <button class="btn btn-gold btn-block" id="login_staff_go">${t('auth_loginBtn')}</button>
      `}
    </div>
    <div class="auth-error" id="login_err"></div>
  `;
  document.querySelectorAll('#authTabs button').forEach(btn=>{
    btn.addEventListener('click', ()=> showLoginScreen(btn.dataset.tab));
  });
  const forgotBtn = document.getElementById('forgotPinBtn');
  if(forgotBtn) forgotBtn.addEventListener('click', showForgotPinScreen);
  const ownerGo = document.getElementById('login_owner_go');
  if(ownerGo) ownerGo.addEventListener('click', async ()=>{
    const pin = document.getElementById('login_owner_pin').value.trim();
    if(pin && pin === SETTINGS.users.ownerPin){
      CURRENT_USER = {role:'owner', name:t('staff_ownerTag')};
      saveSession({role:'owner'});
      hideAuthScreen();
      await recordCheckIn(CURRENT_USER);
      await onAuthResolved();
    } else {
      document.getElementById('login_err').textContent = t('auth_incorrectPin');
    }
  });
  const staffGo = document.getElementById('login_staff_go');
  if(staffGo) staffGo.addEventListener('click', async ()=>{
    const id = parseInt(document.getElementById('login_staff_select').value);
    const pin = document.getElementById('login_staff_pin').value.trim();
    const s = (SETTINGS.users.staff||[]).find(x=>x.id===id);
    if(s && pin && pin===s.pin){
      CURRENT_USER = {role:'cashier', name:s.name, id:s.id};
      saveSession({role:'cashier', id:s.id});
      hideAuthScreen();
      await recordCheckIn(CURRENT_USER);
      await onAuthResolved();
    } else {
      document.getElementById('login_err').textContent = t('auth_incorrectPin');
    }
  });
}

function updateUserChip(){
  const chip = document.getElementById('userChip');
  if(!chip) return;
  if(!CURRENT_USER){ chip.style.display='none'; return; }
  chip.style.display='flex';
  // The owner's display name IS "Owner", so don't render "Owner — Owner".
  const _role = CURRENT_USER.role==='owner' ? t('staff_ownerTag') : t('auth_staffTab');
  document.getElementById('userChipLabel').textContent =
    (CURRENT_USER.name && CURRENT_USER.name !== _role) ? (CURRENT_USER.name + ' — ' + _role) : _role;
}
async function doLogout(){
  await recordCheckOut(CURRENT_USER);
  clearSession();
  CURRENT_USER = null;
  showLoginScreen('owner');
}
const logoutBtnEl = document.getElementById('logoutBtn');
if(logoutBtnEl) logoutBtnEl.addEventListener('click', doLogout);

/* ---- Staff management (Settings, owner only) ---- */
function renderStaffManagement(){
  const users = SETTINGS.users || {ownerPin:'', staff:[]};
  const staff = users.staff || [];
  return `
    <div class="card" style="margin-top:14px;">
      <h2 class="section-title">${iconSVG('customers')} ${t('staff_staffAccessTitle')}</h2>
      <p class="muted" style="font-size:12px;">${t('staff_staffAccessHint')}</p>
      <div id="staffListWrap">
        ${staff.length===0? `<p class="muted" style="font-size:12.5px;">${t('staff_noStaffEmpty')}</p>` :
          staff.map(s=>`<div class="staff-row"><span class="who">${escapeHTML(s.name)}</span><button class="btn btn-outline btn-sm" onclick="editStaffPin(${s.id})">${t('staff_changePinBtn')}</button><button class="btn btn-danger btn-sm" onclick="removeStaff(${s.id})">${t('prod_removeBtn')}</button></div>`).join('')}
      </div>
      <button class="btn btn-outline btn-sm" id="addStaffBtn" style="margin-top:10px;">${t('staff_addStaffBtn')}</button>
      <h3 class="sub-title">${t('staff_ownerPinSubtitle')}</h3>
      <button class="btn btn-outline btn-sm" id="changeOwnerPinBtn">${t('staff_changeOwnerPinBtn')}</button>
      <h3 class="sub-title">${t('staff_attendanceSubtitle')}</h3>
      <p class="muted" style="font-size:12px;">${t('staff_attendanceHint')}</p>
      <button class="btn btn-outline btn-sm" id="viewAttendanceBtn">${t('staff_viewAttendanceLogBtn')}</button>
      <h3 class="sub-title">${t('staff_salesPerformanceSubtitle')}</h3>
      <p class="muted" style="font-size:12px;">${t('staff_salesPerformanceHint')}</p>
      <button class="btn btn-outline btn-sm" id="viewStaffSalesBtn">${t('staff_viewSalesPerformanceBtn')}</button>
    </div>
  `;
}
function wireStaffManagement(){
  const addBtn = document.getElementById('addStaffBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    openModal({
      title:t('modal_addStaff'),
      bodyHTML:`
        <div class="field"><label>${t('staff_nameLabel')}</label><input id="st_name"></div>
        <div class="field"><label>${t('staff_pinLabelWithAsterisk')}</label><input id="st_pin" class="pin-input" type="password" inputmode="numeric" maxlength="6"></div>
      `,
      footerHTML:`<button class="btn btn-outline" onclick="closeModal()">${t('acct_cancelBtn')}</button><button class="btn btn-primary" id="st_save">Add</button>`,
      onMount:()=>{
        document.getElementById('st_save').addEventListener('click', async ()=>{
          const name = document.getElementById('st_name').value.trim();
          const pin = document.getElementById('st_pin').value.trim();
          if(!name){ toast(t('toast_nameRequired'),'error'); return; }
          if(!/^\d{4,6}$/.test(pin)){ toast(t('toast_pinLength'),'error'); return; }
          const users = SETTINGS.users || {ownerPin:'', staff:[]};
          users.staff = users.staff || [];
          users.staff.push({id: Date.now(), name, pin});
          await saveSettings({users});
          closeModal();
          toast(t('toast_staffAdded'),'success');
          renderSettings();
        });
      }
    });
  });
  const attendanceBtn = document.getElementById('viewAttendanceBtn');
  if(attendanceBtn) attendanceBtn.addEventListener('click', showAttendanceLog);
  const staffSalesBtn = document.getElementById('viewStaffSalesBtn');
  if(staffSalesBtn) staffSalesBtn.addEventListener('click', showStaffSalesReport);
  const changeBtn = document.getElementById('changeOwnerPinBtn');
  if(changeBtn) changeBtn.addEventListener('click', ()=>{
    openModal({
      title:t('modal_changeOwnerPin'),
      bodyHTML:`
        <div class="field"><label>${t('staff_currentPinLabel')}</label><input id="co_current" class="pin-input" type="password" inputmode="numeric" maxlength="6"></div>
        <div class="field"><label>${t('staff_newPinLabel')}</label><input id="co_new" class="pin-input" type="password" inputmode="numeric" maxlength="6"></div>
      `,
      footerHTML:`<button class="btn btn-outline" onclick="closeModal()">${t('acct_cancelBtn')}</button><button class="btn btn-primary" id="co_save">Save</button>`,
      onMount:()=>{
        document.getElementById('co_save').addEventListener('click', async ()=>{
          const current = document.getElementById('co_current').value.trim();
          const next = document.getElementById('co_new').value.trim();
          if(current!==SETTINGS.users.ownerPin){ toast(t('toast_currentPinIncorrect'),'error'); return; }
          if(!/^\d{4,6}$/.test(next)){ toast(t('toast_newPinLength'),'error'); return; }
          const users = SETTINGS.users; users.ownerPin = next;
          await saveSettings({users});
          closeModal();
          toast(t('toast_ownerPinUpdated'),'success');
        });
      }
    });
  });
}
async function editStaffPin(staffId){
  openModal({
    title:t('modal_changeStaffPin'),
    bodyHTML:`<div class="field"><label>${t('staff_newPinLabel')}</label><input id="sp_new" class="pin-input" type="password" inputmode="numeric" maxlength="6"></div>`,
    footerHTML:`<button class="btn btn-outline" onclick="closeModal()">${t('acct_cancelBtn')}</button><button class="btn btn-primary" id="sp_save">Save</button>`,
    onMount:()=>{
      document.getElementById('sp_save').addEventListener('click', async ()=>{
        const pin = document.getElementById('sp_new').value.trim();
        if(!/^\d{4,6}$/.test(pin)){ toast(t('toast_pinLength'),'error'); return; }
        const users = SETTINGS.users;
        const s = users.staff.find(x=>x.id===staffId);
        if(s) s.pin = pin;
        await saveSettings({users});
        closeModal();
        toast(t('toast_pinUpdated'),'success');
        renderSettings();
      });
    }
  });
}
async function removeStaff(staffId){
  const users = SETTINGS.users;
  users.staff = (users.staff||[]).filter(s=>s.id!==staffId);
  await saveSettings({users});
  toast(t('toast_staffRemoved'));
  renderSettings();
}

function fmtDateTime(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleDateString(localeTag(),{day:'2-digit',month:'short'}) + ', ' + d.toLocaleTimeString(localeTag(),{hour:'2-digit',minute:'2-digit'});
}
function fmtHours(msIn, msOut){
  if(!msOut) return '<span class="tag tag-amber">Still checked in</span>';
  const hrs = (new Date(msOut) - new Date(msIn)) / 3600000;
  return hrs.toFixed(1) + t('staff_hrsSuffix');
}

async function showAttendanceLog(){
  const records = (await dbGetAll('attendance')).sort((a,b)=> new Date(b.checkIn)-new Date(a.checkIn));
  const staffNames = ['all', ...new Set(records.map(r=>r.staffName))];
  const renderRows = (filterName)=>{
    const filtered = filterName==='all' ? records : records.filter(r=>r.staffName===filterName);
    if(filtered.length===0) return `<tr><td colspan="5" class="muted">${t('staff_noAttendanceEmpty')}</td></tr>`;
    return filtered.slice(0,100).map(r=>`
      <tr>
        <td>${escapeHTML(r.staffName)} ${r.role==='owner'?'<span class="tag tag-green" style="font-size:10px;">Owner</span>':''}</td>
        <td>${fmtDate(r.date)}</td>
        <td>${fmtDateTime(r.checkIn)}</td>
        <td>${r.checkOut?fmtDateTime(r.checkOut):'<span class="muted">—</span>'}</td>
        <td>${fmtHours(r.checkIn, r.checkOut)}</td>
      </tr>
    `).join('');
  };
  openModal({
    title: t('modal_staffAttendanceLog'),
    bodyHTML: `
      <div class="field" style="max-width:220px;">
        <label>${t('staff_filterByStaffLabel')}</label>
        <select id="attendanceFilter">
          ${staffNames.map(n=>`<option value="${escapeHTML(n)}">${n==='all'?'Everyone':escapeHTML(n)}</option>`).join('')}
        </select>
      </div>
      <div style="max-height:400px;overflow:auto;margin-top:8px;">
        <table>
          <thead><tr><th>${t('th_staff')}</th><th>${t('th_date')}</th><th>${t('th_checkIn')}</th><th>${t('th_checkOut')}</th><th>${t('th_hours')}</th></tr></thead>
          <tbody id="attendanceRowsWrap">${renderRows('all')}</tbody>
        </table>
      </div>
    `,
    footerHTML: `<button class="btn btn-outline" onclick="closeModal()">${t('print_closeBtn')}</button>`,
    onMount: ()=>{
      document.getElementById('attendanceFilter').addEventListener('change',(e)=>{
        document.getElementById('attendanceRowsWrap').innerHTML = renderRows(e.target.value);
      });
    }
  });
}

async function showStaffSalesReport(){
  const bills = await scopedLiveBills();
  const users = SETTINGS.users || {ownerPin:'', staff:[]};
  const staffList = users.staff || [];
  const nameForKey = (key, fallbackName)=>{
    if(key==='owner') return 'Owner';
    if(fallbackName) return fallbackName;
    const s = staffList.find(x=>('staff-'+x.id)===key);
    return s ? s.name : t('staff_removedStaffName');
  };

  let rangeSel = 'all', customFrom = '', customTo = '';

  const computeRows = ()=>{
    const now = new Date();
    let from, to;
    to = new Date(now); to.setHours(23,59,59,999);
    if(rangeSel==='today'){ from = new Date(now); from.setHours(0,0,0,0); }
    else if(rangeSel==='week'){ from = new Date(now); from.setDate(now.getDate()-6); from.setHours(0,0,0,0); }
    else if(rangeSel==='month'){ from = new Date(now.getFullYear(), now.getMonth(), 1); }
    else if(rangeSel==='custom'){
      from = customFrom ? new Date(customFrom+'T00:00:00') : new Date(2000,0,1);
      to = customTo ? new Date(customTo+'T23:59:59.999') : to;
      if(from>to){ const t=from; from=to; to=t; } // guard against an inverted From/To pick
    } else { from = new Date(2000,0,1); }

    const filtered = bills.filter(b=>{
      const d = new Date(b.date);
      return d>=from && d<=to;
    });

    // Older bills created before this report existed won't have soldByKey — group those
    // under "Unattributed" rather than dropping them or guessing who made the sale.
    const map = new Map();
    filtered.forEach(b=>{
      const key = b.soldByKey || 'unattributed';
      const name = key==='unattributed' ? 'Unattributed (older bills)' : nameForKey(key, b.soldByName);
      const entry = map.get(key) || {name, total:0, count:0};
      entry.total += b.grandTotal||0;
      entry.count += 1;
      map.set(key, entry);
    });

    return Array.from(map.values()).map(e=>({
      ...e,
      total: Math.round(e.total*100)/100,
      avg: e.count ? Math.round((e.total/e.count)*100)/100 : 0
    })).sort((a,b)=>b.total-a.total);
  };

  openModal({
    title:t('modal_staffSalesPerformance'),
    wide:true,
    bodyHTML:`
      <div class="row" style="align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
        <div class="col field" style="max-width:200px;margin-bottom:0;">
          <label style="font-size:11px;">${t('staff_dateRangeLabel')}</label>
          <select id="ssp_range">
            <option value="today">${t('staff_todayOption')}</option>
            <option value="week">${t('staff_last7DaysOption')}</option>
            <option value="month">${t('staff_thisMonthOption')}</option>
            <option value="all">${t('staff_allTimeOption')}</option>
            <option value="custom">${t('staff_customRangeOption')}</option>
          </select>
        </div>
        <div id="ssp_customWrap" class="col" style="display:none;gap:8px;flex-wrap:wrap;">
          <div class="field" style="max-width:150px;margin-bottom:0;"><label style="font-size:11px;">${t('staff_fromLabel')}</label><input type="date" id="ssp_from"></div>
          <div class="field" style="max-width:150px;margin-bottom:0;"><label style="font-size:11px;">${t('staff_toLabel')}</label><input type="date" id="ssp_to"></div>
        </div>
      </div>
      <div id="ssp_wrap" style="max-height:420px;overflow:auto;"></div>
    `,
    footerHTML:`<button class="btn btn-outline" onclick="closeModal()">${t('print_closeBtn')}</button>`,
    onMount:()=>{
      document.getElementById('ssp_range').value = rangeSel;
      const render = ()=>{
        const rows = computeRows();
        const grandTotal = rows.reduce((s,r)=>s+r.total,0);
        document.getElementById('ssp_wrap').innerHTML = rows.length===0 ? `<div class="empty-state">${t('staff_noSalesEmpty')}</div>` : `
          <table>
            <thead><tr><th>${t('th_staff')}</th><th class="num">${t('th_bills')}</th><th class="num">${t('th_totalSales')}</th><th class="num">${t('th_avgBillValue')}</th><th class="num">${t('th_pctOfTotal')}</th></tr></thead>
            <tbody>${rows.map(r=>`
              <tr>
                <td><strong>${escapeHTML(r.name)}</strong></td>
                <td class="num">${r.count}</td>
                <td class="num">${fmtMoney(r.total)}</td>
                <td class="num">${fmtMoney(r.avg)}</td>
                <td class="num">${grandTotal>0 ? Math.round((r.total/grandTotal)*100) : 0}%</td>
              </tr>
            `).join('')}</tbody>
          </table>
          ${rows.some(r=>r.name.indexOf('Unattributed')===0)?`<p class="muted" style="font-size:11.5px;margin-top:8px;">${t('staff_unattributedHint')}</p>`:''}
        `;
      };
      document.getElementById('ssp_range').addEventListener('change', (e)=>{
        rangeSel = e.target.value;
        document.getElementById('ssp_customWrap').style.display = rangeSel==='custom' ? 'flex' : 'none';
        if(rangeSel==='custom' && !customFrom && !customTo){
          customFrom = todayISO(); customTo = todayISO();
          document.getElementById('ssp_from').value = customFrom;
          document.getElementById('ssp_to').value = customTo;
        }
        render();
      });
      document.getElementById('ssp_from').addEventListener('change', (e)=>{ customFrom = e.target.value; render(); });
      document.getElementById('ssp_to').addEventListener('change', (e)=>{ customTo = e.target.value; render(); });
      render();
    }
  });
}
</script>

<!-- MODULE:PWA -->
<script>
function svgIconDataUri(){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%235c3a21"/><text x="50" y="66" font-family="Arial,sans-serif" font-size="52" font-weight="700" text-anchor="middle" fill="%23d4a24c">B</text></svg>`;
  return 'data:image/svg+xml,' + svg.replace(/\n/g,'');
}
function initPWA(){
  try{
    const manifest = {
      name: SETTINGS.name || 'Cloth Shop Billing and Management',
      short_name: (SETTINGS.name||'Boutique').slice(0,12),
      start_url: './',
      display: 'standalone',
      background_color: '#faf5ec',
      theme_color: '#5c3a21',
      icons: [{ src: svgIconDataUri(), sizes:'any', type:'image/svg+xml', purpose:'any' }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    let link = document.querySelector('link[rel="manifest"]');
    if(!link){ link = document.createElement('link'); link.rel='manifest'; document.head.appendChild(link); }
    link.href = URL.createObjectURL(blob);

    if('serviceWorker' in navigator && location.protocol.startsWith('http')){
      const swCode = `
        const CACHE='boutique-shell-v1';
        self.addEventListener('install', e=>{ self.skipWaiting(); });
        self.addEventListener('activate', e=>{ self.clients.claim(); });
        self.addEventListener('fetch', e=>{
          if(e.request.method!=='GET') return;
          e.respondWith(
            caches.open(CACHE).then(cache=>
              cache.match(e.request).then(cached=>{
                const fetchPromise = fetch(e.request).then(resp=>{ cache.put(e.request, resp.clone()); return resp; }).catch(()=>cached);
                return cached || fetchPromise;
              })
            )
          );
        });
      `;
      const swBlob = new Blob([swCode], {type:'application/javascript'});
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(()=>{ /* not installable in this context, app still works fully offline once loaded */ });
    }

  }catch(e){ /* PWA is a progressive enhancement; ignore failures */ }
}
</script>
